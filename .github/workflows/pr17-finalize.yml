name: PR17 Finalize Known Type Fixes

on:
  push:
    branches:
      - agent/complete-ticket-seo-content-backends-20260814

permissions:
  contents: write

jobs:
  finalize-known-fixes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-ticket-seo-content-backends-20260814
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Normalize bigint test ids at DB boundaries
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const file = "apps/api/tests/functional/admin/phase5_operations.spec.ts";
          const source = fs.readFileSync(file, "utf8");
          const updated = source.replaceAll('.where("product_id", product.id)', '.where("product_id", Number(product.id))');
          if (updated === source) console.log("No Phase5 bigint replacements required.");
          fs.writeFileSync(file, updated);
          NODE
      - name: Format touched files
        run: pnpm exec biome format --write apps/api/tests/functional/admin/phase5_operations.spec.ts apps/api/tests/functional/payments/payment_callback_failures.spec.ts apps/admin/src/lib/queries/api-client.ts
      - name: Commit deterministic fixes
        shell: bash
        run: |
          if git diff --quiet -- .; then
            echo "No deterministic changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/tests/functional/admin/phase5_operations.spec.ts apps/api/tests/functional/payments/payment_callback_failures.spec.ts apps/admin/src/lib/queries/api-client.ts
          git commit -m "fix(ci): normalize remaining typed test boundaries"
          git push origin HEAD:agent/complete-ticket-seo-content-backends-20260814
