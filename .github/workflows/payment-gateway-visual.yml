name: Payment gateway visual

on:
    push:
        branches:
            - "phase/08-payment-gateways"

permissions:
    contents: read

jobs:
    visual:
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 10.32.1
            - uses: actions/setup-node@v4
              with:
                  node-version: 24.14.0
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - name: Install Chromium
              run: pnpm --filter @calibra/admin exec playwright install --with-deps chromium
            - name: Prepare local env
              shell: bash
              run: |
                  cp apps/api/.env.example apps/api/.env
                  cp apps/admin/.env.example apps/admin/.env.local
                  APP_KEY=$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")
                  sed -i "s/^APP_KEY=.*/APP_KEY=$APP_KEY/" apps/api/.env
                  sed -i 's/^QUEUE_DRIVER=.*/QUEUE_DRIVER=sync/' apps/api/.env
                  sed -i 's/^TRANSMIT_TRANSPORT=.*/TRANSMIT_TRANSPORT=none/' apps/api/.env
                  sed -i 's/^LIMITER_STORE=.*/LIMITER_STORE=memory/' apps/api/.env
                  sed -i 's/^CACHE_DRIVER=.*/CACHE_DRIVER=memory/' apps/api/.env
                  sed -i 's/^MAIL_NOTIFICATIONS_ENABLED=.*/MAIL_NOTIFICATIONS_ENABLED=false/' apps/api/.env
                  sed -i 's#^ALLOWED_ORIGINS=.*#ALLOWED_ORIGINS=http://aurora.admin.localhost:3001,http://localhost:3001#' apps/api/.env
            - name: Start Postgres and Redis
              shell: bash
              run: |
                  cd apps/api
                  docker compose up -d --wait db redis
            - name: Bootstrap database
              shell: bash
              run: |
                  pnpm --filter @calibra/api exec node ace db:bootstrap-roles
                  pnpm --filter @calibra/api exec node ace migration:run --connection=postgres_admin
                  set +e
                  pnpm --filter @calibra/api exec node ace db:seed --connection=postgres_admin
                  seed_status=$?
                  set -e
                  echo "Demo seed exit status: $seed_status"
            - name: Start API and admin
              shell: bash
              run: |
                  NEXT_PUBLIC_ADMIN_ROOT=admin.localhost NEXT_PUBLIC_DEV_TENANT=aurora pnpm exec turbo run dev --filter=@calibra/api --filter=@calibra/admin --env-mode=loose > /tmp/payment-gateway-servers.log 2>&1 &
                  for i in $(seq 1 120); do
                      if curl -fsS http://localhost:3333/health/live >/dev/null 2>&1 && curl -fsS -H 'Host: aurora.admin.localhost:3001' http://127.0.0.1:3001/fa/login >/dev/null 2>&1; then
                          exit 0
                      fi
                      sleep 2
                  done
                  cat /tmp/payment-gateway-servers.log
                  exit 1
            - name: Capture real admin UI
              working-directory: apps/admin
              env:
                  ADMIN_LOGIN_EMAIL: admin@bulk.calibra.dev
                  ADMIN_LOGIN_PASSWORD: Passw0rd1!
                  BASE_URL: http://aurora.admin.localhost:3001
              run: pnpm exec playwright test tests/e2e/payment-gateway-visual.spec.ts --workers=1
            - name: Upload browser screenshots
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: payment-gateway-settings-screenshots
                  path: apps/admin/test-results/*.png
                  if-no-files-found: error
                  retention-days: 30
