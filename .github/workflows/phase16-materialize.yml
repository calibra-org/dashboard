name: Phase 16 Materialize
on:
  push:
    branches: [agent/phase16-discovery-os-20260818]
  pull_request:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: phase16-materialize-${{ github.ref }}
  cancel-in-progress: true
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_USER: calibra, POSTGRES_PASSWORD: calibra, POSTGRES_DB: calibra}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U calibra -d calibra" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/phase16-discovery-os-20260818, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24.14.0'}
      - run: npm install --global pnpm@10.32.1
      - name: Recover audited Phase 16 payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api='https://api.github.com/repos/${{ github.repository }}/contents/.phase16v2/payload.b64?ref=agent/phase16-discovery-os'
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$api" -o /tmp/api.json
          python3 - <<'PY'
          import base64,json
          obj=json.load(open('/tmp/api.json'))
          open('/tmp/payload.b64','wb').write(base64.b64decode(obj['content']))
          PY
          base64 -d /tmp/payload.b64 | xz -d > /tmp/payload.tar
          tar -tf /tmp/payload.tar | head -50
          tar -xf /tmp/payload.tar
          test -f .phase16v2/apply_phase16.py
          python3 .phase16v2/apply_phase16.py
      - name: Phase 16 safety invariants
        run: |
          set -euo pipefail
          ! grep -R "syncProduct(Number(productId)).catch(() => undefined)" apps/api/app/services/cache_invalidation.ts
          ! grep -R "syncProducts(productIds).catch(() => undefined)" apps/api/app/services/cache_invalidation.ts
          grep -R "dead_letter\|retrying" apps/api/app apps/api/database/migrations | head
          grep -R "FORCE ROW LEVEL SECURITY" apps/api/database/migrations/*discovery* | head
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:fix
      - name: Generate SDK and docs
        run: pnpm --filter @calibra/sdk run codegen
      - name: Focused Phase 16 tests
        working-directory: apps/api
        run: pnpm test --files=tests/unit/discovery/normalizer.spec.ts --files=tests/unit/discovery/merchandising_engine.spec.ts --files=tests/functional/storefront/discovery_events.spec.ts
      - name: API typecheck
        run: pnpm --filter @calibra/api run typecheck
      - name: Admin typecheck
        run: pnpm --filter @calibra/admin run typecheck
      - name: Admin production build
        run: pnpm --filter @calibra/admin run build
      - name: Lint and diff check
        run: |
          pnpm run lint
          git diff --check
      - name: Commit verified Phase 16
        run: |
          rm -rf .phase16 .phase16v2 .phase16next
          rm -f .github/workflows/phase16-materialize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'No source changes'; exit 1; }
          git commit -m 'feat(phase16): complete product discovery os'
          git push origin HEAD:agent/phase16-discovery-os-20260818
