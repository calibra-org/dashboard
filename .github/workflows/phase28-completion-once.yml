name: Phase 28 Completion Materializer

on:
  push:
    branches:
      - feat/phase28-objective-autonomy-20260825
    paths:
      - ".github/workflows/phase28-completion-once.yml"

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase28-objective-autonomy-20260825
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - run: npm install --global pnpm@10.32.1
      - run: pnpm install --frozen-lockfile
      - name: Complete Phase 28 UI and API contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"pattern not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new))

          ui = "apps/admin/src/features/objective-autonomy/ObjectiveAutonomyWorkspace.tsx"
          replace(
              ui,
              '    const [unexpectedHarm, setUnexpectedHarm] = useState(false);\n',
              '    const [unexpectedHarm, setUnexpectedHarm] = useState(false);\n    const [postmortemFinal, setPostmortemFinal] = useState("0");\n    const [postmortemSummary, setPostmortemSummary] = useState("");\n    const [postmortemLesson, setPostmortemLesson] = useState("");\n    const [postmortemConfidence, setPostmortemConfidence] = useState("0.7");\n',
          )
          marker = '''                        )}\n                    </Card>\n                </div>\n            ) : null}\n\n            {tab === "access" ? ('''
          insertion = '''                        )}\n                    </Card>\n                    <Card className="p-5 xl:col-span-2">\n                        <div className="mb-4 flex items-center justify-between gap-3">\n                            <div>\n                                <h2 className="font-semibold">Postmortem و انتقال یادگیری به حافظه</h2>\n                                <p className="text-muted-foreground text-xs">\n                                    نتیجه واقعی، درس آموخته و عدم‌قطعیت را ثبت می‌کند و به Phase 26 Merchant Memory می‌فرستد.\n                                </p>\n                            </div>\n                            <Sparkles className="size-5 text-primary" />\n                        </div>\n                        {detail.data?.postmortem ? (\n                            <div className="grid gap-3 sm:grid-cols-3">\n                                <div className="rounded-xl border p-4">\n                                    <p className="text-muted-foreground text-xs">Outcome</p>\n                                    <p className="mt-1 font-semibold">{String(detail.data.postmortem.outcome ?? "—")}</p>\n                                </div>\n                                <div className="rounded-xl border p-4">\n                                    <p className="text-muted-foreground text-xs">Final value</p>\n                                    <p className="mt-1 font-semibold">{faNumber(detail.data.postmortem.final_value)}</p>\n                                </div>\n                                <div className="rounded-xl border p-4">\n                                    <p className="text-muted-foreground text-xs">Memory</p>\n                                    <p className="mt-1 break-all font-mono text-xs">\n                                        {String(detail.data.postmortem.memory_public_id ?? "—")}\n                                    </p>\n                                </div>\n                            </div>\n                        ) : selected ? (\n                            <div className="grid gap-3 sm:grid-cols-2">\n                                <div>\n                                    <Label>Final value</Label>\n                                    <Input\n                                        type="number"\n                                        value={postmortemFinal}\n                                        onChange={(event) => setPostmortemFinal(event.target.value)}\n                                    />\n                                </div>\n                                <div>\n                                    <Label>Confidence</Label>\n                                    <Input\n                                        type="number"\n                                        min="0"\n                                        max="1"\n                                        step="0.05"\n                                        value={postmortemConfidence}\n                                        onChange={(event) => setPostmortemConfidence(event.target.value)}\n                                    />\n                                </div>\n                                <div className="sm:col-span-2">\n                                    <Label>خلاصه نتیجه</Label>\n                                    <Textarea\n                                        value={postmortemSummary}\n                                        onChange={(event) => setPostmortemSummary(event.target.value)}\n                                        placeholder="چه اتفاقی افتاد و هدف تا چه حد محقق شد؟"\n                                    />\n                                </div>\n                                <div className="sm:col-span-2">\n                                    <Label>درس آموخته</Label>\n                                    <Textarea\n                                        value={postmortemLesson}\n                                        onChange={(event) => setPostmortemLesson(event.target.value)}\n                                        placeholder="در چرخه بعد چه چیزی باید حفظ یا تغییر کند؟"\n                                    />\n                                </div>\n                                <Button\n                                    className="sm:col-span-2"\n                                    disabled={\n                                        busy ||\n                                        postmortemSummary.trim().length < 10 ||\n                                        postmortemLesson.trim().length < 10 ||\n                                        !evidence\n                                    }\n                                    onClick={() =>\n                                        mutate.mutate({\n                                            path: `objectives/${selected.public_id}/postmortem`,\n                                            body: {\n                                                final_value: Number(postmortemFinal),\n                                                summary: postmortemSummary,\n                                                lesson: postmortemLesson,\n                                                residual_uncertainty: {\n                                                    checkpoint_confidence: Number(checkpointConfidence),\n                                                    latest_cycle_public_id: latestCycle?.public_id ?? null,\n                                                },\n                                                confidence: Number(postmortemConfidence),\n                                                evidence_refs: [\n                                                    {\n                                                        source: evidence.split(":")[0] || "operator",\n                                                        id: evidence.split(":")[1] || "manual",\n                                                        label:\n                                                            evidence.split(":").slice(2).join(":") ||\n                                                            "postmortem evidence",\n                                                    },\n                                                ],\n                                            },\n                                        })\n                                    }\n                                >\n                                    ثبت Postmortem و ذخیره در حافظه Phase 26\n                                </Button>\n                            </div>\n                        ) : null}\n                    </Card>\n                </div>\n            ) : null}\n\n            {tab === "access" ? ('''
          replace(ui, marker, insertion)

          openapi = Path("docs/api/reference/openapi/admin.phase28.v1.yaml")
          openapi.write_text('''openapi: 3.1.0\ninfo:\n  title: Calibra Admin Phase 28 Objective Autonomy API\n  version: 1.0.0\ntags:\n  - name: Objective Autonomy\n    description: Bounded objective-driven commerce autonomy with simulation, portfolio ranking, registered actions, checkpoints, kill switch and postmortems.\npaths:\n  /api/v1/admin/objective-autonomy/overview:\n    get:\n      tags: [Objective Autonomy]\n      operationId: adminObjectiveAutonomyOverview\n      responses:\n        '200': { $ref: '#/components/responses/OkEnvelope' }\n  /api/v1/admin/objective-autonomy/objectives:\n    get:\n      tags: [Objective Autonomy]\n      operationId: adminObjectiveAutonomyObjectives\n      responses:\n        '200': { $ref: '#/components/responses/OkEnvelope' }\n    post:\n      tags: [Objective Autonomy]\n      operationId: adminObjectiveAutonomyCreateObjective\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema: { $ref: '#/components/schemas/ObjectiveRequest' }\n      responses:\n        '201': { $ref: '#/components/responses/OkEnvelope' }\n  /api/v1/admin/objective-autonomy/objectives/{publicId}:\n    parameters:\n      - { $ref: '#/components/parameters/PublicId' }\n    get:\n      tags: [Objective Autonomy]\n      operationId: adminObjectiveAutonomyObjective\n      responses:\n        '200': { $ref: '#/components/responses/OkEnvelope' }\n  /api/v1/admin/objective-autonomy/objectives/{publicId}/activate:\n    parameters:\n      - { $ref: '#/components/parameters/PublicId' }\n    post:\n      tags: [Objective Autonomy]\n      operationId: adminObjectiveAutonomyActivate\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema: { $ref: '#/components/schemas/ReasonRequest' }\n      responses:\n        '200': { $ref: '#/components/responses/OkEnvelope' }\n  /api/v1/admin/objective-autonomy/objectives/{publicId}/halt:\n    parameters:\n      - { $ref: '#/components/parameters/PublicId' }\n    post:\n      tags: [Objective Autonomy]\n      operationId: adminObjectiveAutonomyHalt\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema: { $ref: '#/components/schemas/ReasonRequest' }\n      responses:\n        '200': { $ref: '#/components/responses/OkEnvelope' }\n  /api/v1/admin/objective-autonomy/objectives/{publicId}/cycles:\n    parameters:\n      - { $ref: '#/components/parameters/PublicId' }\n    post:\n      tags: [Objective Autonomy]\n      operationId: adminObjectiveAutonomyStartCycle\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema: { $ref: '#/components/schemas/CycleRequest' }\n      responses:\n        '201': { $ref: '#/components/responses/OkEnvelope' }\n  /api/v1/admin/objective-autonomy/objectives/{publicId}/cycles/{cyclePublicId}/execute:\n    parameters:\n      - { $ref: '#/components/parameters/PublicId' }\n      - name: cyclePublicId\n        in: path\n        required: true\n        schema: { type: string, format: uuid }\n    post:\n      tags: [Objective Autonomy]\n      operationId: adminObjectiveAutonomyExecuteStep\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema: { $ref: '#/components/schemas/ExecuteStepRequest' }\n      responses:\n        '200': { $ref: '#/components/responses/OkEnvelope' }\n  /api/v1/admin/objective-autonomy/objectives/{publicId}/checkpoints:\n    parameters:\n      - { $ref: '#/components/parameters/PublicId' }\n    post:\n      tags: [Objective Autonomy]\n      operationId: adminObjectiveAutonomyCheckpoint\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema: { $ref: '#/components/schemas/CheckpointRequest' }\n      responses:\n        '201': { $ref: '#/components/responses/OkEnvelope' }\n  /api/v1/admin/objective-autonomy/objectives/{publicId}/postmortem:\n    parameters:\n      - { $ref: '#/components/parameters/PublicId' }\n    post:\n      tags: [Objective Autonomy]\n      operationId: adminObjectiveAutonomyPostmortem\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema: { $ref: '#/components/schemas/PostmortemRequest' }\n      responses:\n        '201': { $ref: '#/components/responses/OkEnvelope' }\n  /api/v1/admin/objective-autonomy/access:\n    get:\n      tags: [Objective Autonomy]\n      operationId: adminObjectiveAutonomyAccess\n      responses:\n        '200': { $ref: '#/components/responses/OkEnvelope' }\n  /api/v1/admin/objective-autonomy/access/preset:\n    post:\n      tags: [Objective Autonomy]\n      operationId: adminObjectiveAutonomyAccessPreset\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema: { $ref: '#/components/schemas/AccessPresetRequest' }\n      responses:\n        '200': { $ref: '#/components/responses/OkEnvelope' }\ncomponents:\n  parameters:\n    PublicId:\n      name: publicId\n      in: path\n      required: true\n      schema: { type: string, format: uuid }\n  schemas:\n    EvidenceRef:\n      type: object\n      required: [source, id, label]\n      properties:\n        source: { type: string, minLength: 2, maxLength: 80 }\n        id: { type: string, minLength: 1, maxLength: 160 }\n        label: { type: string, minLength: 2, maxLength: 220 }\n      additionalProperties: false\n    ObjectiveRequest:\n      type: object\n      required: [name, target_metric, direction, baseline_value, target_value, horizon_end, constraints, allowed_tool_keys, autonomy_level, risk_ceiling, minimum_confidence, stop_loss, approvers, scenario_public_id, portfolio_plan_public_id, agent_plan_public_id, reason]\n      properties:\n        name: { type: string, minLength: 3, maxLength: 180 }\n        target_metric: { type: string, pattern: '^[a-z0-9][a-z0-9._-]+$' }\n        direction: { type: string, enum: [maximize, minimize, target] }\n        baseline_value: { type: number }\n        target_value: { type: number }\n        horizon_end: { type: string, format: date-time }\n        budget_minor: { type: integer, minimum: 0 }\n        constraints: { type: object, additionalProperties: true }\n        allowed_tool_keys:\n          type: array\n          minItems: 1\n          maxItems: 64\n          items: { type: string, pattern: '^[a-z0-9][a-z0-9._-]+$' }\n        autonomy_level: { type: string, enum: [recommend, propose, bounded_auto] }\n        risk_ceiling: { type: string, enum: [read_only, low, medium, high, critical] }\n        minimum_confidence: { type: number, minimum: 0, maximum: 1 }\n        stop_loss: { type: object, additionalProperties: true }\n        approvers:\n          type: array\n          maxItems: 32\n          items: { type: string, maxLength: 160 }\n        scenario_public_id: { type: string, format: uuid }\n        portfolio_plan_public_id: { type: string, format: uuid }\n        agent_plan_public_id: { type: string, format: uuid }\n        reason: { type: string, minLength: 3, maxLength: 2000 }\n      additionalProperties: false\n    ReasonRequest:\n      type: object\n      required: [reason]\n      properties:\n        reason: { type: string, minLength: 3, maxLength: 2000 }\n      additionalProperties: false\n    CycleRequest:\n      type: object\n      properties:\n        seed: { type: integer, minimum: 1, maximum: 2147483647 }\n      additionalProperties: false\n    ExecuteStepRequest:\n      type: object\n      required: [step_public_id, dry_run]\n      properties:\n        step_public_id: { type: string, format: uuid }\n        dry_run: { type: boolean }\n      additionalProperties: false\n    CheckpointRequest:\n      type: object\n      required: [observed_value, budget_spent_minor, confidence, constraint_breaches, unexpected_harm, evidence_refs, reason]\n      properties:\n        cycle_public_id: { type: string, format: uuid }\n        observed_value: { type: number }\n        budget_spent_minor: { type: integer, minimum: 0 }\n        confidence: { type: number, minimum: 0, maximum: 1 }\n        constraint_breaches:\n          type: array\n          maxItems: 64\n          items: { type: string, minLength: 2, maxLength: 180 }\n        unexpected_harm: { type: boolean }\n        evidence_refs:\n          type: array\n          minItems: 1\n          maxItems: 64\n          items: { $ref: '#/components/schemas/EvidenceRef' }\n        reason: { type: string, minLength: 3, maxLength: 2000 }\n      additionalProperties: false\n    PostmortemRequest:\n      type: object\n      required: [final_value, summary, lesson, residual_uncertainty, confidence, evidence_refs]\n      properties:\n        final_value: { type: number }\n        summary: { type: string, minLength: 10, maxLength: 8000 }\n        lesson: { type: string, minLength: 10, maxLength: 8000 }\n        residual_uncertainty: { type: object, additionalProperties: true }\n        confidence: { type: number, minimum: 0, maximum: 1 }\n        evidence_refs:\n          type: array\n          minItems: 1\n          maxItems: 64\n          items: { $ref: '#/components/schemas/EvidenceRef' }\n      additionalProperties: false\n    AccessPresetRequest:\n      type: object\n      required: [user_id, preset, reason]\n      properties:\n        user_id: { type: integer, minimum: 1 }\n        preset: { type: string, enum: [owner, operator, strategist, viewer] }\n        reason: { type: string, minLength: 3, maxLength: 2000 }\n      additionalProperties: false\n  responses:\n    OkEnvelope:\n      description: Successful Phase 28 objective autonomy response.\n      content:\n        application/json:\n          schema:\n            type: object\n            required: [data]\n            properties:\n              data: {}\n''')

          package_path = Path("docs/api/package.json")
          package = json.loads(package_path.read_text())
          scripts = package["scripts"]
          scripts["build:json:admin-phase28"] = "redocly bundle reference/openapi/admin.phase28.v1.yaml -o dist/admin.phase28.v1.json --ext json"
          scripts["build:json:admin"] = scripts["build:json:admin"].replace(
              "pnpm build:json:admin-phase27 && pnpm build:json:admin-completion",
              "pnpm build:json:admin-phase27 && pnpm build:json:admin-phase28 && pnpm build:json:admin-completion",
          )
          package_path.write_text(json.dumps(package, indent=4, ensure_ascii=False) + "\n")

          merge = "docs/api/scripts/merge-admin-spec.js"
          replace(
              merge,
              'const phase27 = JSON.parse(readFileSync(resolve(root, "dist/admin.phase27.v1.json"), "utf8"));\n',
              'const phase27 = JSON.parse(readFileSync(resolve(root, "dist/admin.phase27.v1.json"), "utf8"));\nconst phase28 = JSON.parse(readFileSync(resolve(root, "dist/admin.phase28.v1.json"), "utf8"));\n',
          )
          replace(
              merge,
              '    [phase27, "Phase27NetworkIntelligenceOverlay"],\n',
              '    [phase27, "Phase27NetworkIntelligenceOverlay"],\n    [phase28, "Phase28ObjectiveAutonomyOverlay"],\n',
          )

          verifier = "scripts/verify-phase28-objective-autonomy.mjs"
          replace(
              verifier,
              'const routes = read("apps/api/start/routes/admin_objective_autonomy.ts");\n',
              'const routes = read("apps/api/start/routes/admin_objective_autonomy.ts");\nconst openapi = read("docs/api/reference/openapi/admin.phase28.v1.yaml");\nconst apiDocsPackage = read("docs/api/package.json");\n',
          )
          replace(
              verifier,
              'must(permissions.includes("E_AUTONOMY_SELF_LOCKOUT"), "Phase 28 access self-lockout protection missing");\n',
              'must(permissions.includes("E_AUTONOMY_SELF_LOCKOUT"), "Phase 28 access self-lockout protection missing");\nmust(openapi.includes("adminObjectiveAutonomyPostmortem") && openapi.includes("adminObjectiveAutonomyExecuteStep"), "Phase 28 OpenAPI operations missing");\nmust(apiDocsPackage.includes("build:json:admin-phase28"), "Phase 28 OpenAPI overlay is not registered in the admin build");\n',
          )

          workflow = ".github/workflows/phase28-objective-autonomy-check.yml"
          replace(
              workflow,
              '      - "scripts/verify-phase28-objective-autonomy.mjs"\n',
              '      - "scripts/verify-phase28-objective-autonomy.mjs"\n      - "docs/api/reference/openapi/admin.phase28.v1.yaml"\n      - "docs/api/package.json"\n      - "docs/api/scripts/merge-admin-spec.js"\n      - "packages/sdk/src/generated/admin.d.ts"\n',
          )
          replace(
              workflow,
              '      - name: Build SDK dependency\n        run: pnpm --filter @calibra/sdk run build\n',
              '      - name: OpenAPI and SDK drift check\n        run: pnpm --filter @calibra/sdk run codegen:check\n      - name: Build SDK dependency\n        run: pnpm --filter @calibra/sdk run build\n',
          )
          PY
      - name: Format Phase 28 authored files
        run: >-
          pnpm exec biome check --write --unsafe
          apps/admin/src/features/objective-autonomy/ObjectiveAutonomyWorkspace.tsx
          scripts/verify-phase28-objective-autonomy.mjs
          docs/api/scripts/merge-admin-spec.js
          docs/api/package.json
          .github/workflows/phase28-objective-autonomy-check.yml
      - name: Regenerate canonical SDK contracts
        run: pnpm --filter @calibra/sdk run codegen
      - name: Commit completion
        run: |
          git config user.name "calibra-phase28-ci"
          git config user.email "actions@users.noreply.github.com"
          git add apps/admin/src/features/objective-autonomy/ObjectiveAutonomyWorkspace.tsx docs/api/reference/openapi/admin.phase28.v1.yaml docs/api/package.json docs/api/scripts/merge-admin-spec.js packages/sdk/src/generated scripts/verify-phase28-objective-autonomy.mjs .github/workflows/phase28-objective-autonomy-check.yml
          git commit -m "feat: complete Phase 28 operator and API contracts" || exit 0
          git push origin HEAD:feat/phase28-objective-autonomy-20260825
