name: Final Phase 6 and Phase 7 certification

on:
  push:
    branches: [agent/phase7-identity-trust-os]
    paths: [.github/workflows/baseline-gate-repair.yml]

permissions:
  contents: write

env:
  NODE_VERSION: "24.14.0"
  PNPM_VERSION: "10.32.1"
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: calibra
          POSTGRES_PASSWORD: calibra
          POSTGRES_DB: calibra
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U calibra -d calibra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase7-identity-trust-os
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Restore official Phase 6 Configuration backend
        shell: bash
        run: |
          set -euo pipefail
          PHASE6_BASE=9e0357b62abd5b8ccadbc3f7c912f583d0185159
          PHASE6_HEAD=bc971bfc4460a93d11bac84280edc8e0a3a2b59b
          git fetch --no-tags origin agent/phase6-configuration-os
          test "$(git rev-parse origin/agent/phase6-configuration-os)" = "$PHASE6_HEAD"

          for path in \
            apps/api/app/controllers/admin/configuration_controller.ts \
            apps/api/app/services/configuration_engine_service.ts \
            apps/api/app/services/configuration_registry.ts \
            apps/api/app/services/configuration_revision_service.ts \
            apps/api/tests/functional/admin/configuration_engine.spec.ts \
            apps/api/tests/functional/admin/configuration_history.spec.ts
          do
            mkdir -p "$(dirname "$path")"
            git show "$PHASE6_HEAD:$path" > "$path"
          done

          git show "$PHASE6_HEAD:apps/api/database/migrations/1763000000000_create_configuration_revisions.ts" > apps/api/database/migrations/1763200000000_create_configuration_revisions.ts
          git show "$PHASE6_HEAD:apps/api/database/migrations/1763100000000_create_configuration_engine.ts" > apps/api/database/migrations/1763300000000_create_configuration_engine.ts
          test -f apps/api/database/migrations/1763000000000_create_identity_verification_platform.ts

          git diff --binary "$PHASE6_BASE" "$PHASE6_HEAD" -- \
            apps/api/app/services/settings_service.ts \
            apps/api/app/services/admin_audit_log_service.ts \
            apps/api/app/controllers/admin/settings_general_controller.ts \
            apps/api/app/controllers/admin/settings_datetime_controller.ts \
            apps/api/app/controllers/admin/settings_media_controller.ts \
            apps/api/app/controllers/admin/settings_branding_controller.ts \
            apps/api/start/routes/admin_settings.ts > /tmp/phase6-shared.patch
          test -s /tmp/phase6-shared.patch
          git apply --3way /tmp/phase6-shared.patch

          perl -0pi -e 's/\.where\("id", current\.id\)\.update\(payload\)/.where("id", String(current.id)).update(payload)/g' apps/api/app/services/configuration_engine_service.ts
          grep -F '.where("id", String(current.id)).update(payload)' apps/api/app/services/configuration_engine_service.ts
          grep -F '.use(middleware.admin());' apps/api/start/routes/admin_settings.ts
          grep -F 'router.post("/configuration/blueprint/apply"' apps/api/start/routes/admin_settings.ts
          grep -F 'router.post("/configuration/tax/simulate"' apps/api/start/routes/admin_settings.ts

      - name: Apply canonical integration repairs
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs'

          const packagePath = 'docs/api/package.json'
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'))
          pkg.scripts['build:json:admin-phase6'] = 'redocly bundle reference/openapi/admin.phase6.v1.yaml -o dist/admin.phase6.v1.json --ext json'
          if (!pkg.scripts['build:json:admin'].includes('build:json:admin-phase6')) {
            pkg.scripts['build:json:admin'] = pkg.scripts['build:json:admin'].replace('pnpm build:json:admin-phase5 &&', 'pnpm build:json:admin-phase5 && pnpm build:json:admin-phase6 &&')
          }
          fs.writeFileSync(packagePath, `${JSON.stringify(pkg, null, 4)}\n`)

          const mergePath = 'docs/api/scripts/merge-admin-spec.js'
          let merge = fs.readFileSync(mergePath, 'utf8')
          if (!merge.includes('dist/admin.phase6.v1.json')) {
            merge = merge.replace(
              'const phase5 = JSON.parse(readFileSync(resolve(root, "dist/admin.phase5.v1.json"), "utf8"));',
              'const phase5 = JSON.parse(readFileSync(resolve(root, "dist/admin.phase5.v1.json"), "utf8"));\nconst phase6 = JSON.parse(readFileSync(resolve(root, "dist/admin.phase6.v1.json"), "utf8"));',
            )
          }
          if (!merge.includes('[phase6, "Phase6Overlay"]')) merge = merge.replace('    [phase5, "Phase5Overlay"],', '    [phase5, "Phase5Overlay"],\n    [phase6, "Phase6Overlay"],')
          fs.writeFileSync(mergePath, merge)

          const spec = fs.readFileSync('docs/api/reference/openapi/admin.phase6.v1.yaml', 'utf8')
          for (const required of [
            '/api/v1/admin/settings/configuration/blueprint/apply:',
            '/api/v1/admin/settings/configuration/tax/simulate:',
            'ConfigurationBlueprintApplyInput:',
            'ConfigurationTaxSimulationInput:',
          ]) if (!spec.includes(required)) throw new Error(`Missing canonical Phase 6 OpenAPI contract: ${required}`)

          const viewPath = 'apps/admin/src/views/store-config/settings/configuration-group-view.tsx'
          let view = fs.readFileSync(viewPath, 'utf8')
          if (!view.includes('        unset: false,')) view = view.replace('        value: parsed.value,\n        reason,', '        value: parsed.value,\n        unset: false,\n        reason,')
          if (!view.includes('        rollout_percent: 100,')) {
            const anchor = '        expected_version: item.origin.scope_type === "tenant" ? item.origin.version : 0,'
            if (!view.includes(anchor)) throw new Error('Configuration rollout anchor missing')
            view = view.replace(anchor, `${anchor}\n        rollout_percent: 100,`)
          }
          fs.writeFileSync(viewPath, view)

          const openapiPath = 'docs/api/reference/openapi/admin.v1.yaml'
          let openapi = fs.readFileSync(openapiPath, 'utf8')
          const staleHead = '    /api/v1/admin/payment-attempts/{id}/reconcile:\n        post:\n            $ref: "./admin/paths/payments/payment-attempts-id-reconcile.post.yaml"\n\n        head:\n            $ref: "./common/components/operations/HeadCompanion.yaml"'
          if (openapi.includes(staleHead)) openapi = openapi.replace(staleHead, '    /api/v1/admin/payment-attempts/{id}/reconcile:\n        post:\n            $ref: "./admin/paths/payments/payment-attempts-id-reconcile.post.yaml"')
          fs.writeFileSync(openapiPath, openapi)

          const ordersPath = 'apps/api/tests/functional/admin/orders.spec.ts'
          let orders = fs.readFileSync(ordersPath, 'utf8')
          orders = orders.replace('test("transitions processing → completed, persists tracking metadata, idempotent re-runs"', 'test("creates a canonical shipment without completing the processing order, persists tracking metadata, idempotent re-runs"')
          orders = orders.replace('assert.equal(body.status, "completed");', 'assert.equal(body.status, OrderStatus.Processing);')
          orders = orders.replace('assert.equal(reshipped.body().data.status, "completed");', 'assert.equal(reshipped.body().data.status, OrderStatus.Processing);')
          orders = orders.replace('/** Draft → markShipped — state machine refuses the implicit completed transition. */', '/** Draft → markShipped is rejected because only processing orders may create a compatibility shipment. */')
          orders = orders.replace('        res.assertStatus(200);\n        const fresh = await Order.findOrFail(Number(order.id));', '        res.assertStatus(422);\n        const fresh = await Order.findOrFail(Number(order.id));')
          fs.writeFileSync(ordersPath, orders)

          const txPath = 'apps/api/tests/functional/payments/admin_transaction_center.spec.ts'
          let tx = fs.readFileSync(txPath, 'utf8')
          tx = tx.replace('.qs({ "filter[]": ["amount_minor:gte:1500000", "amount_minor:lte:3000000"], "sort[]": "amount_minor:desc" })', '.qs({ "filter[]": "amount_minor:between:1500000,3000000", "sort[]": "amount_minor:desc" })')
          fs.writeFileSync(txPath, tx)

          const paymentPath = 'apps/api/app/controllers/admin/payment_attempts_controller.ts'
          let payment = fs.readFileSync(paymentPath, 'utf8')
          payment = payment.replace('.sum("amount_minor as amount_minor")', '.sum("amount_minor as amount_sum_minor")')
          payment = payment.replace('Number(row.$extras.amount_minor ?? 0)', 'Number(row.$extras.amount_sum_minor ?? 0)')
          fs.writeFileSync(paymentPath, payment)
          NODE

          pnpm exec biome format --write --files-ignore-unknown=true \
            docs/api/package.json docs/api/scripts/merge-admin-spec.js docs/api/reference/openapi/admin.v1.yaml docs/api/reference/openapi/admin.phase6.v1.yaml \
            apps/admin/src/lib/queries/configuration.ts apps/admin/src/views/store-config/settings/configuration-group-view.tsx \
            apps/api/app/controllers/admin/configuration_controller.ts apps/api/app/controllers/admin/payment_attempts_controller.ts \
            apps/api/app/services/configuration_engine_service.ts apps/api/app/services/configuration_registry.ts apps/api/app/services/configuration_revision_service.ts \
            apps/api/app/services/settings_service.ts apps/api/app/services/admin_audit_log_service.ts apps/api/start/routes/admin_settings.ts \
            apps/api/database/migrations/1763200000000_create_configuration_revisions.ts apps/api/database/migrations/1763300000000_create_configuration_engine.ts \
            apps/api/tests/functional/admin/configuration_engine.spec.ts apps/api/tests/functional/admin/configuration_history.spec.ts \
            apps/api/tests/functional/admin/orders.spec.ts apps/api/tests/functional/payments/admin_transaction_center.spec.ts
          git diff --check

      - name: Rebuild canonical contracts and SDK
        run: |
          pnpm --filter @calibra/api-docs run build:json
          pnpm --filter @calibra/sdk run codegen
          pnpm --filter @calibra/sdk run build
          pnpm --filter @calibra/sdk run typecheck

      - name: Verify TypeScript and phase invariants
        run: |
          pnpm --filter @calibra/admin run typecheck
          pnpm --filter @calibra/api run typecheck
          pnpm run verify:phase1-4
          pnpm run verify:phase5
          node scripts/verify-phase7-identity-integration.mjs

      - name: Verify runtime and OpenAPI synchronization
        working-directory: apps/api
        env:
          NODE_ENV: test
          PORT: "3334"
          HOST: "0.0.0.0"
          APP_NAME: calibra-api
          APP_KEY: ci-only-key-not-used-for-real-secrets
          LOG_LEVEL: warn
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: calibra
          DB_PASSWORD: calibra
          DB_DATABASE: calibra
          MAIL_FROM_ADDRESS: ops@calibra.local
          MAIL_FROM_NAME: Calibra
          MAIL_NOTIFICATIONS_ENABLED: "false"
          SMTP_HOST: localhost
          SMTP_PORT: "11025"
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          TRANSMIT_TRANSPORT: none
          QUEUE_DRIVER: sync
          LIMITER_STORE: memory
          CACHE_DRIVER: memory
        run: node ace check:api-docs

      - name: Run isolated functional regression suites
        shell: bash
        env:
          PGPASSWORD: calibra
        run: |
          set -euo pipefail
          cd apps/api
          suites=(
            tests/functional/admin/configuration_engine.spec.ts
            tests/functional/admin/configuration_history.spec.ts
            tests/functional/admin/orders.spec.ts
            tests/functional/payments/admin_transaction_center.spec.ts
            tests/functional/identity/phase7_identity.spec.ts
          )
          for suite in "${suites[@]}"; do
            echo "::group::${suite}"
            psql -h localhost -U calibra -d postgres -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS calibra_test WITH (FORCE);"
            psql -h localhost -U calibra -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE calibra_test OWNER calibra;"
            timeout --foreground 3m pnpm test --files="$suite"
            echo "::endgroup::"
          done

      - name: Verify format, lint, build and generated SDK drift
        run: |
          pnpm run format
          pnpm run lint
          pnpm run build
          pnpm --filter @calibra/sdk run codegen:check

      - name: Publish certified production repair
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/baseline-gate-repair.yml
          git add -A
          git diff --cached --check
          node scripts/verify-phase7-identity-integration.mjs
          git config user.name "calibra-phase7-bot"
          git config user.email "calibra-phase7-bot@users.noreply.github.com"
          git commit -m "fix(integration): restore Phase 6 backend and certify Phase 7 merge gate"
          git push origin HEAD:agent/phase7-identity-trust-os
