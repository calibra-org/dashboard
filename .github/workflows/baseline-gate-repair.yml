name: Baseline merge-gate repair

# One-shot diagnostic for pre-existing main-branch merge-gate debt.
on:
  push:
    branches: [agent/phase7-identity-trust-os]
    paths: [.github/workflows/baseline-gate-repair.yml]

permissions:
  contents: read

env:
  NODE_VERSION: "24.14.0"
  PNPM_VERSION: "10.32.1"
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: calibra
          POSTGRES_PASSWORD: calibra
          POSTGRES_DB: calibra
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U calibra -d calibra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase7-identity-trust-os
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Repair Phase 6 contract wiring in worktree
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const packagePath = 'docs/api/package.json'
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'))
          pkg.scripts['build:json:admin-phase6'] = 'redocly bundle reference/openapi/admin.phase6.v1.yaml -o dist/admin.phase6.v1.json --ext json'
          pkg.scripts['build:json:admin'] = pkg.scripts['build:json:admin'].replace('pnpm build:json:admin-phase5 &&', 'pnpm build:json:admin-phase5 && pnpm build:json:admin-phase6 &&')
          fs.writeFileSync(packagePath, `${JSON.stringify(pkg, null, 4)}\n`)

          const mergePath = 'docs/api/scripts/merge-admin-spec.js'
          let merge = fs.readFileSync(mergePath, 'utf8')
          merge = merge.replace('const phase5 = JSON.parse(readFileSync(resolve(root, "dist/admin.phase5.v1.json"), "utf8"));', 'const phase5 = JSON.parse(readFileSync(resolve(root, "dist/admin.phase5.v1.json"), "utf8"));\nconst phase6 = JSON.parse(readFileSync(resolve(root, "dist/admin.phase6.v1.json"), "utf8"));')
          merge = merge.replace('    [phase5, "Phase5Overlay"],', '    [phase5, "Phase5Overlay"],\n    [phase6, "Phase6Overlay"],')
          fs.writeFileSync(mergePath, merge)
          NODE
          pnpm exec biome format --write --files-ignore-unknown=true docs/api/package.json docs/api/scripts/merge-admin-spec.js apps/admin/src/lib/queries/configuration.ts apps/admin/src/views/store-config/settings/configuration-group-view.tsx
          pnpm --filter @calibra/api-docs run build:json
          pnpm --filter @calibra/sdk run codegen
          pnpm --filter @calibra/sdk run build
          pnpm --filter @calibra/sdk run typecheck
          pnpm --filter @calibra/admin run typecheck

      - name: Print exact remaining route drift sources
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo '=== payment attempt reconcile references ==='
          grep -Rni -C 10 --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=dist 'payment-attempts.*reconcile\|reconcile.*payment-attempts' apps docs scripts packages || true
          echo '=== explicit HEAD blocks ==='
          grep -Rni -C 14 --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=dist '^ *head:' docs/api/reference/openapi | head -360 || true

      - name: Print exact failing shard source and related implementation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo '=== shipping/transaction test files ==='
          find apps/api/tests -type f \( -iname '*shipping*' -o -iname '*transaction*' \) -print
          echo '=== shipping methods references ==='
          grep -Rni -C 12 --exclude-dir=node_modules 'shipping-methods\|shipping_methods' apps/api/tests apps/api/app apps/api/start | head -900 || true
          echo '=== transaction references / amounts ==='
          grep -Rni -C 10 --exclude-dir=node_modules '10964\.3089346\|109643089346\|20000\|transactions' apps/api/tests apps/api/app | head -1200 || true

      - name: Verify build after Phase 6 contract repair
        if: success()
        run: pnpm run build
