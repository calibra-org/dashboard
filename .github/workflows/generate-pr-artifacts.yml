name: Generate PR Artifacts

on:
    push:
        branches:
            - agent/payment-phase4-transaction-center
    workflow_dispatch:

permissions:
    contents: write

env:
    NODE_VERSION: "24.14.0"
    PNPM_VERSION: "10.32.1"
    NODE_ENV: test
    PORT: "3334"
    HOST: "0.0.0.0"
    APP_NAME: calibra-api
    APP_KEY: ci-only-key-not-used-for-real-secrets
    LOG_LEVEL: warn
    DB_HOST: localhost
    DB_PORT: "5432"
    DB_USER: calibra
    DB_PASSWORD: calibra
    DB_DATABASE: calibra
    MAIL_FROM_ADDRESS: ops@calibra.local
    MAIL_FROM_NAME: Calibra
    MAIL_NOTIFICATIONS_ENABLED: "false"
    SMTP_HOST: localhost
    SMTP_PORT: "11025"
    REDIS_HOST: localhost
    REDIS_PORT: "6379"
    TRANSMIT_TRANSPORT: none
    QUEUE_DRIVER: sync
    LIMITER_STORE: memory
    CACHE_DRIVER: memory

jobs:
    generate:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        services:
            postgres:
                image: postgres:17-alpine
                env:
                    POSTGRES_USER: calibra
                    POSTGRES_PASSWORD: calibra
                    POSTGRES_DB: calibra
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U calibra -d calibra"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: agent/payment-phase4-transaction-center
                  fetch-depth: 0
            - uses: pnpm/action-setup@v4
              with:
                  version: ${{ env.PNPM_VERSION }}
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "pnpm"
            - run: pnpm install --frozen-lockfile
            - name: Regenerate database schema from migrations
              working-directory: apps/api
              run: node ace migration:run --force
            - name: Regenerate Admin SDK from OpenAPI
              run: pnpm --filter @calibra/sdk run codegen
            - name: Commit generated artifacts
              shell: bash
              run: |
                  git add apps/api/database/schema.ts packages/sdk/src/generated/admin.d.ts
                  if git diff --cached --quiet; then
                    echo "Generated artifacts already synchronized."
                    exit 0
                  fi
                  git config user.name "calibra-artifact-bot"
                  git config user.email "calibra-artifact-bot@users.noreply.github.com"
                  git commit -m "chore(codegen): synchronize payment schema and admin SDK"
                  git push origin HEAD:agent/payment-phase4-transaction-center
