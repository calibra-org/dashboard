name: Branch Source Snapshot

on:
  push:
    branches:
      - agent/complete-ticket-seo-content-backends-20260814
    paths:
      - .github/workflows/branch-source-snapshot.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: calibra-branch-source
          path: .
          include-hidden-files: true
          retention-days: 1

# One-shot refresh used to capture the exact PR #17 HEAD for offline release verification.
