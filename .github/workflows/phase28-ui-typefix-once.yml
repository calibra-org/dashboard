name: Phase 28 UI Type Fix

on:
  push:
    branches:
      - feat/phase28-objective-autonomy-20260825
    paths:
      - ".github/workflows/phase28-ui-typefix-once.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase28-objective-autonomy-20260825
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - run: npm install --global pnpm@10.32.1
      - run: pnpm install --frozen-lockfile
      - name: Fix Phase 28 admin type contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("apps/admin/src/features/objective-autonomy/ObjectiveAutonomyWorkspace.tsx")
          text = path.read_text()
          replacements = {
              '                description={': '                subtitle={',
              '<Select value={autonomyLevel} onValueChange={setAutonomyLevel}>': '<Select value={autonomyLevel} onValueChange={(value) => setAutonomyLevel(String(value ?? ""))}>',
              '<Select value={riskCeiling} onValueChange={setRiskCeiling}>': '<Select value={riskCeiling} onValueChange={(value) => setRiskCeiling(String(value ?? ""))}>',
              '<Select value={scenarioId} onValueChange={setScenarioId}>': '<Select value={scenarioId} onValueChange={(value) => setScenarioId(String(value ?? ""))}>',
              '<Select value={portfolioId} onValueChange={setPortfolioId}>': '<Select value={portfolioId} onValueChange={(value) => setPortfolioId(String(value ?? ""))}>',
              '<Select value={planId} onValueChange={setPlanId}>': '<Select value={planId} onValueChange={(value) => setPlanId(String(value ?? ""))}>',
              '<p className="font-medium text-xs">{label}</p>': '<p className="font-medium text-xs">{String(label)}</p>',
              'path: `objectives/${selected.public_id}/cycles/${latestCycle.public_id}/execute`,': 'path: `objectives/${selected?.public_id ?? "missing"}/cycles/${latestCycle.public_id}/execute`,',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"missing pattern: {old}")
              text = text.replace(old, new)
          path.write_text(text)
          PY
      - run: pnpm exec biome check --write --unsafe apps/admin/src/features/objective-autonomy/ObjectiveAutonomyWorkspace.tsx
      - run: pnpm --filter @calibra/admin run typecheck
      - name: Commit Phase 28 UI type fix
        run: |
          git config user.name "calibra-phase28-ci"
          git config user.email "actions@users.noreply.github.com"
          git add apps/admin/src/features/objective-autonomy/ObjectiveAutonomyWorkspace.tsx
          git commit -m "fix(admin): satisfy Phase 28 UI type contracts" || exit 0
          git push origin HEAD:feat/phase28-objective-autonomy-20260825
