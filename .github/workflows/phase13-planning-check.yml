name: Phase 13 Planning Integrity

on:
  pull_request:
    paths:
      - "apps/api/app/services/planning_forecast_engine.ts"
      - "apps/api/app/services/phase13_planning_service.ts"
      - "apps/api/app/controllers/admin/planning_controller.ts"
      - "apps/api/app/validators/admin/phase13_planning_validator.ts"
      - "apps/api/database/migrations/1766000000000_create_phase13_planning_os.ts"
      - "apps/api/start/routes/admin_planning.ts"
      - "apps/api/start/routes.ts"
      - "apps/admin/src/features/planning/**"
      - "apps/admin/src/lib/queries/planning.ts"
      - "apps/admin/src/app/**/planning/**"
      - "apps/admin/src/components/Sidebar.tsx"
      - "docs/api/reference/openapi/admin.phase13.v1.yaml"
      - "docs/api/package.json"
      - "docs/api/scripts/merge-admin-spec.js"
      - "packages/sdk/src/generated/admin.d.ts"
      - "scripts/verify-phase13-planning-integration.mjs"
      - "scripts/smoke-phase13-forecast.mjs"
      - ".github/workflows/phase13-planning-check.yml"
  push:
    branches:
      - main
    paths:
      - "apps/api/app/services/planning_forecast_engine.ts"
      - "apps/api/app/services/phase13_planning_service.ts"
      - "apps/api/database/migrations/1766000000000_create_phase13_planning_os.ts"
      - "apps/admin/src/features/planning/**"
      - "docs/api/reference/openapi/admin.phase13.v1.yaml"

permissions:
  contents: write

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
      - name: Install pnpm
        run: npm install --global pnpm@10.32.1
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Finalize Phase 12 and Phase 13 composition
        if: github.event_name == 'pull_request'
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const replace = (path, from, to, required = true) => {
            let text = fs.readFileSync(path, 'utf8');
            if (text.includes(to)) return;
            if (!text.includes(from)) {
              if (required) throw new Error(`Expected patch anchor missing in ${path}: ${from}`);
              return;
            }
            text = text.replace(from, to);
            fs.writeFileSync(path, text);
          };

          replace(
            'apps/admin/src/components/Sidebar.tsx',
            '            { href: "/analytics/decision-intelligence", label: "هوش تصمیم‌گیری", icon: Sparkles },\n',
            '            { href: "/analytics/decision-intelligence", label: "هوش تصمیم‌گیری", icon: Sparkles },\n            { href: "/planning", label: "Planning OS", icon: CalendarClock },\n'
          );

          const economicsFiles = [
            'apps/api/app/services/phase13_planning_service.ts',
            'apps/admin/src/features/planning/PlanningWorkspace.tsx',
            'apps/api/tests/functional/admin/planning.spec.ts',
            'docs/api/reference/openapi/admin.phase13.v1.yaml',
            'scripts/verify-phase13-planning-integration.mjs',
            'scripts/smoke-phase13-forecast.mjs',
          ];
          for (const path of economicsFiles) {
            let text = fs.readFileSync(path, 'utf8');
            text = text.replaceAll('dependency_not_landed', 'available_not_applied');
            fs.writeFileSync(path, text);
          }

          replace(
            'apps/api/app/services/phase13_planning_service.ts',
            '                    phase12_economics: ECONOMICS_STATUS,',
            '                    phase12_economics: "landed",'
          );

          replace(
            'docs/api/reference/openapi/admin.phase13.v1.yaml',
            'Phase 12 economics degrades explicitly when unavailable.',
            'Phase 12 economics is landed; Phase 13 reports cost-aware optimization as not applied until economic objectives are explicitly used.',
            false
          );
          NODE
          pnpm exec biome check --write \
            apps/admin/src/components/Sidebar.tsx \
            apps/admin/src/features/planning/PlanningWorkspace.tsx \
            apps/api/app/services/phase13_planning_service.ts \
            apps/api/tests/functional/admin/planning.spec.ts \
            scripts/verify-phase13-planning-integration.mjs \
            scripts/smoke-phase13-forecast.mjs
          pnpm --filter @calibra/sdk run codegen
          git config user.name "calibra-dev"
          git config user.email "keshavarz20.com@gmail.com"
          git add \
            apps/admin/src/components/Sidebar.tsx \
            apps/admin/src/features/planning/PlanningWorkspace.tsx \
            apps/api/app/services/phase13_planning_service.ts \
            apps/api/tests/functional/admin/planning.spec.ts \
            docs/api/reference/openapi/admin.phase13.v1.yaml \
            packages/sdk/src/generated/admin.d.ts \
            scripts/verify-phase13-planning-integration.mjs \
            scripts/smoke-phase13-forecast.mjs
          if ! git diff --cached --quiet; then
            git commit -m "fix(planning): compose Phase 13 with landed Phase 12"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
      - name: Biome check Phase 13 sources
        run: >-
          pnpm exec biome check
          apps/api/app/services/planning_forecast_engine.ts
          apps/api/app/services/phase13_planning_service.ts
          apps/api/app/controllers/admin/planning_controller.ts
          apps/api/app/validators/admin/phase13_planning_validator.ts
          apps/api/database/migrations/1766000000000_create_phase13_planning_os.ts
          apps/api/start/routes/admin_planning.ts
          apps/admin/src/features/planning/PlanningWorkspace.tsx
          apps/admin/src/lib/queries/planning.ts
          'apps/admin/src/app/[locale]/(authenticated)/planning/page.tsx'
          apps/api/tests/functional/admin/planning.spec.ts
          apps/api/tests/unit/planning/phase13_forecast.spec.ts
          scripts/verify-phase13-planning-integration.mjs
          scripts/smoke-phase13-forecast.mjs
          --max-diagnostics=100
      - name: Verify Phase 13 integration contracts
        run: node scripts/verify-phase13-planning-integration.mjs
      - name: Smoke forecast and replenishment math
        run: node --experimental-strip-types scripts/smoke-phase13-forecast.mjs
      - name: Validate merged test OpenAPI with Japa validator backend
        run: |
          pnpm --filter @calibra/api-docs run build:test-spec
          builder=$(find "$PWD/node_modules/.pnpm" -path '*/node_modules/api-schema-builder/src/index.js' -print -quit)
          test -n "$builder"
          BUILDER="$builder" node <<'NODE'
          const builder = require(process.env.BUILDER);
          try {
            builder.buildSchemaSync('docs/api/dist/_merged.test.json');
            console.log('Merged OpenAPI test schema is compatible with api-schema-builder.');
          } catch (error) {
            console.error(error?.stack ?? error);
            if (error?.errors) console.error(JSON.stringify(error.errors, null, 2));
            process.exit(1);
          }
          NODE
