name: Phase 13 Planning Integrity

on:
  pull_request:
    paths:
      - "apps/api/app/services/planning_forecast_engine.ts"
      - "apps/api/app/services/phase13_planning_service.ts"
      - "apps/api/app/controllers/admin/planning_controller.ts"
      - "apps/api/app/validators/admin/phase13_planning_validator.ts"
      - "apps/api/database/migrations/1766000000000_create_phase13_planning_os.ts"
      - "apps/api/start/routes/admin_planning.ts"
      - "apps/api/start/routes.ts"
      - "apps/admin/src/features/planning/**"
      - "apps/admin/src/lib/queries/planning.ts"
      - "apps/admin/src/app/**/planning/**"
      - "docs/api/reference/openapi/admin.phase13.v1.yaml"
      - "scripts/verify-phase13-planning-integration.mjs"
      - "scripts/smoke-phase13-forecast.mjs"
      - ".github/workflows/phase13-planning-check.yml"
  push:
    branches:
      - main
    paths:
      - "apps/api/app/services/planning_forecast_engine.ts"
      - "apps/api/app/services/phase13_planning_service.ts"
      - "apps/api/database/migrations/1766000000000_create_phase13_planning_os.ts"
      - "apps/admin/src/features/planning/**"
      - "docs/api/reference/openapi/admin.phase13.v1.yaml"

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
      - name: Install pnpm
        run: npm install --global pnpm@10.32.1
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Biome check Phase 13 sources
        run: >-
          pnpm exec biome check
          apps/api/app/services/planning_forecast_engine.ts
          apps/api/app/services/phase13_planning_service.ts
          apps/api/app/controllers/admin/planning_controller.ts
          apps/api/app/validators/admin/phase13_planning_validator.ts
          apps/api/database/migrations/1766000000000_create_phase13_planning_os.ts
          apps/api/start/routes/admin_planning.ts
          apps/admin/src/features/planning/PlanningWorkspace.tsx
          apps/admin/src/lib/queries/planning.ts
          'apps/admin/src/app/[locale]/(authenticated)/planning/page.tsx'
          apps/api/tests/functional/admin/planning.spec.ts
          apps/api/tests/unit/planning/phase13_forecast.spec.ts
          scripts/verify-phase13-planning-integration.mjs
          scripts/smoke-phase13-forecast.mjs
          --max-diagnostics=100
      - name: Verify Phase 13 integration contracts
        run: node scripts/verify-phase13-planning-integration.mjs
      - name: Smoke forecast and replenishment math
        run: node --experimental-strip-types scripts/smoke-phase13-forecast.mjs
      - name: Validate merged test OpenAPI with Japa validator backend
        run: |
          pnpm --filter @calibra/api-docs run build:test-spec
          builder=$(find node_modules/.pnpm -path '*/node_modules/api-schema-builder/src/index.js' -print -quit)
          test -n "$builder"
          BUILDER="$builder" node <<'NODE'
          const builder = require(process.env.BUILDER);
          try {
            builder.buildSchemaSync('docs/api/dist/_merged.test.json');
            console.log('Merged OpenAPI test schema is compatible with api-schema-builder.');
          } catch (error) {
            console.error(error?.stack ?? error);
            if (error?.errors) console.error(JSON.stringify(error.errors, null, 2));
            process.exit(1);
          }
          NODE
