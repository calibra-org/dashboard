name: Phase 13 Planning Integrity

on:
  pull_request:
    paths:
      - "apps/api/app/services/planning_forecast_engine.ts"
      - "apps/api/app/services/phase13_planning_service.ts"
      - "apps/api/app/controllers/admin/planning_controller.ts"
      - "apps/api/app/validators/admin/phase13_planning_validator.ts"
      - "apps/api/database/migrations/1766000000000_create_phase13_planning_os.ts"
      - "apps/api/start/routes/admin_planning.ts"
      - "apps/api/start/routes.ts"
      - "apps/admin/src/features/planning/**"
      - "apps/admin/src/lib/queries/planning.ts"
      - "apps/admin/src/app/**/planning/**"
      - "docs/api/reference/openapi/admin.phase13.v1.yaml"
      - "scripts/verify-phase13-planning-integration.mjs"
      - "scripts/smoke-phase13-forecast.mjs"
      - ".github/workflows/phase13-planning-check.yml"
  push:
    branches:
      - main
    paths:
      - "apps/api/app/services/planning_forecast_engine.ts"
      - "apps/api/app/services/phase13_planning_service.ts"
      - "apps/api/database/migrations/1766000000000_create_phase13_planning_os.ts"
      - "apps/admin/src/features/planning/**"
      - "docs/api/reference/openapi/admin.phase13.v1.yaml"

permissions:
  contents: write

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
      - name: Install pnpm
        run: npm install --global pnpm@10.32.1
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Normalize Phase 13 semantic color tokens
        if: github.event_name == 'pull_request'
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/admin/src/features/planning/PlanningWorkspace.tsx';
          let source = fs.readFileSync(path, 'utf8');
          const replacements = [
            ['violet-500', 'primary'],
            ['violet-700', 'primary'],
            ['violet-300', 'primary'],
            ['fuchsia-500', 'accent'],
            ['sky-500', 'info'],
            ['sky-700', 'info'],
            ['sky-300', 'info'],
            ['cyan-500', 'info'],
            ['amber-500', 'warning'],
            ['amber-700', 'warning'],
            ['amber-300', 'warning'],
            ['orange-500', 'warning'],
            ['emerald-500', 'success'],
            ['emerald-700', 'success'],
            ['emerald-300', 'success'],
            ['teal-500', 'success'],
            ['rose-500', 'danger'],
            ['rose-700', 'danger'],
            ['rose-300', 'danger'],
          ];
          for (const [from, to] of replacements) source = source.replaceAll(from, to);
          fs.writeFileSync(path, source);
          NODE
          pnpm exec biome check apps/admin/src/features/planning/PlanningWorkspace.tsx --write --max-diagnostics=100
          if ! git diff --quiet -- apps/admin/src/features/planning/PlanningWorkspace.tsx; then
            git config user.name "calibra-ci"
            git config user.email "calibra-ci@users.noreply.github.com"
            git add apps/admin/src/features/planning/PlanningWorkspace.tsx
            git commit -m "style(planning): use Calibra semantic color tokens"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Biome check Phase 13 sources
        run: >-
          pnpm exec biome check
          apps/api/app/services/planning_forecast_engine.ts
          apps/api/app/services/phase13_planning_service.ts
          apps/api/app/controllers/admin/planning_controller.ts
          apps/api/app/validators/admin/phase13_planning_validator.ts
          apps/api/database/migrations/1766000000000_create_phase13_planning_os.ts
          apps/api/start/routes/admin_planning.ts
          apps/admin/src/features/planning/PlanningWorkspace.tsx
          apps/admin/src/lib/queries/planning.ts
          'apps/admin/src/app/[locale]/(authenticated)/planning/page.tsx'
          apps/api/tests/functional/admin/planning.spec.ts
          apps/api/tests/unit/planning/phase13_forecast.spec.ts
          scripts/verify-phase13-planning-integration.mjs
          scripts/smoke-phase13-forecast.mjs
          --max-diagnostics=100
      - name: Verify Phase 13 integration contracts
        run: node scripts/verify-phase13-planning-integration.mjs
      - name: Smoke forecast and replenishment math
        run: node --experimental-strip-types scripts/smoke-phase13-forecast.mjs
