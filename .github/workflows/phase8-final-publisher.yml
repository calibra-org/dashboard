name: Phase 8 Final Publisher

on:
  pull_request:
    branches:
      - main
    paths:
      - ".phase8-final/**"
      - ".github/workflows/phase8-final-publisher.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  checks: read
  pull-requests: read

concurrency:
  group: phase8-final-publisher
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout live main with full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct and hash-lock Phase 8 final patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          src='origin/agent/phase8-run5-final-publisher'
          : > /tmp/phase8-final.b64
          for n in 00 01 02 03 04 05 06 07; do
            git show "$src:.phase8-final/part-$n" >> /tmp/phase8-final.b64
          done
          tr -d '\r\n' < /tmp/phase8-final.b64 | base64 -d > /tmp/phase8-final.patch.gz
          gzip -dc /tmp/phase8-final.patch.gz > /tmp/phase8-final.patch
          echo '55b80ea35d9d75327eba6fabbc04048b6818c3891d9832112077a2af62170f7e  /tmp/phase8-final.patch' | sha256sum -c -
          echo "patch_bytes=$(wc -c < /tmp/phase8-final.patch)"
          echo "patch_files=$(grep -c '^diff --git ' /tmp/phase8-final.patch)"
          git apply --stat /tmp/phase8-final.patch

      - name: Apply on live main and verify static invariants
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'calibra-dev'
          git config user.email 'keshavarz20.com@gmail.com'
          git switch -C agent/phase8-social-commerce-run5-final origin/main
          if ! git apply --3way --index /tmp/phase8-final.patch; then
            echo 'PHASE8_FINAL_APPLY_CONFLICT=1'
            git status --short || true
            echo 'Unmerged paths:'
            git diff --name-only --diff-filter=U || true
            exit 1
          fi
          test -z "$(git ls-files -u)"
          git diff --cached --check
          node scripts/verify-phase8-social-commerce.mjs
          echo '--- MATERIALIZED FILES ---'
          git diff --cached --name-status

      - name: Commit and publish final Phase 8 branch
        shell: bash
        run: |
          set -euo pipefail
          git commit -m 'feat(social): Phase 8 Social Commerce, Stories, Video & Community OS'
          git push origin HEAD:refs/heads/agent/phase8-social-commerce-run5-final
          echo "PHASE8_FINAL_HEAD=$(git rev-parse HEAD)"
