name: Phase 21 Biome Diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/phase21-biome-diagnostic.yml"
  push:
    branches:
      - agent/phase21-agentic-commerce-gateway
    paths:
      - ".github/workflows/phase21-biome-diagnostic.yml"

permissions:
  contents: read

jobs:
  biome-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
      - run: npm install --global pnpm@10.32.1
      - run: pnpm install --frozen-lockfile
      - name: Print complete Biome diagnostics
        run: pnpm exec biome lint --max-diagnostics=1000 .
