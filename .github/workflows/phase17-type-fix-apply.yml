name: Phase 17 Type Fix Apply

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase17-main-sync-v3
          fetch-depth: 0
      - name: Apply exact type-safety fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once("apps/api/app/services/phase17_statistics.ts", "export function deterministicBucket(parts: Array<string | number>): number {", "export function deterministicBucket(parts: Array<string | number | bigint>): number {")
          replace_once("apps/api/app/services/phase17_statistics.ts", "export function subjectHash(tenantId: number, subjectType: string, subjectKey: string): string {", "export function subjectHash(tenantId: number | bigint, subjectType: string, subjectKey: string): string {")
          replace_once("apps/api/app/services/phase17_statistics.ts", "if (mean === null || controlMean === null || row.variantId === control?.variantId) {", "if (!control || mean === null || controlMean === null || row.variantId === control.variantId) {")
          replace_once("apps/api/app/services/phase17_experimentation_service.ts", "async assign(input: { experiment_key: string; subject_type: string; subject_key: string }) {", "async assign(input: { experiment_key: string; subject_type: string; subject_key: string }): Promise<{ data: Record<string, unknown> }> {")
          replace_once("apps/api/app/services/phase14_procurement_service.ts", "type Actor = { id?: number | string };", "type Actor = { id?: number | string | bigint };")
          replace_once("apps/api/app/services/phase20_trust_risk_service.ts", "type Actor = { id?: number | string };", "type Actor = { id?: number | string | bigint };")
          replace_once("apps/api/app/services/phase20_trust_risk_service.ts", "async checkoutGuard(input: { orderId: number | string; customerId?: number | string | null; idempotencyKey?: string | null; amountMinor?: number | null }) {", "async checkoutGuard(input: { orderId: number | string; customerId?: number | string | bigint | null; idempotencyKey?: string | null; amountMinor?: number | null }) {")
          PY
          git diff --check
      - name: Commit scoped fixes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/app/services/phase17_statistics.ts apps/api/app/services/phase17_experimentation_service.ts apps/api/app/services/phase14_procurement_service.ts apps/api/app/services/phase20_trust_risk_service.ts
          git rm .github/workflows/phase17-type-fix-apply.yml
          git commit -m "fix(phase17): align type safety with latest main"
          git push origin HEAD:agent/phase17-main-sync-v3
