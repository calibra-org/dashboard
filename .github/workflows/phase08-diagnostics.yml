name: Phase 08 diagnostics

on:
    push:
        branches:
            - "phase/08-payment-gateways"

permissions:
    contents: read

jobs:
    changed-files:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: pnpm/action-setup@v4
              with:
                  version: 10.32.1
            - uses: actions/setup-node@v4
              with:
                  node-version: 24.14.0
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - name: Biome check only Phase 08 changed source
              shell: bash
              run: |
                  git diff --name-only origin/main...HEAD -- '*.ts' '*.tsx' '*.js' '*.mjs' | tr '\n' '\0' | xargs -0 pnpm exec biome check --max-diagnostics=500
