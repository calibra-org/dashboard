name: Phase 08 diagnostics

on:
    push:
        branches:
            - "phase/08-payment-gateways"

permissions:
    contents: write

jobs:
    changed-files:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: pnpm/action-setup@v4
              with:
                  version: 10.32.1
            - uses: actions/setup-node@v4
              with:
                  node-version: 24.14.0
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - name: Apply safe Biome fixes to Phase 08 source
              shell: bash
              run: |
                  git diff --name-only origin/main...HEAD -- '*.ts' '*.tsx' '*.js' '*.mjs' | tr '\n' '\0' | xargs -0 pnpm exec biome check --write --max-diagnostics=500
            - name: Commit fixes
              shell: bash
              run: |
                  if git diff --quiet; then
                      echo "No fixes needed"
                      exit 0
                  fi
                  git config user.name "calibra-dev"
                  git config user.email "keshavarz20.com@gmail.com"
                  git add -A
                  git commit -m "style(payments): apply Biome safe fixes"
                  git push
