name: Phase 8 Reconcile Probe

on:
  push:
    branches:
      - agent/phase8-run2-reconcile-probe
    paths:
      - ".github/workflows/phase8-materialize.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase8-run2-reconcile-probe
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct and verify locked payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .phase8/materialize -maxdepth 1 -type f -name 'part-*' | wc -l)" -eq 6
          cat .phase8/materialize/part-* > /tmp/phase8.patch.gz.b64
          base64 -d /tmp/phase8.patch.gz.b64 > /tmp/phase8.patch.gz
          gzip -dc /tmp/phase8.patch.gz > /tmp/phase8.patch
          expected="cfd53594431022b138352fddea3b091f0009de4f831ed3853500ed327ec9fef2"
          actual="$(sha256sum /tmp/phase8.patch | awk '{print $1}')"
          echo "expected=$expected"
          echo "actual=$actual"
          test "$actual" = "$expected"

      - name: Rebase probe onto current main and three-way apply
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          main_sha="$(git rev-parse origin/main)"
          echo "current_main=$main_sha"
          git reset --hard origin/main
          if ! git apply --3way --index /tmp/phase8.patch; then
            echo "PHASE8_RECONCILE_CONFLICT=1"
            git status --short || true
            echo "Unmerged paths:"
            git diff --name-only --diff-filter=U || true
            exit 1
          fi
          test -z "$(git ls-files -u)"
          git diff --cached --check
          echo "Changed files against current main:"
          git diff --cached --name-status

      - name: Verify Phase 8 static release invariants
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-phase8-social-commerce.mjs

      - name: Commit probe result only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Calibra Phase 8 Reconcile Probe"
          git config user.email "phase8-reconcile@users.noreply.github.com"
          git commit -m "test(phase8): reconcile locked Phase 8 payload onto current main"
          git push --force-with-lease origin HEAD:agent/phase8-run2-reconcile-probe
