name: Phase 8 Integration Materializer

on:
  push:
    branches:
      - agent/phase8-integration-reconcile
    paths:
      - ".phase8/materialize/**"
      - ".github/workflows/phase8-materialize.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase8-integration-reconcile
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct and verify locked payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .phase8/materialize -maxdepth 1 -type f -name 'part-*' | wc -l)" -eq 6
          cat .phase8/materialize/part-* > /tmp/phase8.patch.gz.b64
          base64 -d /tmp/phase8.patch.gz.b64 > /tmp/phase8.patch.gz
          gzip -dc /tmp/phase8.patch.gz > /tmp/phase8.patch
          expected="cfd53594431022b138352fddea3b091f0009de4f831ed3853500ed327ec9fef2"
          actual="$(sha256sum /tmp/phase8.patch | awk '{print $1}')"
          echo "expected=$expected"
          echo "actual=$actual"
          test "$actual" = "$expected"

      - name: Three-way apply onto current integration baseline
        shell: bash
        run: |
          set -euo pipefail
          baseline="$(git rev-parse HEAD)"
          echo "integration_baseline=$baseline"
          if ! git apply --3way --index /tmp/phase8.patch; then
            echo "PHASE8_RECONCILE_CONFLICT=1"
            git status --short || true
            echo "Unmerged paths:"
            git diff --name-only --diff-filter=U || true
            exit 1
          fi
          test -z "$(git ls-files -u)"
          git diff --cached --check

      - name: Remove one-shot transport helpers
        shell: bash
        run: |
          set -euo pipefail
          git rm -r .phase8/materialize
          git rm .github/workflows/phase8-materialize.yml
          git diff --cached --check
          test -z "$(git diff --cached --name-only | grep '^\.phase8/' || true)"
          test -z "$(git diff --cached --name-only | grep '^\.github/workflows/phase8-materialize\.yml$' || true)"

      - name: Verify Phase 8 static release invariants
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-phase8-social-commerce.mjs

      - name: Commit materialized source to integration branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Calibra Phase 8 Materializer"
          git config user.email "phase8-materializer@users.noreply.github.com"
          git status --short
          git commit -m "feat(social): materialize Phase 8 Social Commerce & Community OS"
          git push origin HEAD:agent/phase8-integration-reconcile
