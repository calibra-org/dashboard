name: Phase 33 Bootstrap

on:
  push:
    branches:
      - feat/phase33-snippets

permissions:
  contents: write

concurrency:
  group: phase33-bootstrap
  cancel-in-progress: false

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/phase33-snippets
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.14.0
      - run: npm install --global pnpm@10.32.1
      - run: pnpm install --frozen-lockfile
      - name: Wire Phase 33 into canonical files
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceOnce(path, before, after) {
            const source = fs.readFileSync(path, 'utf8');
            const count = source.split(before).length - 1;
            if (count !== 1) throw new Error(`${path}: expected one replacement, found ${count}`);
            fs.writeFileSync(path, source.replace(before, after));
          }

          replaceOnce(
            'apps/admin/src/components/Sidebar.tsx',
            '        items: [\n            { href: "/settings/general", labelKey: "settings", icon: Settings },',
            '        items: [\n            { href: "/snippets", label: "Snippets", icon: FileText },\n            { href: "/settings/general", labelKey: "settings", icon: Settings },',
          );

          const docsPath = 'docs/api/package.json';
          const docs = JSON.parse(fs.readFileSync(docsPath, 'utf8'));
          const oldAdminBuild = docs.scripts['build:json:admin'];
          const oldTail = 'pnpm build:json:admin-phase32 && pnpm build:json:admin-merge';
          if (!oldAdminBuild.includes(oldTail)) throw new Error('docs/api package admin build tail changed');
          docs.scripts['build:json:admin'] = oldAdminBuild.replace(
            oldTail,
            'pnpm build:json:admin-phase32 && pnpm build:json:admin-phase33 && pnpm build:json:admin-merge',
          );
          docs.scripts['build:json:admin-phase33'] =
            'redocly bundle reference/openapi/admin.phase33.v1.yaml -o dist/admin.phase33.v1.json --ext json';
          fs.writeFileSync(docsPath, `${JSON.stringify(docs, null, 4)}\n`);

          const rootPath = 'package.json';
          const root = JSON.parse(fs.readFileSync(rootPath, 'utf8'));
          root.scripts['verify:phase33'] = 'node scripts/verify-phase33-snippets.mjs';
          fs.writeFileSync(rootPath, `${JSON.stringify(root, null, 4)}\n`);

          replaceOnce(
            'docs/api/scripts/merge-admin-spec.js',
            'const phase32 = JSON.parse(readFileSync(resolve(root, "dist/admin.phase32.v1.json"), "utf8"));',
            'const phase32 = JSON.parse(readFileSync(resolve(root, "dist/admin.phase32.v1.json"), "utf8"));\nconst phase33 = JSON.parse(readFileSync(resolve(root, "dist/admin.phase33.v1.json"), "utf8"));',
          );
          replaceOnce(
            'docs/api/scripts/merge-admin-spec.js',
            '    [phase32, "Phase32ReliabilityGuardianOverlay"],',
            '    [phase32, "Phase32ReliabilityGuardianOverlay"],\n    [phase33, "Phase33SnippetsOverlay"],',
          );

          const servicePath = 'apps/api/app/services/snippets/snippets_service.ts';
          let service = fs.readFileSync(servicePath, 'utf8');
          const serializedBefore = `function serializeSnippet(row: JsonRecord) {
              const validation = objectValue(row.last_validation);
              const currentChecksum = checksum(String(row.source ?? ""));
              return {
                  ...row,
                  conditions: objectValue(row.conditions),
                  capabilities: stringArray(row.capabilities),
                  last_validation: validation,
                  has_unpublished_changes:
                      row.active_revision_id !== null && row.active_revision_id !== undefined && String(validation.checksum ?? "") !== currentChecksum,
              };
          }`;
          const serializedAfter = `function serializeSnippet(row: JsonRecord) {
              return {
                  ...row,
                  conditions: objectValue(row.conditions),
                  capabilities: stringArray(row.capabilities),
                  last_validation: objectValue(row.last_validation),
              };
          }`;
          if (!service.includes(serializedBefore)) throw new Error('serializeSnippet block changed');
          service = service.replace(serializedBefore, serializedAfter);
          const failureNeedle = `            "execution.id",
                      "execution.consumer_key",`;
          if (!service.includes(failureNeedle)) throw new Error('failure select block changed');
          service = service.replace(
            failureNeedle,
            `            "execution.id",
                      "execution.consumer_key",
                      "execution.outcome",`,
          );
          const helperPattern = /\nasync function insertRevision\([\s\S]*?\n}\n\nexport async function createSnippet/;
          if (!helperPattern.test(service)) throw new Error('unused insertRevision helper not found');
          service = service.replace(helperPattern, '\nexport async function createSnippet');
          fs.writeFileSync(servicePath, service);

          replaceOnce(
            'apps/admin/src/lib/queries/snippets.ts',
            '    consecutive_failures: number;\n    has_unpublished_changes: boolean;\n    created_at: string;',
            '    consecutive_failures: number;\n    created_at: string;',
          );

          replaceOnce(
            'apps/admin/src/features/snippets/SnippetsWorkspace.tsx',
            '                    onUse={(template) => {\n                        setSelectedId(null);\n                        setTab("editor");\n                        sessionStorage.setItem("snippets.template", JSON.stringify(template));\n                    }}',
            '                    onUse={(template) => {\n                        sessionStorage.setItem("snippets.template", JSON.stringify(template));\n                        setSelectedId(null);\n                        setTab("editor");\n                    }}',
          );
          NODE
      - name: Format Phase 33 code
        run: >-
          pnpm exec biome check --write
          apps/api/database/migrations/1804000000000_create_snippets_os.ts
          apps/api/app/services/snippets
          apps/api/app/controllers/admin/snippets_controller.ts
          apps/api/app/validators/snippets
          apps/api/start/routes/admin_snippets.ts
          apps/api/start/routes.ts
          apps/admin/src/features/snippets/SnippetsWorkspace.tsx
          apps/admin/src/lib/queries/snippets.ts
          "apps/admin/src/app/[locale]/(authenticated)/snippets/page.tsx"
          apps/admin/src/components/Sidebar.tsx
          docs/api/package.json
          docs/api/scripts/merge-admin-spec.js
          package.json
          scripts/verify-phase33-snippets.mjs
      - name: Verify static Phase 33 contract
        run: node scripts/verify-phase33-snippets.mjs
      - name: Verify Phase 33 OpenAPI overlay builds
        run: pnpm --filter @calibra/api-docs run build:json:admin-phase33
      - name: Remove bootstrap workflow and commit canonical wiring
        run: |
          git rm .github/workflows/phase33-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: finalize Phase 33 Snippets integration"
          git push origin HEAD:feat/phase33-snippets
