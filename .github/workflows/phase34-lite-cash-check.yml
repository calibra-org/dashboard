name: Phase 34 lite cash Integrity

on:
  pull_request:
    paths:
      - "apps/api/database/migrations/1805000000000_create_lite_cash_os.ts"
      - "apps/api/database/migrations/1805000000100_add_lite_cash_warm_job_idempotency.ts"
      - "apps/api/app/services/lite_cash/**"
      - "apps/api/app/controllers/admin/lite_cash_controller.ts"
      - "apps/api/app/validators/lite_cash/**"
      - "apps/api/tests/unit/lite_cash_policy.spec.ts"
      - "apps/api/start/routes/admin_lite_cash.ts"
      - "apps/api/start/routes.ts"
      - "apps/admin/src/features/lite-cash/**"
      - "apps/admin/src/lib/queries/lite-cash.ts"
      - "apps/admin/src/app/**/lite-cash/**"
      - "apps/admin/src/components/Sidebar.tsx"
      - "docs/api/reference/openapi/admin.phase34.v1.yaml"
      - "docs/api/package.json"
      - "docs/api/scripts/merge-admin-spec.js"
      - "docs/calibra/phase34-lite-cash-master-prompt.md"
      - "docs/calibra/phase34-lite-cash-conformance-posture.md"
      - "packages/sdk/src/generated/admin.d.ts"
      - "package.json"
      - "scripts/verify-phase34-lite-cash.mjs"
      - ".github/workflows/phase34-lite-cash-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase34-lite-cash-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: calibra
          POSTGRES_PASSWORD: calibra
          POSTGRES_DB: calibra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U calibra -d calibra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.14.0
      - run: npm install --global pnpm@10.32.1
      - run: pnpm install --frozen-lockfile
      - name: Phase 34 static contract
        run: node scripts/verify-phase34-lite-cash.mjs
      - name: Phase 34 formatting
        run: >-
          pnpm exec biome check
          apps/api/database/migrations/1805000000000_create_lite_cash_os.ts
          apps/api/database/migrations/1805000000100_add_lite_cash_warm_job_idempotency.ts
          apps/api/app/services/lite_cash
          apps/api/app/controllers/admin/lite_cash_controller.ts
          apps/api/app/validators/lite_cash
          apps/api/tests/unit/lite_cash_policy.spec.ts
          apps/api/start/routes/admin_lite_cash.ts
          apps/api/start/routes.ts
          apps/admin/src/features/lite-cash/LiteCashWorkspace.tsx
          apps/admin/src/lib/queries/lite-cash.ts
          "apps/admin/src/app/[locale]/(authenticated)/lite-cash/page.tsx"
          apps/admin/src/components/Sidebar.tsx
          docs/api/package.json
          docs/api/scripts/merge-admin-spec.js
          package.json
          scripts/verify-phase34-lite-cash.mjs
      - name: Build Phase 34 OpenAPI overlay
        run: pnpm --filter @calibra/api-docs run build:json:admin-phase34
      - name: Phase 34 unit tests
        working-directory: apps/api
        run: pnpm test --files=tests/unit/lite_cash_policy.spec.ts
      - name: API typecheck
        run: pnpm --filter @calibra/api run typecheck
      - name: OpenAPI and SDK drift check
        run: pnpm --filter @calibra/sdk run codegen:check
      - name: Build SDK dependency
        run: pnpm --filter @calibra/sdk run build
      - name: Admin typecheck
        run: pnpm --filter @calibra/admin run typecheck
      - name: Admin production build
        run: pnpm --filter @calibra/admin run build
      - name: Storefront typecheck regression
        run: pnpm --filter @calibra/web run typecheck
      - name: Storefront production build regression
        run: pnpm --filter @calibra/web run build
      - name: Clean-tree drift check
        run: git diff --exit-code
