name: Phase 22 Materialize Final Source

on:
  push:
    branches:
      - agent/phase22-materializer-20260822
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: phase22-materialize-final-source
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NODE_ENV: test
      PORT: 3333
      HOST: 127.0.0.1
      APP_NAME: calibra-api-test
      APP_KEY: phase22-test-app-key-0123456789abcdef
      LOG_LEVEL: silent
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: calibra
      DB_PASSWORD: calibra
      DB_DATABASE: calibra_test
      DB_ADMIN_USER: calibra
      DB_ADMIN_PASSWORD: calibra
      MAIL_FROM_ADDRESS: ops@calibra.local
      MAIL_FROM_NAME: Calibra
      MAIL_NOTIFICATIONS_ENABLED: "false"
      SMTP_HOST: localhost
      SMTP_PORT: 11025
      QUEUE_DRIVER: sync
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      TRANSMIT_TRANSPORT: none
      LIMITER_STORE: memory
      CACHE_DRIVER: memory
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: calibra
          POSTGRES_PASSWORD: calibra
          POSTGRES_DB: calibra_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U calibra -d calibra_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase22-materializer-20260822
          fetch-depth: 0

      - name: Preserve carrier payload and switch to clean target
        shell: bash
        run: |
          set -euo pipefail
          cat .phase22/stage_00 .phase22/stage_01 .phase22/stage_02 .phase22/stage_03 > /tmp/phase22-stage.b64
          cp .phase22/patch.py /tmp/phase22_patch.py
          git fetch origin agent/phase22-multi-agent-orchestrator-20260822
          git checkout -B agent/phase22-multi-agent-orchestrator-20260822 origin/agent/phase22-multi-agent-orchestrator-20260822
          base64 -d /tmp/phase22-stage.b64 | tar -xzf - -C .
          python3 /tmp/phase22_patch.py
          git diff --check

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format changed source only
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(
            { git diff --name-only; git ls-files --others --exclude-standard; } \
              | sort -u \
              | grep -E '\.(ts|tsx|js|jsx|mjs|cjs|json)$' \
              | grep -v '^apps/api/database/schema\.ts$' \
              | grep -v '^packages/sdk/src/generated/' || true
          )
          if [ "${#files[@]}" -gt 0 ]; then
            pnpm exec biome check --write --unsafe "${files[@]}"
            pnpm exec biome check "${files[@]}"
          fi
          git diff --check

      - name: Run migration chain and regenerate schema
        working-directory: apps/api
        run: node ace migration:run --connection=postgres_admin --force

      - name: OpenAPI, SDK and focused Phase 22 validation
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir docs/api run build:json:admin
          pnpm --filter @calibra/sdk run codegen:admin
          node scripts/verify-phase22-agent-orchestrator.mjs
          pnpm --filter @calibra/api-docs run build:test-spec
          (cd apps/api && timeout 240s node ace test --files=tests/functional/agent_orchestrator/phase22_agent_orchestrator.spec.ts)
          pnpm --filter @calibra/api run typecheck
          pnpm exec turbo run typecheck --filter=@calibra/admin
          git diff --check

      - name: Guard carrier isolation and publish finalized source
        shell: bash
        run: |
          set -euo pipefail
          ! git status --short | grep -E '^.. \.phase22/'
          ! git status --short | grep -F '.github/workflows/phase22-materialize.yml'
          git config user.name "calibra-dev"
          git config user.email "keshavarz20.com@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m 'feat(phase22): add multi-agent commerce orchestrator'
          git push origin HEAD:agent/phase22-multi-agent-orchestrator-20260822
