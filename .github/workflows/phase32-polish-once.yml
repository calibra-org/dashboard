name: Phase 32 Polish Once

on:
  push:
    branches:
      - feat/phase32-reliability-guardian-20260827
    paths:
      - ".github/workflows/phase32-polish-once.yml"

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase32-reliability-guardian-20260827
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - run: npm install --global pnpm@10.32.1
      - run: pnpm install --frozen-lockfile
      - name: Apply correctness patch
        run: python scripts/phase32-polish-once.py
      - name: Format Phase 32 source
        run: >-
          pnpm exec biome check --write
          apps/api/database/migrations/1803000000000_create_reliability_guardian_os.ts
          apps/api/app/services/reliability_guardian
          apps/api/app/controllers/admin/reliability_guardian_controller.ts
          apps/api/app/validators/reliability_guardian
          apps/api/start/routes/admin_reliability_guardian.ts
          apps/api/start/routes.ts
          apps/admin/src/features/reliability-guardian/ReliabilityGuardianWorkspace.tsx
          apps/admin/src/lib/queries/reliability-guardian.ts
          "apps/admin/src/app/[locale]/(authenticated)/analytics/reliability-guardian/page.tsx"
          apps/admin/src/components/Sidebar.tsx
          scripts/verify-phase32-reliability-guardian.mjs
          .github/workflows/phase32-reliability-guardian-check.yml
      - name: Commit polished source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/database/migrations/1803000000000_create_reliability_guardian_os.ts apps/api/app/services/reliability_guardian apps/api/app/controllers/admin/reliability_guardian_controller.ts apps/api/app/validators/reliability_guardian apps/api/start/routes/admin_reliability_guardian.ts apps/api/start/routes.ts apps/admin/src/features/reliability-guardian/ReliabilityGuardianWorkspace.tsx apps/admin/src/lib/queries/reliability-guardian.ts "apps/admin/src/app/[locale]/(authenticated)/analytics/reliability-guardian/page.tsx" apps/admin/src/components/Sidebar.tsx scripts/verify-phase32-reliability-guardian.mjs .github/workflows/phase32-reliability-guardian-check.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(phase32): harden evidence and recovery semantics"
          git push origin HEAD:feat/phase32-reliability-guardian-20260827
