name: SEO seven-engine formatter

on:
  push:
    branches:
      - agent/seo-seven-real-engines-20260811

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/seo-seven-real-engines-20260811
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format SEO seven-engine changes
        run: |
          pnpm exec biome format \
            apps/api/app/services/seo/search_engines.ts \
            apps/api/app/controllers/admin/seo_controller.ts \
            apps/api/app/validators/admin/seo_validator.ts \
            apps/api/database/migrations/1760000000000_expand_seo_search_engines.ts \
            apps/api/tests/unit/seo/search_engines.spec.ts \
            apps/admin/src/features/seo/types.ts \
            --write
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api apps/admin/src/features/seo/types.ts
          git commit -m "style(seo): apply Biome formatting"
          git push origin HEAD:agent/seo-seven-real-engines-20260811
