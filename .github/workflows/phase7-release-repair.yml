name: Phase 7 Release Repair

on:
  push:
    branches:
      - agent/phase7-identity-trust-os

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      FORCE_COLOR: "3"
      TURBO_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
      NODE_VERSION: "24.14.0"
      PNPM_VERSION: "10.32.1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase7-identity-trust-os
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply targeted release repairs
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function read(path) { return fs.readFileSync(path, 'utf8'); }
          function write(path, value) { fs.writeFileSync(path, value, 'utf8'); }
          function replaceExact(path, from, to) {
            const source = read(path);
            if (!source.includes(from)) throw new Error(`Expected repair anchor not found: ${path}`);
            write(path, source.replace(from, to));
          }

          const docsPackagePath = 'docs/api/package.json';
          const docsPackage = JSON.parse(read(docsPackagePath));
          docsPackage.scripts['build:json:admin-phase6'] = 'redocly bundle reference/openapi/admin.phase6.v1.yaml -o dist/admin.phase6.v1.json --ext json';
          docsPackage.scripts['build:json:admin'] = 'pnpm build:json:admin-base && pnpm build:json:admin-tickets && pnpm build:json:admin-ticket-omnichannel && pnpm build:json:admin-phase5 && pnpm build:json:admin-phase6 && pnpm build:json:admin-runtime-sync && pnpm build:json:admin-identity && pnpm build:json:admin-completion && pnpm build:json:admin-merge';
          write(docsPackagePath, `${JSON.stringify(docsPackage, null, 4)}\n`);

          replaceExact(
            'docs/api/scripts/merge-admin-spec.js',
            'const phase5 = JSON.parse(readFileSync(resolve(root, "dist/admin.phase5.v1.json"), "utf8"));\nconst runtimeSync =',
            'const phase5 = JSON.parse(readFileSync(resolve(root, "dist/admin.phase5.v1.json"), "utf8"));\nconst phase6 = JSON.parse(readFileSync(resolve(root, "dist/admin.phase6.v1.json"), "utf8"));\nconst runtimeSync =',
          );
          replaceExact(
            'docs/api/scripts/merge-admin-spec.js',
            '    [phase5, "Phase5Overlay"],\n    [runtimeSync, "RuntimeSyncOverlay"],',
            '    [phase5, "Phase5Overlay"],\n    [phase6, "Phase6Overlay"],\n    [runtimeSync, "RuntimeSyncOverlay"],',
          );

          replaceExact(
            'apps/api/app/controllers/admin/payment_attempts_controller.ts',
            '.sum("amount_minor as amount_minor")',
            '.sum("amount_minor as total_amount_minor")',
          );
          replaceExact(
            'apps/api/app/controllers/admin/payment_attempts_controller.ts',
            'const amountMinor = Number(row.$extras.amount_minor ?? 0);',
            'const amountMinor = Number(row.$extras.total_amount_minor ?? 0);',
          );

          replaceExact(
            'apps/api/tests/functional/payments/admin_transaction_center.spec.ts',
            '.qs({ "filter[]": ["amount_minor:gte:1500000", "amount_minor:lte:3000000"], "sort[]": "amount_minor:desc" })',
            '.qs({ "filter[]": "amount_minor:between:1500000,3000000", "sort[]": "amount_minor:desc" })',
          );

          replaceExact(
            'apps/api/tests/functional/admin/orders.spec.ts',
            'test("transitions processing → completed, persists tracking metadata, idempotent re-runs", async ({ client, assert }) => {',
            'test("creates canonical in-transit fulfillment, persists tracking metadata, idempotent re-runs", async ({ client, assert }) => {',
          );
          replaceExact(
            'apps/api/tests/functional/admin/orders.spec.ts',
            '        assert.equal(body.status, "completed");',
            '        assert.equal(body.status, "processing");',
          );
          replaceExact(
            'apps/api/tests/functional/admin/orders.spec.ts',
            '        /** Second call updates tracking without re-transitioning. */',
            '        /** Second call updates the canonical shipment without completing the order; delivery is explicit. */',
          );
          replaceExact(
            'apps/api/tests/functional/admin/orders.spec.ts',
            '        assert.equal(reshipped.body().data.status, "completed");',
            '        assert.equal(reshipped.body().data.status, "processing");',
          );
          replaceExact(
            'apps/api/tests/functional/admin/orders.spec.ts',
            '        /** Draft → markShipped — state machine refuses the implicit completed transition. */\n        const res = await client.post(`/api/v1/admin/orders/${order.id}/mark-shipped`).loginAs(admin).json({});\n        res.assertStatus(200);',
            '        /** Draft → markShipped is rejected; compatibility shipping is processing-only. */\n        const res = await client.post(`/api/v1/admin/orders/${order.id}/mark-shipped`).loginAs(admin).json({});\n        res.assertStatus(422);',
          );

          replaceExact(
            'docs/api/reference/openapi/admin.v1.yaml',
            '    /api/v1/admin/payment-attempts/{id}/reconcile:\n        post:\n            $ref: "./admin/paths/payments/payment-attempts-id-reconcile.post.yaml"\n\n        head:\n            $ref: "./common/components/operations/HeadCompanion.yaml"\n',
            '    /api/v1/admin/payment-attempts/{id}/reconcile:\n        post:\n            $ref: "./admin/paths/payments/payment-attempts-id-reconcile.post.yaml"\n',
          );
          NODE
      - name: Regenerate contracts and format
        run: |
          pnpm sdk:codegen
          pnpm format:fix
      - name: Verify repaired static gates
        run: |
          pnpm run typecheck
          pnpm --filter @calibra/api-docs run build:json
      - name: Commit repaired branch and remove bootstrap workflow
        run: |
          rm -f .github/workflows/phase7-release-repair.yml
          git config user.name "calibra-dev"
          git config user.email "calibra-dev@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(identity): repair Phase 7 release gates"
          git push origin HEAD:agent/phase7-identity-trust-os
