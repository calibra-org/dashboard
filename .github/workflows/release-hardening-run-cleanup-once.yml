name: Release Hardening Run Cleanup Once

on:
  push:
    branches:
      - ops/release-hardening-run-cleanup-20260829
    paths:
      - .github/workflows/release-hardening-run-cleanup-once.yml

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel superseded release-hardening runs
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_BRANCH: chore/release-hardening-final-lock-20260829-gpt56
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          self_run="$GITHUB_RUN_ID"

          for status in queued in_progress; do
            page=1
            while true; do
              payload="$(curl --fail-with-body --silent --show-error \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/$repo/actions/runs?status=$status&per_page=100&page=$page")"

              count="$(jq '.workflow_runs | length' <<<"$payload")"
              if [ "$count" -eq 0 ]; then
                break
              fi

              while IFS=$'\t' read -r run_id head_branch; do
                if [ "$run_id" = "$self_run" ]; then
                  continue
                fi
                case "$head_branch" in
                  chore/release-hardening*) ;;
                  *) continue ;;
                esac
                if [ "$head_branch" = "$KEEP_BRANCH" ]; then
                  continue
                fi

                echo "Cancelling superseded run $run_id on $head_branch"
                http_code="$(curl --silent --show-error --output /tmp/cancel-response.txt --write-out '%{http_code}' \
                  -X POST \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "https://api.github.com/repos/$repo/actions/runs/$run_id/cancel")"

                if [ "$http_code" != "202" ] && [ "$http_code" != "409" ]; then
                  cat /tmp/cancel-response.txt
                  echo "Unexpected cancel response: HTTP $http_code" >&2
                  exit 1
                fi
              done < <(jq -r '.workflow_runs[] | [.id, (.head_branch // "")] | @tsv' <<<"$payload")

              if [ "$count" -lt 100 ]; then
                break
              fi
              page=$((page + 1))
            done
          done
