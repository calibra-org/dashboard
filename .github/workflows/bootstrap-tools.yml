name: Bootstrap local tools

on:
  push:
    branches:
      - agent/bootstrap-tools-20260817
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect toolchain
        run: |
          set -euxo pipefail
          git --version
          gh --version
          node --version
          corepack --version || true
      - name: Build bootstrap bundle
        run: |
          set -euxo pipefail
          mkdir -p /tmp/calibra-bootstrap/bin
          cp "$(command -v gh)" /tmp/calibra-bootstrap/bin/gh
          tar -C "$GITHUB_WORKSPACE" -czf /tmp/calibra-bootstrap/calibra-repo.tar.gz .
          sha256sum /tmp/calibra-bootstrap/bin/gh /tmp/calibra-bootstrap/calibra-repo.tar.gz > /tmp/calibra-bootstrap/SHA256SUMS
      - name: Upload bootstrap bundle
        uses: actions/upload-artifact@v4
        with:
          name: calibra-bootstrap-tools
          path: /tmp/calibra-bootstrap
          if-no-files-found: error
          retention-days: 1
