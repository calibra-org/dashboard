name: Phase 32 Reliability Guardian Integrity

on:
  pull_request:
    paths:
      - "apps/api/database/migrations/1803000000000_create_reliability_guardian_os.ts"
      - "apps/api/app/services/reliability_guardian/**"
      - "apps/api/app/controllers/admin/reliability_guardian_controller.ts"
      - "apps/api/app/validators/reliability_guardian/**"
      - "apps/api/start/routes/admin_reliability_guardian.ts"
      - "apps/api/start/routes.ts"
      - "apps/admin/src/features/reliability-guardian/**"
      - "apps/admin/src/lib/queries/reliability-guardian.ts"
      - "apps/admin/src/app/**/analytics/reliability-guardian/**"
      - "apps/admin/src/components/Sidebar.tsx"
      - "docs/api/reference/openapi/admin.phase32.v1.yaml"
      - "docs/api/package.json"
      - "docs/api/scripts/merge-admin-spec.js"
      - "docs/calibra/phase32-reliability-guardian-conformance-posture.md"
      - "scripts/verify-phase32-reliability-guardian.mjs"
      - ".github/workflows/phase32-reliability-guardian-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase32-reliability-guardian-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: calibra
          POSTGRES_PASSWORD: calibra
          POSTGRES_DB: calibra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U calibra -d calibra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - run: npm install --global pnpm@10.32.1
      - run: pnpm install --frozen-lockfile
      - name: Phase 32 static contract
        run: node scripts/verify-phase32-reliability-guardian.mjs
      - name: Phase 32 formatting
        run: >-
          pnpm exec biome check
          apps/api/database/migrations/1803000000000_create_reliability_guardian_os.ts
          apps/api/app/services/reliability_guardian
          apps/api/app/controllers/admin/reliability_guardian_controller.ts
          apps/api/app/validators/reliability_guardian
          apps/api/start/routes/admin_reliability_guardian.ts
          apps/api/start/routes.ts
          apps/admin/src/features/reliability-guardian/ReliabilityGuardianWorkspace.tsx
          apps/admin/src/lib/queries/reliability-guardian.ts
          "apps/admin/src/app/[locale]/(authenticated)/analytics/reliability-guardian/page.tsx"
          apps/admin/src/components/Sidebar.tsx
          docs/api/package.json
          docs/api/scripts/merge-admin-spec.js
          scripts/verify-phase32-reliability-guardian.mjs
      - name: Build Phase 32 OpenAPI overlay
        run: pnpm --filter @calibra/api-docs run build:json:admin-phase32
      - name: API typecheck
        run: pnpm --filter @calibra/api run typecheck
      - name: OpenAPI and SDK drift check
        run: pnpm --filter @calibra/sdk run codegen:check
      - name: Build SDK dependency
        run: pnpm --filter @calibra/sdk run build
      - name: Admin typecheck
        run: pnpm --filter @calibra/admin run typecheck
      - name: Admin production build
        run: pnpm --filter @calibra/admin run build
      - name: Storefront typecheck regression
        run: pnpm --filter @calibra/web run typecheck
      - name: Storefront production build regression
        run: pnpm --filter @calibra/web run build
      - name: Clean-tree drift check
        run: git diff --exit-code
