name: Phase 26 Canonicalize Once

on:
  push:
    branches: [feat/phase26-merchant-memory-20260823]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase26-canonicalize-once
  cancel-in-progress: true

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase26-merchant-memory-20260823
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - run: npm install --global pnpm@10.32.1
      - run: pnpm install --frozen-lockfile
      - name: Harden Phase 26 contracts
        run: |
          python <<'PY'
          from pathlib import Path
          import json

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  if new in text:
                      return text
                  raise SystemExit(f"missing patch marker: {label}")
              return text.replace(old, new, 1)

          service_path = Path('apps/api/app/services/phase26_merchant_memory_service.ts')
          service = service_path.read_text()

          source_target_marker = 'type SourceTarget = { table: string; idColumn?: string };'
          if 'type AgentMemoryPrincipal' not in service:
              service = replace_once(
                  service,
                  source_target_marker,
                  'type AgentMemoryPrincipal = { id: number; principal_key: string };\n\n' + source_target_marker,
                  'agent principal type',
              )

          hash_marker = '''function hash(value: unknown) {
              return createHash("sha256").update(JSON.stringify(stable(value))).digest("hex");
          }
          '''
          score_block = '''function hash(value: unknown) {
              return createHash("sha256").update(JSON.stringify(stable(value))).digest("hex");
          }

          export function normalizeMerchantMemorySearchTokens(query: string) {
              return [...new Set(query.normalize("NFKC").toLowerCase().replace(/[^\\p{L}\\p{N}]+/gu, " ").split(/\\s+/).filter((token) => token.length >= 2))].slice(0, 8);
          }

          export function merchantMemoryRetrievalScore(
              row: { title?: unknown; context?: unknown; lesson?: unknown; confidence?: unknown; strength?: unknown },
              tokens: string[],
          ) {
              const haystack = `${row.title ?? ""} ${row.context ?? ""} ${row.lesson ?? ""}`.normalize("NFKC").toLowerCase();
              const lexicalRatio = tokens.length === 0 ? 1 : tokens.filter((token) => haystack.includes(token)).length / tokens.length;
              const lexical = lexicalRatio * 0.5;
              const confidence = Math.max(0, Math.min(1, Number(row.confidence ?? 0))) * 0.25;
              const strength = Math.max(0, Math.min(1, Number(row.strength ?? 0))) * 0.25;
              return {
                  lexical: Number(lexical.toFixed(8)),
                  confidence: Number(confidence.toFixed(8)),
                  strength: Number(strength.toFixed(8)),
                  total: Number((lexical + confidence + strength).toFixed(8)),
              };
          }
          '''
          if 'merchantMemoryRetrievalScore' not in service:
              service = replace_once(service, hash_marker, score_block, 'retrieval score')

          privacy_marker = '''    const sensitivity = input.sensitivity ?? "aggregate";
              const consumers = input.allowed_consumers ?? ["human"];
          '''
          privacy_block = '''    const sensitivity = input.sensitivity ?? "aggregate";
              const consumers = input.allowed_consumers ?? ["human"];
              const sourceSensitivities = new Set(input.sources.map((source) => source.sensitivity ?? "aggregate"));
              if (sourceSensitivities.has("customer_level_sensitive") && sensitivity !== "customer_level_sensitive") {
                  throw new Exception("Sensitive source evidence requires sensitive memory classification", {
                      status: 422,
                      code: "E_MERCHANT_MEMORY_SOURCE_SENSITIVITY_DOWNGRADE",
                  });
              }
              if (sourceSensitivities.has("internal") && sensitivity === "aggregate") {
                  throw new Exception("Internal source evidence cannot be downgraded to aggregate memory", {
                      status: 422,
                      code: "E_MERCHANT_MEMORY_SOURCE_SENSITIVITY_DOWNGRADE",
                  });
              }
          '''
          if 'E_MERCHANT_MEMORY_SOURCE_SENSITIVITY_DOWNGRADE' not in service:
              service = replace_once(service, privacy_marker, privacy_block, 'source sensitivity boundary')

          signature = 'export async function retrieveMemories(input: RetrieveMemoryInput, actor: User) {'
          hardened_signature = '''export async function retrieveMemories(
              input: RetrieveMemoryInput,
              actor: User,
              agentPrincipal: AgentMemoryPrincipal | null = null,
          ) {
              if (input.consumer === "agent" && !agentPrincipal) {
                  throw new Exception("Approved agent principal is required for agent retrieval", {
                      status: 403,
                      code: "E_MERCHANT_MEMORY_AGENT_PRINCIPAL_REQUIRED",
                  });
              }
              if (input.consumer === "human" && agentPrincipal) {
                  throw new Exception("Agent principal cannot be attached to human retrieval", {
                      status: 422,
                      code: "E_MERCHANT_MEMORY_PRINCIPAL_KIND_MISMATCH",
                  });
              }
          '''
          if 'agentPrincipal: AgentMemoryPrincipal | null = null' not in service:
              service = replace_once(service, signature, hardened_signature, 'server-derived agent principal')

          token_block = '''    const tokens = input.query
              .trim()
              .toLowerCase()
              .split(/\\s+/)
              .filter((token) => token.length >= 2)
              .slice(0, 8);
          '''
          if 'normalizeMerchantMemorySearchTokens(input.query)' not in service:
              service = replace_once(
                  service,
                  token_block,
                  '    const tokens = normalizeMerchantMemorySearchTokens(input.query);\n',
                  'token normalization',
              )

          rows_block = '''    const rows = await query
              .orderBy("strength", "desc")
              .orderBy("confidence", "desc")
              .orderBy("relevant_from", "desc")
              .limit(limit);
              const groupedSources = await sourceRows(rows.map((row) => Number(row.id)));
              const publicIds = rows.map((row) => String(row.public_id));
          '''
          ranked_block = '''    const candidateRows = await query
              .orderBy("strength", "desc")
              .orderBy("confidence", "desc")
              .orderBy("relevant_from", "desc")
              .limit(300);
              const ranked = candidateRows
                  .map((row) => ({ row, score: merchantMemoryRetrievalScore(row, tokens) }))
                  .sort((a, b) => b.score.total - a.score.total || Number(b.row.id) - Number(a.row.id))
                  .slice(0, limit);
              const rows = ranked.map(({ row }) => row);
              const scores = new Map(ranked.map(({ row, score }) => [Number(row.id), score]));
              const groupedSources = await sourceRows(rows.map((row) => Number(row.id)));
              const publicIds = rows.map((row) => String(row.public_id));
          '''
          if 'const candidateRows = await query' not in service:
              service = replace_once(service, rows_block, ranked_block, 'ranked retrieval')

          service = service.replace(
              'principal_id: String(actor.id),',
              'principal_id: input.consumer === "agent" ? String(agentPrincipal!.id) : String(actor.id),',
              1,
          )
          plain_return = 'memories: rows.map((row) => ({ ...row, sources: groupedSources.get(Number(row.id)) ?? [] })),'
          scored_return = 'memories: rows.map((row) => ({ ...row, retrieval_score: scores.get(Number(row.id))?.total ?? 0, score_components: scores.get(Number(row.id)) ?? null, sources: groupedSources.get(Number(row.id)) ?? [] })),'
          if plain_return in service:
              service = service.replace(plain_return, scored_return, 1)

          nullable_memory = '''    let memory: Record<string, unknown> | null = null;
              if (input.memory_public_id) {
                  memory = await requireMemory(input.memory_public_id);
                  const returned = json<string[]>(retrieval.returned_memory_public_ids, []);
                  if (!returned.includes(String(memory.public_id))) {
          '''
          narrowed_memory = '''    let memory: Record<string, unknown> | null = null;
              if (input.memory_public_id) {
                  const selectedMemory = await requireMemory(input.memory_public_id);
                  const returned = json<string[]>(retrieval.returned_memory_public_ids, []);
                  if (!returned.includes(String(selectedMemory.public_id))) {
          '''
          if 'const selectedMemory = await requireMemory(input.memory_public_id);' not in service:
              service = replace_once(service, nullable_memory, narrowed_memory, 'effectiveness memory narrowing')
              service = replace_once(
                  service,
                  '''            });
                  }
              }
              if (input.source_outcome_record_id) {''',
                  '''            });
                  }
                  memory = selectedMemory;
              }
              if (input.source_outcome_record_id) {''',
                  'effectiveness memory assignment',
              )

          overview_destructure = 'const [active, superseded, expired, retrievals, effectiveness] = await Promise.all(['
          if 'sourceLinkage' not in service:
              service = replace_once(
                  service,
                  overview_destructure,
                  'const [active, superseded, expired, retrievals, sourceLinkage, effectiveness] = await Promise.all([',
                  'overview metrics destructure',
              )
              retrieval_count = '        trx.from("merchant_memory_retrievals").where("tenant_id", tenantId()).count("* as count").first(),\n'
              linkage_query = '''        trx.from("merchant_memory_retrievals").where("tenant_id", tenantId()).count("* as count").first(),
                  trx
                      .from("merchant_memory_retrievals")
                      .where("tenant_id", tenantId())
                      .select(
                          trx.raw("SUM(source_linked_count)::float / NULLIF(SUM(result_count), 0) AS source_linked_retrieval_rate"),
                      )
                      .first(),
          '''
              service = replace_once(service, retrieval_count, linkage_query, 'source-linked retrieval metric')

          effectiveness_metric = 'trx.raw("AVG(CASE WHEN repeat_error_avoided IS TRUE THEN 1.0 WHEN repeat_error_avoided IS FALSE THEN 0.0 END) AS repeat_error_avoidance_rate"),'
          if 'misleading_memory_rate' not in service:
              service = replace_once(
                  service,
                  effectiveness_metric,
                  effectiveness_metric + '\n                trx.raw("AVG(CASE WHEN signal = \'harmful\' THEN 1.0 ELSE 0.0 END) AS misleading_memory_rate"),',
                  'misleading memory metric',
              )
              service = replace_once(
                  service,
                  '''        repeat_error_reduction_proxy:
                  effectiveness?.repeat_error_avoidance_rate == null ? null : Number(effectiveness.repeat_error_avoidance_rate),
              };''',
                  '''        repeat_error_reduction_proxy:
                  effectiveness?.repeat_error_avoidance_rate == null ? null : Number(effectiveness.repeat_error_avoidance_rate),
                  misleading_memory_rate:
                      effectiveness?.misleading_memory_rate == null ? null : Number(effectiveness.misleading_memory_rate),
                  source_linked_retrieval_rate:
                      sourceLinkage?.source_linked_retrieval_rate == null ? null : Number(sourceLinkage.source_linked_retrieval_rate),
              };''',
                  'overview metric response',
              )

          service_path.write_text(service)

          controller_path = Path('apps/api/app/controllers/admin/merchant_memory_controller.ts')
          controller = controller_path.read_text()
          old_retrieve = '''    async retrieve({ request, auth, response }: HttpContext) {
              await requireMerchantMemoryPermission(auth.user!, "merchant_memory.retrieve");
              const payload = await request.validateUsing(retrieveMerchantMemoryValidator);
              if (payload.consumer === "agent") {
                  if (!payload.agent_principal_key) {
                      throw new Exception("Agent retrieval requires an approved principal key", {
                          status: 403,
                          code: "E_MERCHANT_MEMORY_AGENT_PRINCIPAL_REQUIRED",
                      });
                  }
                  await requireApprovedAgentPrincipal(payload.agent_principal_key);
                  payload.include_customer_sensitive = false;
              } else if (payload.include_customer_sensitive) {
                  await requireExplicitMerchantMemoryPermission(auth.user!, "merchant_memory.restricted");
              }
              return response.ok({ data: await memory.retrieveMemories(payload, auth.user!) });
          }
          '''
          new_retrieve = '''    async retrieve({ request, auth, response }: HttpContext) {
              await requireMerchantMemoryPermission(auth.user!, "merchant_memory.retrieve");
              const payload = await request.validateUsing(retrieveMerchantMemoryValidator);
              let agentPrincipal: Awaited<ReturnType<typeof requireApprovedAgentPrincipal>> | null = null;
              if (payload.consumer === "agent") {
                  if (!payload.agent_principal_key) {
                      throw new Exception("Agent retrieval requires an approved principal key", {
                          status: 403,
                          code: "E_MERCHANT_MEMORY_AGENT_PRINCIPAL_REQUIRED",
                      });
                  }
                  agentPrincipal = await requireApprovedAgentPrincipal(payload.agent_principal_key);
                  payload.include_customer_sensitive = false;
              } else if (payload.include_customer_sensitive) {
                  await requireExplicitMerchantMemoryPermission(auth.user!, "merchant_memory.restricted");
              }
              return response.ok({ data: await memory.retrieveMemories(payload, auth.user!, agentPrincipal) });
          }
          '''
          if 'let agentPrincipal: Awaited<ReturnType<typeof requireApprovedAgentPrincipal>> | null = null;' not in controller:
              controller = replace_once(controller, old_retrieve, new_retrieve, 'controller agent principal derivation')
          controller_path.write_text(controller)

          package_path = Path('docs/api/package.json')
          pkg = json.loads(package_path.read_text())
          scripts = pkg['scripts']
          scripts['build:json:admin-phase26'] = 'redocly bundle reference/openapi/admin.phase26.v1.yaml -o dist/admin.phase26.v1.json --ext json'
          if 'build:json:admin-phase26' not in scripts['build:json:admin']:
              scripts['build:json:admin'] = scripts['build:json:admin'].replace(
                  'pnpm build:json:admin-phase25 &&',
                  'pnpm build:json:admin-phase25 && pnpm build:json:admin-phase26 &&',
              )
          package_path.write_text(json.dumps(pkg, ensure_ascii=False, indent=4) + '\n')

          merge_path = Path('docs/api/scripts/merge-admin-spec.js')
          merge = merge_path.read_text()
          if 'const phase26 =' not in merge:
              merge = merge.replace(
                  'const phase25 = JSON.parse(readFileSync(resolve(root, "dist/admin.phase25.v1.json"), "utf8"));',
                  'const phase25 = JSON.parse(readFileSync(resolve(root, "dist/admin.phase25.v1.json"), "utf8"));\nconst phase26 = JSON.parse(readFileSync(resolve(root, "dist/admin.phase26.v1.json"), "utf8"));',
              )
          if '[phase26, "Phase26MerchantMemoryOverlay"]' not in merge:
              merge = merge.replace(
                  '[phase25, "Phase25GrowthPortfolioOverlay"],',
                  '[phase25, "Phase25GrowthPortfolioOverlay"],\n    [phase26, "Phase26MerchantMemoryOverlay"],',
              )
          merge_path.write_text(merge)

          sidebar_path = Path('apps/admin/src/components/Sidebar.tsx')
          sidebar = sidebar_path.read_text()
          if '/analytics/merchant-memory' not in sidebar:
              anchor = '            { href: "/analytics/growth-portfolio", label: "سبد رشد خودکار", icon: TrendingUp },\n'
              sidebar = replace_once(
                  sidebar,
                  anchor,
                  anchor + '            { href: "/analytics/merchant-memory", label: "حافظه سازمانی", icon: Library },\n',
                  'Phase 26 navigation',
              )
          sidebar_path.write_text(sidebar)

          workspace_path = Path('apps/admin/src/features/merchant-memory/MerchantMemoryWorkspace.tsx')
          workspace = workspace_path.read_text()
          if 'misleading_memory_rate' not in workspace:
              workspace = workspace.replace(
                  '    repeat_error_reduction_proxy: number | null;\n',
                  '    repeat_error_reduction_proxy: number | null;\n    misleading_memory_rate: number | null;\n    source_linked_retrieval_rate: number | null;\n',
              )
              workspace = workspace.replace(
                  '            <div className="grid gap-4 md:grid-cols-2 xl:grid-cols-4">',
                  '            <div className="grid gap-4 md:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-6">',
              )
              card_anchor = '                <Card className="p-4"><p className="text-sm text-muted-foreground">کاهش تکرار خطا</p><p className="mt-2 text-3xl font-semibold">{percent(overview.data?.repeat_error_reduction_proxy)}</p></Card>\n'
              workspace = replace_once(
                  workspace,
                  card_anchor,
                  card_anchor + '                <Card className="p-4"><p className="text-sm text-muted-foreground">بازیابی منبع‌دار</p><p className="mt-2 text-3xl font-semibold">{percent(overview.data?.source_linked_retrieval_rate)}</p></Card>\n                <Card className="p-4"><p className="text-sm text-muted-foreground">حافظه گمراه‌کننده</p><p className="mt-2 text-3xl font-semibold">{percent(overview.data?.misleading_memory_rate)}</p></Card>\n',
                  'Phase 26 KPI cards',
              )
              workspace = workspace.replace('<span>Score: {memory.retrieval_score}</span>', '<span>امتیاز: {percent(memory.retrieval_score)}</span>')
          workspace_path.write_text(workspace)

          verifier_path = Path('scripts/verify-phase26-merchant-memory.mjs')
          verifier = verifier_path.read_text()
          additions = '''
          must(service.includes("merchantMemoryRetrievalScore") && service.includes("score_components"), "deterministic retrieval score explanation missing");
          must(service.includes("normalizeMerchantMemorySearchTokens"), "unicode-safe retrieval token normalization missing");
          must(service.includes("agentPrincipal!.id"), "server-derived agent principal linkage missing");
          must(service.includes("E_MERCHANT_MEMORY_SOURCE_SENSITIVITY_DOWNGRADE"), "source sensitivity downgrade protection missing");
          must(service.includes("misleading_memory_rate") && service.includes("source_linked_retrieval_rate"), "Phase 26 effectiveness KPIs incomplete");
          must(read("apps/api/app/controllers/admin/merchant_memory_controller.ts").includes("requireApprovedAgentPrincipal"), "approved agent principal gate missing");
          must(read("apps/admin/src/components/Sidebar.tsx").includes("/analytics/merchant-memory"), "Phase 26 navigation missing");
          must(read("docs/api/package.json").includes("build:json:admin-phase26"), "Phase 26 OpenAPI build wiring missing");
          must(read("docs/api/scripts/merge-admin-spec.js").includes("Phase26MerchantMemoryOverlay"), "Phase 26 OpenAPI merge wiring missing");
          must(read("docs/api/reference/openapi/admin.phase26.v1.yaml").includes("/api/v1/admin/merchant-memory/retrievals/{publicId}/effectiveness"), "Phase 26 OpenAPI effectiveness route missing");
          '''
          if 'deterministic retrieval score explanation missing' not in verifier:
              verifier = verifier.replace(
                  'console.log("PASS Phase26 Merchant Memory integrity gate");',
                  additions + '\nconsole.log("PASS Phase26 Merchant Memory integrity gate");',
              )
          verifier_path.write_text(verifier)
          PY
      - name: Canonical format
        run: >-
          pnpm exec biome check --write
          apps/api/app/controllers/admin/merchant_memory_controller.ts
          apps/api/app/services/phase26_merchant_memory_service.ts
          apps/api/tests/unit/phase26_merchant_memory_ranking.spec.ts
          apps/api/database/migrations/1779000000000_create_merchant_memory.ts
          apps/api/start/routes.ts
          apps/admin/src/features/merchant-memory/MerchantMemoryWorkspace.tsx
          apps/admin/src/lib/queries/merchant-memory.ts
          apps/admin/src/components/Sidebar.tsx
          docs/api/package.json
          docs/api/scripts/merge-admin-spec.js
          scripts/verify-phase26-merchant-memory.mjs
      - name: Phase 26 static gate
        run: node scripts/verify-phase26-merchant-memory.mjs
      - name: Phase 26 ranking unit test
        run: pnpm --filter @calibra/api exec node ace test --files='tests/unit/phase26_merchant_memory_ranking.spec.ts'
      - name: API typecheck
        run: pnpm --filter @calibra/api run typecheck
      - name: Admin typecheck
        run: pnpm --filter @calibra/admin run typecheck
      - name: Build merged Admin OpenAPI
        run: pnpm --filter @calibra/api-docs run build:json:admin
      - name: Generate canonical SDK
        run: pnpm --filter @calibra/sdk run generate:admin
      - name: Reformat generated contracts
        run: pnpm exec biome check --write docs/api/package.json docs/api/scripts/merge-admin-spec.js packages/sdk/src/generated/admin.d.ts
      - name: Verify generated contracts are stable
        run: |
          pnpm --filter @calibra/api-docs run build:json:admin
          pnpm --filter @calibra/sdk run generate:admin
          git diff --exit-code -- packages/sdk/src/generated/admin.d.ts
      - name: Commit canonical Phase 26 output and remove workflow
        run: |
          rm .github/workflows/phase26-canonicalize-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(phase26): canonicalize merchant memory contracts"
          git push origin HEAD:feat/phase26-merchant-memory-20260823
