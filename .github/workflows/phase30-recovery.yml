name: Phase 30 One-shot Recovery

on:
  push:
    branches:
      - feat/phase30-retail-media-creator-20260826
    paths:
      - .github/workflows/phase30-recovery.yml

permissions:
  actions: read
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase30-retail-media-creator-20260826
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: phase30-materialized
          path: /tmp/phase30-artifact
          github-token: ${{ github.token }}
          repository: calibra-org/dashboard
          run-id: 32903752877
      - name: Restore verified materialized sources
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/phase30-artifact/apps/admin/src/features/retail-media/RetailMediaWorkspace.tsx apps/admin/src/features/retail-media/RetailMediaWorkspace.tsx
          cp /tmp/phase30-artifact/apps/api/app/services/retail_media/retail_media_service.ts apps/api/app/services/retail_media/retail_media_service.ts
          cp /tmp/phase30-artifact/scripts/phase30-materialize.mjs scripts/phase30-materialize.mjs
          python3 - <<'PY'
          from pathlib import Path

          ui = Path('apps/admin/src/features/retail-media/RetailMediaWorkspace.tsx')
          text = ui.read_text()
          old = '''                {Array.from({ length: 4 }, (_, index) => (\n                    <Card key={index} className="h-36 animate-pulse bg-muted/30" />\n                ))}'''
          new = '''                {["campaigns", "placements", "creators", "measurement"].map((key) => (\n                    <Card key={key} className="h-36 animate-pulse bg-muted/30" />\n                ))}'''
          if old not in text:
              raise SystemExit('expected Phase 30 skeleton anchor missing')
          text = text.replace(old, new, 1)
          text = text.replace('const [reason, setReason] = useState("تنظیم عملیاتی Phase 30");', 'const reason = "تنظیم عملیاتی Phase 30";', 1)
          text = text.replace('const [reason, setReason] = useState("تعریف جایگاه Sponsored");', 'const reason = "تعریف جایگاه Sponsored";', 1)
          ui.write_text(text)

          svc = Path('apps/api/app/services/retail_media/retail_media_service.ts')
          text = svc.read_text()
          old = '        value.forEach((item, index) => assertPrivacySafeContext(item, `${path}[${index}]`));'
          new = '''        value.forEach((item, index) => {\n            assertPrivacySafeContext(item, `${path}[${index}]`);\n        });'''
          if old not in text:
              raise SystemExit('expected Phase 30 privacy callback anchor missing')
          svc.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/phase30-recovery.yml
          git config user.name 'calibra-phase-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- apps/admin/src/features/retail-media/RetailMediaWorkspace.tsx apps/api/app/services/retail_media/retail_media_service.ts scripts/phase30-materialize.mjs .github/workflows/phase30-recovery.yml
          git commit -m 'fix(phase30): restore retail media workspace and lint-safe sources'
          git push origin HEAD:feat/phase30-retail-media-creator-20260826
