name: Phase 31 Fulfillment Promise Integrity

on:
  pull_request:
    paths:
      - "apps/api/database/migrations/1802000000000_create_hyperlocal_promise_fulfillment_os.ts"
      - "apps/api/database/migrations/1802000000001_support_split_fulfillment_promise_quotes.ts"
      - "apps/api/database/migrations/1802000000002_add_fulfillment_capacity_holds.ts"
      - "apps/api/app/services/fulfillment_promise/**"
      - "apps/api/app/controllers/admin/fulfillment_promise_controller.ts"
      - "apps/api/app/controllers/fulfillment_promise_storefront_controller.ts"
      - "apps/api/app/validators/fulfillment_promise/**"
      - "apps/api/start/routes/admin_fulfillment_promise.ts"
      - "apps/api/start/routes/fulfillment_promise_storefront.ts"
      - "apps/api/start/routes.ts"
      - "apps/api/app/controllers/checkout/submit_controller.ts"
      - "apps/api/tests/unit/phase31_fulfillment_promise.spec.ts"
      - "apps/admin/src/features/fulfillment-promise/**"
      - "apps/admin/src/lib/queries/fulfillment-promise.ts"
      - "apps/admin/src/app/**/analytics/fulfillment-promise/**"
      - "apps/admin/src/components/Sidebar.tsx"
      - "docs/api/reference/openapi/admin.phase31.v1.yaml"
      - "docs/api/reference/openapi/storefront.phase31.v1.yaml"
      - "docs/api/package.json"
      - "docs/api/scripts/merge-admin-spec.js"
      - "docs/api/scripts/merge-storefront-spec.js"
      - "docs/calibra/phase31-fulfillment-promise-conformance-posture.md"
      - "packages/sdk/src/generated/admin.d.ts"
      - "packages/sdk/src/generated/storefront.d.ts"
      - "scripts/phase31-materialize.mjs"
      - "scripts/phase31-policy-materialize.mjs"
      - "scripts/verify-phase31-fulfillment-promise.mjs"
      - ".github/workflows/phase31-fulfillment-promise-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase31-fulfillment-promise-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: calibra
          POSTGRES_PASSWORD: calibra
          POSTGRES_DB: calibra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U calibra -d calibra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - run: npm install --global pnpm@10.32.1
      - run: pnpm install --frozen-lockfile
      - name: Create test database
        env:
          PGPASSWORD: calibra
        run: psql -h localhost -U calibra -d calibra -c "CREATE DATABASE calibra_test OWNER calibra;"
      - name: Assert Phase 31 materialization
        run: |
          node scripts/phase31-materialize.mjs
          node scripts/phase31-policy-materialize.mjs
      - name: Check Phase 31 formatting
        run: >-
          pnpm exec biome check
          apps/api/database/migrations/1802000000000_create_hyperlocal_promise_fulfillment_os.ts
          apps/api/database/migrations/1802000000001_support_split_fulfillment_promise_quotes.ts
          apps/api/database/migrations/1802000000002_add_fulfillment_capacity_holds.ts
          apps/api/app/services/fulfillment_promise
          apps/api/app/controllers/admin/fulfillment_promise_controller.ts
          apps/api/app/controllers/fulfillment_promise_storefront_controller.ts
          apps/api/app/validators/fulfillment_promise
          apps/api/start/routes/admin_fulfillment_promise.ts
          apps/api/start/routes/fulfillment_promise_storefront.ts
          apps/api/start/routes.ts
          apps/api/app/controllers/checkout/submit_controller.ts
          apps/api/tests/unit/phase31_fulfillment_promise.spec.ts
          apps/admin/src/features/fulfillment-promise/FulfillmentPromiseWorkspace.tsx
          apps/admin/src/lib/queries/fulfillment-promise.ts
          "apps/admin/src/app/[locale]/(authenticated)/analytics/fulfillment-promise/page.tsx"
          apps/admin/src/components/Sidebar.tsx
          docs/api/package.json
          docs/api/scripts/merge-admin-spec.js
          docs/api/scripts/merge-storefront-spec.js
          scripts/phase31-materialize.mjs
          scripts/phase31-policy-materialize.mjs
          scripts/verify-phase31-fulfillment-promise.mjs
      - name: Phase 31 patch whitespace integrity
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
      - name: Build Phase 31 OpenAPI overlays
        run: |
          pnpm --filter @calibra/api-docs run build:json:admin-phase31
          pnpm --filter @calibra/api-docs run build:json:storefront-phase31
      - name: Phase 31 static contract
        run: node scripts/verify-phase31-fulfillment-promise.mjs
      - name: Phase 31 promise safety unit controls
        working-directory: apps/api
        run: pnpm test --force-exit --suite=unit --files='phase31_fulfillment_promise'
      - name: API typecheck
        run: pnpm --filter @calibra/api run typecheck
      - name: OpenAPI and SDK drift check
        run: pnpm --filter @calibra/sdk run codegen:check
      - name: Build SDK dependency
        run: pnpm --filter @calibra/sdk run build
      - name: Admin typecheck
        run: pnpm --filter @calibra/admin run typecheck
      - name: Admin production build
        run: pnpm --filter @calibra/admin run build
      - name: Storefront typecheck
        run: pnpm --filter @calibra/web run typecheck
      - name: Storefront production build
        run: pnpm --filter @calibra/web run build
      - name: Clean-tree drift check
        run: git diff --exit-code
