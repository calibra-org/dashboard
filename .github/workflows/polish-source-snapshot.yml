name: Polish Source Snapshot

on:
    pull_request:
        branches: ["main"]

permissions:
    contents: read

jobs:
    snapshot:
        if: github.head_ref == 'agent/main-polish-20260822'
        runs-on: ubuntu-latest
        timeout-minutes: 4
        steps:
            - uses: actions/checkout@v4
            - name: Pack source snapshot
              run: |
                  git archive --format=zip --output=calibra-dashboard-source.zip HEAD
            - uses: actions/upload-artifact@v4
              with:
                  name: calibra-dashboard-polish-source
                  path: calibra-dashboard-source.zip
                  if-no-files-found: error
                  retention-days: 1
