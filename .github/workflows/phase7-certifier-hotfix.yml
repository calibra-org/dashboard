name: Phase 7 certifier hotfix

on:
  push:
    branches: [agent/phase7-identity-trust-os]
    paths: [.github/workflows/phase7-certifier-hotfix.yml]

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase7-identity-trust-os
      - name: Correct canonical Phase 6 route assertions and retrigger certifier
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's#/configuration/capabilities#/configuration/registry#' .github/workflows/baseline-gate-repair.yml
          sed -i 's#/configuration/revisions/:scope/:revision/rollback#/configuration/history/:scope/:revision/rollback#' .github/workflows/baseline-gate-repair.yml
          grep -F '/configuration/registry' .github/workflows/baseline-gate-repair.yml
          grep -F '/configuration/history/:scope/:revision/rollback' .github/workflows/baseline-gate-repair.yml
          rm -f .github/workflows/phase7-certifier-hotfix.yml
          git add -A
          git config user.name "calibra-phase7-bot"
          git config user.email "calibra-phase7-bot@users.noreply.github.com"
          git commit -m "ci: correct Phase 6 route assertions"
          git push origin HEAD:agent/phase7-identity-trust-os
