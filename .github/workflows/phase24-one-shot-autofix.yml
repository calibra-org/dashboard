name: Phase 24 One-Shot Navigation Finalizer

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/phase24-synthetic-commerce-20260823'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - run: npm install --global pnpm@10.32.1
      - run: pnpm install --frozen-lockfile
      - name: Add Phase 23 and Phase 24 analytics access
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/admin/src/components/Sidebar.tsx';
          let source = fs.readFileSync(path, 'utf8');
          const anchor = '            { href: "/analytics/decision-intelligence", label: "هوش تصمیم‌گیری", icon: Sparkles },\n';
          if (!source.includes(anchor)) throw new Error('analytics navigation anchor not found');
          if (!source.includes('/analytics/scenario-war-room')) {
            source = source.replace(
              anchor,
              anchor +
                '            { href: "/analytics/scenario-war-room", label: "اتاق جنگ سناریو", icon: ChartNoAxesCombined },\n' +
                '            { href: "/analytics/pre-production-lab", label: "آزمایشگاه پیش‌انتشار", icon: Bug },\n',
            );
          }
          fs.writeFileSync(path, source);
          NODE
          pnpm exec biome check --write apps/admin/src/components/Sidebar.tsx
      - name: Remove one-shot workflow and commit final navigation
        shell: bash
        run: |
          git config user.name "calibra-ci"
          git config user.email "calibra-ci@users.noreply.github.com"
          git add apps/admin/src/components/Sidebar.tsx
          git rm .github/workflows/phase24-one-shot-autofix.yml
          git commit -m "feat(admin): expose Phase 23 and Phase 24 analytics labs"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
