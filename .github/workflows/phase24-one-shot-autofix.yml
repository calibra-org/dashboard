name: Phase 24 One-Shot Autofix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  autofix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/phase24-synthetic-commerce-20260823'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - run: npm install --global pnpm@10.32.1
      - run: pnpm install --frozen-lockfile
      - name: Apply repository formatter and safe lint fixes
        run: >-
          pnpm exec biome check --write
          apps/admin/src/features/synthetic-commerce/SyntheticCommerceWorkspace.tsx
          apps/admin/src/lib/queries/synthetic-commerce.ts
          apps/api/app/services/phase24_synthetic_commerce_service.ts
          apps/api/database/migrations/1777000000000_create_synthetic_commerce_lab.ts
          scripts/verify-phase24-synthetic-commerce.mjs
      - name: Regenerate SDK from merged OpenAPI
        run: pnpm --filter @calibra/sdk run codegen
      - name: Commit canonical generated output
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "calibra-ci"
          git config user.email "calibra-ci@users.noreply.github.com"
          git add \
            apps/admin/src/features/synthetic-commerce/SyntheticCommerceWorkspace.tsx \
            apps/admin/src/lib/queries/synthetic-commerce.ts \
            apps/api/app/services/phase24_synthetic_commerce_service.ts \
            apps/api/database/migrations/1777000000000_create_synthetic_commerce_lab.ts \
            scripts/verify-phase24-synthetic-commerce.mjs \
            packages/sdk/src/generated/
          git commit -m "chore(phase24): apply canonical format and SDK codegen"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
