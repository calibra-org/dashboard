name: Phase 7 Final Certification

on:
  push:
    branches:
      - agent/phase7-identity-trust-os

permissions:
  contents: write

concurrency:
  group: phase7-final-certification-v2
  cancel-in-progress: false

jobs:
  certify:
    if: contains(github.event.head_commit.message, '[phase7-final]')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: calibra
          POSTGRES_PASSWORD: calibra
          POSTGRES_DB: calibra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U calibra -d calibra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      FORCE_COLOR: "3"
      TURBO_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase7-identity-trust-os
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Static and invariant gates
        run: |
          pnpm run format
          pnpm run lint
          pnpm run verify:phase1-4
          pnpm run verify:tickets
          pnpm run verify:phase5
          if [ -f scripts/verify-phase6-configuration-integration.mjs ]; then node scripts/verify-phase6-configuration-integration.mjs; fi
          node scripts/verify-phase7-identity-integration.mjs
          pnpm run typecheck
      - name: Frontend tests
        run: pnpm --filter @calibra/sdk --filter @calibra/admin --filter @calibra/spin run test
      - name: Create test database
        env:
          PGPASSWORD: calibra
        run: psql -h localhost -U calibra -d calibra -c "CREATE DATABASE calibra_test OWNER calibra;"
      - name: Full API suite
        working-directory: apps/api
        run: pnpm test
      - name: OpenAPI and SDK sync
        env:
          NODE_ENV: test
          PORT: "3334"
          HOST: "0.0.0.0"
          APP_NAME: calibra-api
          APP_KEY: ci-only-key-not-used-for-real-secrets
          LOG_LEVEL: warn
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: calibra
          DB_PASSWORD: calibra
          DB_DATABASE: calibra
          MAIL_FROM_ADDRESS: ops@calibra.local
          MAIL_FROM_NAME: Calibra
          MAIL_NOTIFICATIONS_ENABLED: "false"
          SMTP_HOST: localhost
          SMTP_PORT: "11025"
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          TRANSMIT_TRANSPORT: none
          QUEUE_DRIVER: sync
          LIMITER_STORE: memory
          CACHE_DRIVER: memory
        run: |
          pnpm --filter @calibra/api-docs run build:json
          (cd apps/api && node ace check:api-docs)
          pnpm --filter @calibra/sdk run codegen:check
      - name: Production build
        run: |
          pnpm run build
          test -s packages/spin/dist/agent/client.js
          ! grep -q "esm.sh" packages/spin/dist/agent/client.js
      - name: Remove certification helper
        run: |
          rm -f .github/workflows/phase7-final-certification.yml
          git config user.name "calibra-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore(ci): remove Phase 7 final certification helper"
          git push origin HEAD:agent/phase7-identity-trust-os
