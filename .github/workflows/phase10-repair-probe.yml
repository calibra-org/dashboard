name: Phase 10 Repair Probe

on:
  push:
    branches:
      - agent/phase10-decision-intelligence-20260817

permissions:
  contents: write

jobs:
  repair:
    if: contains(github.event.head_commit.message, '[phase10-repair]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase10-decision-intelligence-20260817
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Repair Lucid transaction timestamp usage and unsafe row typing
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/api/app/services/decision_intelligence_service.ts';
          let source = fs.readFileSync(path, 'utf8');
          const anchor = `function numberFrom(value: unknown): number {\n    const parsed = Number(value ?? 0);\n    return Number.isFinite(parsed) ? parsed : 0;\n}\n`;
          if (!source.includes(anchor)) throw new Error('numberFrom anchor missing');
          if (!source.includes('function sqlNow(): string')) {
            source = source.replace(anchor, `${anchor}\nfunction sqlNow(): string {\n    return DateTime.utc().toSQL()!;\n}\n`);
          }
          source = source.replaceAll('trx.fn.now()', 'sqlNow()');
          source = source.replace('function serializeCase(row: Record<string, any>)', 'function serializeCase(row: Record<string, unknown>)');
          fs.writeFileSync(path, source);
          NODE
          pnpm exec biome format --write apps/api/app/services/decision_intelligence_service.ts
      - name: Probe Biome errors only
        run: pnpm exec biome lint . --diagnostic-level=error --max-diagnostics=50
      - name: Verify typecheck after repair
        run: pnpm run typecheck
      - name: Commit repair and remove probe
        run: |
          rm -f .github/workflows/phase10-repair-probe.yml
          git config user.name "calibra-dev"
          git config user.email "calibra-dev@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(intelligence): repair compile and lint gates"
          git push origin HEAD:agent/phase10-decision-intelligence-20260817
