name: PR160 Lockfile Repair

on:
  push:
    branches:
      - chore/deps-safe-cohort-vitest-compat
    paths:
      - .github/workflows/pr160-lockfix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    env:
      PNPM_VERSION: 10.32.1
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/deps-safe-cohort-vitest-compat
      - uses: actions/setup-node@v7
        with:
          node-version: 24.14.0
      - name: Install pnpm
        run: npm install --global pnpm@${PNPM_VERSION}
      - name: Regenerate and verify lockfile
        run: |
          pnpm install --lockfile-only --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Commit repaired lockfile and self-remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr160-lockfix.yml
          git add pnpm-lock.yaml
          git commit -m "fix(ci): regenerate pnpm lockfile"
          git push origin HEAD:chore/deps-safe-cohort-vitest-compat
