name: Adonis Minimal Compatibility Lockfile

on:
    push:
        branches: ["chore/adonis-codegen-compat"]
        paths:
            - ".github/workflows/adonis-codegen-minimal-lockfile.yml"

permissions:
    contents: write

env:
    NODE_VERSION: "24.14.0"
    PNPM_VERSION: "10.32.1"

jobs:
    minimize-lockfile:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: chore/adonis-codegen-compat
            - uses: pnpm/action-setup@v6
              with:
                  version: ${{ env.PNPM_VERSION }}
            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: pnpm
            - name: Restore dependency files from current main
              run: |
                  git fetch origin main --depth=1
                  git checkout origin/main -- apps/api/package.json pnpm-lock.yaml
            - name: Set only compatible Core and Bouncer ranges
              run: |
                  node <<'NODE'
                  const fs = require('node:fs')
                  const path = 'apps/api/package.json'
                  const manifest = JSON.parse(fs.readFileSync(path, 'utf8'))
                  manifest.dependencies['@adonisjs/core'] = '^7.5.0'
                  manifest.dependencies['@adonisjs/bouncer'] = '^4.0.1'
                  fs.writeFileSync(path, `${JSON.stringify(manifest, null, 4)}\n`)
                  NODE
            - name: Regenerate lockfile without update semantics
              run: pnpm install --lockfile-only
            - name: Assert changed-file scope
              shell: bash
              run: |
                  actual=$(git diff --name-only | sort)
                  expected=$(printf '%s\n' 'apps/api/package.json' 'pnpm-lock.yaml')
                  if [ "$actual" != "$expected" ]; then
                    echo "Unexpected changed files:" >&2
                    printf '%s\n' "$actual" >&2
                    exit 1
                  fi
            - name: Assert manifest changes are exactly Core and Bouncer
              run: |
                  node <<'NODE'
                  const assert = require('node:assert/strict')
                  const fs = require('node:fs')
                  const { execFileSync } = require('node:child_process')

                  const before = JSON.parse(execFileSync('git', ['show', 'origin/main:apps/api/package.json'], { encoding: 'utf8' }))
                  const after = JSON.parse(fs.readFileSync('apps/api/package.json', 'utf8'))
                  assert.equal(before.dependencies['@adonisjs/core'], '^7.3.2')
                  assert.equal(before.dependencies['@adonisjs/bouncer'], '^4.0.0')
                  assert.equal(after.dependencies['@adonisjs/core'], '^7.5.0')
                  assert.equal(after.dependencies['@adonisjs/bouncer'], '^4.0.1')
                  after.dependencies['@adonisjs/core'] = before.dependencies['@adonisjs/core']
                  after.dependencies['@adonisjs/bouncer'] = before.dependencies['@adonisjs/bouncer']
                  assert.deepEqual(after, before)
                  NODE
            - name: Assert expected compatibility resolutions
              run: |
                  grep -q "@adonisjs/core@7.5.0" pnpm-lock.yaml
                  grep -q "@adonisjs/bouncer@4.0.1" pnpm-lock.yaml
            - name: Reject unrelated resolution drift
              shell: bash
              run: |
                  diff=$(git diff -- pnpm-lock.yaml)
                  if printf '%s\n' "$diff" | grep -E '^[+-].*(vite@8|lightningcss|@redocly/|react-is@19|postcss@8|nanoid@3|picomatch@4|tinyglobby@)'; then
                    echo "Unrelated lockfile resolution drift detected" >&2
                    exit 1
                  fi
            - name: Commit minimal compatibility alignment
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add apps/api/package.json pnpm-lock.yaml
                  git commit -m "fix(deps): minimize Adonis CodeGen alignment"
                  git push origin HEAD:${GITHUB_REF_NAME}
