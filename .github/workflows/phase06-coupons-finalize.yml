name: Phase 06 Coupons Finalize

on:
  push:
    branches:
      - phase/06-coupons

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: calibra
          POSTGRES_PASSWORD: calibra
          POSTGRES_DB: calibra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U calibra -d calibra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/06-coupons
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply Phase 06 completion patch
        run: |
          python3 .github/scripts/phase06-coupons-finalize.py
          python3 .github/scripts/phase06-coupons-fixtures.py
      - name: Format changed Phase 06 files
        run: >-
          pnpm exec biome format --write
          apps/api/app/contracts/discounter.ts
          apps/api/app/controllers/admin/coupons_controller.ts
          apps/api/app/services/cart_totals_service.ts
          apps/api/app/services/discounter_service.ts
          apps/api/app/services/order_factory.ts
          apps/api/app/services/order_finalizer.ts
          apps/api/app/validators/coupons/apply_validator.ts
          apps/api/app/validators/coupons/coupon_validator.ts
          apps/api/database/seed_modules/0006_coupons_demo_seeder.ts
          apps/api/database/seeders/main_seeder.ts
          apps/api/tests/functional/coupons/admin_coupons_crud.spec.ts
          apps/api/tests/functional/coupons/admin_coupons_extra.spec.ts
          apps/api/tests/functional/coupons/cart_apply.spec.ts
          apps/api/tests/functional/coupons/cart_remove.spec.ts
          apps/api/tests/functional/coupons/usage_limit_global.spec.ts
          apps/api/tests/functional/coupons/usage_limit_per_user.spec.ts
          apps/api/tests/unit/cart/cart_totals.spec.ts
          apps/api/tests/unit/coupons/coupon_eligibility.spec.ts
          apps/api/tests/unit/coupons/discounter.spec.ts
      - run: pnpm --filter @calibra/api run typecheck
      - name: Create test database
        env:
          PGPASSWORD: calibra
        run: psql -h localhost -U calibra -d calibra -c "CREATE DATABASE calibra_test OWNER calibra;"
      - name: Run coupon and cart-total regression suite
        working-directory: apps/api
        run: |
          files=$(find tests/unit/coupons tests/functional/coupons -type f -name '*.spec.ts' -printf '%p\n' | sort | sed 's/^/--files=/' | xargs)
          pnpm test $files --files=tests/unit/cart/cart_totals.spec.ts
      - name: Commit verified Phase 06 changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/api/app/contracts/discounter.ts \
            apps/api/app/controllers/admin/coupons_controller.ts \
            apps/api/app/services/cart_totals_service.ts \
            apps/api/app/services/discounter_service.ts \
            apps/api/app/services/order_factory.ts \
            apps/api/app/services/order_finalizer.ts \
            apps/api/app/validators/coupons/apply_validator.ts \
            apps/api/app/validators/coupons/coupon_validator.ts \
            apps/api/database/seed_modules/0006_coupons_demo_seeder.ts \
            apps/api/database/seeders/main_seeder.ts \
            apps/api/tests/functional/coupons/admin_coupons_crud.spec.ts \
            apps/api/tests/functional/coupons/admin_coupons_extra.spec.ts \
            apps/api/tests/functional/coupons/cart_apply.spec.ts \
            apps/api/tests/functional/coupons/cart_remove.spec.ts \
            apps/api/tests/functional/coupons/usage_limit_global.spec.ts \
            apps/api/tests/functional/coupons/usage_limit_per_user.spec.ts \
            apps/api/tests/unit/cart/cart_totals.spec.ts \
            apps/api/tests/unit/coupons/coupon_eligibility.spec.ts \
            apps/api/tests/unit/coupons/discounter.spec.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(coupons): complete phase 06 runtime invariants"
          git push origin HEAD:phase/06-coupons
