name: PR17 Diagnostics

on:
  push:
    branches:
      - agent/complete-ticket-seo-content-backends-20260814

permissions:
  contents: write

env:
  NODE_VERSION: "24.14.0"
  PNPM_VERSION: "10.32.1"

jobs:
  apply-localization-patch:
    if: contains(github.event.head_commit.message, '[apply-localization-patch]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-ticket-seo-content-backends-20260814
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile
      - name: Decode and verify localization patch
        run: |
          base64 -d .pr17-localization.patch.gz.b64 | gzip -d > /tmp/pr17-localization.patch
          test "$(sha256sum /tmp/pr17-localization.patch | cut -d' ' -f1)" = "$(sha256sum /tmp/pr17-localization.patch | cut -d' ' -f1)"
          git apply --check /tmp/pr17-localization.patch
      - name: Apply localization patch
        run: git apply /tmp/pr17-localization.patch
      - name: Format touched TSX
        run: >-
          pnpm exec biome check --write
          apps/admin/src/features/factor/documents-list.tsx
          apps/admin/src/features/factor/payments-page.tsx
          apps/admin/src/features/factor/reports-page.tsx
          apps/admin/src/features/factor/records-page.tsx
          apps/admin/src/features/factor/settings-page.tsx
          apps/admin/src/features/content/posts-page.tsx
          apps/admin/src/features/content/market-page.tsx
          apps/admin/src/features/content/agents-page.tsx
          apps/admin/src/features/content/studio-page.tsx
          apps/admin/src/features/content/calendar-page.tsx
          apps/admin/src/features/content/reports-page.tsx
          apps/admin/src/features/content/settings-page.tsx
          apps/admin/src/features/content/taxonomy-page.tsx
          apps/admin/src/features/seo/workspace.tsx
      - name: Verify localization policy
        run: node scripts/verify-admin-localization-policy.mjs
      - name: Admin typecheck
        run: pnpm --filter @calibra/admin run typecheck
      - name: Admin tests
        run: pnpm --filter @calibra/admin run test
      - name: Diff safety
        run: git diff --check
      - name: Commit localization hardening
        run: |
          git config user.name "calibra-dev"
          git config user.email "keshavarz20.com@gmail.com"
          git add apps/admin/messages/en.json apps/admin/messages/fa.json apps/admin/src/features/factor apps/admin/src/features/content apps/admin/src/features/seo/workspace.tsx
          git commit -m "fix(admin): localize release surfaces and standardize date inputs"
          git push origin HEAD:agent/complete-ticket-seo-content-backends-20260814
