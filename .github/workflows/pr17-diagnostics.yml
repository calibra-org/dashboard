name: PR17 Diagnostics

on:
  push:
    branches:
      - agent/complete-ticket-seo-content-backends-20260814

permissions:
  contents: read

env:
  FORCE_COLOR: 3
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1
  NODE_VERSION: "24.14.0"
  PNPM_VERSION: "10.32.1"

jobs:
  lint-diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-ticket-seo-content-backends-20260814
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture format diagnostics
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm run format 2>&1 | tee /tmp/format.log
      - name: Capture Biome diagnostics
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm run lint:biome 2>&1 | tee /tmp/biome.log
      - name: Capture token diagnostics
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm run lint:tokens 2>&1 | tee /tmp/tokens.log
      - name: Capture workspace diagnostics
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm run lint:ws 2>&1 | tee /tmp/workspace.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr17-lint-diagnostics-${{ github.sha }}
          path: |
            /tmp/format.log
            /tmp/biome.log
            /tmp/tokens.log
            /tmp/workspace.log
          if-no-files-found: error
          retention-days: 1
