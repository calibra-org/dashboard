name: PR17 Diagnostics

on:
  push:
    branches:
      - agent/complete-ticket-seo-content-backends-20260814

permissions:
  contents: read

env:
  NODE_VERSION: "24.14.0"
  PNPM_VERSION: "10.32.1"

jobs:
  invariant-diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-ticket-seo-content-backends-20260814
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Phase 1-4 diagnostics
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm run verify:phase1-4 2>&1 | tee /tmp/phase1-4.log
      - name: Phase 5 diagnostics
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm run verify:phase5 2>&1 | tee /tmp/phase5.log
      - name: Ticket diagnostics
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm run verify:tickets 2>&1 | tee /tmp/tickets.log
      - name: SEO diagnostics
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm run verify:seo-engines 2>&1 | tee /tmp/seo.log
      - name: Completion diagnostics
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm run verify:completion 2>&1 | tee /tmp/completion.log
      - name: Diff diagnostics
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          git diff --check 2>&1 | tee /tmp/diff.log
      - name: Upload invariant diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr17-invariant-diagnostics-${{ github.sha }}
          path: |
            /tmp/phase1-4.log
            /tmp/phase5.log
            /tmp/tickets.log
            /tmp/seo.log
            /tmp/completion.log
            /tmp/diff.log
          if-no-files-found: error
          retention-days: 1
