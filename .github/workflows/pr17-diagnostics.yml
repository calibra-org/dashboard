name: PR17 Diagnostics

on:
  push:
    branches:
      - agent/complete-ticket-seo-content-backends-20260814

permissions:
  contents: read

env:
  FORCE_COLOR: 3
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1
  NODE_VERSION: "24.14.0"
  PNPM_VERSION: "10.32.1"

jobs:
  canonical-release-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: calibra
          POSTGRES_PASSWORD: calibra
          POSTGRES_DB: calibra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U calibra -d calibra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-ticket-seo-content-backends-20260814
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile
      - name: Formatting and lint
        run: pnpm run format && pnpm run lint
      - name: Release invariants
        run: |
          pnpm run verify:phase1-4
          pnpm run verify:phase5
          pnpm run verify:tickets
          pnpm run verify:seo-engines
          pnpm run verify:completion
          git diff --check
      - name: Typecheck
        run: pnpm run typecheck
      - name: Frontend and SDK tests
        run: pnpm --filter @calibra/sdk --filter @calibra/admin --filter @calibra/spin run test
      - name: Create API test database
        env:
          PGPASSWORD: calibra
        run: psql -h localhost -U calibra -d calibra -c "CREATE DATABASE calibra_test OWNER calibra;"
      - name: API tests
        working-directory: apps/api
        run: pnpm test
      - name: Build
        run: pnpm run build
      - name: Assert bundled spin panel
        run: |
          test -s packages/spin/dist/agent/client.js
          ! grep -q "esm.sh" packages/spin/dist/agent/client.js
      - name: OpenAPI build
        run: pnpm --filter @calibra/api-docs run build:json
      - name: Check registered routes against OpenAPI
        working-directory: apps/api
        env:
          NODE_ENV: test
          PORT: "3334"
          HOST: "0.0.0.0"
          APP_NAME: calibra-api
          APP_KEY: ci-only-key-not-used-for-real-secrets
          LOG_LEVEL: warn
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: calibra
          DB_PASSWORD: calibra
          DB_DATABASE: calibra
          MAIL_FROM_ADDRESS: ops@calibra.local
          MAIL_FROM_NAME: Calibra
          MAIL_NOTIFICATIONS_ENABLED: "false"
          SMTP_HOST: localhost
          SMTP_PORT: "11025"
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          TRANSMIT_TRANSPORT: none
          QUEUE_DRIVER: sync
          LIMITER_STORE: memory
          CACHE_DRIVER: memory
        run: node ace check:api-docs
      - name: SDK codegen sync
        run: pnpm --filter @calibra/sdk run codegen:check
      - name: Panel startup syntax
        run: node --check scripts/panel.mjs
