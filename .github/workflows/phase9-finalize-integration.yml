name: Phase 9 finalize integration
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'agent/phase9-final-main-20260818'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: calibra_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: calibra_test
      APP_KEY: "phase9-integration-test-key-2026"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Merge Phase 9 wiring onto latest main
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const read = p => fs.readFileSync(p, 'utf8');
          const write = (p, s) => fs.writeFileSync(p, s);
          const ensure = (p, needle, from, to) => {
            let s = read(p);
            if (!s.includes(needle)) {
              if (!s.includes(from)) throw new Error(`Anchor missing in ${p}: ${from}`);
              s = s.replace(from, to);
              write(p, s);
            }
          };

          ensure('apps/admin/src/components/Sidebar.tsx', '/products/amazing-deals',
            '            { href: "/products", labelKey: "products", icon: Package },',
            '            { href: "/products", labelKey: "products", icon: Package },\n            { href: "/products/amazing-deals", labelKey: "amazingDeals", icon: BadgePercent },');

          ensure('apps/admin/src/lib/i18n/request.ts', 'messages/personalization',
            '    const operations = (await import(`../../../messages/operations/${locale}.json`)).default;',
            '    const operations = (await import(`../../../messages/operations/${locale}.json`)).default;\n    const personalization = (await import(`../../../messages/personalization/${locale}.json`)).default;');
          ensure('apps/admin/src/lib/i18n/request.ts', '...personalization,',
            '            ...operations,', '            ...operations,\n            ...personalization,');
          ensure('apps/admin/src/lib/i18n/request.ts', '...personalization.Nav,',
            '                ...tickets.Nav,', '                ...tickets.Nav,\n                ...personalization.Nav,');

          ensure('apps/api/start/routes.ts', './routes/personalization.js',
            'await import("./routes/storefront.js");', 'await import("./routes/storefront.js");\nawait import("./routes/personalization.js");');
          ensure('apps/api/start/routes.ts', './routes/admin_personalization.js',
            'await import("./routes/admin_settings.js");', 'await import("./routes/admin_settings.js");\nawait import("./routes/admin_personalization.js");');

          ensure('apps/web/src/app/[locale]/page.tsx', 'AmazingDealsSection',
            'import { apiServer } from "#/lib/api";', 'import { AmazingDealsSection } from "#/components/amazing-deals-section";\nimport { apiServer } from "#/lib/api";');
          ensure('apps/web/src/app/[locale]/page.tsx', '<AmazingDealsSection />',
            '            {featured.length > 0 && (', '            <AmazingDealsSection />\n\n            {featured.length > 0 && (');

          const docsPath = 'docs/api/package.json';
          const docs = JSON.parse(read(docsPath));
          docs.scripts['build:json:storefront-phase9'] = 'redocly bundle reference/openapi/storefront.phase9.v1.yaml -o dist/storefront.phase9.v1.json --ext json';
          docs.scripts['build:json:admin-phase9'] = 'redocly bundle reference/openapi/admin.phase9.v1.yaml -o dist/admin.phase9.v1.json --ext json';
          if (!docs.scripts['build:json:storefront'].includes('storefront-phase9')) docs.scripts['build:json:storefront'] = docs.scripts['build:json:storefront'].replace('pnpm build:json:storefront-identity &&', 'pnpm build:json:storefront-identity && pnpm build:json:storefront-phase9 &&');
          if (!docs.scripts['build:json:admin'].includes('admin-phase9')) docs.scripts['build:json:admin'] = docs.scripts['build:json:admin'].replace('pnpm build:json:admin-identity &&', 'pnpm build:json:admin-identity && pnpm build:json:admin-phase9 &&');
          write(docsPath, JSON.stringify(docs, null, 4) + '\n');

          ensure('docs/api/scripts/merge-admin-spec.js', 'admin.phase9.v1.json',
            'const phase10 = JSON.parse(readFileSync(resolve(root, "dist/admin.phase10.v1.json"), "utf8"));',
            'const phase9 = JSON.parse(readFileSync(resolve(root, "dist/admin.phase9.v1.json"), "utf8"));\nconst phase10 = JSON.parse(readFileSync(resolve(root, "dist/admin.phase10.v1.json"), "utf8"));');
          ensure('docs/api/scripts/merge-admin-spec.js', '[phase9, "Phase9Overlay"]',
            '    [phase10, "Phase10Overlay"],', '    [phase9, "Phase9Overlay"],\n    [phase10, "Phase10Overlay"],');
          ensure('docs/api/scripts/merge-storefront-spec.js', 'storefront.phase9.v1.json',
            'const identity = JSON.parse(readFileSync(resolve(root, "dist/storefront.identity.v1.json"), "utf8"));',
            'const identity = JSON.parse(readFileSync(resolve(root, "dist/storefront.identity.v1.json"), "utf8"));\nconst phase9 = JSON.parse(readFileSync(resolve(root, "dist/storefront.phase9.v1.json"), "utf8"));');
          ensure('docs/api/scripts/merge-storefront-spec.js', '[completion, identity, phase9]',
            'for (const overlay of [completion, identity]) {', 'for (const overlay of [completion, identity, phase9]) {');

          const pkgPath = 'package.json';
          const pkg = JSON.parse(read(pkgPath));
          pkg.scripts['verify:phase9'] = 'node scripts/verify-phase9.mjs';
          write(pkgPath, JSON.stringify(pkg, null, 4) + '\n');

          ensure('apps/api/app/services/order_finalizer.ts', 'Phase9DealGuardService',
            'import { OrderFactory } from "#services/order_factory";',
            'import { OrderFactory } from "#services/order_factory";\nimport Phase9DealGuardService from "#services/phase9_deal_guard_service";');
          ensure('apps/api/app/services/order_finalizer.ts', 'consumeOrder(Number(draft.id))',
            '            await this.writeRedemptionLedger(draft, trx);',
            '            await this.writeRedemptionLedger(draft, trx);\n            await new Phase9DealGuardService().consumeOrder(Number(draft.id));');

          const hardPath = 'apps/api/database/migrations/1763001000000_harden_phase9_master_dod.ts';
          let hard = read(hardPath);
          hard = hard.replace("status IN ('draft','scheduled','active','paused','cancelled','ended','expired','archived')", "status IN ('draft','scheduled','preheat','active','paused','sold_out','cancelled','ended','expired','archived')");
          write(hardPath, hard);

          const navPath = 'scripts/verify-admin-navigation.mjs';
          let nav = read(navPath);
          if (!nav.includes('personalizationPath')) {
            nav = nav.replace('    const ticketsPath = `apps/admin/messages/tickets/${locale}.json`;', '    const ticketsPath = `apps/admin/messages/tickets/${locale}.json`;\n    const personalizationPath = `apps/admin/messages/personalization/${locale}.json`;');
            nav = nav.replace('    const tickets = exists(ticketsPath) ? JSON.parse(read(ticketsPath)) : {};', '    const tickets = exists(ticketsPath) ? JSON.parse(read(ticketsPath)) : {};\n    const personalization = exists(personalizationPath) ? JSON.parse(read(personalizationPath)) : {};');
            nav = nav.replace('        ...tickets,', '        ...tickets,\n        ...personalization,');
            nav = nav.replace('            ...(tickets.Nav ?? {}),', '            ...(tickets.Nav ?? {}),\n            ...(personalization.Nav ?? {}),');
            write(navPath, nav);
          }
          NODE
      - run: pnpm exec biome format --write apps/admin apps/api apps/web docs/api package.json scripts/verify-admin-navigation.mjs scripts/verify-phase9.mjs
      - run: pnpm --filter @calibra/sdk run codegen
      - run: pnpm run typecheck
      - name: Fresh database migration
        working-directory: apps/api
        run: node ace migration:fresh --force
      - run: pnpm run verify:phase9
      - name: Commit finalized integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin apps/api apps/web docs/api package.json packages/sdk scripts/verify-admin-navigation.mjs scripts/verify-phase9.mjs
          if git diff --cached --quiet; then
            echo "No generated drift"
          else
            git commit -m "chore(personalization): finalize Phase 9 integration"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
