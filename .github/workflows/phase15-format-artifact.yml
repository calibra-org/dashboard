name: Phase 15 Format Artifact

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/phase15-format-artifact.yml"

permissions:
  contents: write

concurrency:
  group: phase15-format-artifact-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.14.0"
  PNPM_VERSION: "10.32.1"

jobs:
  format-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase15-customer-genome
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify branch did not move after checkout
        run: |
          git fetch origin agent/phase15-customer-genome
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/agent/phase15-customer-genome)"
      - name: Converge repository formatting
        run: |
          clean=0
          for pass in 1 2 3 4; do
            echo "Biome formatting pass ${pass}"
            pnpm exec biome format --write .
            if pnpm exec biome format .; then
              clean=1
              break
            fi
          done
          if [ "$clean" -ne 1 ]; then
            echo "Biome formatting did not converge within four passes"
            exit 1
          fi
      - name: Guard formatter scope
        run: |
          changed=$(git diff --name-only | wc -l | tr -d ' ')
          echo "Biome changed ${changed} files"
          if [ "$changed" -ne 17 ]; then
            echo "Expected exactly the 17 files proven by the read-only formatter artifact"
            git diff --name-only
            exit 1
          fi
      - name: Commit canonical formatting and remove one-shot workflow
        run: |
          git fetch origin agent/phase15-customer-genome
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/agent/phase15-customer-genome)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm .github/workflows/phase15-format-artifact.yml
          git commit -m "style: normalize Phase 14 and 20 repository formatting"
          git push origin HEAD:agent/phase15-customer-genome
