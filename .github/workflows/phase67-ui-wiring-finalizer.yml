name: Phase 6-7 UI wiring finalizer

on:
  push:
    branches:
      - agent/phase7-identity-trust-os

permissions:
  contents: write

concurrency:
  group: phase67-ui-wiring-finalizer
  cancel-in-progress: false

jobs:
  finalize-ui:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase7-identity-trust-os
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Import the completed Phase 6 settings shell without overwriting newer Phase 7 engines
        run: |
          git fetch origin agent/phase6-configuration-os:refs/remotes/origin/agent/phase6-configuration-os
          git show origin/agent/phase6-configuration-os:'apps/admin/src/app/[locale]/(authenticated)/(store-config)/settings/page.tsx' > 'apps/admin/src/app/[locale]/(authenticated)/(store-config)/settings/page.tsx'
          git show origin/agent/phase6-configuration-os:'apps/admin/src/app/[locale]/(authenticated)/(store-config)/settings/[group]/page.tsx' > 'apps/admin/src/app/[locale]/(authenticated)/(store-config)/settings/[group]/page.tsx'
          git show origin/agent/phase6-configuration-os:'apps/admin/src/components/SettingsNav.tsx' > 'apps/admin/src/components/SettingsNav.tsx'
          git show origin/agent/phase6-configuration-os:'apps/admin/src/views/store-config/settings/configuration-overview.tsx' > 'apps/admin/src/views/store-config/settings/configuration-overview.tsx'

          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/admin/src/views/store-config/settings/configuration-overview.tsx';
          let source = fs.readFileSync(path, 'utf8');
          source = source.replace(
            /import \{[\s\S]*?\} from "#\/components\/ui\/alert-dialog";\n/,
            'import { ConfirmDialog } from "#/components/ui/alert-dialog";\n',
          );
          source = source.replace(
            'import { ArrowLeft, CheckCircle2, Clock3, Database, History, RotateCcw, Settings2, ShieldCheck } from "#/icons";',
            'import { ArrowLeft, Boxes, CheckCircle2, Clock3, History, RotateCcw, Settings2, ShieldCheck } from "#/icons";',
          );
          source = source.replaceAll('<Database', '<Boxes');
          source = source.replace(
            /function RollbackAction\([\s\S]*?\n\}\n\nfunction MetricCard/,
            `function RollbackAction({ item, fa, pending, onRollback }: { item: ConfigurationRevision; fa: boolean; pending: boolean; onRollback: () => void }) {
    return (
        <ConfirmDialog
            trigger={
                <Button variant="ghost" size="sm" disabled={pending} className="gap-1.5">
                    <RotateCcw className="size-3.5" />
                    <span className="hidden sm:inline">{fa ? "بازگردانی" : "Rollback"}</span>
                </Button>
            }
            title={fa ? \`بازگردانی \${scopeLabel(item.scope, true)} به نسخه \${item.revision}؟\` : \`Restore \${scopeLabel(item.scope, false)} to revision \${item.revision}?\`}
            description={
                fa
                    ? "مقادیر نسخه انتخابی دوباره روی تنظیمات فعال نوشته می‌شوند و یک نسخه بازگردانی جدید ساخته می‌شود."
                    : "The selected snapshot is restored and a new rollback revision is appended."
            }
            confirmLabel={fa ? "تأیید بازگردانی" : "Confirm rollback"}
            cancelLabel={fa ? "انصراف" : "Cancel"}
            isConfirming={pending}
            onConfirm={onRollback}
        />
    );
}

function MetricCard`,
          );
          if (source.includes('AlertDialogAction') || source.includes('<Database')) {
            throw new Error('Panel-kit compatibility rewrite did not complete');
          }
          fs.writeFileSync(path, source);
          NODE

          if ! grep -R -E 'GenericSettingsView|settings-groups' apps/admin/src \
              --exclude='generic-settings-view.tsx' --exclude='settings-groups.ts' >/dev/null; then
            rm -f apps/admin/src/views/store-config/settings/generic-settings-view.tsx
            rm -f apps/admin/src/lib/fixtures/settings-groups.ts
          fi

      - name: Format UI wiring
        run: >-
          pnpm exec biome format --write
          'apps/admin/src/app/[locale]/(authenticated)/(store-config)/settings/page.tsx'
          'apps/admin/src/app/[locale]/(authenticated)/(store-config)/settings/[group]/page.tsx'
          apps/admin/src/components/SettingsNav.tsx
          apps/admin/src/views/store-config/settings/configuration-overview.tsx

      - name: Verify type safety
        run: pnpm run typecheck

      - name: Verify frontend behavior
        run: pnpm --filter @calibra/admin run test

      - name: Verify production admin build
        run: pnpm --filter @calibra/admin run build

      - name: Verify Phase 6 and Phase 7 integration invariants
        run: |
          if [ -f scripts/verify-phase6-configuration-integration.mjs ]; then node scripts/verify-phase6-configuration-integration.mjs; fi
          node scripts/verify-phase7-identity-integration.mjs

      - name: Remove this temporary finalizer
        run: rm -f .github/workflows/phase67-ui-wiring-finalizer.yml

      - name: Commit UI wiring
        run: |
          git config user.name "calibra-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(phase6): restore complete configuration workspace wiring"
          git push origin HEAD:agent/phase7-identity-trust-os
