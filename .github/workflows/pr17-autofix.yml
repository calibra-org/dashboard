name: PR17 Reproducible Autofix

on:
  push:
    branches:
      - agent/complete-ticket-seo-content-backends-20260814

permissions:
  contents: write

concurrency:
  group: pr17-reproducible-autofix
  cancel-in-progress: true

jobs:
  format-and-codegen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-ticket-seo-content-backends-20260814
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply deterministic source cleanups
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          function replaceExact(file, from, to) {
            const source = fs.readFileSync(file, "utf8");
            if (!source.includes(from)) return;
            fs.writeFileSync(file, source.replace(from, to));
          }

          replaceExact(
            "apps/api/app/services/seo/operations_service.ts",
            "before = contentPayload(detail.data);",
            "before = { ...contentPayload(detail.data) };",
          );

          const ticketOps = "apps/api/app/services/support/ticket_operations_service.ts";
          let source = fs.readFileSync(ticketOps, "utf8");
          source = source.replace(
            /async function ensureTicketVersion[\s\S]*?\n}\n\n(?=async function event)/,
            "",
          );
          fs.writeFileSync(ticketOps, source);
          NODE
      - name: Apply repository formatter
        run: pnpm exec biome format --write .
      - name: Regenerate SDK from canonical OpenAPI
        run: pnpm --filter @calibra/sdk run codegen
      - name: Commit reproducible outputs
        shell: bash
        run: |
          if git diff --quiet -- .; then
            echo "No reproducible changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(ci): apply reproducible formatter and SDK codegen"
          git push origin HEAD:agent/complete-ticket-seo-content-backends-20260814
