name: Phase 6 OpenAPI route sync fix

on:
  push:
    branches: [agent/phase7-identity-trust-os]
    paths: [.github/workflows/phase6-openapi-route-sync-fix.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase7-identity-trust-os
      - name: Document canonical Configuration runtime endpoints
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const path = 'docs/api/reference/openapi/admin.phase6.v1.yaml'
          let source = fs.readFileSync(path, 'utf8')

          if (!source.includes('/api/v1/admin/settings/configuration/blueprint/apply:')) {
            const anchor = '  /api/v1/admin/settings/configuration/drift:\n'
            if (!source.includes(anchor)) throw new Error('Phase 6 drift path anchor missing')
            const block = `  /api/v1/admin/settings/configuration/blueprint/apply:\n    post:\n      operationId: adminPhase6ConfigurationBlueprintApply\n      security: [{ bearerAuth: [] }]\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema: { $ref: '#/components/schemas/ConfigurationBlueprintApplyInput' }\n      responses:\n        '200': { description: Blueprint applied and captured as immutable revisions, content: { application/json: { schema: { $ref: '#/components/schemas/ConfigurationBlueprintApplyEnvelope' } } } }\n        '403': { description: Configuration blueprint apply permission denied }\n        '422': { description: Invalid configuration blueprint }\n`
            source = source.replace(anchor, `${block}${anchor}`)
          }

          if (!source.includes('/api/v1/admin/settings/configuration/tax/simulate:')) {
            const anchor = 'components:\n'
            if (!source.includes(anchor)) throw new Error('Phase 6 components anchor missing')
            const block = `  /api/v1/admin/settings/configuration/tax/simulate:\n    post:\n      operationId: adminPhase6ConfigurationTaxSimulate\n      security: [{ bearerAuth: [] }]\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema: { $ref: '#/components/schemas/ConfigurationTaxSimulationInput' }\n      responses:\n        '200': { description: Side-effect-free tax calculation and product impact evidence, content: { application/json: { schema: { $ref: '#/components/schemas/ConfigurationTaxSimulationEnvelope' } } } }\n        '403': { description: Configuration tax write permission denied }\n        '422': { description: Invalid tax simulation input }\n`
            source = source.replace(anchor, `${block}${anchor}`)
          }

          if (!source.includes('    ConfigurationBlueprintApplyInput:')) {
            const anchor = '    ConfigurationBlueprintEnvelope:'
            if (!source.includes(anchor)) throw new Error('ConfigurationBlueprintEnvelope schema anchor missing')
            const schemas = `    ConfigurationBlueprintApplyInput:\n      type: object\n      required: [schema_version, entries]\n      properties:\n        schema_version: { type: integer, enum: [1] }\n        entries: { type: array, items: { $ref: '#/components/schemas/ConfigurationBlueprintEntry' } }\n        fingerprint: { type: string }\n        reason: { type: string, minLength: 3, maxLength: 500 }\n        approval_reference: { type: [string, 'null'] }\n    ConfigurationBlueprintApplyEnvelope:\n      type: object\n      required: [data, meta]\n      properties:\n        data: { $ref: '#/components/schemas/ConfigurationBlueprint' }\n        meta:\n          type: object\n          required: [revisions]\n          properties:\n            revisions: { type: object, additionalProperties: { type: integer, minimum: 1 } }\n`
            source = source.replace(anchor, `${schemas}${anchor}`)
          }

          if (!source.includes('    ConfigurationTaxSimulationInput:')) {
            const anchor = '    ConfigurationUrlRedirectEnvelope:'
            if (!source.includes(anchor)) throw new Error('ConfigurationUrlRedirectEnvelope schema anchor missing')
            const schemas = `    ConfigurationTaxSimulationInput:\n      type: object\n      required: [amount_minor, tax_class_id]\n      properties:\n        amount_minor: { type: integer, minimum: 0 }\n        tax_class_id: { type: integer, minimum: 1 }\n        country: { type: [string, 'null'], minLength: 2, maxLength: 2 }\n        region_id: { type: [integer, 'null'], minimum: 1 }\n        prices_include_tax: { type: boolean, default: false }\n    ConfigurationTaxSimulationEnvelope:\n      type: object\n      required: [data]\n      properties:\n        data:\n          type: object\n          required: [amount_minor, tax_class_id, address, prices_include_tax, rate_count, calculation, impact]\n          properties:\n            amount_minor: { type: integer, minimum: 0 }\n            tax_class_id: { type: integer, minimum: 1 }\n            address:\n              type: object\n              required: [country, region_id]\n              properties:\n                country: { type: [string, 'null'] }\n                region_id: { type: [integer, 'null'] }\n            prices_include_tax: { type: boolean }\n            rate_count: { type: integer, minimum: 0 }\n            calculation: { type: object, additionalProperties: true }\n            impact:\n              type: object\n              required: [products_using_tax_class, source]\n              properties:\n                products_using_tax_class: { type: integer, minimum: 0 }\n                source: { type: string, enum: [products.tax_class_id] }\n`
            source = source.replace(anchor, `${schemas}${anchor}`)
          }

          fs.writeFileSync(path, source)
          NODE
          git diff --check
          git add docs/api/reference/openapi/admin.phase6.v1.yaml
          git config user.name "calibra-phase7-bot"
          git config user.email "calibra-phase7-bot@users.noreply.github.com"
          git commit -m "fix(openapi): document Phase 6 configuration runtime endpoints"
          git push origin HEAD:agent/phase7-identity-trust-os
