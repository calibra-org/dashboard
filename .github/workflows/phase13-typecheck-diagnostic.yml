name: Phase 13 API Typecheck Diagnostic

on:
  push:
    branches: ["feat/phase13-planning-os-20260817"]
    paths:
      - ".github/workflows/phase13-typecheck-diagnostic.yml"

permissions:
  contents: write

env:
  NODE_VERSION: "24.14.0"
  PNPM_VERSION: "10.32.1"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "feat/phase13-planning-os-20260817"
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --global pnpm@${PNPM_VERSION}
      - run: pnpm install --frozen-lockfile
      - name: Capture API typecheck output
        shell: bash
        run: |
          set +e
          pnpm --filter @calibra/api run typecheck > /tmp/phase13-typecheck.txt 2>&1
          code=$?
          set -e
          mkdir -p .calibra-phase13
          printf 'exit_code=%s\n\n' "$code" > .calibra-phase13/typecheck-diagnostic.txt
          cat /tmp/phase13-typecheck.txt >> .calibra-phase13/typecheck-diagnostic.txt
      - name: Publish diagnostic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .calibra-phase13/typecheck-diagnostic.txt
          git commit -m "chore(planning): capture Phase 13 API typecheck diagnostic"
          git push origin HEAD:feat/phase13-planning-os-20260817
