name: SEO CI diagnose

on:
  push:
    branches:
      - agent/seo-seven-real-engines-20260811

jobs:
  biome:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/seo-seven-real-engines-20260811
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check changed SEO files only
        run: >-
          pnpm exec biome check --max-diagnostics=200
          apps/admin/src/features/seo/types.ts
          apps/admin/src/features/seo/workspace.tsx
          apps/api/app/controllers/admin/seo_controller.ts
          apps/api/app/services/seo/search_engines.ts
          apps/api/app/services/seo/seo_service.ts
          apps/api/app/validators/admin/seo_validator.ts
          apps/api/commands/seo_sync_search_engines.ts
          apps/api/database/migrations/1760000000000_expand_seo_search_engines.ts
          apps/api/tests/unit/seo/search_engines.spec.ts
          scripts/verify-seo-search-engines.mjs
