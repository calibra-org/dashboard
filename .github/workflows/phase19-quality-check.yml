name: Phase 19 Quality Intelligence Integrity

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/phase19-quality-check.yml"
      - "scripts/materialize-phase19-on-current-main.mjs"
      - "scripts/verify-phase19-quality-trust.mjs"
      - "apps/api/app/controllers/admin/quality_trust_controller.ts"
      - "apps/api/app/services/quality_permissions.ts"
      - "apps/api/app/services/quality_trust_service.ts"
      - "apps/api/app/validators/admin/quality_trust_validator.ts"
      - "apps/api/database/migrations/1767500000000_create_phase19_quality_trust_os.ts"
      - "apps/api/start/routes/admin_quality.ts"
      - "apps/api/start/routes.ts"
      - "apps/api/tests/unit/quality/**"
      - "apps/admin/messages/trust/**"
      - "apps/admin/src/app/**/quality/**"
      - "apps/admin/src/features/quality/**"
      - "apps/admin/src/components/Sidebar.tsx"
      - "apps/admin/src/lib/queries/api-client.ts"
      - "docs/api/package.json"
      - "docs/api/scripts/merge-admin-spec.js"
      - "docs/api/reference/openapi/admin.quality.v1.yaml"
      - "packages/sdk/src/generated/admin.d.ts"
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: calibra
          POSTGRES_PASSWORD: calibra
          POSTGRES_DB: calibra
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U calibra -d calibra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout PR head
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Checkout main push
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture checked-out head
        run: echo "START_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
      - run: npm install --global pnpm@10.32.1
      - run: pnpm install --frozen-lockfile
      - name: Create test database
        env:
          PGPASSWORD: calibra
        run: psql -h localhost -U calibra -d calibra -c "CREATE DATABASE calibra_test OWNER calibra;"
      - name: Capture pre-Phase19 API docs drift baseline
        shell: bash
        env:
          NODE_ENV: test
          PORT: "3334"
          HOST: "0.0.0.0"
          APP_NAME: calibra-api
          APP_KEY: ci-only-key-not-used-for-real-secrets
          LOG_LEVEL: warn
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: calibra
          DB_PASSWORD: calibra
          DB_DATABASE: calibra
          MAIL_FROM_ADDRESS: ops@calibra.local
          MAIL_FROM_NAME: Calibra
          MAIL_NOTIFICATIONS_ENABLED: "false"
          SMTP_HOST: localhost
          SMTP_PORT: "11025"
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          TRANSMIT_TRANSPORT: none
          QUEUE_DRIVER: sync
          LIMITER_STORE: memory
          CACHE_DRIVER: memory
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin main --no-tags
            baseline_ref="origin/main"
          else
            baseline_ref="${START_SHA}^"
          fi
          git checkout --detach "$baseline_ref"
          pnpm --filter @calibra/api-docs run build:json
          set +e
          (cd apps/api && node ace check:api-docs) > /tmp/phase19-main-docs.log 2>&1
          baseline_status=$?
          set -e
          BASELINE_STATUS="$baseline_status" node - <<'NODE'
          const fs = require("node:fs");
          const text = fs.readFileSync("/tmp/phase19-main-docs.log", "utf8").replace(/\x1B\[[0-?]*[ -/]*[@-~]/g, "");
          const routePattern = /\b((?:GET|POST|PUT|PATCH|DELETE|OPTIONS|HEAD)(?:\|(?:GET|POST|PUT|PATCH|DELETE|OPTIONS|HEAD))*)\s+(\/api\/[^\s]+)/g;
          const missing = new Set();
          for (const match of text.matchAll(routePattern)) missing.add(`${match[1]} ${match[2].replace(/[),;]+$/, "")}`);
          const status = Number(process.env.BASELINE_STATUS ?? "0");
          if (status !== 0 && missing.size === 0) {
            console.error(text);
            throw new Error("Could not classify the pre-existing API docs failure on the baseline ref");
          }
          fs.writeFileSync("/tmp/phase19-main-undocumented.json", JSON.stringify([...missing].sort(), null, 2));
          console.log(`Captured ${missing.size} pre-existing undocumented route signatures from the baseline ref`);
          NODE
          git checkout --detach "$START_SHA"
      - name: Materialize Phase 19 integrations
        run: node scripts/materialize-phase19-on-current-main.mjs
      - name: Format Phase 19 release candidate
        run: >-
          pnpm exec biome check --write
          apps/admin/messages/trust/en.json
          apps/admin/messages/trust/fa.json
          apps/admin/src/components/Sidebar.tsx
          apps/admin/src/lib/queries/api-client.ts
          apps/admin/src/features/quality
          apps/api/app/controllers/admin/quality_trust_controller.ts
          apps/api/app/services/quality_permissions.ts
          apps/api/app/services/quality_trust_service.ts
          apps/api/app/validators/admin/quality_trust_validator.ts
          apps/api/start/routes.ts
          apps/api/start/routes/admin_quality.ts
          apps/api/database/migrations/1767500000000_create_phase19_quality_trust_os.ts
          apps/api/tests/unit/quality/phase19_quality_trust.spec.ts
          docs/api/package.json
          docs/api/scripts/merge-admin-spec.js
          scripts/materialize-phase19-on-current-main.mjs
          scripts/verify-phase19-quality-trust.mjs
      - name: Assert Phase 19 seams
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'admin_quality.js' apps/api/start/routes.ts
          grep -F 'href: "/quality/overview"' apps/admin/src/components/Sidebar.tsx
          grep -F 'trustSectionQuality' apps/admin/messages/trust/en.json
          grep -F 'trustSectionQuality' apps/admin/messages/trust/fa.json
          grep -F 'admin.quality.v1.yaml' docs/api/package.json
          grep -F 'admin.quality.v1.json' docs/api/scripts/merge-admin-spec.js
          grep -F "function count(row: unknown" apps/api/app/services/quality_trust_service.ts
          grep -F '.where("ri.id", Number(input[sourceKey]))' apps/api/app/services/quality_trust_service.ts
          grep -F "function useQualityMutation" apps/admin/src/features/quality/queries.ts
      - name: Phase 19 static contract
        run: node scripts/verify-phase19-quality-trust.mjs
      - name: Phase 19 unit invariants
        working-directory: apps/api
        run: pnpm test --files=tests/unit/quality/phase19_quality_trust.spec.ts
      - name: API typecheck
        run: pnpm --filter @calibra/api run typecheck
      - name: Admin typecheck
        run: pnpm exec turbo run typecheck --filter=@calibra/admin
      - name: Admin OpenAPI build
        run: pnpm --filter @calibra/api-docs run build:json:admin
      - name: API docs drift delta gate
        working-directory: apps/api
        shell: bash
        env:
          NODE_ENV: test
          PORT: "3334"
          HOST: "0.0.0.0"
          APP_NAME: calibra-api
          APP_KEY: ci-only-key-not-used-for-real-secrets
          LOG_LEVEL: warn
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: calibra
          DB_PASSWORD: calibra
          DB_DATABASE: calibra
          MAIL_FROM_ADDRESS: ops@calibra.local
          MAIL_FROM_NAME: Calibra
          MAIL_NOTIFICATIONS_ENABLED: "false"
          SMTP_HOST: localhost
          SMTP_PORT: "11025"
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          TRANSMIT_TRANSPORT: none
          QUEUE_DRIVER: sync
          LIMITER_STORE: memory
          CACHE_DRIVER: memory
        run: |
          set -euo pipefail
          set +e
          node ace check:api-docs > /tmp/phase19-candidate-docs.log 2>&1
          candidate_status=$?
          set -e
          CANDIDATE_STATUS="$candidate_status" node - <<'NODE'
          const fs = require("node:fs");
          const baseline = new Set(JSON.parse(fs.readFileSync("/tmp/phase19-main-undocumented.json", "utf8")));
          const text = fs.readFileSync("/tmp/phase19-candidate-docs.log", "utf8").replace(/\x1B\[[0-?]*[ -/]*[@-~]/g, "");
          const routePattern = /\b((?:GET|POST|PUT|PATCH|DELETE|OPTIONS|HEAD)(?:\|(?:GET|POST|PUT|PATCH|DELETE|OPTIONS|HEAD))*)\s+(\/api\/[^\s]+)/g;
          const candidate = new Set();
          for (const match of text.matchAll(routePattern)) candidate.add(`${match[1]} ${match[2].replace(/[),;]+$/, "")}`);
          const status = Number(process.env.CANDIDATE_STATUS ?? "0");
          if (status !== 0 && candidate.size === 0) {
            console.error(text);
            throw new Error("API docs check failed for a reason other than classifiable route drift");
          }
          const introduced = [...candidate].filter((route) => !baseline.has(route)).sort();
          if (introduced.length) {
            console.error("Phase 19 introduced undocumented routes:\n" + introduced.join("\n"));
            process.exit(1);
          }
          console.log(`Phase 19 API docs delta PASS: ${candidate.size} current undocumented route signatures, ${introduced.length} introduced by Phase 19`);
          NODE
      - name: Generate Admin SDK
        run: pnpm --filter @calibra/sdk run codegen:admin
      - name: SDK package build
        run: pnpm --filter @calibra/sdk run build
      - name: Admin production build
        run: pnpm --filter @calibra/admin run build
      - name: Diff hygiene
        run: git diff --check
      - name: Commit generated PR release candidate
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Phase 19 release candidate already materialized"
            exit 0
          fi
          git diff --name-only | tee /tmp/phase19-files.txt
          while IFS= read -r path; do
            case "$path" in
              apps/admin/messages/trust/en.json|apps/admin/messages/trust/fa.json|apps/admin/src/components/Sidebar.tsx|apps/admin/src/lib/queries/api-client.ts|apps/admin/src/features/quality/*|apps/api/app/controllers/admin/quality_trust_controller.ts|apps/api/app/services/quality_permissions.ts|apps/api/app/services/quality_trust_service.ts|apps/api/app/validators/admin/quality_trust_validator.ts|apps/api/start/routes.ts|apps/api/start/routes/admin_quality.ts|apps/api/database/migrations/1767500000000_create_phase19_quality_trust_os.ts|apps/api/tests/unit/quality/phase19_quality_trust.spec.ts|docs/api/package.json|docs/api/scripts/merge-admin-spec.js|packages/sdk/src/generated/admin.d.ts|scripts/materialize-phase19-on-current-main.mjs|scripts/verify-phase19-quality-trust.mjs) ;;
              *) echo "Unexpected touched path: $path" >&2; exit 1 ;;
            esac
          done < /tmp/phase19-files.txt
          remote_sha="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          test "$remote_sha" = "$START_SHA"
          git config user.name "calibra-phase19-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(phase19): generate quality trust integration and admin SDK"
          git push origin "HEAD:${BRANCH}"
      - name: Assert immutable main candidate
        if: github.event_name != 'pull_request'
        run: git diff --exit-code
