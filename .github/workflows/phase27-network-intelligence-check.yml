name: Phase 27 Network Intelligence Integrity

on:
  pull_request:
    paths:
      - "apps/api/app/controllers/admin/network_intelligence_controller.ts"
      - "apps/api/app/services/network_intelligence/**"
      - "apps/api/app/validators/network_intelligence/**"
      - "apps/api/database/migrations/1780000000000_create_network_intelligence_os.ts"
      - "apps/api/start/routes/admin_network_intelligence.ts"
      - "apps/api/start/routes.ts"
      - "apps/api/tests/unit/phase27_network_privacy.spec.ts"
      - "apps/api/tests/functional/network_intelligence/phase27_network.spec.ts"
      - "apps/admin/src/features/network-intelligence/**"
      - "apps/admin/src/lib/queries/network-intelligence.ts"
      - "apps/admin/src/lib/i18n/request.ts"
      - "apps/admin/src/app/[locale]/(authenticated)/decision-intelligence/network-intelligence/**"
      - "apps/admin/src/app/[locale]/(authenticated)/layout.tsx"
      - "apps/admin/messages/network_intelligence/**"
      - "apps/admin/src/components/ui/helper-tooltip.tsx"
      - "docs/api/package.json"
      - "docs/api/reference/openapi/admin.phase27.v1.yaml"
      - "docs/api/scripts/merge-admin-spec.js"
      - "packages/sdk/src/generated/admin.d.ts"
      - "scripts/aggregate-network-benchmarks.mjs"
      - "scripts/test-phase27-network-aggregation.mjs"
      - "scripts/verify-phase27-network.mjs"
      - ".github/workflows/phase27-network-intelligence-check.yml"
  push:
    branches:
      - feat/phase27-private-network-intelligence-20260824

permissions:
  contents: write

concurrency:
  group: phase27-network-intelligence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: calibra
          POSTGRES_PASSWORD: calibra
          POSTGRES_DB: calibra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U calibra -d calibra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase27-private-network-intelligence-20260824
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - run: npm install --global pnpm@10.32.1
      - run: pnpm install --frozen-lockfile
      - name: Create test database
        env:
          PGPASSWORD: calibra
        run: psql -h localhost -U calibra -d calibra -c "CREATE DATABASE calibra_test OWNER calibra;"
      - name: Apply deterministic Phase 27 canonical repairs
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          service_path = Path("apps/api/app/services/network_intelligence/network_service.ts")
          service = service_path.read_text()
          service = service.replace(
              'value.forEach((item, index) => assertAggregateOnlyNetworkPayload(item, `${path}[${index}]`));',
              'for (const [index, item] of value.entries()) {\n            assertAggregateOnlyNetworkPayload(item, `${path}[${index}]`);\n        }',
          )
          service = service.replace('if (!policy || !policy.opted_in) {', 'if (!policy?.opted_in) {')
          service_path.write_text(service)

          aggregate_path = Path("scripts/aggregate-network-benchmarks.mjs")
          aggregate = aggregate_path.read_text()
          aggregate = aggregate.replace(
              'value.forEach((item, index) => assertNoRawIdentityFields(item, `${location}[${index}]`));',
              'for (const [index, item] of value.entries()) {\n            assertNoRawIdentityFields(item, `${location}[${index}]`);\n        }',
          )
          aggregate_path.write_text(aggregate)

          verifier_path = Path("scripts/verify-phase27-network.mjs")
          verifier = verifier_path.read_text().replace('"minimum_cohort_size >= 5",', '"NETWORK_MIN_COHORT_FLOOR = 5",')
          verifier_path.write_text(verifier)

          workspace_path = Path("apps/admin/src/features/network-intelligence/NetworkIntelligenceWorkspace.tsx")
          workspace = workspace_path.read_text()
          workspace = workspace.replace(
              'import { Select } from "#/components/ui/select";',
              'import { Select, SelectContent, SelectItem, SelectTrigger, SelectValue } from "#/components/ui/select";',
          )

          replacements = {
              "network-contribution-metric": '''<Select
                            value={selectedMetric?.metric_key ?? ""}
                            onValueChange={(value) => {
                                if (typeof value === "string") setContributionMetric(value);
                            }}
                        >
                            <SelectTrigger id="network-contribution-metric">
                                <SelectValue placeholder="انتخاب متریک" />
                            </SelectTrigger>
                            <SelectContent>
                                {(metrics.data ?? []).map((metric) => (
                                    <SelectItem key={metric.public_id} value={metric.metric_key}>
                                        {metric.metric_key} · v{metric.version}
                                    </SelectItem>
                                ))}
                            </SelectContent>
                        </Select>''',
              "privacy-method": '''<Select
                            value={privacyMethod}
                            onValueChange={(value) => {
                                if (value === "aggregate_threshold" || value === "laplace_dp" || value === "secure_aggregate") {
                                    setPrivacyMethod(value);
                                }
                            }}
                        >
                            <SelectTrigger id="privacy-method">
                                <SelectValue placeholder="روش privacy" />
                            </SelectTrigger>
                            <SelectContent>
                                <SelectItem value="aggregate_threshold">aggregate threshold</SelectItem>
                                <SelectItem value="laplace_dp">Laplace DP</SelectItem>
                                <SelectItem value="secure_aggregate">secure aggregate (attested backend)</SelectItem>
                            </SelectContent>
                        </Select>''',
              "access-user": '''<Select
                            value={targetUser}
                            onValueChange={(value) => {
                                if (typeof value === "string") setTargetUser(value);
                            }}
                        >
                            <SelectTrigger id="access-user">
                                <SelectValue placeholder="انتخاب کنید" />
                            </SelectTrigger>
                            <SelectContent>
                                {(access.data ?? []).map((row) => (
                                    <SelectItem key={row.id} value={String(row.id)}>{row.identity}</SelectItem>
                                ))}
                            </SelectContent>
                        </Select>''',
              "access-preset": '''<Select
                            value={preset}
                            onValueChange={(value) => {
                                if (typeof value === "string") setPreset(value);
                            }}
                        >
                            <SelectTrigger id="access-preset">
                                <SelectValue placeholder="Preset" />
                            </SelectTrigger>
                            <SelectContent>
                                <SelectItem value="viewer">viewer</SelectItem>
                                <SelectItem value="contributor">contributor</SelectItem>
                                <SelectItem value="privacy_admin">privacy admin</SelectItem>
                                <SelectItem value="owner">owner</SelectItem>
                            </SelectContent>
                        </Select>''',
          }
          for select_id, replacement in replacements.items():
              pattern = rf'<Select id="{re.escape(select_id)}".*?</Select>'
              workspace, count = re.subn(pattern, replacement, workspace, count=1, flags=re.S)
              if count != 1 and f'id="{select_id}"' not in workspace:
                  raise SystemExit(f"failed to canonicalize select: {select_id}")
          workspace_path.write_text(workspace)
          PY
      - name: Canonicalize Phase 27 source
        run: >-
          pnpm exec biome check --write
          apps/api/app/controllers/admin/network_intelligence_controller.ts
          apps/api/app/services/network_intelligence/network_service.ts
          apps/api/app/services/network_intelligence/permissions.ts
          apps/api/app/services/network_intelligence/locks.ts
          apps/api/app/validators/network_intelligence/network_validator.ts
          apps/api/database/migrations/1780000000000_create_network_intelligence_os.ts
          apps/api/start/routes/admin_network_intelligence.ts
          apps/api/start/routes.ts
          apps/api/tests/unit/phase27_network_privacy.spec.ts
          apps/api/tests/functional/network_intelligence/phase27_network.spec.ts
          apps/admin/src/features/network-intelligence
          apps/admin/src/lib/queries/network-intelligence.ts
          apps/admin/src/lib/i18n/request.ts
          apps/admin/src/components/ui/helper-tooltip.tsx
          "apps/admin/src/app/[locale]/(authenticated)/layout.tsx"
          "apps/admin/src/app/[locale]/(authenticated)/decision-intelligence/network-intelligence"
          apps/admin/messages/network_intelligence
          docs/api/package.json
          docs/api/scripts/merge-admin-spec.js
          scripts/aggregate-network-benchmarks.mjs
          scripts/test-phase27-network-aggregation.mjs
          scripts/verify-phase27-network.mjs
      - name: Build canonical Admin OpenAPI
        run: pnpm --filter @calibra/api-docs run build:json:admin
      - name: Generate canonical Admin SDK
        run: pnpm --filter @calibra/sdk run codegen:admin
      - name: Commit canonical Phase 27 output if needed
        run: |
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -A
            git commit -m "chore(phase27): canonicalize generated contracts"
            git push origin HEAD:feat/phase27-private-network-intelligence-20260824
          fi
      - name: Phase 27 static contract
        run: node scripts/verify-phase27-network.mjs
      - name: Offline privacy aggregation regressions
        run: node scripts/test-phase27-network-aggregation.mjs
      - name: Phase 27 unit privacy regressions
        working-directory: apps/api
        run: pnpm test --force-exit --suite=unit --files='phase27_network_privacy'
      - name: Phase 27 functional release contracts
        working-directory: apps/api
        run: pnpm test --force-exit --suite=functional --files='phase27_network'
      - name: API typecheck
        run: pnpm --filter @calibra/api run typecheck
      - name: Build SDK dependency
        run: pnpm --filter @calibra/sdk run build
      - name: Admin typecheck
        run: pnpm --filter @calibra/admin run typecheck
      - name: Admin production build
        run: pnpm --filter @calibra/admin run build
      - name: Verify canonical OpenAPI and SDK are stable
        run: |
          pnpm --filter @calibra/api-docs run build:json:admin
          pnpm --filter @calibra/sdk run codegen:admin
          git diff --exit-code -- packages/sdk/src/generated/admin.d.ts docs/api/package.json docs/api/scripts/merge-admin-spec.js
