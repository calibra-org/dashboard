name: PR16 OpenAPI Repair
on:
  push:
    branches: ["agent/runtime-hardening-20260814"]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Repair merged test OpenAPI compatibility
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          const completion = 'docs/api/reference/openapi/storefront.completion.v1.yaml';
          let source = fs.readFileSync(completion, 'utf8');
          const bad = '"404": { description: Tracking token invalid, expired, revoked, or outside the current tenant }';
          const good = '"404": { description: "Tracking token invalid, expired, revoked, or outside the current tenant" }';
          if (!source.includes(bad) && !source.includes(good)) throw new Error('Support 404 anchor not found');
          source = source.replace(bad, good);
          fs.writeFileSync(completion, source);

          const merge = 'docs/api/scripts/merge-for-tests.js';
          source = fs.readFileSync(merge, 'utf8');
          const mergedAnchor = '};\n\ndowngradeTo30(merged, merged);';
          if (!source.includes('Enrich only the test-only merged fixture')) {
            const lines = [
              '};',
              '',
              '// AdonisJS auto-registers HEAD companions for GET routes. The generated HEAD',
              '// stubs are intentionally minimal in the public specs, but the OpenAPI 3.0',
              '// validator used by Japa requires every path parameter to be declared on the',
              '// operation. Enrich only the test-only merged fixture from the matching GET.',
              'for (const [path, item] of Object.entries(merged.paths ?? {})) {',
              '    if (!item || typeof item !== "object" || !item.head || !item.get) continue;',
              '    const inherited = Array.isArray(item.parameters) ? item.parameters : [];',
              '    const getParameters = Array.isArray(item.get.parameters) ? item.get.parameters : [];',
              '    const headParameters = Array.isArray(item.head.parameters) ? item.head.parameters : [];',
              '    const combined = [...inherited, ...getParameters, ...headParameters];',
              '    const seen = new Set();',
              '    item.head.parameters = combined.filter((parameter) => {',
              '        const key = parameter?.$ref ?? String(parameter?.in ?? "") + ":" + String(parameter?.name ?? "");',
              '        if (seen.has(key)) return false;',
              '        seen.add(key);',
              '        return true;',
              '    });',
              '    if (item.head.parameters.length === 0) delete item.head.parameters;',
              '    item.head.summary ??= "HEAD companion for " + path;',
              '}',
              '',
              'downgradeTo30(merged, merged);',
            ].join('\n');
            if (!source.includes(mergedAnchor)) throw new Error('Merged fixture anchor not found');
            source = source.replace(mergedAnchor, lines);
          }

          const constAnchor = '    if (Array.isArray(node.type)) {';
          if (!source.includes('single-value enum')) {
            const lines = [
              '    // OpenAPI 3.1 supports const; OpenAPI 3.0 expresses the same constraint',
              '    // with a single-value enum. This conversion is test-fixture only.',
              '    if (Object.prototype.hasOwnProperty.call(node, "const")) {',
              '        node.enum = [node.const];',
              '        delete node.const;',
              '    }',
              '',
              '    if (Array.isArray(node.type)) {',
            ].join('\n');
            if (!source.includes(constAnchor)) throw new Error('downgradeTo30 anchor not found');
            source = source.replace(constAnchor, lines);
          }
          fs.writeFileSync(merge, source);
          NODE
      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name calibra-dev
          git config user.email keshavarz20.com@gmail.com
          git rm .github/workflows/pr16-openapi-repair.yml
          git add docs/api/reference/openapi/storefront.completion.v1.yaml docs/api/scripts/merge-for-tests.js
          git commit -m 'fix(test): normalize OpenAPI 3.1 features for Japa'
          git push origin HEAD:agent/runtime-hardening-20260814
