name: Phase 6-7 canonical finalizer

on:
  push:
    branches:
      - agent/phase7-identity-trust-os

permissions:
  contents: write

concurrency:
  group: phase67-canonical-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase7-identity-trust-os
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Apply canonical Phase 6-7 integration repairs
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const packagePath = 'docs/api/package.json';
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          pkg.scripts['build:json:admin-phase6'] = 'redocly bundle reference/openapi/admin.phase6.v1.yaml -o dist/admin.phase6.v1.json --ext json';
          pkg.scripts['build:json:admin'] = 'pnpm build:json:admin-base && pnpm build:json:admin-tickets && pnpm build:json:admin-ticket-omnichannel && pnpm build:json:admin-phase5 && pnpm build:json:admin-phase6 && pnpm build:json:admin-runtime-sync && pnpm build:json:admin-identity && pnpm build:json:admin-completion && pnpm build:json:admin-merge';
          fs.writeFileSync(packagePath, `${JSON.stringify(pkg, null, 4)}\n`);

          const mergePath = 'docs/api/scripts/merge-admin-spec.js';
          let merge = fs.readFileSync(mergePath, 'utf8');
          if (!merge.includes('dist/admin.phase6.v1.json')) {
            merge = merge.replace(
              'const phase5 = JSON.parse(readFileSync(resolve(root, "dist/admin.phase5.v1.json"), "utf8"));',
              'const phase5 = JSON.parse(readFileSync(resolve(root, "dist/admin.phase5.v1.json"), "utf8"));\nconst phase6 = JSON.parse(readFileSync(resolve(root, "dist/admin.phase6.v1.json"), "utf8"));',
            );
          }
          if (!merge.includes('[phase6, "Phase6Overlay"]')) {
            merge = merge.replace(
              '    [phase5, "Phase5Overlay"],',
              '    [phase5, "Phase5Overlay"],\n    [phase6, "Phase6Overlay"],',
            );
          }
          if (!merge.includes('dist/admin.phase6.v1.json') || !merge.includes('[phase6, "Phase6Overlay"]')) {
            throw new Error('Phase 6 OpenAPI overlay wiring failed');
          }
          fs.writeFileSync(mergePath, merge);

          const adminSpecPath = 'docs/api/reference/openapi/admin.v1.yaml';
          let adminSpec = fs.readFileSync(adminSpecPath, 'utf8');
          const badHead = '    /api/v1/admin/payment-attempts/{id}/reconcile:\n        post:\n            $ref: "./admin/paths/payments/payment-attempts-id-reconcile.post.yaml"\n\n        head:\n            $ref: "./common/components/operations/HeadCompanion.yaml"';
          const fixedHead = '    /api/v1/admin/payment-attempts/{id}/reconcile:\n        post:\n            $ref: "./admin/paths/payments/payment-attempts-id-reconcile.post.yaml"';
          if (adminSpec.includes(badHead)) adminSpec = adminSpec.replace(badHead, fixedHead);
          if (adminSpec.includes('/api/v1/admin/payment-attempts/{id}/reconcile:\n        post:\n            $ref: "./admin/paths/payments/payment-attempts-id-reconcile.post.yaml"\n\n        head:')) {
            throw new Error('Stale HEAD reconciliation route was not removed');
          }
          fs.writeFileSync(adminSpecPath, adminSpec);

          const sidebarPath = 'apps/admin/src/components/Sidebar.tsx';
          let sidebar = fs.readFileSync(sidebarPath, 'utf8');
          const navStartToken = '                {groups.map((group) => (';
          const navEndToken = '                ))}\n            </nav>';
          const navStart = sidebar.indexOf(navStartToken);
          const navEnd = sidebar.indexOf(navEndToken, navStart);
          if (navStart < 0 || navEnd < 0) throw new Error('Sidebar navigation block not found');

          const topLevelNav = `                {groups.slice(0, 3).map((group) => (\n                    <div key={group.titleKey} className="flex flex-col gap-1">\n                        <div className="px-3 pb-1 font-medium text-[0.65rem] text-sidebar-foreground/50 uppercase tracking-wider">\n                            {navT(group.titleKey)}\n                        </div>\n                        {group.items.map((item) => itemLink(item))}\n                    </div>\n                ))}\n                {collapsible(\n                    "factor-sidebar-items",\n                    factorActive,\n                    factorOpen,\n                    setFactorOpen,\n                    ReceiptText,\n                    navT("factor"),\n                    factorItems,\n                )}\n                {collapsible(\n                    "content-sidebar-items",\n                    contentActive,\n                    contentOpen,\n                    setContentOpen,\n                    PenLine,\n                    navT("content"),\n                    contentItems,\n                )}\n                {collapsible("seo-sidebar-items", seoActive, seoOpen, setSeoOpen, Search, navT("seo"), seoItems, {\n                    0: navT("seoSectionControl"),\n                    2: navT("seoSectionCatalog"),\n                    6: navT("seoSectionContent"),\n                    10: navT("seoSectionMonitoring"),\n                    14: navT("seoSectionSystem"),\n                })}\n                {collapsible(\n                    "ticket-sidebar-items",\n                    ticketActive,\n                    ticketOpen,\n                    setTicketOpen,\n                    MessageSquare,\n                    navT("tickets"),\n                    ticketItems,\n                    undefined,\n                    ticketUnread,\n                )}\n                {groups.slice(3).map((group) => (\n                    <div key={group.titleKey} className="flex flex-col gap-1">\n                        <div className="px-3 pb-1 font-medium text-[0.65rem] text-sidebar-foreground/50 uppercase tracking-wider">\n                            {navT(group.titleKey)}\n                        </div>\n                        {group.items.map((item) => itemLink(item))}\n                        {group.titleKey === "configuration" ? (\n                            <div className="mt-1">\n                                {collapsible(\n                                    "identity-sidebar-items",\n                                    identityActive,\n                                    identityOpen,\n                                    setIdentityOpen,\n                                    ShieldCheck,\n                                    "هویت و امنیت",\n                                    identityItems,\n                                    { 12: "تنظیمات" },\n                                )}\n                            </div>\n                        ) : null}\n                    </div>\n                ))}\n`;
          sidebar = sidebar.slice(0, navStart) + topLevelNav + sidebar.slice(navEnd + '                ))}\n'.length);
          fs.writeFileSync(sidebarPath, sidebar);
          NODE

      - name: Regenerate canonical OpenAPI SDK types
        run: pnpm --filter @calibra/sdk run codegen

      - name: Format repaired sources
        run: >-
          pnpm exec biome format --write
          apps/admin/src/lib/queries/configuration.ts
          apps/admin/src/views/store-config/settings/configuration-group-view.tsx
          apps/admin/src/components/Sidebar.tsx
          docs/api/package.json
          docs/api/scripts/merge-admin-spec.js

      - name: Verify type safety
        run: pnpm run typecheck

      - name: Verify Phase 6 and Phase 7 invariants
        run: |
          node scripts/verify-phase7-identity-integration.mjs
          if [ -f scripts/verify-phase6-configuration-integration.mjs ]; then node scripts/verify-phase6-configuration-integration.mjs; fi

      - name: Remove temporary diagnostics and finalizer
        run: |
          rm -f .github/workflows/baseline-gate-repair.yml
          rm -f .github/workflows/phase6-test-schema-diagnostic.yml
          rm -f .github/workflows/phase7-admin-diagnostic.yml
          rm -f .github/workflows/phase7-certifier-hotfix.yml
          rm -f diagnostics/phase7-admin-build.log diagnostics/phase7-admin-status.txt diagnostics/phase7-admin-typecheck.log diagnostics/phase7-sdk-build.log
          rm -f .github/workflows/phase67-canonical-finalizer.yml

      - name: Commit canonical repairs
        run: |
          git config user.name "calibra-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(phase6-7): complete canonical integration and navigation"
          git push origin HEAD:agent/phase7-identity-trust-os
