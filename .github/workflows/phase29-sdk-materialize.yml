name: Phase 29 SDK Materializer

on:
  pull_request:
    paths:
      - ".github/workflows/phase29-sdk-materialize.yml"

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/phase29-product-passport-20260825'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - run: npm install --global pnpm@10.32.1
      - run: pnpm install --frozen-lockfile
      - name: Generate SDK from merged OpenAPI contracts
        run: pnpm --filter @calibra/sdk run codegen
      - name: Assert only expected Phase 29 SDK files changed
        run: |
          changed="$(git diff --name-only -- packages/sdk/src/generated/)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -v -E '^(packages/sdk/src/generated/admin\.d\.ts|packages/sdk/src/generated/storefront\.d\.ts)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected generated SDK changes:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
          printf '%s\n' "$changed" | grep -q '^packages/sdk/src/generated/admin\.d\.ts$'
          printf '%s\n' "$changed" | grep -q '^packages/sdk/src/generated/storefront\.d\.ts$'
      - name: Verify generated SDK and build
        run: |
          pnpm --filter @calibra/sdk run codegen:check
          pnpm --filter @calibra/sdk run build
      - name: Commit generated SDK and remove materializer
        run: |
          git rm .github/workflows/phase29-sdk-materialize.yml
          git add packages/sdk/src/generated/admin.d.ts packages/sdk/src/generated/storefront.d.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(sdk): generate Phase 29 passport contracts"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
