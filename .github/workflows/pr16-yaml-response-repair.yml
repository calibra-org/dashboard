name: PR16 YAML Response Repair
on:
  push:
    branches: ["agent/runtime-hardening-20260814"]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Quote comma-containing inline response descriptions
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const replacements = [
            [
              'docs/api/reference/openapi/admin.tickets.v1.yaml',
              '"422": { description: Invalid ticket, customer, or assignee. }',
              '"422": { description: "Invalid ticket, customer, or assignee." }',
            ],
            [
              'docs/api/reference/openapi/admin.phase5.v1.yaml',
              "'409': { description: Idempotency, concurrency or over-fulfillment conflict }",
              "'409': { description: 'Idempotency, concurrency or over-fulfillment conflict' }",
            ],
            [
              'docs/api/reference/openapi/admin.phase5.v1.yaml',
              "'409': { description: Idempotency, concurrency or over-return conflict }",
              "'409': { description: 'Idempotency, concurrency or over-return conflict' }",
            ],
          ];
          for (const [path, from, to] of replacements) {
            let source = fs.readFileSync(path, 'utf8');
            if (!source.includes(from) && !source.includes(to)) throw new Error(`OpenAPI response anchor not found: ${path}`);
            source = source.replace(from, to);
            fs.writeFileSync(path, source);
          }
          NODE
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name calibra-dev
          git config user.email keshavarz20.com@gmail.com
          git rm .github/workflows/pr16-yaml-response-repair.yml
          git add docs/api/reference/openapi/admin.tickets.v1.yaml docs/api/reference/openapi/admin.phase5.v1.yaml
          git commit -m 'fix(api-docs): quote inline conflict descriptions'
          git push origin HEAD:agent/runtime-hardening-20260814
