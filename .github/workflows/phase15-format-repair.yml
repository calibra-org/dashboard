name: Phase 15 One-shot Format Repair

on:
  push:
    branches:
      - agent/phase15-customer-genome
    paths:
      - ".github/workflows/phase15-format-repair.yml"

permissions:
  contents: write

env:
  NODE_VERSION: "24.14.0"
  PNPM_VERSION: "10.32.1"
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase15-customer-genome
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --global pnpm@${PNPM_VERSION}
      - run: pnpm install --frozen-lockfile
      - name: Apply canonical Biome formatting
        run: pnpm exec biome format --write .
      - name: Guard formatting scope
        run: |
          changed=$(git diff --name-only | wc -l | tr -d ' ')
          echo "Biome changed ${changed} files"
          if [ "$changed" -gt 20 ]; then
            echo "Refusing unexpectedly broad formatter change"
            git diff --name-only
            exit 1
          fi
      - name: Verify repository formatting
        run: pnpm exec biome format .
      - name: Commit formatting and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm .github/workflows/phase15-format-repair.yml
          git commit -m "style: normalize Phase 14 and 20 repository formatting"
          git push origin HEAD:agent/phase15-customer-genome
