name: Phase 13 Apply Verified Payload

on:
    push:
        branches: ["feat/phase13-planning-os-20260817"]
        paths:
            - ".calibra-phase13/**"
            - ".github/workflows/phase13-apply-payload.yml"

permissions:
    contents: write

concurrency:
    group: phase13-apply-payload-${{ github.ref }}
    cancel-in-progress: false

jobs:
    apply:
        runs-on: ubuntu-latest
        timeout-minutes: 6
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: "feat/phase13-planning-os-20260817"
                  fetch-depth: 0
            - uses: actions/setup-node@v4
              with:
                  node-version: "24.14.0"
            - name: Reassemble and verify payload
              shell: bash
              run: |
                  set -euo pipefail
                  cat .calibra-phase13/payload.part.* | base64 --decode > /tmp/phase13_payload.tar.gz
                  echo "90cab34d24956f1c85321fb86d2454210940678e65f5ac48beadfaf988af2006  /tmp/phase13_payload.tar.gz" | sha256sum --check --strict
                  tar -xzf /tmp/phase13_payload.tar.gz -C .
            - name: Verify Phase 13 invariants
              run: node scripts/verify-phase13-planning-integration.mjs
            - name: Smoke forecast engine
              run: node --experimental-strip-types scripts/smoke-phase13-forecast.mjs
            - name: Publish clean Phase 13 source commit
              shell: bash
              run: |
                  set -euo pipefail
                  rm -rf .calibra-phase13 .github/workflows/phase13-apply-payload.yml
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add -A
                  git commit -m "feat(planning): Phase 13 Planning OS control tower"
                  git push origin HEAD:feat/phase13-planning-os-20260817
