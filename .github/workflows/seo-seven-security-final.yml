name: SEO seven-engine security final

on:
  push:
    branches:
      - agent/seo-seven-real-engines-20260811

permissions:
  contents: write

jobs:
  security-final:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/seo-seven-real-engines-20260811
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python3 .github/scripts/seo-seven-security-final.py
      - run: pnpm exec biome format apps/api/app/services/seo/search_engines.ts apps/api/database/migrations/1760000000000_expand_seo_search_engines.ts apps/admin/src/features/seo/workspace.tsx scripts/verify-seo-search-engines.mjs --write
      - run: pnpm run verify:seo-engines
      - run: pnpm --filter @calibra/api run typecheck
      - run: pnpm --filter @calibra/sdk run build
      - run: pnpm --filter @calibra/admin run typecheck
      - name: Commit final security pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/app/services/seo/search_engines.ts apps/api/database/migrations/1760000000000_expand_seo_search_engines.ts apps/admin/src/features/seo/workspace.tsx scripts/verify-seo-search-engines.mjs docs/seo-integration/SEARCH_ENGINES_REAL_INTEGRATIONS_FA.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(seo): harden provider verification and sync evidence"
          git push origin HEAD:agent/seo-seven-real-engines-20260811
