name: Phase 7 engine bind hotfix

on:
  push:
    branches: [agent/phase7-identity-trust-os]
    paths: [.github/workflows/phase7-engine-bind-hotfix.yml]

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase7-identity-trust-os
      - name: Add current Lucid bigint binding compatibility repair
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const path = '.github/workflows/baseline-gate-repair.yml'
          let source = fs.readFileSync(path, 'utf8')
          const anchor = "          grep -F 'router.post(\"/configuration/history/:scope/:revision/rollback\"' apps/api/start/routes/admin_settings.ts\n"
          if (!source.includes(anchor)) throw new Error('certifier Phase 6 route anchor missing')
          const repair = `${anchor}\n          # Current Lucid does not accept JavaScript bigint as a query binding. Preserve the exact DB bigint value as a decimal string at the binding boundary.\n          sed -i 's/where(\"id\", current.id)/where(\"id\", typeof current.id === \"bigint\" ? current.id.toString() : current.id)/' apps/api/app/services/configuration_engine_service.ts\n          grep -F 'typeof current.id === \"bigint\" ? current.id.toString() : current.id' apps/api/app/services/configuration_engine_service.ts\n`
          source = source.replace(anchor, repair)
          fs.writeFileSync(path, source)
          NODE
          rm -f .github/workflows/phase7-engine-bind-hotfix.yml
          git add -A
          git diff --cached --check
          git config user.name "calibra-phase7-bot"
          git config user.email "calibra-phase7-bot@users.noreply.github.com"
          git commit -m "ci: normalize Phase 6 bigint query binding"
          git push origin HEAD:agent/phase7-identity-trust-os
