name: Phase 34 Biome Diagnostic

on:
  push:
    branches:
      - "feat/phase34-lite-cash"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase34-biome-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/phase34-lite-cash
      - uses: actions/setup-node@v7
        with:
          node-version: 24.14.0
      - run: npm install --global pnpm@10.32.1
      - run: pnpm install --frozen-lockfile
      - name: Reproduce canonical Phase 34 working tree
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          function replaceOnce(path, from, to) {
            const source = fs.readFileSync(path, "utf8");
            const count = source.split(from).length - 1;
            if (count !== 1) throw new Error(`${path}: expected exactly one replacement target, found ${count}`);
            fs.writeFileSync(path, source.replace(from, to), "utf8");
          }
          replaceOnce(
            "apps/admin/src/components/Sidebar.tsx",
            '            { href: "/snippets", label: "Snippets", icon: FileText },',
            '            { href: "/snippets", label: "Snippets", icon: FileText },\n            { href: "/lite-cash", label: "lite cash", icon: SlidersHorizontal },',
          );
          replaceOnce(
            "apps/api/app/services/lite_cash/lite_cash_service.ts",
            'from "./policy.js";',
            'from "#services/lite_cash/policy";',
          );
          replaceOnce(
            "apps/api/app/services/lite_cash/lite_cash_service.ts",
            'async function settingsRow() {\n    const existing = await currentTrx().from("lite_cash_settings").where("tenant_id", tenantId()).first();\n    if (existing) return existing;\n    const [created] = await currentTrx()\n        .table("lite_cash_settings")\n        .insert({ tenant_id: tenantId() })\n        .returning("*");\n    return created;\n}',
            'async function settingsRow() {\n    const existing = await currentTrx().from("lite_cash_settings").where("tenant_id", tenantId()).first();\n    if (existing) return existing;\n    const [created] = await currentTrx()\n        .table("lite_cash_settings")\n        .insert({ tenant_id: tenantId() })\n        .onConflict(["tenant_id"])\n        .ignore()\n        .returning("*");\n    if (created) return created;\n    const raced = await currentTrx().from("lite_cash_settings").where("tenant_id", tenantId()).first();\n    if (!raced) throw new Error("Failed to initialize lite cash settings");\n    return raced;\n}',
          );
          replaceOnce(
            "apps/api/app/controllers/admin/lite_cash_controller.ts",
            'function changedPayload(value: unknown): { data: unknown; changed: boolean } {\n    if (!value || typeof value !== "object") return { data: value, changed: true };\n    const record = value as Record<string, unknown>;\n    return { data: record.data ?? value, changed: record.changed !== false };\n}\n\n',
            "",
          );
          replaceOnce(
            "docs/api/reference/openapi/admin.phase34.v1.yaml",
            "    LiteCashPolicyUpdate:\n      allOf:\n        - { $ref: '#/components/schemas/LiteCashPolicyCreate' }\n      required: [reason]",
            "    LiteCashPolicyUpdate:\n      type: object\n      required: [reason]\n      properties:\n        name: { type: string }\n        description: { type: string }\n        kind: { type: string, enum: [api, page, asset, query] }\n        route_pattern: { type: string }\n        status: { type: string, enum: [enabled, disabled, archived] }\n        risk_tier: { type: string, enum: [low, medium, high, critical] }\n        ttl_seconds: { type: integer, minimum: 1, maximum: 604800 }\n        grace_seconds: { type: integer, minimum: 0, maximum: 604800 }\n        stale_if_error_seconds: { type: integer, minimum: 0, maximum: 604800 }\n        soft_timeout_ms: { type: integer, minimum: 10, maximum: 60000 }\n        hard_timeout_ms: { type: integer, minimum: 10, maximum: 120000 }\n        tags: { type: array, items: { type: string } }\n        vary: { type: array, items: { type: string } }\n        conditions: { type: object, additionalProperties: true }\n        reason: { type: string, minLength: 3, maxLength: 2000 }",
          );
          replaceOnce(
            "docs/api/reference/openapi/admin.phase34.v1.yaml",
            "    LiteCashProfileUpdate:\n      allOf:\n        - { $ref: '#/components/schemas/LiteCashProfileCreate' }\n      required: [reason]",
            "    LiteCashProfileUpdate:\n      type: object\n      required: [reason]\n      properties:\n        name: { type: string }\n        mode: { type: string, enum: [safe, balanced, aggressive, custom] }\n        status: { type: string, enum: [draft, active, archived] }\n        css: { type: object, additionalProperties: true }\n        javascript: { type: object, additionalProperties: true }\n        images: { type: object, additionalProperties: true }\n        fonts: { type: object, additionalProperties: true }\n        navigation: { type: object, additionalProperties: true }\n        edge: { type: object, additionalProperties: true }\n        reason: { type: string, minLength: 3, maxLength: 2000 }",
          );
          replaceOnce(
            "docs/api/package.json",
            "pnpm build:json:admin-phase32 && pnpm build:json:admin-phase33 && pnpm build:json:admin-merge",
            "pnpm build:json:admin-phase32 && pnpm build:json:admin-phase33 && pnpm build:json:admin-phase34 && pnpm build:json:admin-merge",
          );
          replaceOnce(
            "docs/api/package.json",
            '        "build:json:admin-phase33": "redocly bundle reference/openapi/admin.phase33.v1.yaml -o dist/admin.phase33.v1.json --ext json"\n',
            '        "build:json:admin-phase33": "redocly bundle reference/openapi/admin.phase33.v1.yaml -o dist/admin.phase33.v1.json --ext json",\n        "build:json:admin-phase34": "redocly bundle reference/openapi/admin.phase34.v1.yaml -o dist/admin.phase34.v1.json --ext json"\n',
          );
          replaceOnce(
            "docs/api/scripts/merge-admin-spec.js",
            'const phase33 = JSON.parse(readFileSync(resolve(root, "dist/admin.phase33.v1.json"), "utf8"));',
            'const phase33 = JSON.parse(readFileSync(resolve(root, "dist/admin.phase33.v1.json"), "utf8"));\nconst phase34 = JSON.parse(readFileSync(resolve(root, "dist/admin.phase34.v1.json"), "utf8"));',
          );
          replaceOnce(
            "docs/api/scripts/merge-admin-spec.js",
            '    [phase33, "Phase33SnippetsOverlay"],',
            '    [phase33, "Phase33SnippetsOverlay"],\n    [phase34, "Phase34LiteCashOverlay"],',
          );
          replaceOnce(
            "package.json",
            '        "verify:phase33": "node scripts/verify-phase33-snippets.mjs"\n',
            '        "verify:phase33": "node scripts/verify-phase33-snippets.mjs",\n        "verify:phase34": "node scripts/verify-phase34-lite-cash.mjs"\n',
          );
          const verifierPath = "scripts/verify-phase34-lite-cash.mjs";
          let verifier = fs.readFileSync(verifierPath, "utf8");
          verifier = verifier.replace('must(policy.includes(\'must\') === false || true, "Phase34 policy module loaded");\n', "");
          const broken = 'for (const forbidden of ["flushall", "flushdb", "child_process", "node:vm", "execSync(", "spawnSync(", "redis.call(", "keys(\\\"*\\\"")]) {';
          const fixed = 'for (const forbidden of ["flushall", "flushdb", "child_process", "node:vm", "execSync(", "spawnSync(", "redis.call(", \'keys("*"\']) {';
          if (!verifier.includes(broken)) throw new Error("Phase34 verifier forbidden-array target not found");
          verifier = verifier.replace(broken, fixed);
          verifier = verifier.replace(
            'const idempotencyMigration = read("apps/api/database/migrations/1805000000100_add_lite_cash_warm_job_idempotency.ts");',
            'const idempotencyMigration = read("apps/api/database/migrations/1805000000100_add_lite_cash_warm_job_idempotency.ts");\nconst activeProfileMigration = read("apps/api/database/migrations/1805000000200_enforce_lite_cash_profile_activation.ts");',
          );
          verifier = verifier.replace(
            'must(idempotencyMigration.includes("lite_cash_warm_jobs_idempotency_unique"), "Phase34 warm idempotency DB guard is missing");',
            'must(idempotencyMigration.includes("lite_cash_warm_jobs_idempotency_unique"), "Phase34 warm idempotency DB guard is missing");\nmust(activeProfileMigration.includes("lite_cash_profiles_single_active"), "Phase34 single-active-profile DB guard is missing");',
          );
          fs.writeFileSync(verifierPath, verifier, "utf8");
          NODE
      - run: pnpm run format:fix
      - name: Capture focused Biome output
        id: biome
        shell: bash
        run: |
          set +e
          pnpm exec biome check \
            apps/api/database/migrations/1805000000000_create_lite_cash_os.ts \
            apps/api/database/migrations/1805000000100_add_lite_cash_warm_job_idempotency.ts \
            apps/api/database/migrations/1805000000200_enforce_lite_cash_profile_activation.ts \
            apps/api/app/services/lite_cash \
            apps/api/app/controllers/admin/lite_cash_controller.ts \
            apps/api/app/validators/lite_cash \
            apps/api/tests/unit/lite_cash_policy.spec.ts \
            apps/api/start/routes/admin_lite_cash.ts \
            apps/api/start/routes.ts \
            apps/admin/src/features/lite-cash/LiteCashWorkspace.tsx \
            apps/admin/src/lib/queries/lite-cash.ts \
            "apps/admin/src/app/[locale]/(authenticated)/lite-cash/page.tsx" \
            apps/admin/src/components/Sidebar.tsx \
            docs/api/package.json \
            docs/api/scripts/merge-admin-spec.js \
            docs/api/reference/openapi/admin.phase34.v1.yaml \
            package.json \
            scripts/verify-phase34-lite-cash.mjs \
            --max-diagnostics=500 > phase34-biome.txt 2>&1
          code=$?
          printf '\nBIOME_EXIT=%s\n' "$code" >> phase34-biome.txt
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v7
        with:
          name: phase34-biome-${{ github.run_id }}
          path: phase34-biome.txt
          retention-days: 1
      - name: Preserve diagnostic exit status
        run: test "${{ steps.biome.outputs.code }}" -eq 0
