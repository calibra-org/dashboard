name: Harden final certifier formatting

on:
  push:
    branches: [agent/phase7-identity-trust-os]
    paths: [.github/workflows/certifier-format-fix.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase7-identity-trust-os
          fetch-depth: 0
      - name: Restore production bootstrap and format all restored Phase 6 controllers
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:apps/api/tests/bootstrap.ts > apps/api/tests/bootstrap.ts
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/baseline-gate-repair.yml')
          lines = path.read_text().splitlines()
          anchor = '            apps/api/app/controllers/admin/configuration_controller.ts apps/api/app/controllers/admin/payment_attempts_controller.ts \\'
          try:
              index = lines.index(anchor)
          except ValueError:
              raise SystemExit('Expected certifier formatter anchor not found')
          additions = [
              '            apps/api/app/controllers/admin/settings_branding_controller.ts apps/api/app/controllers/admin/settings_datetime_controller.ts \\',
              '            apps/api/app/controllers/admin/settings_general_controller.ts apps/api/app/controllers/admin/settings_media_controller.ts \\',
          ]
          for addition in reversed(additions):
              if addition not in lines:
                  lines.insert(index + 1, addition)
          path.write_text('\n'.join(lines) + '\n')
          PY
          git diff --check
          git config user.name "calibra-phase7-bot"
          git config user.email "calibra-phase7-bot@users.noreply.github.com"
          git add apps/api/tests/bootstrap.ts .github/workflows/baseline-gate-repair.yml
          git commit -m "ci: format all restored Phase 6 integration files"
          git push origin HEAD:agent/phase7-identity-trust-os
