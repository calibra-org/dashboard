name: Apply Ticket8 Carrier

on:
  push:
    branches:
      - agent/complete-ticket-seo-content-backends-20260814

permissions:
  contents: write

jobs:
  apply-ticket8:
    if: contains(github.event.head_commit.message, '[apply-ticket8-carrier]')
    runs-on: ubuntu-24.04
    env:
      FORCE_COLOR: 3
      TURBO_TELEMETRY_DISABLED: 1
      DO_NOT_TRACK: 1
      NODE_VERSION: 24.14.0
      PNPM_VERSION: 10.32.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Reconstruct Ticket Support OS source
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .ticket8-carrier/p-00 \
            .ticket8-carrier/p-01-02 \
            .ticket8-carrier/p-03-04 \
            .ticket8-carrier/p-05-06 \
            .ticket8-carrier/p-07-08 \
            .ticket8-carrier/p-09-10 \
            .ticket8-carrier/p-11 \
            > /tmp/ticket8-source.tar.xz.b64
          echo "161751215bebbc060144e0cc8d8b6cafbb4b82e227b8eb079cf2427a616a1303  /tmp/ticket8-source.tar.xz.b64" | sha256sum -c -
          base64 -d /tmp/ticket8-source.tar.xz.b64 > /tmp/ticket8-source.tar.xz
          echo "928631da90d2b416041e2b96326f2a915a697c350f5f3fbea420910973e6d0d5  /tmp/ticket8-source.tar.xz" | sha256sum -c -
          tar -xJf /tmp/ticket8-source.tar.xz
          rm -rf .ticket8-carrier
          rm -f .github/workflows/apply-ticket8-carrier.yml
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply canonical formatting to Ticket Support OS
        shell: bash
        run: |
          pnpm exec biome check --write \
            apps/admin/messages/tickets/en.json \
            apps/admin/messages/tickets/fa.json \
            apps/admin/src/components/Sidebar.tsx \
            apps/admin/src/features/tickets \
            'apps/admin/src/app/[locale]/(authenticated)/tickets' \
            apps/api/app/enums/support_ticket.ts \
            apps/api/app/services/legacy_mark_shipped_service.ts \
            apps/api/app/services/support/ticket_operations_service.ts \
            apps/api/database/migrations/1760001300000_expand_support_ticket_channels.ts \
            apps/api/start/routes/support_public.ts \
            apps/api/tests/functional/admin/ticket_support_os.spec.ts \
            packages/panel-kit/src/icons/icons.generated.ts \
            scripts/verify-tickets-integration.mjs
      - name: Regenerate SDK
        run: pnpm --filter @calibra/sdk run codegen
      - name: Verify Ticket Support OS invariants
        shell: bash
        run: |
          node scripts/verify-tickets-integration.mjs
          pnpm --filter @calibra/admin run test
          pnpm --filter @calibra/admin run typecheck
          pnpm --filter @calibra/api run typecheck
          git diff --check
      - name: Commit Ticket Support OS
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: expand ticket support operations"
          git push origin "HEAD:${GITHUB_REF_NAME}"
