name: Phase 08 token fix

on:
    push:
        branches:
            - "phase/08-payment-gateways"

permissions:
    contents: write

jobs:
    fix:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Replace raw status colors with Calibra semantic tokens
              shell: bash
              run: |
                  sed -i 's/border-emerald-500\/25 bg-emerald-500\/5/border-success\/40 bg-success\/10/g' apps/admin/src/views/store-config/payments/payment-gateway-detail-view.tsx
                  sed -i 's/border-amber-500\/30/border-warning\/40/g' apps/admin/src/views/store-config/payments/payment-gateway-detail-view.tsx
                  sed -i 's/border-emerald-500\/25 bg-emerald-500\/5/border-success\/40 bg-success\/10/g' apps/admin/src/views/store-config/payments/payments-view.tsx
                  sed -i 's/border-amber-500\/25 bg-amber-500\/5/border-warning\/40 bg-warning\/10/g' apps/admin/src/views/store-config/payments/payments-view.tsx
            - name: Commit semantic-token fixes
              shell: bash
              run: |
                  if git diff --quiet; then
                      echo "No fixes needed"
                      exit 0
                  fi
                  git config user.name "calibra-dev"
                  git config user.email "keshavarz20.com@gmail.com"
                  git add apps/admin/src/views/store-config/payments/payment-gateway-detail-view.tsx apps/admin/src/views/store-config/payments/payments-view.tsx
                  git commit -m "style(payments): use semantic status tokens"
                  git push
