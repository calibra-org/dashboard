name: Phase 25 Typecheck Fix Once

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'feat/phase25-growth-portfolio-20260823'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase25-growth-portfolio-20260823
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global pnpm@10.32.1
      - run: pnpm install --frozen-lockfile
      - name: Normalize Governance OS actor identifier
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/api/app/services/phase25_growth_portfolio_service.ts')
          text = path.read_text()
          old = '''                },\n            },\n            actor.id,\n        );\n        await trx\n            .from("growth_portfolio_rebalance_events")'''
          new = '''                },\n            },\n            Number(actor.id),\n        );\n        await trx\n            .from("growth_portfolio_rebalance_events")'''
          if old not in text:
              raise SystemExit('Governance actor normalization anchor missing')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Canonical format
        run: pnpm exec biome check --write apps/api/app/services/phase25_growth_portfolio_service.ts
      - name: API typecheck
        run: pnpm --filter @calibra/api run typecheck
      - name: Commit verified patch and remove one-shot workflow
        run: |
          rm .github/workflows/phase25-typecheck-fix-once.yml
          git config user.name "calibra-dev"
          git config user.email "keshavarz20.com@gmail.com"
          git add -A
          git commit -m "fix(phase25): normalize governance actor identifier"
          git push origin HEAD:feat/phase25-growth-portfolio-20260823
