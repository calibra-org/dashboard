name: Phase 6 Current Finalizer

on:
  push:
    branches:
      - agent/phase6-configuration-os

permissions:
  contents: write

concurrency:
  group: phase6-current-finalizer
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      FORCE_COLOR: 3
      TURBO_TELEMETRY_DISABLED: 1
      DO_NOT_TRACK: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase6-configuration-os
          fetch-depth: 0
      - name: Synchronize Phase 6 source onto latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git rebase origin/main; then
            echo "Phase 6 rebase conflicts:" >&2
            git diff --name-only --diff-filter=U >&2 || true
            git status --short >&2 || true
            git rebase --abort || true
            exit 1
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format repository
        run: pnpm exec biome format --write .
      - name: Regenerate composed API specs and SDK
        run: |
          pnpm --filter @calibra/api-docs run build:json
          pnpm --filter @calibra/sdk run codegen
      - name: Verify lint with complete diagnostics
        run: |
          pnpm exec biome lint . --max-diagnostics=500
          pnpm exec biome check . --max-diagnostics=500
          pnpm run lint:tokens
          pnpm run lint:ws
      - name: Verify compile and generated-contract gates
        run: |
          pnpm run typecheck
          pnpm run build
          pnpm --filter @calibra/sdk run codegen:check
      - name: Remove one-shot workflow and commit verified output
        shell: bash
        run: |
          rm .github/workflows/phase6-current-finalize.yml
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            git commit --allow-empty -m "chore(phase6): synchronize validated source with main"
          else
            git commit -m "chore(phase6): finalize current-main integration"
          fi
          git push --force-with-lease origin HEAD:agent/phase6-configuration-os
