name: Finalize PR17

on:
  push:
    branches:
      - agent/complete-ticket-seo-content-backends-20260814

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Install workspace
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile

      - name: Fix Factor accessibility verifier
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'scripts/verify-factor-integration.mjs';
          let source = fs.readFileSync(path, 'utf8');
          const oldLine = 'pass(sidebar.includes("aria-expanded={factorOpen}"), "Factor sidebar submenu is not accessible/collapsible");';
          const newBlock = `pass(\n    sidebar.includes("aria-expanded={open}") &&\n        sidebar.includes("aria-controls={id}") &&\n        sidebar.includes('"factor-sidebar-items"') &&\n        sidebar.includes("factorOpen,") &&\n        sidebar.includes("setFactorOpen,"),\n    "Factor sidebar submenu is not accessible/collapsible",\n);`;
          if (!source.includes(oldLine)) {
              throw new Error('Expected Factor verifier assertion was not found');
          }
          source = source.replace(oldLine, newBlock);
          fs.writeFileSync(path, source);
          NODE

      - name: Regenerate SDK from repository OpenAPI
        run: pnpm --filter @calibra/sdk codegen

      - name: Commit generated/finalizer fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-factor-integration.mjs packages/sdk/src/generated
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "fix(ci): sync SDK and factor verifier"
          git push origin HEAD
