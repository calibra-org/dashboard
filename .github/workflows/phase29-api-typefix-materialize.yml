name: Phase 29 API Typefix Materializer

on:
  pull_request:
    paths:
      - ".github/workflows/phase29-api-typefix-materialize.yml"

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/phase29-product-passport-20260825'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - run: npm install --global pnpm@10.32.1
      - run: pnpm install --frozen-lockfile
      - name: Apply typed query-builder fixes
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/api/app/services/product_passport/product_passport_service.ts';
          let source = fs.readFileSync(path, 'utf8');
          const batchBefore = `    if (input.batchCode) {\n        query = query.where((builder) => {\n            builder.where("receipt_line.batch_code", input.batchCode).orWhere("receipt_line.lot_code", input.batchCode);\n        });\n    }`;
          const batchAfter = `    const batchCode = input.batchCode;\n    if (batchCode) {\n        query = query.where((builder) => {\n            builder.where("receipt_line.batch_code", batchCode).orWhere("receipt_line.lot_code", batchCode);\n        });\n    }`;
          if (!source.includes(batchBefore)) throw new Error('Expected batch query marker not found');
          source = source.replace(batchBefore, batchAfter);
          const qualityBefore = `    const [product, variation, versions, evidence, edges, qualityCases] = await Promise.all([\n        trx.from("products").where("id", passport.product_id).first(),\n        passport.variation_id == null\n            ? Promise.resolve(null)\n            : trx.from("product_variations").where("id", passport.variation_id).first(),\n        trx\n            .from("product_passport_versions")\n            .where({ tenant_id: tenantId(), passport_id: passport.id })\n            .orderBy("version", "desc")\n            .limit(50),\n        trx\n            .from("product_passport_evidence")\n            .where({ tenant_id: tenantId(), passport_id: passport.id })\n            .orderBy("created_at", "desc")\n            .limit(200),\n        trx\n            .from("product_passport_edges")\n            .where({ tenant_id: tenantId(), passport_id: passport.id })\n            .orderBy("created_at", "desc")\n            .limit(200),\n        trx\n            .from("quality_cases")\n            .where({ tenant_id: tenantId(), product_id: passport.product_id })\n            .modify((query) => {\n                if (passport.variation_id != null) query.where("variation_id", passport.variation_id);\n            })\n            .orderBy("updated_at", "desc")\n            .limit(50),\n    ]);`;
          const qualityAfter = `    let qualityCasesQuery = trx.from("quality_cases").where({ tenant_id: tenantId(), product_id: passport.product_id });\n    if (passport.variation_id != null) qualityCasesQuery = qualityCasesQuery.where("variation_id", passport.variation_id);\n    const [product, variation, versions, evidence, edges, qualityCases] = await Promise.all([\n        trx.from("products").where("id", passport.product_id).first(),\n        passport.variation_id == null\n            ? Promise.resolve(null)\n            : trx.from("product_variations").where("id", passport.variation_id).first(),\n        trx\n            .from("product_passport_versions")\n            .where({ tenant_id: tenantId(), passport_id: passport.id })\n            .orderBy("version", "desc")\n            .limit(50),\n        trx\n            .from("product_passport_evidence")\n            .where({ tenant_id: tenantId(), passport_id: passport.id })\n            .orderBy("created_at", "desc")\n            .limit(200),\n        trx\n            .from("product_passport_edges")\n            .where({ tenant_id: tenantId(), passport_id: passport.id })\n            .orderBy("created_at", "desc")\n            .limit(200),\n        qualityCasesQuery.orderBy("updated_at", "desc").limit(50),\n    ]);`;
          if (!source.includes(qualityBefore)) throw new Error('Expected quality query marker not found');
          source = source.replace(qualityBefore, qualityAfter);
          fs.writeFileSync(path, source);
          NODE
      - name: Format fixed service
        run: pnpm exec biome check --write apps/api/app/services/product_passport/product_passport_service.ts
      - name: Commit fixes and remove materializer
        run: |
          git rm .github/workflows/phase29-api-typefix-materialize.yml
          git add apps/api/app/services/product_passport/product_passport_service.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(api): type Phase 29 provenance queries"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
