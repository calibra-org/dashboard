name: Repair Release Baseline

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase18-pricing-promotion-main-20260818
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - run: npm install --global pnpm@10.32.1
      - run: pnpm install --frozen-lockfile
      - name: Repair release baseline sources
        run: node scripts/repair-release-baseline.mjs
      - name: Apply canonical formatting
        run: pnpm run format:fix
      - name: Apply safe Biome fixes
        run: |
          pnpm exec biome lint . --write --diagnostic-level=error --max-diagnostics=100 || true
          pnpm exec biome check . --write --diagnostic-level=error --max-diagnostics=100 || true
          pnpm run format:fix
      - name: Regenerate OpenAPI-derived SDK declarations
        run: pnpm --filter @calibra/sdk run codegen
      - name: Format generated output
        run: pnpm run format:fix
      - name: Remove one-shot finalizer files
        run: rm .github/workflows/repair-release-baseline.yml scripts/repair-release-baseline.mjs
      - name: Apply final safe Biome fixes
        run: |
          pnpm exec biome lint . --write --diagnostic-level=error --max-diagnostics=100 || true
          pnpm exec biome check . --write --diagnostic-level=error --max-diagnostics=100 || true
          pnpm run format:fix
      - name: Validate release tree before committing
        run: |
          pnpm exec biome lint . --diagnostic-level=error --max-diagnostics=100
          pnpm exec biome check . --diagnostic-level=error --max-diagnostics=100
          pnpm run lint:tokens
          pnpm run lint:ws
          pnpm run format
          git diff --check
      - name: Commit generated repair
        run: |
          git config user.name "calibra-ci"
          git config user.email "calibra-ci@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "fix(ci): close release baseline debt"
            git push origin HEAD:agent/phase18-pricing-promotion-main-20260818
          else
            echo "No repair changes to commit."
          fi
