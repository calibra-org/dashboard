name: Phase 18 Diagnostics

on:
  pull_request:
    paths:
      - "apps/api/app/controllers/admin/pricing_brain_controller.ts"
      - "apps/api/app/services/order_factory.ts"
      - "apps/api/app/services/pricing_brain_service.ts"
      - "apps/api/app/services/pricing_decision_engine.ts"
      - "apps/api/app/services/pricing_permissions.ts"
      - "apps/api/app/services/pricing_policy_service.ts"
      - "apps/api/app/validators/admin/pricing_brain_validator.ts"
      - "apps/api/database/migrations/1767800000000_create_phase18_pricing_policy_runtime.ts"
      - "apps/api/start/routes/admin_pricing_brain.ts"
      - "apps/api/tests/functional/pricing/phase18_pricing_governance.spec.ts"
      - "apps/api/tests/unit/pricing/pricing_decision_engine.spec.ts"
      - "apps/admin/src/features/pricing-brain/**"
      - "apps/admin/src/app/**/pricing-brain/**"
      - "docs/api/reference/openapi/admin.phase18.v1.yaml"
      - ".github/workflows/phase18-diagnostics.yml"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
      - run: npm install --global pnpm@10.32.1
      - run: pnpm install --frozen-lockfile

      - name: Build merged OpenAPI fixture
        run: pnpm --filter @calibra/api-docs run build:test-spec

      - name: Capture exact OpenAPI 3 validator errors
        shell: bash
        run: |
          validator=$(find node_modules/.pnpm -path '*/node_modules/openapi-schema-validator/dist/index.js' | head -n 1)
          if [ -z "$validator" ]; then
            echo '{"error":"openapi-schema-validator dist entry not found"}' > phase18-openapi-errors.json
          else
            VALIDATOR_PATH="$validator" node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const validatorPath = path.resolve(process.env.VALIDATOR_PATH)
          const loaded = require(validatorPath)
          const OpenAPISchemaValidator = loaded.default ?? loaded
          const spec = JSON.parse(fs.readFileSync('docs/api/dist/_merged.test.json', 'utf8'))
          const result = new OpenAPISchemaValidator({ version: 3 }).validate(spec)
          fs.writeFileSync('phase18-openapi-errors.json', JSON.stringify(result, null, 2) + '\n')
          console.log(JSON.stringify(result, null, 2))
          NODE
          fi

      - name: Regenerate SDK from official OpenAPI pipeline
        run: pnpm --filter @calibra/sdk run codegen

      - name: Format Phase 18 sources only
        run: >-
          pnpm exec biome format --write
          apps/admin/src/features/pricing-brain/actions.ts
          apps/admin/src/features/pricing-brain/pricing-brain-dashboard.tsx
          apps/admin/src/features/pricing-brain/pricing-governance.tsx
          apps/admin/src/features/pricing-brain/types.ts
          apps/api/app/services/pricing_brain_service.ts
          apps/api/app/services/pricing_decision_engine.ts
          apps/api/app/services/pricing_policy_service.ts
          apps/api/start/routes/admin_pricing_brain.ts
          apps/api/tests/functional/pricing/phase18_pricing_governance.spec.ts

      - name: Capture generated and formatted diff
        shell: bash
        run: |
          git diff -- packages/sdk/src/generated/admin.d.ts > phase18-sdk.patch || true
          git diff -- \
            apps/admin/src/features/pricing-brain/actions.ts \
            apps/admin/src/features/pricing-brain/pricing-brain-dashboard.tsx \
            apps/admin/src/features/pricing-brain/pricing-governance.tsx \
            apps/admin/src/features/pricing-brain/types.ts \
            apps/api/app/services/pricing_brain_service.ts \
            apps/api/app/services/pricing_decision_engine.ts \
            apps/api/app/services/pricing_policy_service.ts \
            apps/api/start/routes/admin_pricing_brain.ts \
            apps/api/tests/functional/pricing/phase18_pricing_governance.spec.ts \
            > phase18-format.patch || true

      - uses: actions/upload-artifact@v4
        with:
          name: phase18-diagnostic-output
          if-no-files-found: error
          retention-days: 1
          path: |
            phase18-openapi-errors.json
            phase18-sdk.patch
            phase18-format.patch
            docs/api/dist/_merged.test.json
            packages/sdk/src/generated/admin.d.ts
            apps/admin/src/features/pricing-brain/actions.ts
            apps/admin/src/features/pricing-brain/pricing-brain-dashboard.tsx
            apps/admin/src/features/pricing-brain/pricing-governance.tsx
            apps/admin/src/features/pricing-brain/types.ts
            apps/api/app/services/pricing_brain_service.ts
            apps/api/app/services/pricing_decision_engine.ts
            apps/api/app/services/pricing_policy_service.ts
            apps/api/start/routes/admin_pricing_brain.ts
            apps/api/tests/functional/pricing/phase18_pricing_governance.spec.ts
