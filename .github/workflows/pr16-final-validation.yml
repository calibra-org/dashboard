name: PR16 Final Validation
on:
  push:
    branches: ["agent/runtime-hardening-20260814"]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: calibra
          POSTGRES_PASSWORD: calibra
          POSTGRES_DB: calibra
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U calibra -d calibra"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NODE_ENV: test
      PORT: "3334"
      HOST: 0.0.0.0
      APP_NAME: calibra-api
      APP_KEY: ci-only-key-not-used-for-real-secrets
      LOG_LEVEL: warn
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: calibra
      DB_PASSWORD: calibra
      DB_DATABASE: calibra_test
      MAIL_FROM_ADDRESS: ops@calibra.local
      MAIL_FROM_NAME: Calibra
      MAIL_NOTIFICATIONS_ENABLED: "false"
      SMTP_HOST: localhost
      SMTP_PORT: "11025"
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      TRANSMIT_TRANSPORT: none
      QUEUE_DRIVER: sync
      LIMITER_STORE: memory
      CACHE_DRIVER: memory
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and validate merged OpenAPI fixture
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @calibra/api-docs run build:test-spec
          pkg=$(find node_modules/.pnpm -type d -path '*/node_modules/api-schema-builder' | head -1)
          PKG="$pkg" node <<'NODE'
          const path = require('node:path');
          const builder = require(path.resolve(process.env.PKG));
          builder.buildSchemaSync(path.resolve('docs/api/dist/_merged.test.json'));
          console.log('api-schema-builder: VALID');
          NODE
      - name: Static release gates
        run: |
          pnpm run verify:phase1-4
          pnpm run verify:phase5
          pnpm run typecheck
          pnpm run build
      - name: Create test database
        env:
          PGPASSWORD: calibra
        run: psql -h localhost -U calibra -d calibra -c "CREATE DATABASE calibra_test OWNER calibra;"
      - name: Run PR16 functional regression specs
        working-directory: apps/api
        run: pnpm test --files=tests/functional/admin/phase5_operations.spec.ts --files=tests/functional/admin/phase5_operations_hardening.spec.ts --files=tests/functional/payments/payment_callback_failures.spec.ts
      - name: Remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name calibra-dev
          git config user.email keshavarz20.com@gmail.com
          git rm .github/workflows/pr16-final-validation.yml
          git commit -m 'chore(ci): remove temporary PR16 validation workflow'
          git push origin HEAD:agent/runtime-hardening-20260814
