name: Check

on:
  pull_request:
    branches: ["**"]

permissions:
  contents: write

jobs:
  phase12-fix:
    if: github.head_ref == 'agent/phase12-runner-20260818'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/phase12-profitability-cash-os
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - run: npm install --global pnpm@10.32.1
      - run: pnpm install --frozen-lockfile
      - name: Regenerate exact Phase 12 Admin SDK
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'calibra-dev'
          git config user.email 'keshavarz20.com@gmail.com'
          pnpm --filter @calibra/api-docs run build:json:admin
          pnpm --filter @calibra/sdk run codegen:admin
          git diff --check
          git add packages/sdk/src/generated/admin.d.ts
          if ! git diff --cached --quiet; then
            git commit -m 'fix(sdk): sync Phase 12 Admin contract'
            git push origin HEAD:agent/phase12-profitability-cash-os
          fi
