name: Check

on:
  pull_request:
    branches: ["**"]

permissions:
  contents: write

jobs:
  phase12-tenant-lock-fix:
    if: github.head_ref == 'agent/phase12-runner-20260818'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/phase12-profitability-cash-os
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - run: npm install --global pnpm@10.32.1
      - run: pnpm install --frozen-lockfile
      - name: Use persisted tenant for explicit transaction economics capture
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'calibra-dev'
          git config user.email 'keshavarz20.com@gmail.com'
          python3 <<'PY'
          from pathlib import Path
          p = Path('apps/api/app/services/economics_service.ts')
          s = p.read_text()
          old_sig = '''async function resolveLineCost(\n    trx: TransactionClientContract,\n    line: Record<string, any>,\n    currency: string,\n    effectiveAt: string,\n    method: InventoryCostMethod,\n) {'''
          new_sig = '''async function resolveLineCost(\n    trx: TransactionClientContract,\n    line: Record<string, any>,\n    currency: string,\n    effectiveAt: string,\n    method: InventoryCostMethod,\n    tenantId: number,\n) {'''
          if old_sig not in s:
              raise SystemExit('resolveLineCost signature not found')
          s = s.replace(old_sig, new_sig, 1)
          old_lock = 'await trx.rawQuery("SELECT pg_advisory_xact_lock(?, ?)", [Number(currentTenantId()) % 2147483647, lockKey]);'
          new_lock = 'await trx.rawQuery("SELECT pg_advisory_xact_lock(?, ?)", [tenantId % 2147483647, lockKey]);'
          if old_lock not in s:
              raise SystemExit('resolveLineCost advisory lock not found')
          s = s.replace(old_lock, new_lock, 1)
          old_call = 'const resolved = await resolveLineCost(trx, line, currency, String(effectiveAt), method);'
          new_call = 'const resolved = await resolveLineCost(trx, line, currency, String(effectiveAt), method, Number(order.tenant_id));'
          if old_call not in s:
              raise SystemExit('resolveLineCost call not found')
          s = s.replace(old_call, new_call, 1)
          p.write_text(s)
          PY
          pnpm exec biome format --write apps/api/app/services/economics_service.ts
          pnpm --filter @calibra/api run typecheck
          cd apps/api
          pnpm test --files=tests/unit/orders/order_state_machine.spec.ts --files=tests/functional/refunds/admin_create_partial_refund.spec.ts
          cd ../..
          git diff --check
          git add apps/api/app/services/economics_service.ts
          if ! git diff --cached --quiet; then
            git commit -m 'fix(economics): preserve tenant scope with explicit transactions'
            git push origin HEAD:agent/phase12-profitability-cash-os
          fi
