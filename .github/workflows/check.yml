name: Check

on:
  pull_request:
    branches: ["**"]

jobs:
  phase12-lint-diagnose:
    if: github.head_ref == 'agent/phase12-runner-20260818'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/phase12-profitability-cash-os
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - run: npm install --global pnpm@10.32.1
      - run: pnpm install --frozen-lockfile
      - name: Check Phase 12 changed files only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          mapfile -d '' files < <(git diff --name-only origin/main...HEAD -z)
          pnpm exec biome check --max-diagnostics=200 "${files[@]}"
