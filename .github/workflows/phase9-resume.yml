name: Phase 9 Resume

on:
    push:
        branches: ["agent/phase9-personalization-deals-20260816"]

permissions:
    contents: write

env:
    GH_TOKEN: ${{ github.token }}

jobs:
    resume:
        if: contains(github.event.head_commit.message, '[phase9-resume]')
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v4
            - name: Extract exact Phase 9 admin UI context
              shell: bash
              run: |
                  set -euo pipefail
                  cat .phase9-payload/part-00 .phase9-payload/part-01 .phase9-payload/part-02 .phase9-payload/part-03 > /tmp/phase9.b64
                  echo "13e9ffcbcbeb7c72f7f68c5f2482acf910c5acd3bbb28e220fa92aed9d4347dc  /tmp/phase9.b64" | sha256sum -c -
                  base64 -d /tmp/phase9.b64 > /tmp/phase9.tgz
                  echo "f38cffa6fbb1eab253e7879389ae423810adc2316bc4bd636d51e54e4cc6d956  /tmp/phase9.tgz" | sha256sum -c -
                  tar -xzf /tmp/phase9.tgz -C .
                  node .phase9-finalize/apply-phase9.mjs
                  {
                    echo '=== workspace imports and header ==='
                    nl -ba apps/admin/src/views/personalization/personalization-workspace.tsx | sed -n '1,110p'
                    echo
                    echo '=== workspace product picker ==='
                    nl -ba apps/admin/src/views/personalization/personalization-workspace.tsx | sed -n '250,315p'
                    echo
                    echo '=== workspace select context ==='
                    nl -ba apps/admin/src/views/personalization/personalization-workspace.tsx | sed -n '455,505p'
                  } > /tmp/snippets
                  encoded=$(base64 -w0 /tmp/snippets)
                  old=$(gh api "repos/${GITHUB_REPOSITORY}/contents/phase9-source-snippets.txt?ref=${GITHUB_REF_NAME}" --jq .sha 2>/dev/null || true)
                  args=(--method PUT "repos/${GITHUB_REPOSITORY}/contents/phase9-source-snippets.txt" -f message="chore(ci): capture Phase 9 admin UI context" -f content="$encoded" -f branch="${GITHUB_REF_NAME}")
                  if [ -n "$old" ]; then args+=(-f sha="$old"); fi
                  gh api "${args[@]}"
