name: Phase 9 Resume

on:
    push:
        branches: ["agent/phase9-personalization-deals-20260816"]

permissions:
    contents: write

env:
    NODE_VERSION: "24.14.0"
    PNPM_VERSION: "10.32.1"
    TURBO_TELEMETRY_DISABLED: 1
    DO_NOT_TRACK: 1
    GH_TOKEN: ${{ github.token }}

jobs:
    resume:
        if: contains(github.event.head_commit.message, '[phase9-resume]')
        runs-on: ubuntu-latest
        timeout-minutes: 30
        services:
            postgres:
                image: postgres:17-alpine
                env:
                    POSTGRES_USER: calibra
                    POSTGRES_PASSWORD: calibra
                    POSTGRES_DB: calibra
                ports: ["5432:5432"]
                options: >-
                    --health-cmd "pg_isready -U calibra -d calibra"
                    --health-interval 5s --health-timeout 5s --health-retries 10
            redis:
                image: redis:7-alpine
                ports: ["6379:6379"]
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 5s --health-timeout 3s --health-retries 10
        steps:
            - uses: actions/checkout@v4
              with: { fetch-depth: 0 }
            - uses: pnpm/action-setup@v4
              with: { version: "10.32.1" }
            - uses: actions/setup-node@v4
              with:
                  node-version: "24.14.0"
                  cache: pnpm

            - name: Expand verified payload and apply compatibility fixes
              shell: bash
              run: |
                  set -euo pipefail
                  cat .phase9-payload/part-00 .phase9-payload/part-01 .phase9-payload/part-02 .phase9-payload/part-03 > /tmp/phase9.b64
                  test "$(wc -c < /tmp/phase9.b64)" = "37180"
                  echo "13e9ffcbcbeb7c72f7f68c5f2482acf910c5acd3bbb28e220fa92aed9d4347dc  /tmp/phase9.b64" | sha256sum -c -
                  base64 -d /tmp/phase9.b64 > /tmp/phase9.tgz
                  test "$(wc -c < /tmp/phase9.tgz)" = "27884"
                  echo "f38cffa6fbb1eab253e7879389ae423810adc2316bc4bd636d51e54e4cc6d956  /tmp/phase9.tgz" | sha256sum -c -
                  tar -xzf /tmp/phase9.tgz -C .
                  node .phase9-finalize/apply-phase9.mjs
                  sed -i 's/\["resolvePrice","controlled_random"/\["ProductTransformer","controlled_random"/' scripts/verify-phase9.mjs
                  python3 - <<'PY'
                  from pathlib import Path
                  import json

                  def replace_once(text, old, new, label):
                      if old not in text:
                          raise SystemExit(f"{label} anchor missing")
                      return text.replace(old, new, 1)

                  web = Path("apps/web/src/components/amazing-deals-section.tsx")
                  s = web.read_text()
                  for old, new, label in [
                      ('import { formatMoney } from "#/lib/format";', 'import { formatPrice, getMoneyFormatConfig } from "#/lib/money";', 'storefront money import'),
                      ('const locale=await getLocale(); const api=await apiServer();', 'const locale=await getLocale(); const moneyConfig=await getMoneyFormatConfig(); const api=await apiServer();', 'storefront money config'),
                      ('formatMoney(p.effective_price,locale as "fa"|"en")', 'formatPrice(p.effective_price,moneyConfig,locale)', 'effective price format'),
                      ('formatMoney(p.regular_price,locale as "fa"|"en")', 'formatPrice(p.regular_price,moneyConfig,locale)', 'regular price format'),
                  ]:
                      s = replace_once(s, old, new, label)
                  web.write_text(s)

                  controller = Path("apps/api/app/controllers/admin/personalization_controller.ts")
                  s = controller.read_text()
                  s = replace_once(s, 'this.service.createCampaign(ctx.request.body(), actorId(ctx))', 'this.service.createCampaign(ctx.request.body() as Parameters<Phase9PersonalizationService["createCampaign"]>[0], actorId(ctx))', 'create campaign type')
                  s = replace_once(s, 'this.service.updateCampaign(id, ctx.request.body())', 'this.service.updateCampaign(id, ctx.request.body() as Parameters<Phase9PersonalizationService["updateCampaign"]>[1])', 'update campaign type')
                  controller.write_text(s)

                  service = Path("apps/api/app/services/phase9_personalization_service.ts")
                  s = service.read_text()
                  s = replace_once(s, '.where("campaign_id", campaign.id).orderBy("position", "asc")', '.where("campaign_id", Number(campaign.id)).orderBy("position", "asc")', 'campaign id query')
                  service.write_text(s)

                  workspace = Path("apps/admin/src/views/personalization/personalization-workspace.tsx")
                  s = workspace.read_text()
                  s = replace_once(s, 'FlaskConical, Home,', 'LayoutDashboard,', 'icon imports')
                  s = s.replace('<FlaskConical ', '<Sparkles ')
                  s = s.replace('<Home ', '<LayoutDashboard ')
                  s = replace_once(s, 'from "#/lib/queries/products";', 'from "#/lib/products/queries";', 'products query import')
                  s = replace_once(s, 'return <HelperTooltip content={text}/>;', 'return <HelperTooltip>{text}</HelperTooltip>;', 'helper tooltip')
                  if 'onValueChange={setPlacement}' in s:
                      s = s.replace('onValueChange={setPlacement}', 'onValueChange={value=>setPlacement(String(value))}', 1)
                  workspace.write_text(s)

                  docs_pkg = Path("docs/api/package.json")
                  pkg = json.loads(docs_pkg.read_text())
                  scripts = pkg["scripts"]
                  scripts["build:json:admin-phase6"] = "redocly bundle reference/openapi/admin.phase6.v1.yaml -o dist/admin.phase6.v1.json --ext json"
                  parts = scripts["build:json:admin"].split(" && ")
                  cmd = "pnpm build:json:admin-phase6"
                  if cmd not in parts:
                      anchor = parts.index("pnpm build:json:admin-phase5")
                      parts.insert(anchor + 1, cmd)
                  scripts["build:json:admin"] = " && ".join(parts)
                  docs_pkg.write_text(json.dumps(pkg, ensure_ascii=False, indent=4) + "\n")

                  merge = Path("docs/api/scripts/merge-admin-spec.js")
                  s = merge.read_text()
                  if 'dist/admin.phase6.v1.json' not in s:
                      s = replace_once(s, 'const phase5 = JSON.parse(readFileSync(resolve(root, "dist/admin.phase5.v1.json"), "utf8"));', 'const phase5 = JSON.parse(readFileSync(resolve(root, "dist/admin.phase5.v1.json"), "utf8"));\nconst phase6 = JSON.parse(readFileSync(resolve(root, "dist/admin.phase6.v1.json"), "utf8"));', 'phase6 read')
                  if '[phase6, "Phase6Overlay"],' not in s:
                      s = replace_once(s, '[phase5, "Phase5Overlay"],', '[phase5, "Phase5Overlay"],\n    [phase6, "Phase6Overlay"],', 'phase6 overlay')
                  merge.write_text(s)
                  PY

            - name: Install dependencies
              shell: bash
              run: |
                  set -o pipefail
                  echo install > /tmp/phase9-stage
                  pnpm install --frozen-lockfile 2>&1 | tee /tmp/phase9-last.log

            - name: Format changed files
              shell: bash
              run: |
                  set -euo pipefail
                  {
                    git diff --name-only --diff-filter=ACM
                    git ls-files --others --exclude-standard
                  } | sort -u | grep -vE '^\.phase9-|^\.github/workflows/phase9-(finalize|resume)\.yml$|^phase9-(diagnostic|source-snippets)\.txt$' | grep -E '\.(ts|tsx|js|mjs|json)$' > /tmp/phase9-format.txt || true
                  if [ -s /tmp/phase9-format.txt ]; then xargs -d '\n' pnpm exec biome format --write < /tmp/phase9-format.txt; fi

            - name: Codegen
              shell: bash
              run: |
                  set -o pipefail
                  echo codegen > /tmp/phase9-stage
                  pnpm --filter @calibra/sdk run codegen 2>&1 | tee /tmp/phase9-last.log

            - name: Typecheck
              shell: bash
              run: |
                  set -o pipefail
                  echo typecheck > /tmp/phase9-stage
                  pnpm run typecheck 2>&1 | tee /tmp/phase9-last.log

            - name: Create test database
              env: { PGPASSWORD: calibra }
              run: psql -h localhost -U calibra -d calibra -c "CREATE DATABASE calibra_test OWNER calibra;" || true

            - name: Functional test
              shell: bash
              run: |
                  set -o pipefail
                  echo functional > /tmp/phase9-stage
                  (cd apps/api && pnpm test --files=tests/functional/admin/phase9_personalization.spec.ts) 2>&1 | tee /tmp/phase9-last.log

            - name: OpenAPI runtime sync
              shell: bash
              working-directory: apps/api
              env:
                  NODE_ENV: test
                  PORT: "3334"
                  HOST: "0.0.0.0"
                  APP_NAME: calibra-api
                  APP_KEY: ci-only-key-not-used-for-real-secrets
                  LOG_LEVEL: warn
                  DB_HOST: localhost
                  DB_PORT: "5432"
                  DB_USER: calibra
                  DB_PASSWORD: calibra
                  DB_DATABASE: calibra
                  MAIL_FROM_ADDRESS: ops@calibra.local
                  MAIL_FROM_NAME: Calibra
                  MAIL_NOTIFICATIONS_ENABLED: "false"
                  SMTP_HOST: localhost
                  SMTP_PORT: "11025"
                  REDIS_HOST: localhost
                  REDIS_PORT: "6379"
                  TRANSMIT_TRANSPORT: none
                  QUEUE_DRIVER: sync
                  LIMITER_STORE: memory
                  CACHE_DRIVER: memory
              run: |
                  set -o pipefail
                  echo openapi > /tmp/phase9-stage
                  node ace check:api-docs 2>&1 | tee /tmp/phase9-last.log

            - name: Build
              shell: bash
              run: |
                  set -o pipefail
                  echo build > /tmp/phase9-stage
                  pnpm run build 2>&1 | tee /tmp/phase9-last.log

            - name: Persist diagnostic
              if: failure()
              shell: bash
              run: |
                  set -euo pipefail
                  stage=$(cat /tmp/phase9-stage 2>/dev/null || echo preflight)
                  { echo "stage=$stage"; echo "run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"; echo; cat /tmp/phase9-last.log 2>/dev/null || true; } > /tmp/diag
                  encoded=$(base64 -w0 /tmp/diag)
                  old=$(gh api "repos/${GITHUB_REPOSITORY}/contents/phase9-diagnostic.txt?ref=${GITHUB_REF_NAME}" --jq .sha 2>/dev/null || true)
                  args=(--method PUT "repos/${GITHUB_REPOSITORY}/contents/phase9-diagnostic.txt" -f message="chore(ci): capture Phase 9 diagnostic" -f content="$encoded" -f branch="${GITHUB_REF_NAME}")
                  if [ -n "$old" ]; then args+=(-f sha="$old"); fi
                  gh api "${args[@]}"

            - name: Publish one clean commit
              shell: bash
              run: |
                  set -euo pipefail
                  rm -rf .phase9-payload .phase9-finalize .github/workflows/phase9-finalize.yml .github/workflows/phase9-resume.yml phase9-diagnostic.txt phase9-source-snippets.txt
                  git fetch origin main
                  git reset --soft origin/main
                  git add -A
                  if git diff --cached --name-only | grep -Eq '^\.phase9-|^\.github/workflows/phase9-(finalize|resume)\.yml$|^phase9-(diagnostic|source-snippets)\.txt$'; then echo "temporary artifact leaked"; exit 1; fi
                  git config user.name "calibra-dev"
                  git config user.email "keshavarz20.com@gmail.com"
                  git commit -m "feat(personalization): implement Phase 9 deals and recommendations"
                  git push --force-with-lease origin HEAD:agent/phase9-personalization-deals-20260816
