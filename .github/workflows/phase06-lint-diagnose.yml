name: Phase 06 Lint Diagnose

on:
  push:
    branches:
      - phase/06-coupons

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/06-coupons
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Biome check Phase 06 files
        run: >-
          pnpm exec biome check --max-diagnostics=200
          apps/api/app/contracts/discounter.ts
          apps/api/app/controllers/admin/coupons_controller.ts
          apps/api/app/controllers/cart/coupons_controller.ts
          apps/api/app/services/cart_totals_service.ts
          apps/api/app/services/cart_view_builder.ts
          apps/api/app/services/coupon_test_runner.ts
          apps/api/app/services/discounter_service.ts
          apps/api/app/services/order_factory.ts
          apps/api/app/services/order_finalizer.ts
          apps/api/app/validators/coupons/apply_validator.ts
          apps/api/app/validators/coupons/coupon_validator.ts
          apps/api/database/seed_modules/0006_coupons_demo_seeder.ts
          apps/api/database/seeders/main_seeder.ts
          apps/api/tests/functional/coupons/admin_coupons_crud.spec.ts
          apps/api/tests/functional/coupons/admin_coupons_extra.spec.ts
          apps/api/tests/functional/coupons/cart_apply.spec.ts
          apps/api/tests/functional/coupons/cart_remove.spec.ts
          apps/api/tests/functional/coupons/checkout_redemption.spec.ts
          apps/api/tests/functional/coupons/usage_limit_global.spec.ts
          apps/api/tests/functional/coupons/usage_limit_per_user.spec.ts
          apps/api/tests/unit/cart/cart_totals.spec.ts
          apps/api/tests/unit/coupons/coupon_eligibility.spec.ts
          apps/api/tests/unit/coupons/discounter.spec.ts
