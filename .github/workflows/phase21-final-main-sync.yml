name: Phase 21 Final Main Sync

on:
  pull_request:
    paths:
      - .github/workflows/phase21-final-main-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Phase 21 branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase21-agentic-commerce-gateway
          fetch-depth: 0
      - name: Merge latest main and self-clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          rm -f .github/workflows/phase21-final-main-sync.yml
          git add -A
          git commit --amend --no-edit
          git push origin HEAD:agent/phase21-agentic-commerce-gateway
