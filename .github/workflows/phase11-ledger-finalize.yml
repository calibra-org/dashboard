name: Phase 11 Ledger Finalize

on:
  push:
    branches:
      - agent/phase11-governance-os-rebase

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase11-governance-os-rebase
          fetch-depth: 0
      - name: Apply final Phase 11 patch
        run: python3 .github/scripts/phase11_finalize.py
      - name: Validate patch
        run: git diff --check
      - name: Commit final Phase 11 fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(governance): canonicalize persisted ledger hash material"
          git push origin HEAD:agent/phase11-governance-os-rebase
