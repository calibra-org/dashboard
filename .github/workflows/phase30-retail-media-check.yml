name: Phase 30 Retail Media Integrity

on:
  pull_request:
    paths:
      - "apps/api/database/migrations/1801000000000_create_retail_media_creator_os.ts"
      - "apps/api/app/services/retail_media/**"
      - "apps/api/app/controllers/admin/retail_media_controller.ts"
      - "apps/api/app/controllers/retail_media_storefront_controller.ts"
      - "apps/api/app/validators/retail_media/**"
      - "apps/api/start/routes/admin_retail_media.ts"
      - "apps/api/start/routes/retail_media_storefront.ts"
      - "apps/api/start/routes.ts"
      - "apps/api/start/events.ts"
      - "apps/api/app/services/order_factory.ts"
      - "apps/api/tests/unit/phase30_retail_media.spec.ts"
      - "apps/admin/src/features/retail-media/**"
      - "apps/admin/src/lib/queries/retail-media.ts"
      - "apps/admin/src/app/**/analytics/retail-media/**"
      - "apps/admin/src/components/Sidebar.tsx"
      - "docs/api/reference/openapi/admin.phase30.v1.yaml"
      - "docs/api/reference/openapi/storefront.phase30.v1.yaml"
      - "docs/api/package.json"
      - "docs/api/scripts/merge-admin-spec.js"
      - "docs/api/scripts/merge-storefront-spec.js"
      - "docs/calibra/phase30-retail-media-conformance-posture.md"
      - "packages/sdk/src/generated/admin.d.ts"
      - "packages/sdk/src/generated/storefront.d.ts"
      - "scripts/phase30-materialize.mjs"
      - "scripts/verify-phase30-retail-media.mjs"
      - ".github/workflows/phase30-retail-media-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase30-retail-media-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: calibra
          POSTGRES_PASSWORD: calibra
          POSTGRES_DB: calibra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U calibra -d calibra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - run: npm install --global pnpm@10.32.1
      - run: pnpm install --frozen-lockfile
      - name: Create test database
        env:
          PGPASSWORD: calibra
        run: psql -h localhost -U calibra -d calibra -c "CREATE DATABASE calibra_test OWNER calibra;"

      - name: Verify Phase 30 integration is fully materialized
        run: |
          node scripts/phase30-materialize.mjs
          git diff --exit-code

      - name: Phase 30 format integrity
        run: >-
          pnpm exec biome check
          apps/api/database/migrations/1801000000000_create_retail_media_creator_os.ts
          apps/api/app/services/retail_media
          apps/api/app/controllers/admin/retail_media_controller.ts
          apps/api/app/controllers/retail_media_storefront_controller.ts
          apps/api/app/validators/retail_media
          apps/api/start/routes/admin_retail_media.ts
          apps/api/start/routes/retail_media_storefront.ts
          apps/api/start/routes.ts
          apps/api/start/events.ts
          apps/api/app/services/order_factory.ts
          apps/api/tests/unit/phase30_retail_media.spec.ts
          apps/admin/src/features/retail-media/RetailMediaWorkspace.tsx
          apps/admin/src/lib/queries/retail-media.ts
          "apps/admin/src/app/[locale]/(authenticated)/analytics/retail-media/page.tsx"
          apps/admin/src/components/Sidebar.tsx
          docs/api/package.json
          docs/api/scripts/merge-admin-spec.js
          docs/api/scripts/merge-storefront-spec.js
          scripts/phase30-materialize.mjs
          scripts/verify-phase30-retail-media.mjs

      - name: Build Phase 30 OpenAPI overlays
        run: |
          pnpm --filter @calibra/api-docs run build:json:admin-phase30
          pnpm --filter @calibra/api-docs run build:json:storefront-phase30
      - name: Phase 30 static contract
        run: node scripts/verify-phase30-retail-media.mjs
      - name: Phase 30 trust and money unit controls
        working-directory: apps/api
        run: pnpm test --force-exit --suite=unit --files='phase30_retail_media'
      - name: API typecheck
        run: pnpm --filter @calibra/api run typecheck
      - name: OpenAPI and SDK drift check
        run: pnpm --filter @calibra/sdk run codegen:check
      - name: Build SDK dependency
        run: pnpm --filter @calibra/sdk run build
      - name: Admin typecheck
        run: pnpm --filter @calibra/admin run typecheck
      - name: Admin production build
        run: pnpm --filter @calibra/admin run build
      - name: Storefront typecheck
        run: pnpm --filter @calibra/web run typecheck
      - name: Storefront production build
        run: pnpm --filter @calibra/web run build
      - name: Final exact-head drift check
        run: git diff --exit-code
