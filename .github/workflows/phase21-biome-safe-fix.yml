name: Phase 21 Biome Safe Fix

on:
  pull_request:
    paths:
      - .github/workflows/phase21-biome-safe-fix.yml
  push:
    branches:
      - agent/phase21-agentic-commerce-gateway
    paths:
      - .github/workflows/phase21-biome-safe-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    env:
      NODE_VERSION: 24.14.0
      PNPM_VERSION: 10.32.1
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase21-agentic-commerce-gateway
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pnpm
        run: npm install --global pnpm@${PNPM_VERSION}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply only remaining safe import assists
        run: |
          pnpm exec biome check --write \
            apps/api/app/services/agentic_gateway/gateway_service.ts \
            apps/api/app/services/agentic_gateway/product_graph_service.ts \
            apps/api/tests/functional/agentic_gateway/phase21_agentic_gateway.spec.ts
          pnpm exec biome check --diagnostic-level=error \
            apps/api/app/services/agentic_gateway/gateway_service.ts \
            apps/api/app/services/agentic_gateway/product_graph_service.ts \
            apps/api/tests/functional/agentic_gateway/phase21_agentic_gateway.spec.ts
      - name: Self-clean and publish
        run: |
          rm -f .github/workflows/phase21-biome-safe-fix.yml
          rm -f docs/calibra/phase21-biome-errors.log
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(phase21): apply remaining Biome import assists"
          git push origin HEAD:agent/phase21-agentic-commerce-gateway
