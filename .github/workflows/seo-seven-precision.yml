name: SEO seven-engine precision

on:
  push:
    branches:
      - agent/seo-seven-real-engines-20260811

permissions:
  contents: write

jobs:
  precision:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/seo-seven-real-engines-20260811
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python3 .github/scripts/seo-seven-precision.py
      - run: python3 .github/scripts/seo-seven-precision-fix.py
      - run: pnpm exec biome format apps/api/app/services/seo/search_engines.ts apps/api/app/services/seo/seo_service.ts apps/api/app/validators/admin/seo_validator.ts apps/admin/src/features/seo/types.ts apps/admin/src/features/seo/workspace.tsx --write
      - run: pnpm --filter @calibra/api run typecheck
      - run: pnpm --filter @calibra/sdk run build
      - run: pnpm --filter @calibra/admin run typecheck
      - name: Commit precision pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/app/services/seo/search_engines.ts apps/api/app/services/seo/seo_service.ts apps/api/app/validators/admin/seo_validator.ts apps/admin/src/features/seo/types.ts apps/admin/src/features/seo/workspace.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(seo): preserve provider dimensions and rank semantics"
          git push origin HEAD:agent/seo-seven-real-engines-20260811
