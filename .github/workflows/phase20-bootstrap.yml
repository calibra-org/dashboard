name: Phase 20 Completion Materialize

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: phase20-completion-materialize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: calibra
          POSTGRES_PASSWORD: calibra
          POSTGRES_DB: calibra
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U calibra -d calibra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase20-trust-risk-completion-20260818
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
      - run: npm install --global pnpm@10.32.1
      - name: Sync live main baseline
        run: |
          git fetch origin main
          PHASE20_MERGE_BASE="$(git merge-base HEAD origin/main)"
          test -n "$PHASE20_MERGE_BASE"
          echo "PHASE20_MERGE_BASE=$PHASE20_MERGE_BASE" >> "$GITHUB_ENV"
          echo "Phase 20 merge base: $PHASE20_MERGE_BASE"
          echo "Live main: $(git rev-parse origin/main)"
          git merge --no-edit origin/main
      - name: Recover verified Phase 20 candidate
        run: |
          set -euo pipefail
          mkdir -p /tmp/phase20-merge
          cp .phase20completion/PHASE20_EXECUTION_PROMPT_FA_FINAL.md /tmp/PHASE20_EXECUTION_PROMPT_FA_FINAL.md
          cat .phase20completion/payload.* > /tmp/phase20.b64
          base64 -d /tmp/phase20.b64 > /tmp/phase20.tar.xz
          echo "cd77aec08d9c2a0a5e6832739a0ee7c5afee8930f619078098cd89823b2e9a01  /tmp/phase20.tar.xz" | sha256sum -c -
          xz -d -c /tmp/phase20.tar.xz > /tmp/phase20.tar
          tar -tf /tmp/phase20.tar | sed 's#^\./##' | sort -u > /tmp/phase20-merge/payload-files.txt
          git diff --name-only "$PHASE20_MERGE_BASE"..origin/main | sort -u > /tmp/phase20-merge/main-files.txt
          comm -12 /tmp/phase20-merge/payload-files.txt /tmp/phase20-merge/main-files.txt > /tmp/phase20-merge/overlap.txt
          printf '%s\n' '.github/workflows/phase20-trust-risk-check.yml' 'apps/admin/src/components/Sidebar.tsx' | sort -u > /tmp/phase20-merge/expected-overlap.txt
          echo 'Phase 20/main overlapping files:'
          cat /tmp/phase20-merge/overlap.txt
          diff -u /tmp/phase20-merge/expected-overlap.txt /tmp/phase20-merge/overlap.txt
          git show "origin/main:.github/workflows/phase20-trust-risk-check.yml" > /tmp/phase20-merge/main-phase20-check.yml
          git show "$PHASE20_MERGE_BASE:.github/workflows/phase20-trust-risk-check.yml" > /tmp/phase20-merge/base-phase20-check.yml
          git show "origin/main:apps/admin/src/components/Sidebar.tsx" > /tmp/phase20-merge/main-sidebar.tsx
          git show "$PHASE20_MERGE_BASE:apps/admin/src/components/Sidebar.tsx" > /tmp/phase20-merge/base-sidebar.tsx
          tar -xf /tmp/phase20.tar
          cp .github/workflows/phase20-trust-risk-check.yml /tmp/phase20-merge/candidate-phase20-check.yml
          cp apps/admin/src/components/Sidebar.tsx /tmp/phase20-merge/candidate-sidebar.tsx
          if ! git merge-file -p /tmp/phase20-merge/candidate-phase20-check.yml /tmp/phase20-merge/base-phase20-check.yml /tmp/phase20-merge/main-phase20-check.yml > /tmp/phase20-merge/merged-phase20-check.yml; then
            echo 'Conflict while reconciling phase20-trust-risk-check.yml with live main'
            cat /tmp/phase20-merge/merged-phase20-check.yml
            exit 1
          fi
          mv /tmp/phase20-merge/merged-phase20-check.yml .github/workflows/phase20-trust-risk-check.yml
          if ! git merge-file -p /tmp/phase20-merge/candidate-sidebar.tsx /tmp/phase20-merge/base-sidebar.tsx /tmp/phase20-merge/main-sidebar.tsx > /tmp/phase20-merge/merged-sidebar.tsx; then
            echo 'Conflict while reconciling Sidebar.tsx with live main'
            cat /tmp/phase20-merge/merged-sidebar.tsx
            exit 1
          fi
          mv /tmp/phase20-merge/merged-sidebar.tsx apps/admin/src/components/Sidebar.tsx
          install -Dm644 /tmp/PHASE20_EXECUTION_PROMPT_FA_FINAL.md docs/calibra/PHASE20_EXECUTION_PROMPT_FA.md
          cat >> docs/calibra/PHASE20_EXECUTION_PROMPT_FA.md <<'EOF'

          ## قرارداد شمارشی اجرای Phase 20
          - قرارداد API این completion شامل **20 endpoint** است و باید با route/OpenAPI/SDK زنده هم‌راستا بماند.
          - از این قرارداد **11 مسیر write** هستند و تمام writeها باید auth، permission، tenant/RLS، audit و limiter/step-up لازم را حفظ کنند.
          - merge فقط پس از **CI سبز** روی همان candidate commit مجاز است؛ هیچ gate نباید bypass یا سبز فرض شود.
          EOF
          rm -rf .phase20completion
      - run: pnpm install --frozen-lockfile
      - name: Admin OpenAPI and SDK
        run: |
          pnpm --dir docs/api run build:json:admin
          pnpm --filter @calibra/sdk run codegen:admin
      - name: Phase 20 static contract
        run: node scripts/verify-phase20-trust-risk-integration.mjs
      - name: Build API test specification once
        run: pnpm --filter @calibra/api-docs run build:test-spec
      - name: Diagnose merged OpenAPI 3.0 contract
        run: |
          VALIDATOR_DIR="$(find "$PWD/node_modules/.pnpm" -type d -path '*/node_modules/openapi-schema-validator' | head -1)"
          test -n "$VALIDATOR_DIR" || { echo 'openapi-schema-validator not found'; exit 1; }
          node - "$VALIDATOR_DIR" <<'NODE'
          const fs = require('node:fs')
          const validatorDir = process.argv[2]
          const loaded = require(validatorDir)
          const OpenAPISchemaValidator = loaded.default || loaded
          const spec = JSON.parse(fs.readFileSync('docs/api/dist/_merged.test.json', 'utf8'))
          const validator = new OpenAPISchemaValidator({ version: 3 })
          const result = validator.validate(spec)
          if (result.errors?.length) {
            console.error(JSON.stringify(result.errors, null, 2))
            process.exit(1)
          }
          console.log('Merged OpenAPI 3.0 schema validator: PASS')
          NODE
      - name: Phase 20 legacy unit tests
        working-directory: apps/api
        run: timeout 180s node ace test --files=tests/unit/trust/phase20_trust_risk.spec.ts
      - name: Phase 20 contract unit tests
        working-directory: apps/api
        run: timeout 180s node ace test --files=tests/unit/trust/phase20_contracts.spec.ts
      - name: Phase 20 functional tests
        working-directory: apps/api
        run: timeout 240s node ace test --files=tests/functional/trust/phase20_trust.spec.ts
      - name: API typecheck
        run: pnpm --filter @calibra/api run typecheck
      - name: Admin typecheck
        run: pnpm --filter @calibra/admin run typecheck
      - name: Admin build
        run: pnpm --filter @calibra/admin run build
      - name: Working tree contract
        run: git diff --check
      - name: Commit verified Phase 20
        run: |
          rm -f .github/workflows/phase20-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'No completion changes'; exit 1; }
          git commit -m 'feat(phase20): complete trust fraud and risk os'
          git push origin HEAD:agent/phase20-trust-risk-completion-20260818
