name: Phase 33 Recovery Fix

on:
  push:
    branches:
      - feat/phase33-snippets

permissions:
  contents: write

concurrency:
  group: phase33-recovery-fix
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/phase33-snippets
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.14.0
      - run: npm install --global pnpm@10.32.1
      - run: pnpm install --frozen-lockfile
      - name: Make rollback a Safe Mode recovery path
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/api/app/services/snippets/snippets_service.ts';
          const source = fs.readFileSync(path, 'utf8');
          const before = `export async function rollbackSnippet(publicId: string, input: RollbackInput, userId: number) {
              const snippet = await snippetByPublicId(publicId);
              await assertPublishable(snippet, input.environment, input.rollout_percent);
              const trx = currentTrx();`;
          const after = `export async function rollbackSnippet(publicId: string, input: RollbackInput, userId: number) {
              const snippet = await snippetByPublicId(publicId);
              const settings = await getSettings();
              if (input.rollout_percent > numberValue(settings.max_rollout_percent)) {
                  throw new Exception("Rollout exceeds tenant ceiling", { status: 422, code: "E_SNIPPETS_ROLLOUT_LIMIT" });
              }
              if (snippet.status === "archived") {
                  throw new Exception("Archived snippets cannot be rolled back", { status: 409, code: "E_SNIPPET_ARCHIVED" });
              }
              const trx = currentTrx();`;
          const count = source.split(before).length - 1;
          if (count !== 1) throw new Error(`expected rollback block once, found ${count}`);
          fs.writeFileSync(path, source.replace(before, after));
          NODE
      - name: Strengthen Phase 33 recovery verifier
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'scripts/verify-phase33-snippets.mjs';
          const source = fs.readFileSync(path, 'utf8');
          const before = `must(!service.includes("source_executed: true"), "Phase33 simulation must never claim source execution");`;
          const after = `${before}
          const rollbackBody = service.slice(service.indexOf("export async function rollbackSnippet"), service.indexOf("export async function observeExecution"));
          must(!rollbackBody.includes("assertPublishable("), "Phase33 rollback must not depend on the current draft being publishable");
          must(!rollbackBody.includes("Safe Mode blocks"), "Phase33 rollback must remain available as a Safe Mode recovery path");
          must(rollbackBody.includes("max_rollout_percent"), "Phase33 rollback must still enforce rollout ceiling");
          must(rollbackBody.includes("Target revision is not publishable"), "Phase33 rollback must validate the target immutable revision");`;
          if (!source.includes(before)) throw new Error('Phase33 verifier anchor not found');
          fs.writeFileSync(path, source.replace(before, after));
          NODE
      - name: Format and verify
        run: |
          pnpm exec biome check --write apps/api/app/services/snippets/snippets_service.ts scripts/verify-phase33-snippets.mjs
          node scripts/verify-phase33-snippets.mjs
          pnpm --filter @calibra/api run typecheck
      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/phase33-recovery-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: keep Snippets rollback available during Safe Mode"
          git push origin HEAD:feat/phase33-snippets
