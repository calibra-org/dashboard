name: Adonis Compatibility Lockfile

on:
    push:
        branches: ["chore/adonis-codegen-compat"]
        paths:
            - ".github/workflows/adonis-codegen-compat-lockfile.yml"

permissions:
    contents: write

env:
    NODE_VERSION: "24.14.0"
    PNPM_VERSION: "10.32.1"

jobs:
    align-lockfile:
        runs-on: ubuntu-latest
        timeout-minutes: 8
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: chore/adonis-codegen-compat
            - uses: pnpm/action-setup@v6
              with:
                  version: ${{ env.PNPM_VERSION }}
            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: pnpm
            - name: Align compatible Adonis versions only
              run: pnpm --filter ./apps/api update @adonisjs/core@7.5.0 @adonisjs/bouncer@4.0.1 --lockfile-only
            - name: Assert changed-file scope
              shell: bash
              run: |
                  actual=$(git diff --name-only | sort)
                  expected=$(printf '%s\n' 'apps/api/package.json' 'pnpm-lock.yaml')
                  if [ "$actual" != "$expected" ]; then
                    echo "Unexpected changed files:" >&2
                    printf '%s\n' "$actual" >&2
                    exit 1
                  fi
            - name: Assert manifest changes are exactly Core and Bouncer
              run: |
                  node <<'NODE'
                  const assert = require('node:assert/strict')
                  const fs = require('node:fs')
                  const { execFileSync } = require('node:child_process')

                  const before = JSON.parse(execFileSync('git', ['show', 'HEAD:apps/api/package.json'], { encoding: 'utf8' }))
                  const after = JSON.parse(fs.readFileSync('apps/api/package.json', 'utf8'))

                  assert.equal(before.dependencies['@adonisjs/core'], '^7.3.2')
                  assert.equal(before.dependencies['@adonisjs/bouncer'], '^4.0.0')
                  assert.equal(after.dependencies['@adonisjs/core'], '^7.5.0')
                  assert.equal(after.dependencies['@adonisjs/bouncer'], '^4.0.1')

                  after.dependencies['@adonisjs/core'] = before.dependencies['@adonisjs/core']
                  after.dependencies['@adonisjs/bouncer'] = before.dependencies['@adonisjs/bouncer']
                  assert.deepEqual(after, before)
                  NODE
            - name: Assert expected lockfile resolutions
              run: |
                  grep -q "@adonisjs/core@7.5.0" pnpm-lock.yaml
                  grep -q "@adonisjs/bouncer@4.0.1" pnpm-lock.yaml
            - name: Commit compatibility alignment
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add apps/api/package.json pnpm-lock.yaml
                  git commit -m "fix(deps): align Adonis CodeGen compatibility"
                  git push origin HEAD:${GITHUB_REF_NAME}
