name: Phase 32 CI Repair Once

on:
  push:
    paths:
      - ".github/workflows/phase32-ci-repair-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase32-reliability-guardian-20260827
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - run: npm install --global pnpm@10.32.1
      - run: pnpm install --frozen-lockfile
      - name: Apply deterministic Phase 32 repairs
        run: python scripts/phase32-ci-repair-once.py
      - name: Format repaired files
        run: >-
          pnpm exec biome check --write
          apps/api/app/services/reliability_guardian/reliability_guardian_service.ts
          docs/api/package.json
          docs/api/scripts/merge-admin-spec.js
      - name: API typecheck
        run: pnpm --filter @calibra/api run typecheck
      - name: Generate SDK
        run: pnpm --filter @calibra/sdk run codegen
      - name: Verify SDK drift
        run: pnpm --filter @calibra/sdk run codegen:check
      - name: Phase 32 static contract
        run: node scripts/verify-phase32-reliability-guardian.mjs
      - name: Admin typecheck
        run: pnpm --filter @calibra/admin run typecheck
      - name: Commit repaired product files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/api/app/services/reliability_guardian/reliability_guardian_service.ts \
            docs/api/package.json \
            docs/api/scripts/merge-admin-spec.js \
            packages/sdk/src/generated/admin.d.ts
          if git diff --cached --quiet; then
            echo "No repair changes required"
          else
            git commit -m "fix(phase32): satisfy CI contracts and generated SDK"
            git push origin HEAD:feat/phase32-reliability-guardian-20260827
          fi
