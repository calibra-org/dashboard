name: Phase 20 Trust Risk Integrity

on:
  pull_request:
    paths:
      - "apps/api/app/services/phase20_trust_risk_service.ts"
      - "apps/api/app/controllers/admin/trust_risk_controller.ts"
      - "apps/api/app/validators/admin/phase20_trust_risk_validator.ts"
      - "apps/api/database/migrations/1767600000000_create_phase20_trust_risk_os.ts"
      - "apps/api/start/routes/admin_trust_risk.ts"
      - "apps/api/start/routes.ts"
      - "apps/api/app/controllers/checkout/submit_controller.ts"
      - "apps/api/tests/unit/trust/phase20_trust_risk.spec.ts"
      - "apps/admin/src/features/trust/**"
      - "apps/admin/src/lib/queries/trust-risk.ts"
      - "apps/admin/src/app/**/trust/**"
      - "scripts/verify-phase20-trust-risk-integration.mjs"
      - ".github/workflows/phase20-trust-risk-check.yml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: calibra
          POSTGRES_PASSWORD: calibra
          POSTGRES_DB: calibra
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U calibra -d calibra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
      - run: npm install --global pnpm@10.32.1
      - run: pnpm install --frozen-lockfile
      - name: Phase 20 static contract
        run: node scripts/verify-phase20-trust-risk-integration.mjs
      - name: Create canonical test database
        env:
          PGPASSWORD: calibra
        run: psql -h localhost -U calibra -d calibra -c "CREATE DATABASE calibra_test OWNER calibra;"
      - name: Phase 20 unit tests
        working-directory: apps/api
        run: pnpm test --files=tests/unit/trust/phase20_trust_risk.spec.ts
      - name: API typecheck
        run: pnpm --filter @calibra/api run typecheck
      - name: Admin typecheck
        run: pnpm --filter @calibra/admin run typecheck
      - name: Admin production build
        run: pnpm --filter @calibra/admin run build
