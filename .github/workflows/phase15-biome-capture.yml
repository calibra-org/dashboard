name: Phase 15 Canonical Fix

on:
    pull_request:
        branches: [main]

permissions:
    contents: write

env:
    NODE_VERSION: "24.14.0"
    PNPM_VERSION: "10.32.1"
    TURBO_TELEMETRY_DISABLED: 1
    DO_NOT_TRACK: 1

jobs:
    fix:
        runs-on: ubuntu-latest
        timeout-minutes: 12
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.pull_request.head.ref }}
            - uses: pnpm/action-setup@v4
              with:
                  version: ${{ env.PNPM_VERSION }}
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - name: Apply Phase 15 correctness and lint fixes
              shell: bash
              run: |
                  python - <<'PY'
                  from pathlib import Path

                  def replace(path, old, new):
                      p = Path(path)
                      text = p.read_text()
                      if new in text:
                          return
                      if old not in text:
                          raise SystemExit(f"expected snippet missing in {path}")
                      p.write_text(text.replace(old, new))

                  # Stable React keys for static skeletons.
                  replace(
                      "apps/admin/src/views/customers/cohorts/cohorts-lifecycle.tsx",
                      'import { CustomerWorkspaceNav } from "../customer-workspace-nav";\n\nexport function CohortsLifecycle()',
                      'import { CustomerWorkspaceNav } from "../customer-workspace-nav";\n\nconst COHORT_SKELETON_KEYS = ["cohort-skeleton-a", "cohort-skeleton-b", "cohort-skeleton-c", "cohort-skeleton-d", "cohort-skeleton-e", "cohort-skeleton-f"] as const;\n\nexport function CohortsLifecycle()',
                  )
                  replace(
                      "apps/admin/src/views/customers/cohorts/cohorts-lifecycle.tsx",
                      '''{Array.from({ length: 6 }, (_, index) => (\n                                <Skeleton key={index} className="h-10" />\n                            ))}''',
                      '''{COHORT_SKELETON_KEYS.map((key) => (\n                                <Skeleton key={key} className="h-10" />\n                            ))}''',
                  )

                  replace(
                      "apps/admin/src/views/customers/intelligence/intelligence-overview.tsx",
                      'import { CustomerWorkspaceNav } from "../customer-workspace-nav";\n\ninterface MetricCardProps',
                      'import { CustomerWorkspaceNav } from "../customer-workspace-nav";\n\nconst INTELLIGENCE_SKELETON_KEYS = ["intelligence-skeleton-a", "intelligence-skeleton-b", "intelligence-skeleton-c", "intelligence-skeleton-d", "intelligence-skeleton-e", "intelligence-skeleton-f"] as const;\n\ninterface MetricCardProps',
                  )
                  replace(
                      "apps/admin/src/views/customers/intelligence/intelligence-overview.tsx",
                      '''{Array.from({ length: 6 }, (_, index) => (\n                        <Skeleton key={index} className="h-36" />\n                    ))}''',
                      '''{INTELLIGENCE_SKELETON_KEYS.map((key) => (\n                        <Skeleton key={key} className="h-36" />\n                    ))}''',
                  )

                  # NBA candidates are logically unique by action/evidence; do not use array position as identity.
                  replace(
                      "apps/admin/src/views/customers/detail/intelligence-card.tsx",
                      '''{data.nba_candidates.map((candidate, index) => (\n                            <div\n                                key={`${candidate.action_type ?? "candidate"}-${index}`}''',
                      '''{data.nba_candidates.map((candidate) => (\n                            <div\n                                key={[\n                                    candidate.action_type ?? "candidate",\n                                    candidate.eligibility ?? "unknown",\n                                    candidate.consent_requirement ?? "none",\n                                    ...(candidate.reason_codes ?? []),\n                                    ...(candidate.evidence_refs ?? []),\n                                ].join(":")}''',
                  )

                  # Stable UI-only identity for editable segment conditions.
                  replace(
                      "apps/admin/src/views/customers/segments/segment-studio.tsx",
                      'import { useEffect, useMemo, useState } from "react";',
                      'import { useEffect, useMemo, useRef, useState } from "react";',
                  )
                  replace(
                      "apps/admin/src/views/customers/segments/segment-studio.tsx",
                      '''    const [conditions, setConditions] = useState<SegmentCondition[]>([\n        { feature: "lifecycle.state", operator: "eq", value: "active_repeat" },\n    ]);\n    const saveDefinition''',
                      '''    const [conditions, setConditions] = useState<SegmentCondition[]>([\n        { feature: "lifecycle.state", operator: "eq", value: "active_repeat" },\n    ]);\n    const conditionKeys = useRef(new WeakMap<SegmentCondition, string>());\n    const conditionKeySequence = useRef(0);\n    const getConditionKey = (condition: SegmentCondition) => {\n        const existing = conditionKeys.current.get(condition);\n        if (existing) return existing;\n        conditionKeySequence.current += 1;\n        const created = `condition-${conditionKeySequence.current}`;\n        conditionKeys.current.set(condition, created);\n        return created;\n    };\n    const saveDefinition''',
                  )
                  replace(
                      "apps/admin/src/views/customers/segments/segment-studio.tsx",
                      'key={`${index}-${condition.feature}`}',
                      'key={getConditionKey(condition)}',
                  )
                  replace(
                      "apps/admin/src/views/customers/segments/segment-studio.tsx",
                      '''function Field({ label, help, children }: { label: string; help: string; children: ReactNode }) {\n    return (\n        <label className="flex flex-col gap-1.5 text-sm">\n            <span className="flex items-center gap-1 font-medium">\n                {label}\n                <HelperTooltip>{help}</HelperTooltip>\n            </span>\n            {children}\n        </label>\n    );\n}''',
                      '''function Field({ label, help, children }: { label: string; help: string; children: ReactNode }) {\n    return (\n        <div className="flex flex-col gap-1.5 text-sm">\n            <span className="flex items-center gap-1 font-medium">\n                {label}\n                <HelperTooltip>{help}</HelperTooltip>\n            </span>\n            {children}\n        </div>\n    );\n}''',
                  )

                  # Evidence-first economic quality: paid customers without ledger coverage are not "ready".
                  replace(
                      "apps/api/app/services/customer_intelligence_service.ts",
                      '''function buildNbaCandidates(lifecycle: LifecycleState, openTickets: number, emailOptIn: boolean, smsOptIn: boolean) {''',
                      '''export function deriveQualityStatus(\n    orderCount: number,\n    expectedOrders: number,\n    contributionStatus: ContributionStatus,\n): string {\n    if (orderCount === 0 || expectedOrders === 0) return "limited_history";\n    if (contributionStatus === "available") return "ready";\n    if (contributionStatus === "partial") return "partial_economic_coverage";\n    return "missing_economic_coverage";\n}\n\nfunction buildNbaCandidates(lifecycle: LifecycleState, openTickets: number, emailOptIn: boolean, smsOptIn: boolean) {''',
                  )
                  replace(
                      "apps/api/app/services/customer_intelligence_service.ts",
                      '''    const qualityStatus =\n        orderCount === 0 ? "limited_history" : contribution.status === "partial" ? "partial_economic_coverage" : "ready";''',
                      '''    const qualityStatus = deriveQualityStatus(orderCount, contribution.expectedOrders, contribution.status);''',
                  )

                  # Contribution coverage denominator is customers with paid orders, not every profile.
                  replace(
                      "apps/api/app/services/customer_intelligence_service.ts",
                      '''        .select(\n            currentTrx().raw(\n                "COUNT(*) FILTER (WHERE historical_contribution_ltv_minor IS NOT NULL)::bigint AS contribution_customer_count",\n            ),\n        )\n        .first();''',
                      '''        .select(\n            currentTrx().raw(\n                "COUNT(*) FILTER (WHERE historical_contribution_ltv_minor IS NOT NULL)::bigint AS contribution_customer_count",\n            ),\n        )\n        .select(\n            currentTrx().raw(\n                "COUNT(*) FILTER (WHERE COALESCE((signals->'economics'->>'expected_orders')::int, 0) > 0)::bigint AS contribution_eligible_customer_count",\n            ),\n        )\n        .first();''',
                  )
                  replace(
                      "apps/api/app/services/customer_intelligence_service.ts",
                      '''    const total = Number(row?.total ?? 0);\n    const contributionCustomers = Number(row?.contribution_customer_count ?? 0);''',
                      '''    const total = Number(row?.total ?? 0);\n    const contributionCustomers = Number(row?.contribution_customer_count ?? 0);\n    const contributionEligibleCustomers = Number(row?.contribution_eligible_customer_count ?? 0);''',
                  )
                  replace(
                      "apps/api/app/services/customer_intelligence_service.ts",
                      '''        contribution_coverage_ratio: total === 0 ? 0 : contributionCustomers / total,''',
                      '''        contribution_coverage_ratio:\n            contributionEligibleCustomers === 0 ? 0 : contributionCustomers / contributionEligibleCustomers,''',
                  )
                  replace(
                      "apps/api/app/services/customer_intelligence_service.ts",
                      '''        contribution_status:\n            contributionCustomers === 0 ? "unavailable" : contributionCustomers < total ? "partial" : "available",''',
                      '''        contribution_status:\n            contributionEligibleCustomers === 0\n                ? "unavailable"\n                : contributionCustomers < contributionEligibleCustomers\n                  ? "partial"\n                  : "available",''',
                  )

                  # Cohort contribution stays null until all eligible members have economic coverage.
                  replace(
                      "apps/api/app/services/customer_intelligence_service.ts",
                      '''    const { rows } = await currentTrx().rawQuery<{ rows: Array<Record<string, string | number>> }>(''',
                      '''    const { rows } = await currentTrx().rawQuery<{ rows: Array<Record<string, string | number | null>> }>(''',
                  )
                  replace(
                      "apps/api/app/services/customer_intelligence_service.ts",
                      '''                COALESCE(SUM(cip.historical_revenue_ltv_minor), 0)::bigint AS revenue_ltv_minor,\n                COALESCE(SUM(cip.historical_contribution_ltv_minor), 0)::bigint AS contribution_ltv_minor''',
                      '''                COALESCE(SUM(cip.historical_revenue_ltv_minor), 0)::bigint AS revenue_ltv_minor,\n                CASE\n                    WHEN COUNT(*) FILTER (WHERE COALESCE((cip.signals->'economics'->>'expected_orders')::int, 0) > 0) = 0 THEN NULL\n                    WHEN COUNT(*) FILTER (WHERE cip.historical_contribution_ltv_minor IS NOT NULL) =\n                         COUNT(*) FILTER (WHERE COALESCE((cip.signals->'economics'->>'expected_orders')::int, 0) > 0)\n                    THEN SUM(cip.historical_contribution_ltv_minor)::bigint\n                    ELSE NULL\n                END AS contribution_ltv_minor''',
                  )
                  replace(
                      "apps/api/app/services/customer_intelligence_service.ts",
                      '''        contribution_ltv_minor: Number(row.contribution_ltv_minor),''',
                      '''        contribution_ltv_minor: row.contribution_ltv_minor === null ? null : Number(row.contribution_ltv_minor),''',
                  )

                  replace(
                      "apps/admin/src/lib/queries/customer-intelligence.ts",
                      '''    contribution_ltv_minor: number;''',
                      '''    contribution_ltv_minor: number | null;''',
                  )
                  replace(
                      "docs/api/reference/openapi/admin.customer-intelligence.v1.yaml",
                      '''                contribution_ltv_minor: { type: integer, format: int64 }''',
                      '''                contribution_ltv_minor: { type: [integer, "null"], format: int64 }''',
                  )

                  # Pure tests lock the quality semantics; source assertions lock nullable cohort contract.
                  replace(
                      "apps/api/tests/unit/customer_intelligence.spec.ts",
                      '''import { deriveLifecycle, deriveRiskBand, deriveValueBand } from "#services/customer_intelligence_service";''',
                      '''import { deriveLifecycle, deriveQualityStatus, deriveRiskBand, deriveValueBand } from "#services/customer_intelligence_service";''',
                  )
                  replace(
                      "apps/api/tests/unit/customer_intelligence.spec.ts",
                      '''        assert.equal(deriveValueBand(15), "high_value");\n    });''',
                      '''        assert.equal(deriveValueBand(15), "high_value");\n\n        assert.equal(deriveQualityStatus(0, 0, "unavailable"), "limited_history");\n        assert.equal(deriveQualityStatus(1, 0, "unavailable"), "limited_history");\n        assert.equal(deriveQualityStatus(2, 2, "available"), "ready");\n        assert.equal(deriveQualityStatus(2, 2, "partial"), "partial_economic_coverage");\n        assert.equal(deriveQualityStatus(2, 2, "unavailable"), "missing_economic_coverage");\n    });''',
                  )
                  replace(
                      "apps/api/tests/unit/customer_intelligence.spec.ts",
                      '''        assert.include(contract, "enum: [available, partial, unavailable]");''',
                      '''        assert.include(contract, "enum: [available, partial, unavailable]");\n        assert.include(contract, 'contribution_ltv_minor: { type: [integer, "null"], format: int64 }');''',
                  )
                  PY

            - name: Apply canonical Biome output
              run: >-
                  pnpm exec biome check --write
                  apps/api/app/controllers/admin/customer_intelligence_controller.ts
                  apps/api/app/controllers/admin/customer_segments_controller.ts
                  apps/api/app/controllers/admin/procurement_controller.ts
                  apps/api/app/controllers/admin/trust_risk_controller.ts
                  apps/api/app/controllers/checkout/submit_controller.ts
                  apps/api/app/jobs/refresh_customer_intelligence_job.ts
                  apps/api/app/services/customer_intelligence_eligibility_service.ts
                  apps/api/app/services/customer_intelligence_segments_service.ts
                  apps/api/app/services/customer_intelligence_service.ts
                  apps/api/app/validators/admin/customer_intelligence_validator.ts
                  apps/api/database/migrations/1768000000000_create_phase15_customer_intelligence.ts
                  apps/api/start/routes/admin_customer_intelligence.ts
                  apps/api/start/routes/admin_customer_segments.ts
                  apps/api/tests/unit/customer_intelligence.spec.ts
                  apps/admin/src/lib/api.ts
                  apps/admin/src/lib/i18n/request.ts
                  apps/admin/src/lib/queries/customer-intelligence.ts
                  apps/admin/src/views/customers/customer-workspace-nav.tsx
                  apps/admin/src/views/customers/cohorts/cohorts-lifecycle.tsx
                  apps/admin/src/views/customers/detail/customers-detail.tsx
                  apps/admin/src/views/customers/detail/intelligence-card.tsx
                  apps/admin/src/views/customers/intelligence/intelligence-overview.tsx
                  apps/admin/src/views/customers/segments/segment-studio.tsx
                  apps/admin/messages/customer-intelligence/en.json
                  apps/admin/messages/customer-intelligence/fa.json
                  docs/api/reference/openapi/admin.customer-intelligence.v1.yaml
                  docs/api/scripts/merge-admin-spec.js
            - name: Commit canonical fixes
              run: |
                  if git diff --quiet; then
                    echo "No canonical changes to commit"
                    exit 0
                  fi
                  git config user.name "calibra-phase15-bot"
                  git config user.email "actions@users.noreply.github.com"
                  git add \
                    apps/api/app/controllers/admin/customer_intelligence_controller.ts \
                    apps/api/app/controllers/admin/customer_segments_controller.ts \
                    apps/api/app/controllers/admin/procurement_controller.ts \
                    apps/api/app/controllers/admin/trust_risk_controller.ts \
                    apps/api/app/controllers/checkout/submit_controller.ts \
                    apps/api/app/jobs/refresh_customer_intelligence_job.ts \
                    apps/api/app/services/customer_intelligence_eligibility_service.ts \
                    apps/api/app/services/customer_intelligence_segments_service.ts \
                    apps/api/app/services/customer_intelligence_service.ts \
                    apps/api/app/validators/admin/customer_intelligence_validator.ts \
                    apps/api/database/migrations/1768000000000_create_phase15_customer_intelligence.ts \
                    apps/api/start/routes/admin_customer_intelligence.ts \
                    apps/api/start/routes/admin_customer_segments.ts \
                    apps/api/tests/unit/customer_intelligence.spec.ts \
                    apps/admin/src/lib/api.ts \
                    apps/admin/src/lib/i18n/request.ts \
                    apps/admin/src/lib/queries/customer-intelligence.ts \
                    apps/admin/src/views/customers/customer-workspace-nav.tsx \
                    apps/admin/src/views/customers/cohorts/cohorts-lifecycle.tsx \
                    apps/admin/src/views/customers/detail/customers-detail.tsx \
                    apps/admin/src/views/customers/detail/intelligence-card.tsx \
                    apps/admin/src/views/customers/intelligence/intelligence-overview.tsx \
                    apps/admin/src/views/customers/segments/segment-studio.tsx \
                    apps/admin/messages/customer-intelligence/en.json \
                    apps/admin/messages/customer-intelligence/fa.json \
                    docs/api/reference/openapi/admin.customer-intelligence.v1.yaml \
                    docs/api/scripts/merge-admin-spec.js
                  git commit -m "fix(phase15): finalize customer genome quality and lint"
                  git push origin HEAD:agent/phase15-customer-genome
