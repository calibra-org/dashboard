name: Phase 23 Digital Twin Integrity

on:
  pull_request:
    paths:
      - "apps/api/app/services/phase23_digital_twin_service.ts"
      - "apps/api/app/controllers/admin/digital_twin_controller.ts"
      - "apps/api/app/validators/admin/phase23_digital_twin_validator.ts"
      - "apps/api/database/migrations/1776000000000_create_commerce_digital_twin.ts"
      - "apps/api/start/routes/admin_digital_twin.ts"
      - "apps/api/start/routes.ts"
      - "apps/admin/src/features/digital-twin/**"
      - "apps/admin/src/lib/queries/digital-twin.ts"
      - "apps/admin/src/app/**/analytics/scenario-war-room/**"
      - "docs/api/reference/openapi/admin.phase23.v1.yaml"
      - "docs/api/scripts/merge-admin-spec.js"
      - "docs/api/package.json"
      - "scripts/verify-phase23-digital-twin.mjs"
      - ".github/workflows/phase23-digital-twin-check.yml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: calibra
          POSTGRES_PASSWORD: calibra
          POSTGRES_DB: calibra_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U calibra -d calibra_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
      - run: npm install --global pnpm@10.32.1
      - run: pnpm install --frozen-lockfile
      - name: Static Phase 23 contract
        run: node scripts/verify-phase23-digital-twin.mjs
      - name: OpenAPI and SDK
        run: |
          pnpm --dir docs/api run build:json:admin
          pnpm --filter @calibra/sdk run codegen:admin
          grep -F '"/api/v1/admin/digital-twin/overview"' packages/sdk/src/generated/admin.d.ts
          grep -F '"/api/v1/admin/digital-twin/runs/{publicId}/decision-brief"' packages/sdk/src/generated/admin.d.ts
          grep -F 'getDigitalTwinDecisionBrief' packages/sdk/src/generated/admin.d.ts
      - name: API typecheck
        run: pnpm --filter @calibra/api run typecheck
      - name: Admin typecheck
        run: pnpm exec turbo run typecheck --filter=@calibra/admin
      - name: Admin production build
        run: pnpm exec turbo run build --filter=@calibra/admin
      - name: Diff hygiene
        run: git diff --check
