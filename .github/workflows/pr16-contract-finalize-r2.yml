name: PR16 Contract Finalize R2
on:
  push:
    branches: ["agent/runtime-hardening-20260814"]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: calibra
          POSTGRES_PASSWORD: calibra
          POSTGRES_DB: calibra
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U calibra -d calibra"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NODE_ENV: test
      PORT: "3334"
      HOST: 0.0.0.0
      APP_NAME: calibra-api
      APP_KEY: ci-only-key-not-used-for-real-secrets
      LOG_LEVEL: warn
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: calibra
      DB_PASSWORD: calibra
      DB_DATABASE: calibra
      MAIL_FROM_ADDRESS: ops@calibra.local
      MAIL_FROM_NAME: Calibra
      MAIL_NOTIFICATIONS_ENABLED: "false"
      SMTP_HOST: localhost
      SMTP_PORT: "11025"
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      TRANSMIT_TRANSPORT: none
      QUEUE_DRIVER: sync
      LIMITER_STORE: memory
      CACHE_DRIVER: memory
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Repair structural OpenAPI contracts
        run: |
          node <<'NODE'
          const fs = require('fs');
          const storefront = 'docs/api/reference/openapi/storefront.completion.v1.yaml';
          let s = fs.readFileSync(storefront, 'utf8');
          const bad404 = '"404": { description: Tracking token invalid, expired, revoked, or outside the current tenant }';
          const good404 = '"404": { description: "Tracking token invalid, expired, revoked, or outside the current tenant" }';
          if (!s.includes(bad404) && !s.includes(good404)) throw new Error('support 404 anchor not found');
          s = s.replace(bad404, good404);
          fs.writeFileSync(storefront, s);

          const admin = 'docs/api/reference/openapi/admin.v1.yaml';
          s = fs.readFileSync(admin, 'utf8');
          const oldBlock = '    /api/v1/admin/payment-attempts/{id}:\n        get:\n            $ref: "./admin/paths/payments/payment-attempts-id.get.yaml"\n\n    /api/v1/admin/payment-attempts/summary:\n        get:\n            $ref: "./admin/paths/payments/payment-attempts-summary.get.yaml"\n\n    /api/v1/admin/payment-attempts/{id}/reconciliation:\n        get:\n            $ref: "./admin/paths/payments/payment-attempts-id-reconciliation.get.yaml"\n\n    /api/v1/admin/payment-attempts/{id}/reconcile:\n        post:\n            $ref: "./admin/paths/payments/payment-attempts-id-reconcile.post.yaml"\n\n        head:\n            $ref: "./common/components/operations/HeadCompanion.yaml"\n';
          const newBlock = '    /api/v1/admin/payment-attempts/{id}:\n        get:\n            $ref: "./admin/paths/payments/payment-attempts-id.get.yaml"\n        head:\n            $ref: "./common/components/operations/HeadCompanion.yaml"\n\n    /api/v1/admin/payment-attempts/summary:\n        get:\n            $ref: "./admin/paths/payments/payment-attempts-summary.get.yaml"\n\n    /api/v1/admin/payment-attempts/{id}/reconciliation:\n        get:\n            $ref: "./admin/paths/payments/payment-attempts-id-reconciliation.get.yaml"\n\n    /api/v1/admin/payment-attempts/{id}/reconcile:\n        post:\n            $ref: "./admin/paths/payments/payment-attempts-id-reconcile.post.yaml"\n';
          if (s.includes(oldBlock)) s = s.replace(oldBlock, newBlock);
          else if (!s.includes(newBlock)) throw new Error('payment attempts OpenAPI block not found');
          fs.writeFileSync(admin, s);

          const merger = 'docs/api/scripts/merge-for-tests.js';
          s = fs.readFileSync(merger, 'utf8');
          const anchor = '        pathItem.head = {\n            description:';
          const replacement = '        pathItem.head = {\n            summary: "HEAD companion",\n            ...(Array.isArray(op.parameters) ? { parameters: structuredClone(op.parameters) } : {}),\n            description:';
          if (s.includes(anchor)) s = s.replace(anchor, replacement);
          else if (!s.includes('summary: "HEAD companion"')) throw new Error('synthetic HEAD generator anchor not found');
          fs.writeFileSync(merger, s);
          NODE
      - name: Regenerate OpenAPI and SDK
        run: |
          pnpm --filter @calibra/api-docs run build:json
          pnpm --filter @calibra/sdk run codegen
          pnpm run format:fix
      - name: Create test database
        env:
          PGPASSWORD: calibra
        run: psql -h localhost -U calibra -d calibra -c "CREATE DATABASE calibra_test OWNER calibra;"
      - name: Verify API route sync
        working-directory: apps/api
        run: node ace check:api-docs
      - name: Run PR16 functional regressions
        working-directory: apps/api
        run: pnpm test --files=tests/functional/admin/phase5_operations.spec.ts --files=tests/functional/admin/phase5_operations_hardening.spec.ts --files=tests/functional/payments/payment_callback_failures.spec.ts
      - name: Run release gates
        run: |
          pnpm run verify:phase1-4
          pnpm run verify:phase5
          pnpm --filter @calibra/sdk run codegen:check
          pnpm run typecheck
          pnpm run build
      - name: Commit clean PR16
        run: |
          git config user.name calibra-dev
          git config user.email keshavarz20.com@gmail.com
          git rm .github/workflows/pr16-contract-finalize.yml .github/workflows/pr16-contract-finalize-r2.yml
          git add -A
          git commit -m 'fix(api): repair test OpenAPI and finalize Phase 5 hardening'
          git push origin HEAD:agent/runtime-hardening-20260814
