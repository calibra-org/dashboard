name: Phase 28 PR Materializer

on:
  pull_request:
    paths:
      - ".github/workflows/phase28-pr-materialize-once.yml"

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - run: npm install --global pnpm@10.32.1
      - run: pnpm install --frozen-lockfile
      - name: Finalize Phase 28 operator UI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("apps/admin/src/features/objective-autonomy/ObjectiveAutonomyWorkspace.tsx")
          text = path.read_text()

          replacements = {
              '                description={': '                subtitle={',
              '<Select value={autonomyLevel} onValueChange={setAutonomyLevel}>': '<Select value={autonomyLevel} onValueChange={(value) => setAutonomyLevel(String(value ?? ""))}>',
              '<Select value={riskCeiling} onValueChange={setRiskCeiling}>': '<Select value={riskCeiling} onValueChange={(value) => setRiskCeiling(String(value ?? ""))}>',
              '<Select value={scenarioId} onValueChange={setScenarioId}>': '<Select value={scenarioId} onValueChange={(value) => setScenarioId(String(value ?? ""))}>',
              '<Select value={portfolioId} onValueChange={setPortfolioId}>': '<Select value={portfolioId} onValueChange={(value) => setPortfolioId(String(value ?? ""))}>',
              '<Select value={planId} onValueChange={setPlanId}>': '<Select value={planId} onValueChange={(value) => setPlanId(String(value ?? ""))}>',
              '<p className="font-medium text-xs">{label}</p>': '<p className="font-medium text-xs">{String(label)}</p>',
              'path: `objectives/${selected.public_id}/cycles/${latestCycle.public_id}/execute`,': 'path: `objectives/${selected?.public_id ?? "missing"}/cycles/${latestCycle.public_id}/execute`,',
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new)

          state_marker = '    const [unexpectedHarm, setUnexpectedHarm] = useState(false);\n'
          if 'postmortemSummary' not in text:
              if state_marker not in text:
                  raise SystemExit('postmortem state marker missing')
              text = text.replace(state_marker, state_marker + '''    const [postmortemFinal, setPostmortemFinal] = useState("0");\n    const [postmortemSummary, setPostmortemSummary] = useState("");\n    const [postmortemLesson, setPostmortemLesson] = useState("");\n    const [postmortemConfidence, setPostmortemConfidence] = useState("0.7");\n''')

              access_marker = '''                    </Card>\n                </div>\n            ) : null}\n\n            {tab === "access" ? ('''
              postmortem = '''                    </Card>\n                    <Card className="p-5 xl:col-span-2">\n                        <div className="mb-4 flex items-center justify-between gap-3">\n                            <div>\n                                <h2 className="font-semibold">Postmortem و انتقال یادگیری به حافظه</h2>\n                                <p className="text-muted-foreground text-xs">\n                                    نتیجه واقعی، درس آموخته و عدم‌قطعیت را ثبت می‌کند و به Phase 26 Merchant Memory می‌فرستد.\n                                </p>\n                            </div>\n                            <Sparkles className="size-5 text-primary" />\n                        </div>\n                        {detail.data?.postmortem ? (\n                            <div className="grid gap-3 sm:grid-cols-3">\n                                <div className="rounded-xl border p-4">\n                                    <p className="text-muted-foreground text-xs">Outcome</p>\n                                    <p className="mt-1 font-semibold">{String(detail.data.postmortem.outcome ?? "—")}</p>\n                                </div>\n                                <div className="rounded-xl border p-4">\n                                    <p className="text-muted-foreground text-xs">Final value</p>\n                                    <p className="mt-1 font-semibold">{faNumber(detail.data.postmortem.final_value)}</p>\n                                </div>\n                                <div className="rounded-xl border p-4">\n                                    <p className="text-muted-foreground text-xs">Memory</p>\n                                    <p className="mt-1 break-all font-mono text-xs">{String(detail.data.postmortem.memory_public_id ?? "—")}</p>\n                                </div>\n                            </div>\n                        ) : selected ? (\n                            <div className="grid gap-3 sm:grid-cols-2">\n                                <div>\n                                    <Label>Final value</Label>\n                                    <Input type="number" value={postmortemFinal} onChange={(event) => setPostmortemFinal(event.target.value)} />\n                                </div>\n                                <div>\n                                    <Label>Confidence</Label>\n                                    <Input type="number" min="0" max="1" step="0.05" value={postmortemConfidence} onChange={(event) => setPostmortemConfidence(event.target.value)} />\n                                </div>\n                                <div className="sm:col-span-2">\n                                    <Label>خلاصه نتیجه</Label>\n                                    <Textarea value={postmortemSummary} onChange={(event) => setPostmortemSummary(event.target.value)} placeholder="چه اتفاقی افتاد و هدف تا چه حد محقق شد؟" />\n                                </div>\n                                <div className="sm:col-span-2">\n                                    <Label>درس آموخته</Label>\n                                    <Textarea value={postmortemLesson} onChange={(event) => setPostmortemLesson(event.target.value)} placeholder="در چرخه بعد چه چیزی باید حفظ یا تغییر کند؟" />\n                                </div>\n                                <Button\n                                    className="sm:col-span-2"\n                                    disabled={busy || postmortemSummary.trim().length < 10 || postmortemLesson.trim().length < 10 || !evidence}\n                                    onClick={() => mutate.mutate({\n                                        path: `objectives/${selected.public_id}/postmortem`,\n                                        body: {\n                                            final_value: Number(postmortemFinal),\n                                            summary: postmortemSummary,\n                                            lesson: postmortemLesson,\n                                            residual_uncertainty: { checkpoint_confidence: Number(checkpointConfidence), latest_cycle_public_id: latestCycle?.public_id ?? null },\n                                            confidence: Number(postmortemConfidence),\n                                            evidence_refs: [{ source: evidence.split(":")[0] || "operator", id: evidence.split(":")[1] || "manual", label: evidence.split(":").slice(2).join(":") || "postmortem evidence" }],\n                                        },\n                                    })}\n                                >\n                                    ثبت Postmortem و ذخیره در حافظه Phase 26\n                                </Button>\n                            </div>\n                        ) : null}\n                    </Card>\n                </div>\n            ) : null}\n\n            {tab === "access" ? ('''
              if access_marker not in text:
                  raise SystemExit('postmortem insertion marker missing')
              text = text.replace(access_marker, postmortem, 1)

          path.write_text(text)
          PY
      - run: pnpm exec biome check --write --unsafe apps/admin/src/features/objective-autonomy/ObjectiveAutonomyWorkspace.tsx docs/api/scripts/merge-admin-spec.js docs/api/package.json
      - run: pnpm --filter @calibra/admin run typecheck
      - name: Build canonical Phase 28 OpenAPI and regenerate SDK
        run: pnpm --filter @calibra/sdk run codegen
      - run: pnpm --filter @calibra/sdk run build
      - name: Commit materialized Phase 28 contracts
        run: |
          git config user.name "calibra-phase28-ci"
          git config user.email "actions@users.noreply.github.com"
          git add apps/admin/src/features/objective-autonomy/ObjectiveAutonomyWorkspace.tsx docs/api/package.json docs/api/scripts/merge-admin-spec.js packages/sdk/src/generated
          git commit -m "feat: materialize final Phase 28 operator and SDK contracts" || exit 0
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
