name: Phase 16 Sync Finalized SDK

on:
  push:
    branches:
      - agent/phase16-discovery-os-final-20260818

permissions:
  contents: write

concurrency:
  group: phase16-sync-finalized-sdk
  cancel-in-progress: true

jobs:
  regenerate-sdk:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase16-finalized-source-20260822
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Regenerate Admin OpenAPI SDK
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir docs/api run build:json:admin
          pnpm --filter @calibra/sdk run codegen:admin
          git diff --check

      - name: Guard generated-only change and publish
        shell: bash
        env:
          TARGET_BRANCH: agent/phase16-finalized-source-20260822
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test "$changed" = "packages/sdk/src/generated/admin.d.ts"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/sdk/src/generated/admin.d.ts
          git diff --cached --check
          git commit -m 'chore(phase16): regenerate admin SDK contract'
          git push origin "HEAD:${TARGET_BRANCH}"
