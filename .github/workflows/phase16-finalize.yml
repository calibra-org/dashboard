name: Phase 16 Format Finalized Source

on:
  push:
    branches:
      - agent/phase16-discovery-os-final-20260818

permissions:
  contents: write

concurrency:
  group: phase16-format-finalized-source
  cancel-in-progress: true

jobs:
  format-finalized-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase16-finalized-source-20260822
          fetch-depth: 0

      - name: Capture allowed Phase 16 paths
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git diff --name-only origin/main...HEAD | sort -u > "${RUNNER_TEMP}/phase16-allowed.txt"
          test -s "${RUNNER_TEMP}/phase16-allowed.txt"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply formatting only
        shell: bash
        run: |
          set -euo pipefail
          pnpm run format:fix
          pnpm run format
          git diff --check

      - name: Guard formatting scope and publish
        shell: bash
        env:
          TARGET_BRANCH: agent/phase16-finalized-source-20260822
        run: |
          set -euo pipefail
          git diff --name-only | sort -u > "${RUNNER_TEMP}/phase16-formatted.txt"
          test -s "${RUNNER_TEMP}/phase16-formatted.txt"

          unexpected="$(comm -23 "${RUNNER_TEMP}/phase16-formatted.txt" "${RUNNER_TEMP}/phase16-allowed.txt")"
          if [ -n "$unexpected" ]; then
            echo 'Formatter changed files outside the Phase 16 PR scope:'
            printf '%s\n' "$unexpected"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m 'style(phase16): normalize finalized source'
          git push origin "HEAD:${TARGET_BRANCH}"
