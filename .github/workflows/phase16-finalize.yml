name: Phase 16 Normalize Finalized Source

on:
  push:
    branches:
      - agent/phase16-discovery-os-final-20260818

permissions:
  contents: write

concurrency:
  group: phase16-normalize-finalized-source
  cancel-in-progress: true

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase16-finalized-source-20260822
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply safe Biome fixes only to Phase 16 changed source
        shell: bash
        env:
          BASE_SHA: 954139ddd1e2282e9cc408481fcff17a461923a5
        run: |
          set -euo pipefail
          mapfile -t files < <(
            git diff --name-only "${BASE_SHA}...HEAD" \
              | grep -E '\.(ts|tsx|js|jsx|mjs|cjs|json)$' \
              | grep -v '^packages/sdk/src/generated/' \
              | grep -v '^apps/api/database/schema\.ts$'
          )
          test "${#files[@]}" -gt 0
          pnpm exec biome check --write "${files[@]}"
          pnpm exec biome check "${files[@]}"
          git diff --check

      - name: Guard and publish normalization
        shell: bash
        env:
          TARGET_BRANCH: agent/phase16-finalized-source-20260822
          BASE_SHA: 954139ddd1e2282e9cc408481fcff17a461923a5
        run: |
          set -euo pipefail
          mapfile -t allowed < <(git diff --name-only "${BASE_SHA}...HEAD")
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -gt 0
          for path in "${changed[@]}"; do
            printf '%s\n' "${allowed[@]}" | grep -Fxq -- "$path"
            test "$path" != "apps/api/database/schema.ts"
            case "$path" in
              packages/sdk/src/generated/*) exit 1 ;;
            esac
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${changed[@]}"
          git diff --cached --check
          git commit -m 'style(phase16): normalize finalized source'
          git push origin "HEAD:${TARGET_BRANCH}"
