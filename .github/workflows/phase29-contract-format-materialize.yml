name: Phase 29 Contract Format Materializer

on:
  pull_request:
    paths:
      - ".github/workflows/phase29-contract-format-materialize.yml"

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/phase29-product-passport-20260825'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - run: npm install --global pnpm@10.32.1
      - run: pnpm install --frozen-lockfile
      - name: Format Phase 29 contracts
        run: pnpm exec biome check --write docs/api/package.json docs/api/scripts/merge-admin-spec.js scripts/verify-phase29-product-passport.mjs apps/api/tests/unit/phase29_product_passport.spec.ts
      - name: Verify Phase 29 contract
        run: node scripts/verify-phase29-product-passport.mjs
      - name: Commit formatting and remove materializer
        run: |
          git rm .github/workflows/phase29-contract-format-materialize.yml
          git add docs/api/package.json docs/api/scripts/merge-admin-spec.js scripts/verify-phase29-product-passport.mjs apps/api/tests/unit/phase29_product_passport.spec.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(api): format Phase 29 contracts"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
