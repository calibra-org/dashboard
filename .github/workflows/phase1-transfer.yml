name: Phase 1 transfer

on:
  push:
    branches:
      - agent/phase1-transfer-staging-20260810
    paths:
      - .transfer/READY

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble selected transfer blob
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          id="$(tr -d '\r\n' < .transfer/READY)"
          test -n "$id"
          mkdir -p .transfer-output
          sha="$(awk -v id="$id" '$1 == id { print $2 }' .transfer/MANIFEST)"
          codec="$(awk -v id="$id" '$1 == id { print $3 }' .transfer/MANIFEST)"
          codec="${codec:-gzip}"
          if [ -n "$sha" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/git/blobs/$sha" --jq .content \
              | tr -d '\r\n' | base64 --decode \
              | tr -d '\r\n' | base64 --decode > /tmp/phase1-transfer.bin
            case "$codec" in
              gzip) gzip -dc /tmp/phase1-transfer.bin > ".transfer-output/blob-$id" ;;
              bzip2) bzip2 -dc /tmp/phase1-transfer.bin > ".transfer-output/blob-$id" ;;
              *) echo "Unsupported codec: $codec" >&2; exit 2 ;;
            esac
          else
            dir=".transfer/blob-$id"
            test -d "$dir"
            cat "$dir"/*.part | tr -d '\r\n' | base64 --decode | gzip -d > ".transfer-output/blob-$id"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ".transfer-output/blob-$id"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: assemble phase1 $id blob"
          git push origin "HEAD:${GITHUB_REF_NAME}"
