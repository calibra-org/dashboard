name: Phase 1 transfer

on:
  push:
    branches:
      - agent/phase1-transfer-staging-20260810
    paths:
      - .transfer/READY

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble selected transfer blob
        shell: bash
        run: |
          set -euo pipefail
          id="$(tr -d '\r\n' < .transfer/READY)"
          test -n "$id"
          dir=".transfer/blob-$id"
          test -d "$dir"
          mkdir -p .transfer-output
          cat "$dir"/*.part | tr -d '\r\n' | base64 --decode | gzip -d > ".transfer-output/blob-$id"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ".transfer-output/blob-$id"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: assemble phase1 $id blob"
          git push origin "HEAD:${GITHUB_REF_NAME}"
