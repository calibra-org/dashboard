name: Phase 1 transfer

on:
  push:
    branches:
      - agent/phase1-transfer-staging-20260810
    paths:
      - .transfer/READY

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble transfer blobs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .transfer-output
          shopt -s nullglob
          for dir in .transfer/blob-*; do
            [ -d "$dir" ] || continue
            id="$(basename "$dir")"
            cat "$dir"/*.part | tr -d '\r\n' | base64 --decode > ".transfer-output/$id"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .transfer-output
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: assemble phase1 transfer blobs"
          git push origin "HEAD:${GITHUB_REF_NAME}"
