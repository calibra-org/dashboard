name: Restore canonical factor verifier

on:
  push:
    branches:
      - agent/phase7-identity-trust-os

permissions:
  contents: write

concurrency:
  group: restore-factor-verifier
  cancel-in-progress: false

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase7-identity-trust-os
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Restore full verifier and apply canonical top-level navigation invariant
        run: |
          git show 93e993216b11ff8a7fc226eb22a10b9605eec5a1:scripts/verify-factor-integration.mjs > scripts/verify-factor-integration.mjs
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'scripts/verify-factor-integration.mjs';
          let source = fs.readFileSync(file, 'utf8');
          const oldCheck = `pass(
              sidebar.includes('"factor-sidebar-items"') &&
                  sidebar.includes('navT("factor")') &&
                  !sidebar.includes('group.titleKey === "sales"'),
              "Factor must be a first-level navigation heading, not nested under Sales",
          );`;
          const replacement = `const primaryWorkspaceStart = sidebar.indexOf("{groups.slice(0, 3).map");
          const primaryWorkspaceEnd = sidebar.indexOf("{groups.slice(3).map");
          const primaryWorkspaceIds = [
              '"factor-sidebar-items"',
              '"content-sidebar-items"',
              '"seo-sidebar-items"',
              '"ticket-sidebar-items"',
          ];
          pass(
              primaryWorkspaceStart >= 0 && primaryWorkspaceEnd > primaryWorkspaceStart,
              "Primary workspace navigation boundary is missing",
          );
          for (const id of primaryWorkspaceIds) {
              const index = sidebar.indexOf(id, primaryWorkspaceStart);
              pass(
                  index > primaryWorkspaceStart && index < primaryWorkspaceEnd,
                  \`${'${id}'} must be rendered as a first-level navigation heading\`,
              );
          }
          pass(!sidebar.includes('group.titleKey === "sales"'), "Primary workspaces must not be nested under Sales");`;
          if (!source.includes(oldCheck)) throw new Error('Canonical Factor top-level assertion not found');
          source = source.replace(oldCheck, replacement);
          fs.writeFileSync(file, source);
          NODE
          pnpm exec biome format --write scripts/verify-factor-integration.mjs

      - name: Verify restored Phase 1-4 contracts
        run: pnpm run verify:phase1-4

      - name: Verify Phase 6 and 7 contracts
        run: |
          if [ -f scripts/verify-phase6-configuration-integration.mjs ]; then node scripts/verify-phase6-configuration-integration.mjs; fi
          node scripts/verify-phase7-identity-integration.mjs

      - name: Verify repository formatting and type safety
        run: |
          pnpm run format
          pnpm run typecheck

      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/restore-factor-verifier.yml
          git config user.name "calibra-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(tests): restore canonical factor verifier and menu invariants"
          git push origin HEAD:agent/phase7-identity-trust-os
