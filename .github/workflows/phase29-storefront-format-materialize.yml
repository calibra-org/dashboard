name: Phase 29 Storefront Format Materializer

on:
  pull_request:
    paths:
      - ".github/workflows/phase29-storefront-format-materialize.yml"

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/phase29-product-passport-20260825'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - run: npm install --global pnpm@10.32.1
      - run: pnpm install --frozen-lockfile
      - name: Format Phase 29 storefront
        run: pnpm exec biome check --write "apps/web/src/app/[locale]/passport/[resolverKey]/page.tsx" docs/api/package.json docs/api/scripts/merge-storefront-spec.js
      - name: Commit and remove materializer
        run: |
          git rm .github/workflows/phase29-storefront-format-materialize.yml
          git add "apps/web/src/app/[locale]/passport/[resolverKey]/page.tsx" docs/api/package.json docs/api/scripts/merge-storefront-spec.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(web): format Phase 29 passport resolver"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
