name: Phase 21 Admin SDK Sync

on:
  push:
    branches:
      - agent/phase21-agentic-commerce-gateway
    paths:
      - .github/workflows/phase21-admin-sdk-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    env:
      NODE_VERSION: 24.14.0
      PNPM_VERSION: 10.32.1
    steps:
      - name: Checkout Phase 21 branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase21-agentic-commerce-gateway
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install --global pnpm@${PNPM_VERSION}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate admin SDK and self-clean
        shell: bash
        run: |
          set -e
          pnpm --filter @calibra/sdk run codegen:admin
          rm -f .github/workflows/phase21-admin-sdk-sync.yml
          git add packages/sdk/src/generated/admin.d.ts .github/workflows/phase21-admin-sdk-sync.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync Phase 17 OpenAPI SDK description"
          git push origin HEAD:agent/phase21-agentic-commerce-gateway
