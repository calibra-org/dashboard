name: PR160 Repair

on:
    pull_request:
        branches: ["main"]

permissions:
    contents: write

env:
    NODE_VERSION: "24.14.0"
    PNPM_VERSION: "10.32.1"

jobs:
    repair:
        if: github.event.pull_request.number == 160 && github.head_ref == 'chore/deps-safe-cohort-vitest-compat'
        runs-on: ubuntu-latest
        timeout-minutes: 12
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.head.ref }}
                  repository: ${{ github.event.pull_request.head.repo.full_name }}
            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ env.NODE_VERSION }}
            - run: npm install --global pnpm@${PNPM_VERSION}
            - name: Install current graph
              run: pnpm install --frozen-lockfile --ignore-scripts
            - name: Pin Playwright catalog to the audit version
              run: |
                  python - <<'PY'
                  from pathlib import Path
                  path = Path("pnpm-workspace.yaml")
                  text = path.read_text()
                  old = '        "@playwright/test": ^1.59.1'
                  new = '        "@playwright/test": 1.62.1'
                  if old not in text:
                      raise SystemExit("expected Playwright catalog entry not found")
                  path.write_text(text.replace(old, new, 1))
                  PY
            - name: Regenerate lockfile from manifests
              run: pnpm install --lockfile-only --ignore-scripts
            - name: Format the failing source with repository Biome
              run: pnpm exec biome format apps/api/app/services/media_storage.ts --write
            - name: Validate frozen lockfile and Playwright resolution
              run: |
                  pnpm install --frozen-lockfile --ignore-scripts
                  test "$(pnpm --filter @calibra/admin exec playwright --version)" = "Version 1.62.1"
                  pnpm run format
            - name: Commit repaired files and remove repair workflow
              run: |
                  rm .github/workflows/pr160-repair.yml
                  git config user.name "calibra-ci"
                  git config user.email "calibra-ci@users.noreply.github.com"
                  git add pnpm-workspace.yaml pnpm-lock.yaml apps/api/app/services/media_storage.ts .github/workflows/pr160-repair.yml
                  if git diff --cached --quiet; then
                      exit 0
                  fi
                  git commit -m "fix(ci): align Playwright lock and format media storage"
                  git push origin HEAD:${{ github.event.pull_request.head.ref }}
