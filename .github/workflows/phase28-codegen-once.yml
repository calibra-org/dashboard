name: Phase 28 SDK Materializer

on:
  push:
    branches:
      - feat/phase28-objective-autonomy-20260825
    paths:
      - ".github/workflows/phase28-codegen-once.yml"

permissions:
  contents: write

jobs:
  codegen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase28-objective-autonomy-20260825
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - run: npm install --global pnpm@10.32.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @calibra/sdk run codegen
      - name: Commit generated Phase 28 SDK
        run: |
          git config user.name "calibra-phase28-ci"
          git config user.email "actions@users.noreply.github.com"
          git add packages/sdk/src/generated docs/api/dist || true
          git commit -m "chore(sdk): generate Phase 28 objective autonomy types" || exit 0
          git push origin HEAD:feat/phase28-objective-autonomy-20260825
