name: Phase 29 Product Passport Integrity

on:
  pull_request:
    paths:
      - "apps/api/database/migrations/1800000000000_create_product_passport_os.ts"
      - "apps/api/app/services/product_passport/**"
      - "apps/api/app/controllers/admin/product_passport_controller.ts"
      - "apps/api/app/controllers/product_passport_public_controller.ts"
      - "apps/api/app/validators/product_passport/**"
      - "apps/api/start/routes/admin_product_passports.ts"
      - "apps/api/start/routes/product_passports_public.ts"
      - "apps/api/start/routes.ts"
      - "apps/api/tests/unit/phase29_product_passport.spec.ts"
      - "apps/admin/src/features/product-passport/**"
      - "apps/admin/src/lib/queries/product-passport.ts"
      - "apps/admin/src/app/**/product-passports/**"
      - "apps/admin/src/components/Sidebar.tsx"
      - "apps/web/src/app/**/passport/**"
      - "docs/api/reference/openapi/admin.phase29.v1.yaml"
      - "docs/api/reference/openapi/storefront.phase29.v1.yaml"
      - "docs/api/package.json"
      - "docs/api/scripts/merge-admin-spec.js"
      - "docs/api/scripts/merge-storefront-spec.js"
      - "docs/calibra/phase29-product-passport-conformance-posture.md"
      - "packages/sdk/src/generated/admin.d.ts"
      - "packages/sdk/src/generated/storefront.d.ts"
      - "scripts/verify-phase29-product-passport.mjs"
      - ".github/workflows/phase29-product-passport-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase29-product-passport-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: calibra
          POSTGRES_PASSWORD: calibra
          POSTGRES_DB: calibra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U calibra -d calibra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - run: npm install --global pnpm@10.32.1
      - run: pnpm install --frozen-lockfile
      - name: Create test database
        env:
          PGPASSWORD: calibra
        run: psql -h localhost -U calibra -d calibra -c "CREATE DATABASE calibra_test OWNER calibra;"
      - name: Phase 29 format integrity
        run: >-
          pnpm exec biome check
          apps/api/database/migrations/1800000000000_create_product_passport_os.ts
          apps/api/app/services/product_passport
          apps/api/app/controllers/admin/product_passport_controller.ts
          apps/api/app/controllers/product_passport_public_controller.ts
          apps/api/app/validators/product_passport
          apps/api/start/routes/admin_product_passports.ts
          apps/api/start/routes/product_passports_public.ts
          apps/api/tests/unit/phase29_product_passport.spec.ts
          apps/admin/src/lib/queries/product-passport.ts
          apps/admin/src/features/product-passport/ProductPassportWorkspace.tsx
          "apps/admin/src/app/[locale]/(authenticated)/products/product-passports/page.tsx"
          apps/admin/src/components/Sidebar.tsx
          "apps/web/src/app/[locale]/passport/[resolverKey]/page.tsx"
          docs/api/package.json
          docs/api/scripts/merge-admin-spec.js
          docs/api/scripts/merge-storefront-spec.js
          scripts/verify-phase29-product-passport.mjs
      - name: Phase 29 static contract
        run: node scripts/verify-phase29-product-passport.mjs
      - name: Phase 29 public-boundary unit controls
        working-directory: apps/api
        run: pnpm test --force-exit --suite=unit --files='phase29_product_passport'
      - name: API typecheck
        run: pnpm --filter @calibra/api run typecheck
      - name: Phase 29 OpenAPI bundles
        run: |
          pnpm --filter @calibra/api-docs run build:json:admin-phase29
          pnpm --filter @calibra/api-docs run build:json:storefront-phase29
      - name: OpenAPI and SDK drift check
        run: pnpm --filter @calibra/sdk run codegen:check
      - name: Build SDK dependency
        run: pnpm --filter @calibra/sdk run build
      - name: Admin typecheck
        run: pnpm --filter @calibra/admin run typecheck
      - name: Admin production build
        run: pnpm --filter @calibra/admin run build
      - name: Storefront typecheck
        run: pnpm --filter @calibra/web run typecheck
      - name: Storefront production build
        run: pnpm --filter @calibra/web run build
