name: PR16 Final Gate
on:
  push:
    branches: ["agent/runtime-hardening-20260814"]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: calibra
          POSTGRES_PASSWORD: calibra
          POSTGRES_DB: calibra
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U calibra -d calibra"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NODE_ENV: test
      PORT: "3334"
      HOST: 0.0.0.0
      APP_NAME: calibra-api
      APP_KEY: ci-only-key-not-used-for-real-secrets
      LOG_LEVEL: warn
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: calibra
      DB_PASSWORD: calibra
      DB_DATABASE: calibra
      MAIL_FROM_ADDRESS: ops@calibra.local
      MAIL_FROM_NAME: Calibra
      MAIL_NOTIFICATIONS_ENABLED: "false"
      SMTP_HOST: localhost
      SMTP_PORT: "11025"
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      TRANSMIT_TRANSPORT: none
      QUEUE_DRIVER: sync
      LIMITER_STORE: memory
      CACHE_DRIVER: memory
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Repair proven OpenAPI compatibility defects
        run: |
          node <<'NODE'
          const fs = require('fs');

          function replaceRequired(path, from, to, label) {
            let s = fs.readFileSync(path, 'utf8');
            if (s.includes(from)) {
              s = s.replace(from, to);
              fs.writeFileSync(path, s);
              return;
            }
            if (!s.includes(to)) throw new Error(label + ' anchor not found');
          }

          replaceRequired(
            'docs/api/reference/openapi/storefront.completion.v1.yaml',
            '"404": { description: Tracking token invalid, expired, revoked, or outside the current tenant }',
            '"404": { description: "Tracking token invalid, expired, revoked, or outside the current tenant" }',
            'support tracking 404'
          );
          replaceRequired(
            'docs/api/reference/openapi/admin.tickets.v1.yaml',
            '"422": { description: Invalid ticket, customer, or assignee. }',
            '"422": { description: "Invalid ticket, customer, or assignee." }',
            'ticket 422'
          );
          replaceRequired(
            'docs/api/reference/openapi/admin.phase5.v1.yaml',
            "'409': { description: Idempotency, concurrency or over-fulfillment conflict }",
            "'409': { description: 'Idempotency, concurrency or over-fulfillment conflict' }",
            'fulfillment 409'
          );
          replaceRequired(
            'docs/api/reference/openapi/admin.phase5.v1.yaml',
            "'409': { description: Idempotency, concurrency or over-return conflict }",
            "'409': { description: 'Idempotency, concurrency or over-return conflict' }",
            'return 409'
          );

          const adminPath = 'docs/api/reference/openapi/admin.v1.yaml';
          let s = fs.readFileSync(adminPath, 'utf8');
          const misplaced = '    /api/v1/admin/payment-attempts/{id}:\n        get:\n            $ref: "./admin/paths/payments/payment-attempts-id.get.yaml"\n\n    /api/v1/admin/payment-attempts/summary:\n        get:\n            $ref: "./admin/paths/payments/payment-attempts-summary.get.yaml"\n\n    /api/v1/admin/payment-attempts/{id}/reconciliation:\n        get:\n            $ref: "./admin/paths/payments/payment-attempts-id-reconciliation.get.yaml"\n\n    /api/v1/admin/payment-attempts/{id}/reconcile:\n        post:\n            $ref: "./admin/paths/payments/payment-attempts-id-reconcile.post.yaml"\n\n        head:\n            $ref: "./common/components/operations/HeadCompanion.yaml"\n';
          const corrected = '    /api/v1/admin/payment-attempts/{id}:\n        get:\n            $ref: "./admin/paths/payments/payment-attempts-id.get.yaml"\n        head:\n            $ref: "./common/components/operations/HeadCompanion.yaml"\n\n    /api/v1/admin/payment-attempts/summary:\n        get:\n            $ref: "./admin/paths/payments/payment-attempts-summary.get.yaml"\n\n    /api/v1/admin/payment-attempts/{id}/reconciliation:\n        get:\n            $ref: "./admin/paths/payments/payment-attempts-id-reconciliation.get.yaml"\n\n    /api/v1/admin/payment-attempts/{id}/reconcile:\n        post:\n            $ref: "./admin/paths/payments/payment-attempts-id-reconcile.post.yaml"\n';
          if (s.includes(misplaced)) {
            s = s.replace(misplaced, corrected);
            fs.writeFileSync(adminPath, s);
          } else if (!s.includes(corrected)) {
            throw new Error('payment attempts HEAD contract anchor not found');
          }

          const mergerPath = 'docs/api/scripts/merge-for-tests.js';
          s = fs.readFileSync(mergerPath, 'utf8');
          const anchor = '    if (!node || typeof node !== "object") return;\n\n    if (Array.isArray(node.type)) {';
          const replacement = '    if (!node || typeof node !== "object") return;\n\n    if (Object.prototype.hasOwnProperty.call(node, "const")) {\n        const constValue = node.const;\n        delete node.const;\n        node.enum = [constValue];\n    }\n\n    if (Array.isArray(node.type)) {';
          if (s.includes(anchor)) {
            s = s.replace(anchor, replacement);
            fs.writeFileSync(mergerPath, s);
          } else if (!s.includes('Object.prototype.hasOwnProperty.call(node, "const")')) {
            throw new Error('test OpenAPI const downgrade anchor not found');
          }
          NODE

      - name: Regenerate contracts and normalize formatting
        run: |
          pnpm --filter @calibra/api-docs run build:json
          pnpm --filter @calibra/sdk run codegen
          pnpm run format:fix

      - name: Verify legacy test OpenAPI schema
        run: |
          pnpm --filter @calibra/api-docs run build:test-spec
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const dir = fs.readdirSync('node_modules/.pnpm').find((name) => name.startsWith('api-schema-builder@'));
          if (!dir) throw new Error('api-schema-builder package directory not found');
          const builder = require(path.resolve('node_modules/.pnpm', dir, 'node_modules/api-schema-builder'));
          builder.buildSchemaSync(path.resolve('docs/api/dist/_merged.test.json'));
          console.log('legacy OpenAPI validator accepted merged schema');
          NODE

      - name: Create test database
        env:
          PGPASSWORD: calibra
        run: psql -h localhost -U calibra -d calibra -c "CREATE DATABASE calibra_test OWNER calibra;"

      - name: Verify API route sync
        working-directory: apps/api
        run: node ace check:api-docs

      - name: Run Phase 5 and payment regressions
        working-directory: apps/api
        run: |
          timeout 240s pnpm test --files=tests/functional/admin/phase5_operations.spec.ts
          timeout 240s pnpm test --files=tests/functional/admin/phase5_operations_hardening.spec.ts
          timeout 240s pnpm test --files=tests/functional/payments/payment_callback_failures.spec.ts

      - name: Run frontend/unit regression tests
        run: pnpm --filter @calibra/sdk --filter @calibra/admin --filter @calibra/spin run test

      - name: Run release verifiers and static gates
        run: |
          pnpm run verify:phase1-4
          pnpm run verify:phase5
          pnpm --filter @calibra/sdk run codegen:check
          pnpm run format
          pnpm run lint
          pnpm run typecheck
          pnpm run build

      - name: Commit verified clean branch
        run: |
          git config user.name calibra-dev
          git config user.email keshavarz20.com@gmail.com
          git rm .github/workflows/pr16-final-gate.yml
          git add -A
          git commit -m 'fix(api): finalize Phase 5 runtime and contract hardening'
          git push origin HEAD:agent/runtime-hardening-20260814
