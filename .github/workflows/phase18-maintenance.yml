name: Phase18 Maintenance

on:
  push:
    branches:
      - agent/phase18-pricing-promotion-main-20260818
    paths:
      - '.github/workflows/phase18-maintenance.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase18-pricing-promotion-main-20260818
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - run: npm install --global pnpm@10.32.1
      - run: pnpm install --frozen-lockfile
      - name: Add one canonical Phase 18 sidebar entry
        run: >-
          node -e 'const fs=require("node:fs"); const p="apps/admin/src/components/Sidebar.tsx"; let s=fs.readFileSync(p,"utf8"); const old="items: [{ href: \"/economics\", labelKey: \"economics\", icon: Wallet }],"; const next="items: [\n            { href: \"/economics\", labelKey: \"economics\", icon: Wallet },\n            { href: \"/pricing-brain\", label: \"مغز قیمت‌گذاری\", icon: Sparkles },\n        ],"; if(!s.includes(next)){if(!s.includes(old)) throw new Error("Phase18 sidebar anchor changed"); s=s.replace(old,next); fs.writeFileSync(p,s)}'
      - name: Format only Phase 18 source files
        run: |
          pnpm exec biome format --write \
            apps/admin/src/components/Sidebar.tsx \
            apps/admin/src/app/'[locale]'/'(authenticated)'/pricing-brain/page.tsx \
            apps/admin/src/features/pricing-brain/actions.ts \
            apps/admin/src/features/pricing-brain/pricing-brain-dashboard.tsx \
            apps/api/app/abilities/main.ts \
            apps/api/app/controllers/admin/pricing_brain_controller.ts \
            apps/api/app/services/pricing_brain_service.ts \
            apps/api/app/services/pricing_decision_engine.ts \
            apps/api/app/validators/admin/pricing_brain_validator.ts \
            apps/api/start/routes/admin_pricing_brain.ts \
            apps/api/tests/unit/pricing/pricing_decision_engine.spec.ts \
            docs/api/package.json \
            docs/api/scripts/merge-admin-spec.js
      - name: Regenerate SDK strictly from composed OpenAPI
        run: pnpm --filter @calibra/sdk run codegen
      - name: Commit generated Phase 18 normalization
        run: |
          git config user.name 'calibra-phase18-bot'
          git config user.email 'calibra-phase18-bot@users.noreply.github.com'
          git add \
            apps/admin/src/components/Sidebar.tsx \
            apps/admin/src/app/'[locale]'/'(authenticated)'/pricing-brain/page.tsx \
            apps/admin/src/features/pricing-brain/actions.ts \
            apps/admin/src/features/pricing-brain/pricing-brain-dashboard.tsx \
            apps/api/app/abilities/main.ts \
            apps/api/app/controllers/admin/pricing_brain_controller.ts \
            apps/api/app/services/pricing_brain_service.ts \
            apps/api/app/services/pricing_decision_engine.ts \
            apps/api/app/validators/admin/pricing_brain_validator.ts \
            apps/api/start/routes/admin_pricing_brain.ts \
            apps/api/tests/unit/pricing/pricing_decision_engine.spec.ts \
            docs/api/package.json \
            docs/api/scripts/merge-admin-spec.js \
            packages/sdk/src/generated/admin.d.ts
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'chore(phase18): normalize source and regenerate SDK'
            git push origin HEAD:agent/phase18-pricing-promotion-main-20260818
          fi