name: Phase 7 Lint Fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    env:
      NODE_VERSION: "24.14.0"
      PNPM_VERSION: "10.32.1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase7-identity-trust-os
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply exact lint repairs
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          function read(path) { return fs.readFileSync(path, 'utf8'); }
          function write(path, value) { fs.writeFileSync(path, value, 'utf8'); }
          function replaceExact(path, from, to) {
            const source = read(path);
            if (!source.includes(from)) throw new Error(`Repair anchor not found: ${path}`);
            write(path, source.replace(from, to));
          }

          replaceExact(
            'apps/admin/src/views/store-config/settings/configuration-overview.tsx',
            'const CATEGORIES = ["site", "commerce", "communications", "governance", "developer", "change_management"] as const;\n',
            'const CATEGORIES = ["site", "commerce", "communications", "governance", "developer", "change_management"] as const;\nconst CONFIGURATION_SKELETON_KEYS = ["configuration-1", "configuration-2", "configuration-3", "configuration-4", "configuration-5", "configuration-6"] as const;\n',
          );
          replaceExact(
            'apps/admin/src/views/store-config/settings/configuration-overview.tsx',
            '{Array.from({ length: 6 }).map((_, index) => (\n                            <div key={index} className="h-44 animate-pulse rounded-xl border bg-muted/35" />\n                        ))}',
            '{CONFIGURATION_SKELETON_KEYS.map((key) => (\n                            <div key={key} className="h-44 animate-pulse rounded-xl border bg-muted/35" />\n                        ))}',
          );

          replaceExact(
            'apps/admin/src/views/store-config/shipping/shipping-zones-view.tsx',
            'const LOCATION_TYPES = ["country", "state", "postcode", "continent"] as const;\n',
            'const LOCATION_TYPES = ["country", "state", "postcode", "continent"] as const;\ntype EditableLocation = { clientKey: string; type: (typeof LOCATION_TYPES)[number]; code: string };\n',
          );
          replaceExact(
            'apps/admin/src/views/store-config/shipping/shipping-zones-view.tsx',
            '    const [locations, setLocations] = useState(zone.locations.map((item) => ({ type: item.type, code: item.code })));',
            '    const [locations, setLocations] = useState<EditableLocation[]>(() =>\n        zone.locations.map((item) => ({\n            clientKey: crypto.randomUUID(),\n            type: item.type as EditableLocation["type"],\n            code: item.code,\n        })),\n    );',
          );
          replaceExact(
            'apps/admin/src/views/store-config/shipping/shipping-zones-view.tsx',
            'onClick={() => setLocations((current) => [...current, { type: "country", code: "" }])}',
            'onClick={() => setLocations((current) => [...current, { clientKey: crypto.randomUUID(), type: "country", code: "" }])}',
          );
          replaceExact(
            'apps/admin/src/views/store-config/shipping/shipping-zones-view.tsx',
            '<div key={`${location.type}-${index}`} className="grid gap-2 sm:grid-cols-[150px_minmax(0,1fr)_auto]">',
            '<div key={location.clientKey} className="grid gap-2 sm:grid-cols-[150px_minmax(0,1fr)_auto]">',
          );
          replaceExact(
            'apps/admin/src/views/store-config/shipping/shipping-zones-view.tsx',
            'onClick={() => replaceLocations.mutate(locations.map((item) => ({ ...item, code: item.code.trim() })))}',
            'onClick={() => replaceLocations.mutate(locations.map((item) => ({ type: item.type, code: item.code.trim() })))}',
          );

          replaceExact(
            'apps/admin/src/views/transactions/transactions-center.tsx',
            'import { type KeyboardEvent, type ReactNode, useDeferredValue, useMemo, useState } from "react";',
            'import { type ReactNode, useDeferredValue, useMemo, useState } from "react";',
          );
          replaceExact(
            'apps/admin/src/views/transactions/transactions-center.tsx',
            '{Array.from({ length: 8 }).map((_, index) => (\n                            <Skeleton key={index} className="h-12 w-full" />\n                        ))}',
            '{["transaction-1", "transaction-2", "transaction-3", "transaction-4", "transaction-5", "transaction-6", "transaction-7", "transaction-8"].map((key) => (\n                            <Skeleton key={key} className="h-12 w-full" />\n                        ))}',
          );
          replaceExact(
            'apps/admin/src/views/transactions/transactions-center.tsx',
            '    const onKeyDown = (event: KeyboardEvent<HTMLTableRowElement>) => {\n        if (event.key === "Enter" || event.key === " ") {\n            event.preventDefault();\n            onOpen();\n        }\n    };\n    return (\n        <tr\n            tabIndex={0}\n            role="button"\n            aria-label={`${detailsLabel} #${row.id}`}\n            className="cursor-pointer border-b outline-none transition-colors last:border-0 hover:bg-muted/35 focus-visible:bg-muted/50 focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-ring"\n            onClick={onOpen}\n            onKeyDown={onKeyDown}\n        >\n            <td className="px-4 py-3 font-semibold">#{formatNumber(row.id, locale)}</td>',
            '    return (\n        <tr className="border-b transition-colors last:border-0 hover:bg-muted/35">\n            <td className="px-4 py-3 font-semibold">\n                <button\n                    type="button"\n                    aria-label={`${detailsLabel} #${row.id}`}\n                    className="rounded-sm font-semibold outline-none hover:text-primary hover:underline focus-visible:ring-2 focus-visible:ring-ring"\n                    onClick={onOpen}\n                >\n                    #{formatNumber(row.id, locale)}\n                </button>\n            </td>',
          );

          replaceExact(
            'apps/api/app/services/payment_reconciliation_service.ts',
            'import type { ProviderPaymentStatus, ReconcileResult } from "#services/adapters/base_redirect_gateway";',
            'import type { PaymentAdapter, ProviderPaymentStatus, ReconcileResult } from "#services/adapters/base_redirect_gateway";',
          );
          replaceExact(
            'apps/api/app/services/payment_reconciliation_service.ts',
            '            let adapter;',
            '            let adapter: PaymentAdapter;',
          );
          NODE
      - name: Format and verify repaired lint surface
        run: |
          pnpm format:fix
          pnpm exec biome lint . --max-diagnostics=1000 --diagnostic-level=error
          pnpm run typecheck
      - name: Commit production-only repair
        run: |
          rm -f .github/workflows/phase7-lint-errors.yml .github/workflows/phase7-lint-fix.yml .github/workflows/phase7-lint-diagnostic.yml
          git config user.name "calibra-dev"
          git config user.email "calibra-dev@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(identity): close repository lint gates"
          git push origin HEAD:agent/phase7-identity-trust-os
