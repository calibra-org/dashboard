name: Apply Finalize Carrier

on:
  push:
    branches:
      - agent/complete-ticket-seo-content-backends-20260814

permissions:
  contents: write

jobs:
  apply-finalize:
    if: contains(github.event.head_commit.message, '[apply-finalize-carrier]')
    runs-on: ubuntu-24.04
    env:
      FORCE_COLOR: 3
      TURBO_TELEMETRY_DISABLED: 1
      DO_NOT_TRACK: 1
      NODE_VERSION: 24.14.0
      PNPM_VERSION: 10.32.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Reconstruct and apply verified patch
        shell: bash
        run: |
          set -euo pipefail
          cat .finalize-carrier/part-* > /tmp/finalize.patch.xz.b64
          echo "68cd07c81b64c502718cfdd3ceba5dc823f4adb2b92afeb1eb5fa44efa8a1a90  /tmp/finalize.patch.xz.b64" | sha256sum -c -
          base64 -d /tmp/finalize.patch.xz.b64 > /tmp/finalize.patch.xz
          echo "ad04041bc41d0aac5a45b81c9efecf95a9d53325ba05c7f442b98649585eff13  /tmp/finalize.patch.xz" | sha256sum -c -
          xz -dc /tmp/finalize.patch.xz > /tmp/finalize.patch
          echo "4cf49e8c566cb7ff7121badd8ff3f5ba18adf6e3fce3c9b85cb2c9c60c70fc56  /tmp/finalize.patch" | sha256sum -c -
          git apply --check /tmp/finalize.patch
          git apply /tmp/finalize.patch
          python3 - <<'PY'
          from pathlib import Path

          def replace(path_str: str, old: str, new: str) -> None:
              path = Path(path_str)
              source = path.read_text()
              if old not in source:
                  raise SystemExit(f"expected source fragment missing in {path_str}: {old[:80]!r}")
              path.write_text(source.replace(old, new, 1))

          replace(
              "apps/admin/src/components/Sidebar.tsx",
              'aria-label={ticketsT("unread", { count: badge })}',
              'title={ticketsT("unread", { count: badge })}',
          )

          replace(
              "apps/admin/src/features/content/settings-page.tsx",
              "    }, [settings.data]);",
              "    }, [settings.data, copyT]);",
          )

          shipping = Path("apps/admin/src/views/store-config/shipping/shipping-zones-view.tsx")
          source = shipping.read_text()
          source = source.replace(
              'const LOCATION_TYPES = ["country", "state", "postcode", "continent"] as const;\n',
              'const LOCATION_TYPES = ["country", "state", "postcode", "continent"] as const;\nlet nextTemporaryLocationId = -1;\n',
              1,
          )
          source = source.replace(
              'const [locations, setLocations] = useState(zone.locations.map((item) => ({ type: item.type, code: item.code })));',
              'const [locations, setLocations] = useState(zone.locations.map((item) => ({ id: item.id, type: item.type, code: item.code })));',
              1,
          )
          source = source.replace(
              'onClick={() => setLocations((current) => [...current, { type: "country", code: "" }])}',
              'onClick={() => setLocations((current) => [...current, { id: nextTemporaryLocationId--, type: "country", code: "" }])}',
              1,
          )
          source = source.replace(
              '<div key={`${location.type}-${index}`} className="grid gap-2 sm:grid-cols-[150px_minmax(0,1fr)_auto]">',
              '<div key={location.id} className="grid gap-2 sm:grid-cols-[150px_minmax(0,1fr)_auto]">',
              1,
          )
          source = source.replace(
              'onClick={() => replaceLocations.mutate(locations.map((item) => ({ ...item, code: item.code.trim() })))}',
              'onClick={() => replaceLocations.mutate(locations.map((item) => ({ type: item.type, code: item.code.trim() })))}',
              1,
          )
          shipping.write_text(source)

          transactions = Path("apps/admin/src/views/transactions/transactions-center.tsx")
          source = transactions.read_text()
          source = source.replace(
              'const RECONCILIATION: PaymentReconciliationStatus[] = ["unchecked", "matched", "mismatch", "unsupported", "error"];\n',
              'const RECONCILIATION: PaymentReconciliationStatus[] = ["unchecked", "matched", "mismatch", "unsupported", "error"];\nconst TRANSACTION_SKELETON_KEYS = ["transaction-1", "transaction-2", "transaction-3", "transaction-4", "transaction-5", "transaction-6", "transaction-7", "transaction-8"] as const;\n',
              1,
          )
          source = source.replace(
              '{Array.from({ length: 8 }).map((_, index) => (\n                            <Skeleton key={index} className="h-12 w-full" />\n                        ))}',
              '{TRANSACTION_SKELETON_KEYS.map((key) => (\n                            <Skeleton key={key} className="h-12 w-full" />\n                        ))}',
              1,
          )
          source = source.replace(
              '    return (\n        <tr\n            tabIndex={0}\n            role="button"',
              '    return (\n        // biome-ignore lint/a11y/useSemanticElements: A button cannot replace a table row without invalid table markup; keyboard activation is implemented below.\n        <tr\n            tabIndex={0}\n            role="button"',
              1,
          )
          transactions.write_text(source)

          reconciliation = Path("apps/api/app/services/payment_reconciliation_service.ts")
          source = reconciliation.read_text()
          source = source.replace(
              'import type { ProviderPaymentStatus, ReconcileResult } from "#services/adapters/base_redirect_gateway";',
              'import type { PaymentAdapter, ProviderPaymentStatus, ReconcileResult } from "#services/adapters/base_redirect_gateway";',
              1,
          )
          source = source.replace('            let adapter;\n', '            let adapter: PaymentAdapter;\n', 1)
          reconciliation.write_text(source)
          PY
          rm -rf .finalize-carrier
          rm -f .github/workflows/apply-finalize-carrier.yml
          rm -f .github/workflows/finalize-artifacts.yml
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply canonical formatting
        shell: bash
        run: pnpm exec biome check --write --max-diagnostics=500 . || true
      - name: Capture Biome diagnostics
        shell: bash
        run: |
          set -o pipefail
          pnpm exec biome check --max-diagnostics=500 . 2>&1 | tee /tmp/biome.log
      - name: Upload Biome diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biome-diagnostics-${{ github.sha }}
          path: /tmp/biome.log
          if-no-files-found: error
          retention-days: 1
      - name: Regenerate canonical SDK
        run: pnpm --filter @calibra/sdk run codegen
      - name: Verify release invariants
        run: |
          pnpm run verify:phase1-4
          pnpm run verify:phase5
          node scripts/verify-admin-localization-policy.mjs
          node scripts/verify-factor-integration.mjs
          node scripts/verify-seo-integration.mjs
          node scripts/verify-seo-search-engines.mjs
          node scripts/verify-tickets-integration.mjs
          node scripts/verify-ticket-seo-content-completion.mjs
          git diff --check
      - name: Typecheck and lint
        run: |
          pnpm run typecheck
          pnpm run lint
      - name: Commit finalized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: finalize phase closure and realtime/i18n"
          git push origin "HEAD:${GITHUB_REF_NAME}"
