name: Phase 9 lint diagnostics
on:
  pull_request:
    branches: [main]
jobs:
  lint-diagnostics:
    if: github.event.pull_request.head.ref == 'agent/phase9-final-main-20260818'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - run: npm install --global pnpm@10.32.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome lint . --max-diagnostics=500
