name: Phase 7 Lint Errors

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    env:
      NODE_VERSION: "24.14.0"
      PNPM_VERSION: "10.32.1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Show only error diagnostics
        shell: bash
        run: pnpm exec biome lint . --max-diagnostics=1000 --diagnostic-level=error || true
