name: Phase 16 Materialize Diagnostic

on:
  push:
    branches: [agent/phase16-discovery-os-final-20260818]

permissions:
  contents: read

concurrency:
  group: phase16-materialize-diag
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase16-discovery-os-final-20260818
          fetch-depth: 0

      - name: Extract audited payload
        run: |
          set -euo pipefail
          cat .phase16payload3/part_* > /tmp/p16h.b64
          echo "635802c91e43b067617afe97c0682b83d203b633c280b6900f2cfe70b770032c  /tmp/p16h.b64" | sha256sum -c -
          base64 -d /tmp/p16h.b64 | xz -d > /tmp/phase16.tar
          echo "cda3771619610ee71e33877d6fa512381acd3ed539d4af1730981827fae29bce  /tmp/phase16.tar" | sha256sum -c -
          tar -xf /tmp/phase16.tar -C /tmp
          cp .phase16payload3/harden2.py /tmp/harden2.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('/tmp/p16h/apply_phase16.py')
          s = p.read_text()
          pattern = r'''    marker=''' + "'''" + r'''[ \t]*\{collapsible\(\n[ \t]*"ticket-sidebar-items",''' + "'''"
          replacement = '''    marker=''' + "'''" + '''                    {collapsible(\n                        "ticket-sidebar-items",''' + "'''"
          s, count = re.subn(pattern, replacement, s, count=1)
          if count != 1:
              raise SystemExit('ticket marker definition missing')
          p.write_text(s)
          PY

      - name: Inspect materializer path contract
        run: |
          set -euxo pipefail
          grep -nE 'discovery_query_service|discovery_segment_service|services/discovery|admin_discovery|create_phase16_discovery|verify-phase16-discovery' /tmp/p16h/apply_phase16.py | sed -n '1,220p' || true
          find /tmp/p16h -maxdepth 3 -type f -print | sort | sed -n '1,220p'

      - name: Reset current main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Apply canonical Phase 16
        run: python3 /tmp/p16h/apply_phase16.py

      - name: Apply Phase 16 hardening
        run: python3 /tmp/harden2.py

      - name: Inspect materialized tree
        run: |
          set -euxo pipefail
          find apps/api/app -maxdepth 5 -type f \( -iname '*discovery*' -o -path '*/discovery/*' \) -print | sort | sed -n '1,260p'
          find apps/api/database/migrations -maxdepth 1 -type f -iname '*discovery*' -print | sort
          find scripts -maxdepth 1 -type f -iname '*phase16*' -print | sort
          git status --short | sed -n '1,320p'

      - name: Verify API services
        run: |
          set -euxo pipefail
          test -f apps/api/app/services/discovery_query_service.ts
          test -f apps/api/app/services/discovery_segment_service.ts
          test -f apps/api/app/validators/admin/discovery_validator.ts
          test -f apps/api/app/controllers/admin/discovery_controller.ts
          test -f apps/api/start/routes/admin_discovery.ts
          test -f apps/api/database/migrations/1768200000000_create_phase16_discovery_os.ts
          test -f scripts/verify-phase16-discovery.mjs

      - name: Verify route wiring
        run: grep -q 'admin_discovery.js' apps/api/start/routes.ts

      - name: Verify English nav message
        run: grep -q '"discovery": "Discovery"' apps/admin/messages/en.json

      - name: Verify Persian nav message
        run: grep -q '"discovery": "کشف"' apps/admin/messages/fa.json

      - name: Verify Sidebar wiring
        run: grep -q 'discovery-sidebar-items' apps/admin/src/components/Sidebar.tsx

      - name: Verify no swallowed discovery errors
        run: '! grep -R "catch(() => undefined)" apps/api/app/services/discovery apps/api/app/services/cache_invalidation.ts'
