name: Phase 18 Generated Finalizer

on:
  pull_request:
    paths:
      - ".github/workflows/phase18-finalize-generated.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: calibra
          POSTGRES_PASSWORD: calibra
          POSTGRES_DB: calibra
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U calibra -d calibra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
      - run: npm install --global pnpm@10.32.1
      - run: pnpm install --frozen-lockfile

      - name: Create test database
        env:
          PGPASSWORD: calibra
        run: psql -h localhost -U calibra -d calibra -c "CREATE DATABASE calibra_test OWNER calibra;"

      - name: Reuse the already-proven Phase 18 source patch
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs")
          const source = fs.readFileSync(".github/workflows/phase18-diagnostics.yml", "utf8")
          const startMarker = "          node <<'NODE'\n"
          const endMarker = "\n          NODE\n"
          const start = source.indexOf(startMarker)
          if (start < 0) throw new Error("Phase 18 source patch start marker not found")
          const bodyStart = start + startMarker.length
          const end = source.indexOf(endMarker, bodyStart)
          if (end < 0) throw new Error("Phase 18 source patch end marker not found")
          const body = source
            .slice(bodyStart, end)
            .split("\n")
            .map((line) => (line.startsWith("          ") ? line.slice(10) : line))
            .join("\n")
          fs.writeFileSync("/tmp/phase18-source-fix.cjs", `${body}\n`)
          NODE
          node /tmp/phase18-source-fix.cjs

      - name: Remove the one remaining unused governance parameter
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs")
          const path = "apps/admin/src/features/pricing-brain/pricing-governance.tsx"
          let source = fs.readFileSync(path, "utf8")
          const oldCall = "proposals.map((proposal) => <ProposalCard key={proposal.id} proposal={proposal} fa={fa} />)"
          const newCall = "proposals.map((proposal) => <ProposalCard key={proposal.id} proposal={proposal} />)"
          const oldSignature = "function ProposalCard({ proposal, fa }: { proposal: PricingProposal; fa: boolean }) {"
          const newSignature = "function ProposalCard({ proposal }: { proposal: PricingProposal }) {"
          if (!source.includes(oldCall) || !source.includes(oldSignature)) {
            throw new Error("Expected ProposalCard cleanup anchors were not found")
          }
          source = source.replace(oldCall, newCall).replace(oldSignature, newSignature)
          fs.writeFileSync(path, source)
          NODE

      - name: Format and apply safe Biome fixes to Phase 18 only
        run: |
          files="apps/admin/src/features/pricing-brain/actions.ts apps/admin/src/features/pricing-brain/pricing-brain-dashboard.tsx apps/admin/src/features/pricing-brain/pricing-governance.tsx apps/admin/src/features/pricing-brain/types.ts apps/api/app/services/pricing_brain_service.ts apps/api/app/services/pricing_decision_engine.ts apps/api/app/services/pricing_policy_service.ts apps/api/start/routes/admin_pricing_brain.ts apps/api/tests/functional/pricing/phase18_pricing_governance.spec.ts"
          pnpm exec biome format --write $files
          pnpm exec biome check --write $files
          pnpm exec biome check $files
          git diff --check

      - name: Validate merged OpenAPI with the exact test validator
        run: |
          pnpm --filter @calibra/api-docs run build:test-spec
          validator=$(find node_modules/.pnpm -path '*/node_modules/openapi-schema-validator/dist/index.js' | head -n 1)
          test -n "$validator"
          VALIDATOR_PATH="$validator" node <<'NODE'
          const fs = require("node:fs")
          const path = require("node:path")
          const loaded = require(path.resolve(process.env.VALIDATOR_PATH))
          const OpenAPISchemaValidator = loaded.default ?? loaded
          const spec = JSON.parse(fs.readFileSync("docs/api/dist/_merged.test.json", "utf8"))
          const result = new OpenAPISchemaValidator({ version: 3 }).validate(spec)
          if (result.errors?.length) {
            console.error(JSON.stringify(result, null, 2))
            process.exit(1)
          }
          console.log("Phase 18 merged OpenAPI validation: PASS")
          NODE

      - name: Regenerate and build SDK using the official deterministic pipeline
        run: |
          pnpm --filter @calibra/sdk run codegen
          first=$(sha256sum packages/sdk/src/generated/admin.d.ts | cut -d' ' -f1)
          pnpm --filter @calibra/sdk run codegen
          second=$(sha256sum packages/sdk/src/generated/admin.d.ts | cut -d' ' -f1)
          test "$first" = "$second"
          pnpm --filter @calibra/sdk run typecheck
          pnpm --filter @calibra/sdk run build

      - name: Verify Phase 18 TypeScript surface without touching unrelated debt
        shell: bash
        run: |
          set +e
          pnpm --filter @calibra/api run typecheck > phase18-api-typecheck.log 2>&1
          api_rc=$?
          set -e
          cat phase18-api-typecheck.log
          api_errors=$(grep -E "error TS[0-9]+:" phase18-api-typecheck.log || true)
          unexpected_api=$(printf '%s\n' "$api_errors" | grep -v "app/controllers/admin/procurement_controller.ts" || true)
          if [ -n "$unexpected_api" ]; then
            echo "Unexpected API TypeScript errors outside known Phase 14 debt:"
            printf '%s\n' "$unexpected_api"
            exit 1
          fi
          if [ "$api_rc" -ne 0 ] && [ -z "$api_errors" ]; then
            echo "API typecheck failed without a classified TypeScript diagnostic"
            exit "$api_rc"
          fi

          set +e
          pnpm --filter @calibra/admin run typecheck > phase18-admin-typecheck.log 2>&1
          admin_rc=$?
          set -e
          cat phase18-admin-typecheck.log
          admin_errors=$(grep -E "error TS[0-9]+:" phase18-admin-typecheck.log || true)
          phase18_admin_errors=$(printf '%s\n' "$admin_errors" | grep -E "pricing-brain|pricing_brain" || true)
          if [ -n "$phase18_admin_errors" ]; then
            echo "Phase 18 admin TypeScript errors found:"
            printf '%s\n' "$phase18_admin_errors"
            exit 1
          fi
          if [ "$admin_rc" -ne 0 ]; then
            echo "Admin typecheck still has diagnostics outside Phase 18; scoped finalizer leaves them untouched."
          fi

      - name: Run Phase 18 decision and governance golden regressions
        working-directory: apps/api
        run: >-
          pnpm test
          --files=tests/unit/pricing/pricing_decision_engine.spec.ts
          --files=tests/functional/pricing/phase18_pricing_governance.spec.ts

      - name: Commit exact generated and validated Phase 18 output
        shell: bash
        run: |
          git config user.name "calibra-dev"
          git config user.email "keshavarz20.com@gmail.com"
          git add \
            apps/admin/src/features/pricing-brain/actions.ts \
            apps/admin/src/features/pricing-brain/pricing-brain-dashboard.tsx \
            apps/admin/src/features/pricing-brain/pricing-governance.tsx \
            apps/admin/src/features/pricing-brain/types.ts \
            apps/api/app/services/pricing_brain_service.ts \
            apps/api/app/services/pricing_decision_engine.ts \
            apps/api/app/services/pricing_policy_service.ts \
            apps/api/start/routes/admin_pricing_brain.ts \
            apps/api/tests/functional/pricing/phase18_pricing_governance.spec.ts \
            docs/api/reference/openapi/admin.phase18.v1.yaml \
            packages/sdk/src/generated/admin.d.ts
          git status --short
          if git diff --cached --quiet; then
            echo "No Phase 18 finalizer changes to commit"
            exit 0
          fi
          git commit -m "fix(phase18): close pricing release gates"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
