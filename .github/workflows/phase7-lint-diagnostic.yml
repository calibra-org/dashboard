name: Phase 7 lint diagnostics

on:
  push:
    branches: [agent/phase7-identity-trust-os]
    paths: [.github/workflows/phase7-lint-diagnostic.yml]

permissions:
  contents: write

env:
  NODE_VERSION: "24.14.0"
  PNPM_VERSION: "10.32.1"

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase7-identity-trust-os
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture format and lint diagnostics
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics
          pnpm run format > diagnostics/phase7-format.log 2>&1; F=$?
          pnpm run lint:biome > diagnostics/phase7-lint-biome.log 2>&1; B=$?
          pnpm run lint:tokens > diagnostics/phase7-lint-tokens.log 2>&1; T=$?
          pnpm run lint:ws > diagnostics/phase7-lint-ws.log 2>&1; W=$?
          printf 'format=%s\nbiome=%s\ntokens=%s\nworkspace=%s\n' "$F" "$B" "$T" "$W" > diagnostics/phase7-lint-status.txt
          set -e
      - name: Commit diagnostics
        shell: bash
        run: |
          git config user.name "calibra-phase7-bot"
          git config user.email "calibra-phase7-bot@users.noreply.github.com"
          git add diagnostics/phase7-*.log diagnostics/phase7-lint-status.txt
          git commit -m "test: capture Phase 7 lint diagnostics"
          git push origin HEAD:agent/phase7-identity-trust-os
