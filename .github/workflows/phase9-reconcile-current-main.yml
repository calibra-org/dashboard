name: Phase9 Reconcile Current Main

on:
  push:
    branches: ["agent/phase9-final-main-20260818"]

permissions:
  contents: write

concurrency:
  group: phase9-reconcile-current-main
  cancel-in-progress: true

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase9-final-main-20260818
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - run: npm install --global pnpm@10.32.1
      - name: Merge current main and resolve only known additive conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            printf 'Conflicts:\n%s\n' "$conflicts"
            allowed='^(apps/admin/src/components/Sidebar\.tsx|apps/api/start/routes\.ts|docs/api/package\.json|docs/api/scripts/merge-admin-spec\.js|packages/sdk/src/generated/admin\.d\.ts)$'
            unexpected="$(printf '%s\n' "$conflicts" | grep -Ev "$allowed" || true)"
            if [ -n "$unexpected" ]; then
              echo "Unexpected merge conflicts detected:"
              printf '%s\n' "$unexpected"
              exit 1
            fi
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              git checkout --ours -- "$file"
              git add "$file"
            done <<< "$conflicts"
          fi

          node <<'NODE'
          const fs = require('node:fs');

          const sidebarPath = 'apps/admin/src/components/Sidebar.tsx';
          let sidebar = fs.readFileSync(sidebarPath, 'utf8');
          if (!sidebar.includes('href: "/planning"')) {
            const anchor = '            { href: "/analytics/decision-intelligence", label: "هوش تصمیم‌گیری", icon: Sparkles },';
            if (!sidebar.includes(anchor)) throw new Error('Sidebar planning anchor missing');
            sidebar = sidebar.replace(anchor, `${anchor}\n            { href: "/planning", label: "Planning OS", icon: CalendarClock },`);
            fs.writeFileSync(sidebarPath, sidebar);
          }

          const routesPath = 'apps/api/start/routes.ts';
          let routes = fs.readFileSync(routesPath, 'utf8');
          if (!routes.includes('admin_planning.js')) {
            const anchor = 'await import("./routes/admin_decision_intelligence.js");';
            if (!routes.includes(anchor)) throw new Error('Route planning anchor missing');
            routes = routes.replace(anchor, `${anchor}\nawait import("./routes/admin_planning.js");`);
            fs.writeFileSync(routesPath, routes);
          }

          const docsPackagePath = 'docs/api/package.json';
          const docsPackage = JSON.parse(fs.readFileSync(docsPackagePath, 'utf8'));
          docsPackage.scripts['build:json:admin-phase13'] = 'redocly bundle reference/openapi/admin.phase13.v1.yaml -o dist/admin.phase13.v1.json --ext json';
          const adminBuild = docsPackage.scripts['build:json:admin'];
          if (!adminBuild.includes('build:json:admin-phase13')) {
            const anchor = ' && pnpm build:json:admin-completion';
            if (!adminBuild.includes(anchor)) throw new Error('Admin docs build anchor missing');
            docsPackage.scripts['build:json:admin'] = adminBuild.replace(anchor, ` && pnpm build:json:admin-phase13${anchor}`);
          }
          fs.writeFileSync(docsPackagePath, `${JSON.stringify(docsPackage, null, 4)}\n`);

          const mergeAdminPath = 'docs/api/scripts/merge-admin-spec.js';
          let mergeAdmin = fs.readFileSync(mergeAdminPath, 'utf8');
          if (!mergeAdmin.includes('const phase13 =')) {
            const anchor = 'const phase12 = JSON.parse(readFileSync(resolve(root, "dist/admin.phase12.v1.json"), "utf8"));';
            if (!mergeAdmin.includes(anchor)) throw new Error('Phase13 import anchor missing');
            mergeAdmin = mergeAdmin.replace(anchor, `${anchor}\nconst phase13 = JSON.parse(readFileSync(resolve(root, "dist/admin.phase13.v1.json"), "utf8"));`);
          }
          if (!mergeAdmin.includes('[phase13, "Phase13PlanningOverlay"]')) {
            const anchor = '    [phase12, "Phase12Overlay"],';
            if (!mergeAdmin.includes(anchor)) throw new Error('Phase13 overlay anchor missing');
            mergeAdmin = mergeAdmin.replace(anchor, `${anchor}\n    [phase13, "Phase13PlanningOverlay"],`);
          }
          fs.writeFileSync(mergeAdminPath, mergeAdmin);
          NODE

          git add apps/admin/src/components/Sidebar.tsx apps/api/start/routes.ts docs/api/package.json docs/api/scripts/merge-admin-spec.js
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Regenerate OpenAPI SDK contracts
        run: pnpm --filter @calibra/sdk run codegen
      - name: Fix Phase 9 changed-source lint only
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only origin/main -- '*.ts' '*.tsx' '*.js' '*.mjs' '*.json' | grep -Ev '^(packages/sdk/src/generated/|apps/api/database/schema\.ts$)' || true)
          if [ "${#files[@]}" -gt 0 ]; then
            pnpm exec biome check --write "${files[@]}"
          fi
      - name: Verify Phase 9 invariants
        run: node scripts/verify-phase9.mjs
      - name: Typecheck reconciled tree
        run: pnpm run typecheck
      - name: Commit merge, generated contracts, and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/phase9-reconcile-current-main.yml
          git add -A
          git status --short
          git commit -m "merge(personalization): reconcile Phase 9 with current main"
          git push origin HEAD:agent/phase9-final-main-20260818
