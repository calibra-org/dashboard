name: Bootstrap pnpm

on:
  push:
    branches:
      - agent/bootstrap-tools-20260817
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Build pnpm offline bundle
        run: |
          set -euxo pipefail
          mkdir -p /tmp/pnpm-offline
          cd /tmp/pnpm-offline
          npm pack pnpm@10.32.1
          sha256sum pnpm-10.32.1.tgz > SHA256SUMS
      - name: Upload pnpm bundle
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-10.32.1-offline
          path: /tmp/pnpm-offline
          if-no-files-found: error
          retention-days: 1
