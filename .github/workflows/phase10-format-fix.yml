name: Phase 10 Format Fix

on:
  push:
    branches:
      - agent/phase10-decision-intelligence-20260817

permissions:
  contents: write

jobs:
  fix:
    if: contains(github.event.head_commit.message, '[phase10-format]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase10-decision-intelligence-20260817
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Remove arbitrary severity thresholds
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/api/app/services/decision_intelligence_service.ts';
          let s = fs.readFileSync(path, 'utf8');
          const exact = (from, to) => {
            if (!s.includes(from)) throw new Error(`missing anchor: ${from.slice(0, 80)}`);
            s = s.replace(from, to);
          };
          exact(`\nfunction severityFromCount(count: number, criticalAt = 20, highAt = 5): IntelligenceSeverity {\n    if (count >= criticalAt) return "critical";\n    if (count >= highAt) return "high";\n    if (count >= 2) return "medium";\n    return "low";\n}\n`, `\n`);
          exact(
            `.select(trx.raw("COUNT(*)::int AS count"), trx.raw("COALESCE(SUM(amount_minor), 0)::bigint AS amount_minor"))`,
            `.select(\n            trx.raw("COUNT(*)::int AS count"),\n            trx.raw("COUNT(*) FILTER (WHERE reconciliation_status = 'error')::int AS error_count"),\n            trx.raw("COALESCE(SUM(amount_minor), 0)::bigint AS amount_minor"),\n        )`,
          );
          exact(`    const severity = severityFromCount(count, 10, 3);`, `    const errorCount = numberFrom(row?.error_count);\n    const severity: IntelligenceSeverity = errorCount > 0 ? "high" : "medium";`);
          exact(`signalSnapshot: { count, amountMinor: String(row?.amount_minor ?? 0) },`, `signalSnapshot: { count, errorCount, amountMinor: String(row?.amount_minor ?? 0) },`);
          exact(`payload: { count, amountMinor: String(row?.amount_minor ?? 0) },`, `payload: { count, errorCount, amountMinor: String(row?.amount_minor ?? 0) },`);
          exact(`.select(trx.raw("COUNT(*)::int AS count"))`, `.select(\n            trx.raw("COUNT(*)::int AS count"),\n            trx.raw("COUNT(*) FILTER (WHERE status = 'exception')::int AS exception_count"),\n        )`);
          exact(`    const severity = severityFromCount(count, 12, 4);`, `    const exceptionCount = numberFrom(row?.exception_count);\n    const severity: IntelligenceSeverity = exceptionCount > 0 ? "high" : "medium";`);
          exact(`signalSnapshot: { count },\n            observationSnapshot: { shipmentStatuses`, `signalSnapshot: { count, exceptionCount },\n            observationSnapshot: { shipmentStatuses`);
          exact(`payload: { count },\n                    freshnessAt: now,`, `payload: { count, exceptionCount },\n                    freshnessAt: now,`);
          exact(`    const severity = severityFromCount(count, 15, 5);`, `    const severity: IntelligenceSeverity = "high";`);
          exact(`    const severity: IntelligenceSeverity = outOfStockCount > 0 ? severityFromCount(outOfStockCount, 20, 5) : severityFromCount(count, 30, 10);`, `    const severity: IntelligenceSeverity = outOfStockCount > 0 ? "high" : "medium";`);
          exact(`    const severity = latest.status === "failed" ? "high" : severityFromCount(failedCount, 50, 10);`, `    const severity: IntelligenceSeverity = latest.status === "failed" ? "high" : "medium";`);
          fs.writeFileSync(path, s);
          NODE
      - name: Apply repository formatter to Phase 10 backend
        run: |
          pnpm exec biome format --write \
            apps/api/app/services/decision_intelligence_service.ts \
            apps/api/app/controllers/admin/decision_intelligence_controller.ts \
            apps/api/app/validators/admin/intelligence_validator.ts \
            apps/api/start/routes/admin_decision_intelligence.ts \
            apps/api/start/routes.ts \
            apps/api/database/migrations/1764000000000_create_decision_intelligence_kernel.ts
      - name: Commit production changes and remove helper
        run: |
          rm -f .github/workflows/phase10-format-fix.yml
          git config user.name "calibra-dev"
          git config user.email "calibra-dev@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor(intelligence): use domain-native severity and normalize backend"
          git push origin HEAD:agent/phase10-decision-intelligence-20260817
