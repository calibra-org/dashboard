name: Phase 21 Finalize Source

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/phase21-hardening.yml"
      - ".phase21-hardening/**"
      - "apps/api/app/services/agentic_gateway/**"
      - "apps/api/app/controllers/agentic_gateway_controller.ts"
      - "apps/api/start/routes/agentic_gateway.ts"
      - "docs/api/reference/openapi/admin.agentic-commerce.v1.yaml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: calibra
          POSTGRES_PASSWORD: calibra
          POSTGRES_DB: calibra_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U calibra -d calibra_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase21-agentic-commerce-gateway
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
      - run: npm install --global pnpm@10.32.1
      - run: pnpm install --frozen-lockfile
      - name: Phase 21 static contract
        run: node scripts/verify-phase21-agentic-gateway.mjs
      - name: OpenAPI and SDK synchronization
        run: |
          pnpm --dir docs/api run build:json:admin
          pnpm --filter @calibra/sdk run codegen:admin
      - name: Build API test specification
        run: pnpm --filter @calibra/api-docs run build:test-spec
      - name: Validate merged OpenAPI 3.0 contract
        run: |
          VALIDATOR_DIR="$(find "$PWD/node_modules/.pnpm" -type d -path '*/node_modules/openapi-schema-validator' | head -1)"
          test -n "$VALIDATOR_DIR" || { echo 'openapi-schema-validator not found'; exit 1; }
          node - "$VALIDATOR_DIR" <<'NODE'
          const fs = require('node:fs')
          const validatorDir = process.argv[2]
          const loaded = require(validatorDir)
          const OpenAPISchemaValidator = loaded.default || loaded
          const spec = JSON.parse(fs.readFileSync('docs/api/dist/_merged.test.json', 'utf8'))
          const validator = new OpenAPISchemaValidator({ version: 3 })
          const result = validator.validate(spec)
          if (result.errors?.length) {
            console.error(JSON.stringify(result.errors, null, 2))
            process.exit(1)
          }
          console.log('Merged OpenAPI 3.0 schema validator: PASS')
          NODE
      - name: Phase 21 contract tests
        working-directory: apps/api
        run: timeout 240s node ace test --files=tests/functional/agentic_gateway/phase21_agentic_gateway.spec.ts
      - name: API typecheck
        run: pnpm --filter @calibra/api run typecheck
      - name: Admin typecheck
        run: pnpm exec turbo run typecheck --filter=@calibra/admin
      - name: Admin production build
        run: pnpm exec turbo run build --filter=@calibra/admin
      - name: Diff hygiene
        run: git diff --check
      - name: Publish generated contract and remove temporary transport
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .phase21-hardening .github/workflows/phase21-hardening.yml
          git config user.name "calibra-dev"
          git config user.email "keshavarz20.com@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No finalization changes to publish"
            exit 0
          fi
          git commit -m "chore(phase21): finalize generated contract and remove transport"
          git push origin HEAD:agent/phase21-agentic-commerce-gateway
