name: Phase 15 Admin SDK Sync

on:
    push:
        branches: [agent/phase15-customer-genome]
        paths:
            - ".github/workflows/phase15-lint-diagnostic.yml"

permissions:
    contents: write

env:
    NODE_VERSION: "24.14.0"
    PNPM_VERSION: "10.32.1"

jobs:
    sync:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: ${{ env.PNPM_VERSION }}
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - name: Generate Admin SDK from merged contract
              run: |
                  pnpm --filter @calibra/api-docs run build:json:admin
                  pnpm --filter @calibra/sdk run codegen:admin
            - name: Commit generated SDK and remove temporary sync workflow
              shell: bash
              run: |
                  set -euo pipefail
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  rm .github/workflows/phase15-lint-diagnostic.yml
                  git add packages/sdk/src/generated/admin.d.ts .github/workflows/phase15-lint-diagnostic.yml
                  if git diff --cached --quiet; then
                      echo "No generated SDK drift remains."
                      exit 0
                  fi
                  git commit -m "chore(sdk): sync procurement and trust admin contract"
                  git push origin "HEAD:${GITHUB_REF_NAME}"
