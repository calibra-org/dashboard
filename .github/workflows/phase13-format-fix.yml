name: Phase 13 Guarded Format Fix

on:
  push:
    branches: ["feat/phase13-planning-os-20260817"]
    paths:
      - ".github/workflows/phase13-format-fix.yml"

permissions:
  contents: write

env:
  NODE_VERSION: "24.14.0"
  PNPM_VERSION: "10.32.1"

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "feat/phase13-planning-os-20260817"
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --global pnpm@${PNPM_VERSION}
      - run: pnpm install --frozen-lockfile
      - name: Capture PR-owned file set
        shell: bash
        run: git diff --name-only origin/main...HEAD | sort -u > /tmp/phase13-allowed.txt
      - name: Apply repository formatter
        run: pnpm run format:fix
      - name: Guard against unrelated formatting
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | sort -u > /tmp/phase13-formatted.txt
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            if ! grep -Fxq "$path" /tmp/phase13-allowed.txt; then
              echo "Refusing unrelated formatter change: $path"
              exit 1
            fi
          done < /tmp/phase13-formatted.txt
          cat /tmp/phase13-formatted.txt
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatter changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(planning): apply repository formatting"
          git push origin HEAD:feat/phase13-planning-os-20260817
