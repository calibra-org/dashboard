version: 2
updates:
    - package-ecosystem: npm
      directory: "/"
      schedule:
          interval: weekly
          day: monday
          time: "04:30"
          timezone: "UTC"
      open-pull-requests-limit: 10
      groups:
          production-dependencies:
              dependency-type: production
          development-dependencies:
              dependency-type: development
    - package-ecosystem: github-actions
      directory: "/"
      schedule:
          interval: weekly
          day: monday
          time: "05:00"
          timezone: "UTC"
      open-pull-requests-limit: 10
