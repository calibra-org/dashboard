openapi: 3.1.0
info:
    title: Calibra Admin Customer Intelligence Overlay
    version: "1.0.0"
    description: Additive Phase 15 contract for customer intelligence and dynamic customer segments.
tags:
    - name: Admin / Customer Intelligence
      description: Rebuildable customer lifecycle, RFM, value/risk, cohort, and segment projections.
security:
    - BearerAuth: []
components:
    securitySchemes:
        BearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT
    schemas:
        CustomerIntelligenceProfile:
            type: object
            required:
                - customer_id
                - lifecycle_state
                - lifecycle_reason
                - frequency_365d
                - monetary_365d_minor
                - value_band
                - risk_band
                - signals
                - prediction_meta
                - nba_candidates
                - quality_status
                - engine_version
                - calculated_at
            properties:
                customer_id: { type: integer, format: int64, minimum: 1 }
                lifecycle_state:
                    type: string
                    enum: [never_purchased, first_purchase, active_repeat, at_risk, lapsed, reactivated]
                lifecycle_reason: { type: string }
                recency_days: { type: [integer, "null"], minimum: 0 }
                frequency_365d: { type: integer, minimum: 0 }
                monetary_365d_minor: { type: integer, format: int64, minimum: 0 }
                rfm_recency_score: { type: [integer, "null"], minimum: 1, maximum: 5 }
                rfm_frequency_score: { type: [integer, "null"], minimum: 1, maximum: 5 }
                rfm_monetary_score: { type: [integer, "null"], minimum: 1, maximum: 5 }
                rfm_score: { type: [integer, "null"], minimum: 3, maximum: 15 }
                value_band: { type: string, enum: [unknown, developing, core, high_value] }
                risk_band: { type: string, enum: [unknown, low, medium, high] }
                historical_revenue_ltv_minor: { type: [integer, "null"], format: int64, minimum: 0 }
                historical_contribution_ltv_minor: { type: [integer, "null"], format: int64 }
                expected_next_purchase_from: { type: [string, "null"], format: date-time }
                expected_next_purchase_to: { type: [string, "null"], format: date-time }
                signals: { type: object, additionalProperties: true }
                prediction_meta: { type: object, additionalProperties: true }
                nba_candidates:
                    type: array
                    items:
                        type: object
                        additionalProperties: true
                quality_status: { type: string }
                engine_version: { type: string }
                calculated_at: { type: string, format: date-time }
                stale_at: { type: [string, "null"], format: date-time }
        CustomerIntelligenceSummary:
            type: object
            required: [total, active_repeat, at_risk, lapsed, high_risk, high_value, historical_revenue_ltv_minor, engine_version, predictive_status, contribution_status]
            properties:
                total: { type: integer, minimum: 0 }
                active_repeat: { type: integer, minimum: 0 }
                at_risk: { type: integer, minimum: 0 }
                lapsed: { type: integer, minimum: 0 }
                high_risk: { type: integer, minimum: 0 }
                high_value: { type: integer, minimum: 0 }
                historical_revenue_ltv_minor: { type: integer, format: int64, minimum: 0 }
                generated_at: { type: [string, "null"], format: date-time }
                engine_version: { type: string }
                predictive_status: { type: string }
                contribution_status: { type: string }
        LifecycleCohort:
            type: object
            required: [cohort, lifecycle_state, customers, revenue_ltv_minor]
            properties:
                cohort: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" }
                lifecycle_state: { type: string }
                customers: { type: integer, minimum: 0 }
                revenue_ltv_minor: { type: integer, format: int64, minimum: 0 }
        SegmentCondition:
            type: object
            required: [feature, operator, value]
            properties:
                feature:
                    type: string
                    enum:
                        - lifecycle.state
                        - risk.band
                        - value.band
                        - rfm.score
                        - rfm.recency_days
                        - rfm.frequency_365d
                        - rfm.monetary_365d_minor
                        - economics.historical_revenue_ltv_minor
                        - consent.email
                        - consent.sms
                operator: { type: string, enum: [eq, neq, gt, gte, lt, lte, in] }
                value: {}
        SegmentDefinition:
            type: object
            required: [version, op, conditions]
            properties:
                version: { type: integer, const: 1 }
                op: { type: string, enum: [and, or] }
                conditions:
                    type: array
                    maxItems: 20
                    items: { $ref: "#/components/schemas/SegmentCondition" }
        SegmentIntelligenceDefinition:
            type: object
            required: [segment_id, kind, refresh_policy, definition_version, status]
            properties:
                segment_id: { type: integer, format: int64, minimum: 1 }
                kind: { type: string, enum: [saved_view, rule_based, rfm, cohort, lifecycle, predictive] }
                definition:
                    oneOf:
                        - { $ref: "#/components/schemas/SegmentDefinition" }
                        - { type: "null" }
                refresh_policy: { type: string, enum: [manual, event_driven] }
                definition_version: { type: integer, minimum: 0 }
                status: { type: string }
                member_count: { type: [integer, "null"], minimum: 0 }
                last_evaluated_at: { type: [string, "null"], format: date-time }
        SegmentMember:
            type: object
            required: [id, matched_at, evaluated_at]
            properties:
                id: { type: integer, format: int64, minimum: 1 }
                first_name: { type: [string, "null"] }
                last_name: { type: [string, "null"] }
                phone: { type: [string, "null"] }
                matched_at: { type: string, format: date-time }
                evaluated_at: { type: string, format: date-time }
paths:
    /api/v1/admin/customer-intelligence/summary:
        get:
            operationId: adminCustomerIntelligenceSummary
            summary: Read the customer intelligence summary
            tags: [Admin / Customer Intelligence]
            responses:
                "200":
                    description: Customer intelligence summary.
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [data]
                                properties:
                                    data: { $ref: "#/components/schemas/CustomerIntelligenceSummary" }
                "401": { description: Authentication required }
                "403": { description: Admin access required }
    /api/v1/admin/customer-intelligence/cohorts:
        get:
            operationId: adminCustomerIntelligenceCohorts
            summary: List lifecycle cohorts
            tags: [Admin / Customer Intelligence]
            responses:
                "200":
                    description: Cohort rows.
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [data]
                                properties:
                                    data:
                                        type: array
                                        items: { $ref: "#/components/schemas/LifecycleCohort" }
                "401": { description: Authentication required }
                "403": { description: Admin access required }
    /api/v1/admin/customer-intelligence/refresh:
        post:
            operationId: adminCustomerIntelligenceRefreshAll
            summary: Recompute all eligible customer intelligence profiles
            tags: [Admin / Customer Intelligence]
            responses:
                "200":
                    description: Recompute result.
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [data]
                                properties:
                                    data:
                                        type: object
                                        required: [refreshed, purged]
                                        properties:
                                            refreshed: { type: integer, minimum: 0 }
                                            purged: { type: integer, minimum: 0 }
                "401": { description: Authentication required }
                "403": { description: Admin access required }
    /api/v1/admin/customer-intelligence/customers/{id}:
        get:
            operationId: adminCustomerIntelligenceShow
            summary: Read one customer intelligence profile
            tags: [Admin / Customer Intelligence]
            parameters:
                - name: id
                  in: path
                  required: true
                  schema: { type: integer, format: int64, minimum: 1 }
            responses:
                "200":
                    description: Customer intelligence profile.
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [data]
                                properties:
                                    data: { $ref: "#/components/schemas/CustomerIntelligenceProfile" }
                "401": { description: Authentication required }
                "403": { description: Admin access required }
                "404": { description: Customer not found or ineligible }
    /api/v1/admin/customer-intelligence/customers/{id}/refresh:
        post:
            operationId: adminCustomerIntelligenceRefresh
            summary: Recompute one customer intelligence profile
            tags: [Admin / Customer Intelligence]
            parameters:
                - name: id
                  in: path
                  required: true
                  schema: { type: integer, format: int64, minimum: 1 }
            responses:
                "200":
                    description: Refreshed customer intelligence profile.
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [data]
                                properties:
                                    data: { $ref: "#/components/schemas/CustomerIntelligenceProfile" }
                "401": { description: Authentication required }
                "403": { description: Admin access required }
                "404": { description: Customer not found or ineligible }
    /api/v1/admin/customer-segments/{id}/intelligence-definition:
        get:
            operationId: adminCustomerSegmentIntelligenceDefinition
            summary: Read the dynamic intelligence definition for an owned customer segment
            tags: [Admin / Customer Intelligence]
            parameters:
                - name: id
                  in: path
                  required: true
                  schema: { type: integer, format: int64, minimum: 1 }
            responses:
                "200":
                    description: Segment intelligence definition or saved-view compatibility state.
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [data]
                                properties:
                                    data: { $ref: "#/components/schemas/SegmentIntelligenceDefinition" }
                "404": { description: Segment not found }
        put:
            operationId: adminCustomerSegmentIntelligenceDefinitionUpdate
            summary: Save a versioned dynamic segment definition
            tags: [Admin / Customer Intelligence]
            parameters:
                - name: id
                  in: path
                  required: true
                  schema: { type: integer, format: int64, minimum: 1 }
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [kind, definition, refresh_policy]
                            properties:
                                kind: { type: string, enum: [rule_based, rfm, cohort, lifecycle, predictive] }
                                definition: { $ref: "#/components/schemas/SegmentDefinition" }
                                refresh_policy: { type: string, enum: [manual, event_driven] }
            responses:
                "200":
                    description: Saved definition.
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [data]
                                properties:
                                    data: { $ref: "#/components/schemas/SegmentIntelligenceDefinition" }
                "404": { description: Segment not found }
                "422": { description: Invalid or unsupported definition }
    /api/v1/admin/customer-segments/{id}/preview:
        post:
            operationId: adminCustomerSegmentPreview
            summary: Preview dynamic segment membership without materializing it
            tags: [Admin / Customer Intelligence]
            parameters:
                - name: id
                  in: path
                  required: true
                  schema: { type: integer, format: int64, minimum: 1 }
            responses:
                "200":
                    description: Preview count and sample customer identifiers.
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [data]
                                properties:
                                    data:
                                        type: object
                                        required: [count, sample_customer_ids]
                                        properties:
                                            count: { type: integer, minimum: 0 }
                                            sample_customer_ids:
                                                type: array
                                                items: { type: integer, format: int64, minimum: 1 }
                "404": { description: Segment not found }
                "409": { description: Segment is still a legacy saved view }
    /api/v1/admin/customer-segments/{id}/evaluate:
        post:
            operationId: adminCustomerSegmentEvaluate
            summary: Evaluate and materialize dynamic segment membership
            tags: [Admin / Customer Intelligence]
            parameters:
                - name: id
                  in: path
                  required: true
                  schema: { type: integer, format: int64, minimum: 1 }
            responses:
                "200":
                    description: Evaluation result.
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [data]
                                properties:
                                    data:
                                        type: object
                                        required: [member_count, evaluated_at]
                                        properties:
                                            member_count: { type: integer, minimum: 0 }
                                            evaluated_at: { type: string, format: date-time }
                "404": { description: Segment not found }
                "409": { description: Segment is still a legacy saved view }
    /api/v1/admin/customer-segments/{id}/members:
        get:
            operationId: adminCustomerSegmentMembers
            summary: List materialized members of an owned dynamic segment
            tags: [Admin / Customer Intelligence]
            parameters:
                - name: id
                  in: path
                  required: true
                  schema: { type: integer, format: int64, minimum: 1 }
                - name: page
                  in: query
                  schema: { type: integer, minimum: 1, default: 1 }
                - name: limit
                  in: query
                  schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
            responses:
                "200":
                    description: Paginated dynamic-segment members.
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [data, meta]
                                properties:
                                    data:
                                        type: array
                                        items: { $ref: "#/components/schemas/SegmentMember" }
                                    meta:
                                        type: object
                                        required: [page, limit, total, last_page]
                                        properties:
                                            page: { type: integer, minimum: 1 }
                                            limit: { type: integer, minimum: 1 }
                                            total: { type: integer, minimum: 0 }
                                            last_page: { type: integer, minimum: 1 }
                "404": { description: Segment not found }
