title: OtpRequestResult
description: >
    The `data` envelope returned by `POST /auth/otp/request`. Carries only the lifetime of the
    freshly-issued code; the response is identical whether or not the identifier is registered, so a
    caller can never use it for account enumeration.
type: object
properties:
    verification_id:
        type: string
        format: uuid
        description: Opaque verification transaction id used for resend and optional verify binding.
    delivery:
        type: string
        enum: [accepted, sent, delivered, delivery_unknown, failed, blocked]
        description: Delivery state known at request time; accepted does not mean delivered.
    expires_in:
        type: integer
        description: Seconds until the issued OTP code expires.
        examples: [300]
required:
    - expires_in
