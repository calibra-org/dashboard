operationId: paymentMellatRedirect
summary: Bridge a Behpardakht Mellat RefId into the bank's required form POST
description: >
    Accepts the non-secret Mellat `RefId` generated by the server-side payment request and returns a
    short, no-store HTML document that auto-posts the RefId to the fixed Behpardakht Shaparak
    StartPay endpoint. Merchant terminal credentials never reach the browser.
tags: [Payment]
security: []
parameters:
    - name: authority
      in: query
      required: true
      schema:
          type: string
          pattern: "^[A-Za-z0-9_-]{6,128}$"
responses:
    "200":
        description: Ephemeral CSP-restricted auto-submit form for Behpardakht Mellat.
        headers:
            Cache-Control:
                schema: { type: string }
            Content-Security-Policy:
                schema: { type: string }
        content:
            text/html:
                schema: { type: string }
    "400":
        description: Invalid or missing RefId.
