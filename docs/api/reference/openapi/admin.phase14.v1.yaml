openapi: 3.1.0
info:
  title: Calibra Admin Phase 14 Procurement OS Overlay
  version: 1.0.0
  description: Procurement and supplier operations contract for the landed Phase 14 runtime.
tags:
  - name: Procurement OS
    description: Supplier, purchase-order, receiving, recommendation, and procurement-health operations.
paths:
  /api/v1/admin/procurement/overview:
    get:
      tags: [Procurement OS]
      operationId: adminProcurementOverview
      security: [{ bearerAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/ProcurementOk' } }
  /api/v1/admin/procurement/suppliers:
    get:
      tags: [Procurement OS]
      operationId: adminProcurementSuppliers
      security: [{ bearerAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/ProcurementOk' } }
    post:
      tags: [Procurement OS]
      operationId: adminProcurementSupplierCreate
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SupplierCreateInput' } } }
      responses:
        '201': { $ref: '#/components/responses/ProcurementOk' }
        '422': { description: Invalid supplier payload }
  /api/v1/admin/procurement/purchase-orders:
    get:
      tags: [Procurement OS]
      operationId: adminProcurementPurchaseOrders
      security: [{ bearerAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/ProcurementOk' } }
    post:
      tags: [Procurement OS]
      operationId: adminProcurementPurchaseOrderCreate
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PurchaseOrderCreateInput' } } }
      responses:
        '200': { $ref: '#/components/responses/ProcurementOk' }
        '201': { $ref: '#/components/responses/ProcurementOk' }
        '422': { description: Invalid purchase-order payload }
  /api/v1/admin/procurement/purchase-orders/{id}/transition:
    post:
      tags: [Procurement OS]
      operationId: adminProcurementPurchaseOrderTransition
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProcurementId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PurchaseOrderTransitionInput' } } }
      responses:
        '200': { $ref: '#/components/responses/ProcurementOk' }
        '409': { description: Optimistic version conflict or invalid transition }
        '422': { description: Invalid transition payload }
  /api/v1/admin/procurement/purchase-orders/{id}/receipts:
    post:
      tags: [Procurement OS]
      operationId: adminProcurementPurchaseOrderReceive
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ProcurementId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PurchaseOrderReceiptInput' } } }
      responses:
        '200': { $ref: '#/components/responses/ProcurementOk' }
        '201': { $ref: '#/components/responses/ProcurementOk' }
        '409': { description: Receipt conflict }
        '422': { description: Invalid receipt payload }
  /api/v1/admin/procurement/recommendations:
    get:
      tags: [Procurement OS]
      operationId: adminProcurementRecommendations
      security: [{ bearerAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/ProcurementOk' } }
  /api/v1/admin/procurement/health:
    get:
      tags: [Procurement OS]
      operationId: adminProcurementHealth
      security: [{ bearerAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/ProcurementOk' } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  parameters:
    ProcurementId:
      in: path
      name: id
      required: true
      schema: { type: integer, minimum: 1 }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      schema: { type: string, maxLength: 160 }
  responses:
    ProcurementOk:
      description: Procurement operation result
      content:
        application/json:
          schema: { type: object, additionalProperties: true }
  schemas:
    SupplierCreateInput:
      type: object
      additionalProperties: false
      required: [code, legal_name, display_name]
      properties:
        code: { type: string, minLength: 2, maxLength: 64 }
        legal_name: { type: string, minLength: 2, maxLength: 220 }
        display_name: { type: string, minLength: 2, maxLength: 220 }
        email: { type: string, format: email }
        phone: { type: string, maxLength: 64 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        payment_terms: { type: string, maxLength: 120 }
        default_lead_time_days: { type: number, minimum: 0, maximum: 365 }
        criticality: { type: string, enum: [low, normal, high, critical] }
    PurchaseOrderLineInput:
      type: object
      additionalProperties: false
      required: [product_id, name, quantity, unit_cost]
      properties:
        product_id: { type: number, exclusiveMinimum: 0 }
        variation_id: { type: number, exclusiveMinimum: 0 }
        sku: { type: string, maxLength: 190 }
        name: { type: string, minLength: 1, maxLength: 255 }
        quantity: { type: number, exclusiveMinimum: 0 }
        unit_cost: { type: number, minimum: 0 }
        expected_date: { type: string }
    PurchaseOrderCreateInput:
      type: object
      additionalProperties: false
      required: [supplier_id, lines]
      properties:
        supplier_id: { type: number, exclusiveMinimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        expected_date: { type: string }
        payment_terms: { type: string, maxLength: 120 }
        planning_recommendation_id: { type: number, exclusiveMinimum: 0 }
        lines:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: '#/components/schemas/PurchaseOrderLineInput' }
    PurchaseOrderTransitionInput:
      type: object
      additionalProperties: false
      required: [status, expected_version]
      properties:
        status: { type: string, enum: [approval, sent, acknowledged, partially_shipped, closed, cancelled] }
        expected_version: { type: number, exclusiveMinimum: 0 }
    PurchaseOrderReceiptLineInput:
      type: object
      additionalProperties: false
      required: [purchase_order_line_id, received_quantity, accepted_quantity]
      properties:
        purchase_order_line_id: { type: number, exclusiveMinimum: 0 }
        received_quantity: { type: number, exclusiveMinimum: 0 }
        accepted_quantity: { type: number, minimum: 0 }
        rejected_quantity: { type: number, minimum: 0 }
        quarantine_quantity: { type: number, minimum: 0 }
        quality_reason: { type: string, maxLength: 240 }
        lot_code: { type: string, maxLength: 120 }
        batch_code: { type: string, maxLength: 120 }
    PurchaseOrderReceiptInput:
      type: object
      additionalProperties: false
      required: [lines]
      properties:
        notes: { type: string, maxLength: 1000 }
        lines:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: '#/components/schemas/PurchaseOrderReceiptLineInput' }
