    /api/v1/admin/factor/documents:
        get:
            operationId: adminFactorDocumentsIndex
            summary: List factor documents
            description: Lists tenant-scoped invoices, proformas, and credit notes with search, lifecycle, customer, date, and sort filters.
            tags: [Admin / Factor]
            parameters:
                - { name: page, in: query, schema: { type: integer, minimum: 1 } }
                - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
                - { name: q, in: query, schema: { type: string, maxLength: 120 } }
                - { name: type, in: query, schema: { type: string, enum: [proforma, invoice, credit_note] } }
                - { name: status, in: query, schema: { type: string, enum: [draft, sent, viewed, awaiting, paid, expired, cancelled, refunded, credited] } }
                - { name: customer_id, in: query, schema: { type: integer, minimum: 1 } }
                - { name: from, in: query, schema: { type: string, format: date-time } }
                - { name: to, in: query, schema: { type: string, format: date-time } }
                - { name: sort, in: query, schema: { type: string, enum: [created_desc, created_asc, due_asc, amount_desc] } }
            responses:
                "200":
                    description: Paginated invoices, proformas, and credit notes.
                    content:
                        application/json:
                            schema: { $ref: "./common/components/schemas/FactorDocumentListEnvelope.yaml" }
                "401": { description: Authentication required. }
                "403": { description: Admin role required. }
                "422": { description: Invalid query parameters. }
        head:
            $ref: "./common/components/operations/HeadCompanion.yaml"
        post:
            operationId: adminFactorDocumentsStore
            summary: Create a factor document
            tags: [Admin / Factor]
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "./common/components/schemas/FactorDocumentInput.yaml" }
            responses:
                "201":
                    description: Factor document created.
                    content:
                        application/json:
                            schema: { $ref: "./common/components/schemas/FactorDocumentEnvelope.yaml" }
                "401": { description: Authentication required. }
                "403": { description: Admin role required. }
                "422": { description: Invalid document input. }
    /api/v1/admin/factor/documents/{id}:
        parameters:
            - name: id
              in: path
              required: true
              schema: { type: integer, minimum: 1 }
        get:
            operationId: adminFactorDocumentsShow
            summary: Show a factor document
            tags: [Admin / Factor]
            responses:
                "200":
                    description: Factor document detail.
                    content:
                        application/json:
                            schema: { $ref: "./common/components/schemas/FactorDocumentEnvelope.yaml" }
                "404": { description: Factor document not found. }
        head:
            $ref: "./common/components/operations/HeadCompanion.yaml"
        patch:
            operationId: adminFactorDocumentsUpdate
            summary: Update a mutable factor document
            tags: [Admin / Factor]
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "./common/components/schemas/FactorDocumentUpdateInput.yaml" }
            responses:
                "200":
                    description: Factor document updated.
                    content:
                        application/json:
                            schema: { $ref: "./common/components/schemas/FactorDocumentEnvelope.yaml" }
                "404": { description: Factor document not found. }
                "409": { description: The document is immutable or its issued type is locked. }
                "422": { description: Invalid document input. }
    /api/v1/admin/factor/documents/{id}/transition:
        parameters:
            - name: id
              in: path
              required: true
              schema: { type: integer, minimum: 1 }
        post:
            operationId: adminFactorDocumentsTransition
            summary: Transition a factor document
            tags: [Admin / Factor]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [to_status, expected_version]
                            properties:
                                to_status: { type: string, enum: [sent, viewed, awaiting, paid, expired, cancelled] }
                                reason: { type: [string, "null"], maxLength: 1000 }
                                expected_version: { type: integer, minimum: 1 }
                            additionalProperties: false
            responses:
                "200":
                    description: Lifecycle transition applied.
                    content:
                        application/json:
                            schema: { $ref: "./common/components/schemas/FactorDocumentEnvelope.yaml" }
                "409": { description: Invalid lifecycle transition or incomplete collection. }
                "422": { description: Invalid transition payload. }
    /api/v1/admin/factor/documents/{id}/convert:
        parameters:
            - name: id
              in: path
              required: true
              schema: { type: integer, minimum: 1 }
        post:
            operationId: adminFactorDocumentsConvert
            summary: Convert a proforma to an invoice or a paid invoice to a credit note
            tags: [Admin / Factor]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [target_type, expected_version]
                            properties:
                                target_type: { type: string, enum: [invoice, credit_note] }
                                expected_version: { type: integer, minimum: 1 }
                                reason: { type: [string, "null"], maxLength: 1000 }
                            additionalProperties: false
            responses:
                "201":
                    description: Converted document created.
                    content:
                        application/json:
                            schema: { $ref: "./common/components/schemas/FactorDocumentEnvelope.yaml" }
                "409": { description: Source document cannot be converted to the requested type. }
    /api/v1/admin/factor/documents/{id}/payment-link:
        parameters:
            - name: id
              in: path
              required: true
              schema: { type: integer, minimum: 1 }
        post:
            operationId: adminFactorPaymentLinkStore
            summary: Create a single-use payment link for the outstanding document amount
            tags: [Admin / Factor]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [gateway_id, expected_version]
                            properties:
                                gateway_id: { type: integer, minimum: 1 }
                                expires_at: { type: [string, "null"], format: date-time }
                                expected_version: { type: integer, minimum: 1 }
                            additionalProperties: false
            responses:
                "201":
                    description: Payment link created.
                    content:
                        application/json:
                            schema: { $ref: "./common/components/schemas/FactorPaymentLinkEnvelope.yaml" }
                "409": { description: The document cannot accept an online payment link. }
                "422": { description: Gateway or expiry is invalid. }
    /api/v1/admin/factor/documents/{id}/manual-payment:
        parameters:
            - name: id
              in: path
              required: true
              schema: { type: integer, minimum: 1 }
        post:
            operationId: adminFactorManualPaymentStore
            summary: Record a manual payment against the outstanding amount
            tags: [Admin / Factor]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [amount_minor, method, expected_version]
                            properties:
                                amount_minor: { type: integer, minimum: 1 }
                                method: { type: string, enum: [manual, cash, card, bank_transfer] }
                                reference: { type: [string, "null"], maxLength: 191 }
                                notes: { type: [string, "null"], maxLength: 2000 }
                                paid_at: { type: [string, "null"], format: date-time }
                                expected_version: { type: integer, minimum: 1 }
                            additionalProperties: false
            responses:
                "201":
                    description: Payment recorded.
                    content:
                        application/json:
                            schema: { $ref: "./common/components/schemas/FactorDocumentEnvelope.yaml" }
                "409": { description: The document cannot accept payments. }
                "422": { description: Payment exceeds the outstanding balance or input is invalid. }
