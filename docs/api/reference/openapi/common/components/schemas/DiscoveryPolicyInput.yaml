type: object
required:
- name
- max_results
- typo_tolerance
- typo_max_edits
properties:
  name:
    type: string
  max_results:
    type: integer
    minimum: 1
    maximum: 100
  typo_tolerance:
    type: boolean
  typo_max_edits:
    type: integer
    minimum: 0
    maximum: 2
  ranking_weights:
    type: object
    additionalProperties:
      type: number
  reason:
    type: string
