title: FactorDocumentUpdateInput
type: object
required:
- type
- customer
- lines
- expected_version
properties:
  type:
    type: string
    enum:
    - proforma
    - invoice
  customer_id:
    type:
    - integer
    - 'null'
    minimum: 1
  customer:
    type: object
    required:
    - name
    properties:
      name:
        type: string
        minLength: 1
        maxLength: 255
      email:
        type:
        - string
        - 'null'
        format: email
      phone:
        type:
        - string
        - 'null'
      company:
        type:
        - string
        - 'null'
      national_id:
        type:
        - string
        - 'null'
    additionalProperties: false
  lines:
    type: array
    minItems: 1
    items:
      type: object
      required:
      - name
      - quantity
      - unit_price_minor
      properties:
        product_id:
          type:
          - integer
          - 'null'
          minimum: 1
        variation_id:
          type:
          - integer
          - 'null'
          minimum: 1
        sku:
          type:
          - string
          - 'null'
        name:
          type: string
          minLength: 1
        description:
          type:
          - string
          - 'null'
        quantity:
          type: integer
          minimum: 1
        unit_price_minor:
          type: integer
          minimum: 0
        discount_percent:
          type: number
          minimum: 0
          maximum: 100
      additionalProperties: false
  order_discount_minor:
    type: integer
    minimum: 0
  shipping_minor:
    type: integer
    minimum: 0
  tax_percent:
    type: number
    minimum: 0
    maximum: 100
  round_to_minor:
    type: integer
    enum:
    - 1
    - 10
    - 100
    - 1000
  customer_note:
    type:
    - string
    - 'null'
  internal_note:
    type:
    - string
    - 'null'
  due_at:
    type:
    - string
    - 'null'
    format: date-time
  expires_at:
    type:
    - string
    - 'null'
    format: date-time
  delivery_channel:
    type: string
    enum:
    - none
    - sms
    - email
    - whatsapp
  expected_version:
    type: integer
    minimum: 1
additionalProperties: false
