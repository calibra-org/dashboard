openapi: 3.1.0
info:
  title: Calibra Storefront Identity Phase 7 Overlay
  version: 1.0.0
servers:
  - url: /
tags:
  - name: Identity
    description: Customer identity, credential, session, and strong-authentication operations.
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Opaque Calibra access token sent in the Authorization Bearer header.
  schemas:
    IdentityEnvelope:
      type: object
      required: [data]
      properties:
        data: { type: object, additionalProperties: true }
    IdentityListEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { type: object, additionalProperties: true }
paths:
  /api/v1/auth/passkeys/begin:
    post:
      summary: Begin passkey authentication
      tags: [Identity]
      operationId: authPasskeyBegin
      security: []
      responses:
        '200': { description: WebAuthn authentication ceremony started, content: { application/json: { schema: { $ref: '#/components/schemas/IdentityEnvelope' } } } }
  /api/v1/auth/passkeys/finish:
    post:
      summary: Finish passkey authentication
      tags: [Identity]
      operationId: authPasskeyFinish
      security: []
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses:
        '200': { description: Passkey verified and bearer token minted, content: { application/json: { schema: { $ref: '#/components/schemas/IdentityEnvelope' } } } }
        '422': { description: Invalid or expired WebAuthn ceremony }
  /api/v1/account/identity/sessions:
    get:
      summary: List account sessions
      tags: [Identity]
      operationId: accountIdentitySessions
      security: [{ BearerAuth: [] }]
      responses: { '200': { description: Current account sessions, content: { application/json: { schema: { $ref: '#/components/schemas/IdentityListEnvelope' } } } } }
  /api/v1/account/identity/sessions/{id}:
    delete:
      summary: Revoke an account session
      tags: [Identity]
      operationId: accountIdentitySessionRevoke
      security: [{ BearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer, format: int64 } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 4 } } } } } }
      responses: { '200': { description: Session revoked, content: { application/json: { schema: { $ref: '#/components/schemas/IdentityEnvelope' } } } } }
  /api/v1/account/identity/sessions/revoke-others:
    post:
      summary: Revoke other account sessions
      tags: [Identity]
      operationId: accountIdentitySessionsRevokeOthers
      security: [{ BearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 4 } } } } } }
      responses: { '200': { description: Other sessions revoked, content: { application/json: { schema: { $ref: '#/components/schemas/IdentityEnvelope' } } } } }
  /api/v1/account/identity/credentials:
    get:
      summary: List account credentials
      tags: [Identity]
      operationId: accountIdentityCredentials
      security: [{ BearerAuth: [] }]
      responses: { '200': { description: Redacted account credentials, content: { application/json: { schema: { $ref: '#/components/schemas/IdentityListEnvelope' } } } } }
  /api/v1/account/identity/credentials/{id}:
    delete:
      summary: Revoke an account credential
      tags: [Identity]
      operationId: accountIdentityCredentialRevoke
      security: [{ BearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer, format: int64 } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 4 } } } } } }
      responses: { '200': { description: Credential revoked, content: { application/json: { schema: { $ref: '#/components/schemas/IdentityEnvelope' } } } } }
  /api/v1/account/identity/totp/begin:
    post:
      summary: Begin TOTP enrollment
      tags: [Identity]
      operationId: accountIdentityTotpBegin
      security: [{ BearerAuth: [] }]
      responses: { '200': { description: TOTP enrollment started, content: { application/json: { schema: { $ref: '#/components/schemas/IdentityEnvelope' } } } } }
  /api/v1/account/identity/totp/confirm:
    post:
      summary: Confirm TOTP enrollment
      tags: [Identity]
      operationId: accountIdentityTotpConfirm
      security: [{ BearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string, minLength: 6, maxLength: 6 } } } } } }
      responses: { '200': { description: TOTP enrollment confirmed, content: { application/json: { schema: { $ref: '#/components/schemas/IdentityEnvelope' } } } } }
  /api/v1/account/identity/recovery-codes:
    post:
      summary: Rotate account recovery codes
      tags: [Identity]
      operationId: accountIdentityRecoveryCodes
      security: [{ BearerAuth: [] }]
      responses: { '200': { description: New recovery codes returned once, content: { application/json: { schema: { $ref: '#/components/schemas/IdentityEnvelope' } } } } }
  /api/v1/account/identity/passkeys/begin:
    post:
      summary: Begin passkey registration
      tags: [Identity]
      operationId: accountIdentityPasskeyBegin
      security: [{ BearerAuth: [] }]
      responses: { '200': { description: Passkey registration ceremony started, content: { application/json: { schema: { $ref: '#/components/schemas/IdentityEnvelope' } } } } }
  /api/v1/account/identity/passkeys/finish:
    post:
      summary: Finish passkey registration
      tags: [Identity]
      operationId: accountIdentityPasskeyFinish
      security: [{ BearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses: { '200': { description: Passkey public credential registered, content: { application/json: { schema: { $ref: '#/components/schemas/IdentityEnvelope' } } } } }
