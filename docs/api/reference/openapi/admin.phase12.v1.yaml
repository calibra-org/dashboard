openapi: 3.1.0
info:
  title: Calibra Admin Phase 12 Economics Overlay
  version: 1.0.0
  description: Profitability, cash, working capital, immutable cost snapshots and settlement reconciliation.
paths:
  /api/v1/admin/economics/overview:
    get:
      operationId: adminEconomicsOverview
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: from, schema: { type: string } }
        - { in: query, name: to, schema: { type: string } }
        - { in: query, name: currency, schema: { type: string, minLength: 3, maxLength: 3 } }
      responses: { '200': { description: Economic overview } }
  /api/v1/admin/economics/cube:
    get:
      operationId: adminEconomicsCube
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: dimension, schema: { type: string, enum: [product, order] } }
        - { in: query, name: currency, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses: { '200': { description: Rebuildable profitability projection } }
  /api/v1/admin/economics/working-capital:
    get:
      operationId: adminEconomicsWorkingCapital
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Currency-safe working capital snapshot } }
  /api/v1/admin/economics/orders/{id}:
    get:
      operationId: adminEconomicsOrder
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/EconomicsId' }]
      responses: { '200': { description: Order economic drill-down }, '404': { description: Order not found } }
  /api/v1/admin/economics/products/{id}:
    get:
      operationId: adminEconomicsProduct
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/EconomicsId' }]
      responses: { '200': { description: Product economic drill-down }, '404': { description: Product not found } }
  /api/v1/admin/economics/cost-policies:
    post:
      operationId: adminEconomicsCreateCostPolicy
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses: { '201': { description: Versioned cost policy created }, '409': { description: Idempotency conflict } }
  /api/v1/admin/economics/cost-layers:
    post:
      operationId: adminEconomicsCreateCostLayer
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses: { '201': { description: Immutable cost layer created }, '409': { description: Idempotency conflict } }
  /api/v1/admin/economics/line-costs/{id}/corrections:
    post:
      operationId: adminEconomicsCorrectLineCost
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/EconomicsId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses: { '200': { description: Reversal and replacement cost correction }, '409': { description: Idempotency conflict } }
  /api/v1/admin/economics/settlements/reconcile:
    post:
      operationId: adminEconomicsReconcileSettlement
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses: { '200': { description: Settlement revision appended }, '409': { description: Idempotency conflict } }
  /api/v1/admin/economics/backfill:
    post:
      operationId: adminEconomicsBackfill
      security: [{ bearerAuth: [] }]
      requestBody: { required: false, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses: { '200': { description: Historical economics backfill batch } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  parameters:
    EconomicsId:
      in: path
      name: id
      required: true
      schema: { type: integer, minimum: 1 }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: { type: string, minLength: 8, maxLength: 190 }
