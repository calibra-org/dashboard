title: AdminRefund
description: One `order_refunds` row plus its line-item breakdown and bounded gateway-settlement projection.
type: object
properties:
    id: { type: integer }
    order_id: { type: integer }
    refund_number:
        type: integer
        description: Human-facing reference allocated from `refund_number_seq`.
    amount_minor: { $ref: "../../../common/components/schemas/Money.yaml" }
    tax_amount_minor: { $ref: "../../../common/components/schemas/Money.yaml" }
    reason: { type: [string, "null"] }
    refunded_by_user_id: { type: [integer, "null"] }
    restock_requested: { type: boolean }
    gateway_refund_id:
        type: [string, "null"]
        description: PSP-side refund identifier when automatic gateway settlement completed.
    gateway_refund_status:
        type: string
        enum: [completed, manual_action_required, unknown]
        description: >-
            Safe projection of the automatic PSP settlement attempt. `manual_action_required` means
            the Calibra refund ledger was booked but provider-side money movement did not complete
            automatically and an operator must reconcile it. Raw provider diagnostics are not exposed.
    gateway_refund_error_code:
        type: [string, "null"]
        description: Bounded internal error code for a non-completed automatic gateway refund.
    processed_at: { type: string, format: date-time }
    line_items:
        type: array
        items:
            type: object
            properties:
                id: { type: integer }
                order_line_item_id: { type: integer }
                quantity: { type: integer }
                refund_amount_minor: { $ref: "../../../common/components/schemas/Money.yaml" }
                refund_tax_minor: { $ref: "../../../common/components/schemas/Money.yaml" }
    created_at: { type: string, format: date-time }
required:
    - id
    - order_id
    - refund_number
    - amount_minor
    - gateway_refund_status
    - processed_at
