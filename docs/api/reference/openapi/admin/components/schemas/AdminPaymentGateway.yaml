title: AdminPaymentGateway
description: >
    Tenant payment-gateway registry row. Secret credential values are never returned: configured
    credential fields contain the `***` sentinel and unconfigured fields are empty strings.
type: object
properties:
    id: { type: integer }
    code:
        type: string
        description: Stable adapter code (for example `mellat`, `parsian`, `zarinpal`, `cod`).
    enabled: { type: boolean }
    ordering: { type: integer }
    supports:
        type: object
        description: Server-owned adapter capability flags (`refunds`, `partial_refunds`, ...).
        additionalProperties: true
    implementation_status:
        type: string
        enum: [stub, implemented, live]
        description: >
            `stub` has no usable adapter and cannot be enabled; `implemented` has a concrete
            protocol adapter but still needs tenant merchant credentials/provider verification;
            `live` is an offline method or a provider-verified integration.
    category:
        type: string
        enum: [bank, psp, bnpl, offline, legacy]
    admin_visible: { type: boolean }
    credential_fields:
        type: array
        items:
            type: object
            properties:
                key: { type: string }
                required: { type: boolean }
            required: [key, required]
    health_status:
        type: string
        enum: [unconfigured, configured, healthy, error]
    last_verified_at: { type: [string, "null"], format: date-time }
    last_error: { type: [string, "null"] }
    settings:
        type: object
        description: >
            Non-secret gateway settings plus credential mask sentinels. The reserved encrypted
            credential ciphertext is never serialized by the transformer.
        additionalProperties: true
    created_at: { type: [string, "null"], format: date-time }
    updated_at: { type: [string, "null"], format: date-time }
required:
    - id
    - code
    - enabled
    - ordering
    - supports
    - implementation_status
    - category
    - admin_visible
    - credential_fields
    - health_status
    - last_verified_at
    - last_error
    - settings
