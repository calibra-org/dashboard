title: AdminPaymentAttempt
description: >
    Operational `payment_attempts` projection. List responses omit large provider payloads; detail
    responses additionally include `gateway_payload` and `reconciliation_evidence`. The transformer
    never exposes idempotency or credential material.
type: object
properties:
    id: { type: integer }
    order_id: { type: integer }
    gateway_id: { type: integer }
    gateway_code: { type: [string, "null"] }
    status:
        type: string
        enum: [initiated, awaiting_callback, verified, failed, cancelled, refunded]
    amount_minor: { type: integer }
    currency: { type: string }
    gateway_authority: { type: [string, "null"] }
    gateway_transaction_id: { type: [string, "null"] }
    error_code: { type: [string, "null"] }
    error_message: { type: [string, "null"] }
    reconciliation_status:
        type: string
        enum: [unchecked, matched, mismatch, unsupported, error]
    reconciliation_provider_status: { type: [string, "null"] }
    reconciliation_checked_at: { type: [string, "null"], format: date-time }
    reconciliation_checked_by_user_id: { type: [integer, "null"] }
    reconciliation_error_code: { type: [string, "null"] }
    initiated_at: { type: [string, "null"], format: date-time }
    verified_at: { type: [string, "null"], format: date-time }
    created_at: { type: [string, "null"], format: date-time }
    gateway_payload:
        type: object
        description: PSP request/response evidence. Present on detail responses only.
        additionalProperties: true
    reconciliation_evidence:
        type: object
        description: Latest provider reconciliation evidence. Present on detail responses only.
        additionalProperties: true
required:
    - id
    - order_id
    - gateway_id
    - status
    - amount_minor
    - currency
    - reconciliation_status
